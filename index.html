<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget</title>
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#FAFBFC; --raised:#FFFFFF;
  --ink:#131722; --ink-2:#4A5263;
  --ink-soft:#5A6272; --ink-mute:#8A92A3;
  --line:#E3E6EC; --line-2:#EEF0F4;
  --accent:#3B5BDB; --accent-soft:#EDF0FD; --accent-ink:#2A45B0;
  --pos:#0F7A55; --pos-soft:#E6F4EE;
  --neg:#C1272D; --neg-soft:#FBECEC;
  --warn:#9A6700; --warn-soft:#FFF6E0;
  --focus:#3B5BDB;
  /* Une teinte par classe d'actif. Aucune n'est un vert ni un rouge saturé : ces deux
     couleurs restent réservées au gain et à la perte, sinon un compte se lirait comme
     une performance. Deux comptes d'une même classe se départagent par une nuance,
     calculée dans patAccountColor(). */
  --c-pea:#3B5BDB; --c-av:#0F8B84; --c-livret:#0B6FA4; --c-pee:#7B4AD1;
  --c-per:#8E3F6B; --c-crypto:#B0740A; --c-immo:#6E7A18; --c-courant:#5A6478; --c-autre:#6B7280;
  /* Famille de jalons entièrement décrochée : un doré discret, distinct de l accent. */
  --done-ink:#8A6A15; --done-b:#DFC77A; --done-bg:#FCF7E8; --done-on:#FFFFFF;
  --radius:10px; --radius-sm:7px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A22; --surface-2:#1B2029; --raised:#1E242E;
  --ink:#E7EAF0; --ink-2:#B7BECD; --ink-soft:#98A1B2; --ink-mute:#78808F;
  --line:#272D38; --line-2:#20262F;
  --accent:#7C93F5; --accent-soft:#1C2440; --accent-ink:#A8B8FF;
  --pos:#3FBF8F; --pos-soft:#12301F;
  --neg:#F4726F; --neg-soft:#331A1C;
  --warn:#E0B04A; --warn-soft:#2E2611;
  --focus:#7C93F5;
  --c-pea:#7C93F5; --c-av:#3EC1B6; --c-livret:#4FADD8; --c-pee:#AC8CF2;
  --c-per:#CE86AC; --c-crypto:#E0A63C; --c-immo:#AEBC4E; --c-courant:#99A4B8; --c-autre:#9AA3B2;
  /* Sur le doré clair du thème sombre, un texte blanc tomberait à 1,9:1 : il passe en
     encre sombre pour rester lisible. */
  --done-ink:#E0BA55; --done-b:#5C4C1E; --done-bg:#1E1B10; --done-on:#191509;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
::selection{background:var(--accent-soft)}

/* ---------- typography utilities ---------- */
.eyebrow{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:14.5px}
h3{font-size:13px}
.muted{color:var(--ink-soft)}
.tiny{font-size:12px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto;
  display:flex; flex-direction:column; gap:18px;
}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 6px 2px}
.brand b{font-size:17px;font-weight:660;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-mute)}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navlabel{padding:14px 8px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mute)}
.navlabel:first-child{padding-top:2px}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:7px 8px;border-radius:var(--radius-sm);
  color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:500;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:20px}
.navbtn svg{flex:none;opacity:.85}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

.main{padding:22px 26px 60px;max-width:1220px;width:100%}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.periodnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.periodnav button{background:none;border:0;padding:5px 9px;border-radius:5px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center}
.periodnav button:hover{background:var(--surface-2);color:var(--ink)}
.periodnav .label{padding:4px 10px;font-weight:620;min-width:132px;text-align:center;font-size:13.5px}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  font-size:13px;font-weight:550;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;gap:5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--neg);border-color:var(--line)}
.btn.danger:hover{background:var(--neg-soft);border-color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}

/* ---------- cards / layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card>.chead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card>.chead .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1080px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-size:22px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.kpis.k5 .kpi .v{font-size:20px}
.kpi .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- comparison strip (signature) ---------- */
.cmp{display:flex;flex-direction:column}
.cmprow{display:grid;grid-template-columns:172px 96px 84px 1fr 130px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}
.cmprow:first-child{border-top:0}
.cmpname{display:flex;align-items:center;gap:8px;min-width:0}
.cmpname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:520}
.cmpdelta{display:flex;align-items:center;gap:5px;font-weight:620;font-size:13px}
.track{position:relative;height:22px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:var(--line);opacity:.75}
.track .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-mute);opacity:.5}
.track .fill{position:absolute;top:4px;bottom:4px;border-radius:2px}
.track .fill.over{background:var(--neg)}
.track .fill.under{background:var(--pos)}
.track .fill.flat{background:var(--ink-mute)}
.cmpprev{text-align:right;font-size:12px;color:var(--ink-soft)}
.legendline{display:flex;gap:16px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip .sw{width:11px;height:11px;border-radius:3px;flex:none}

/* ---------- category rows ---------- */
.catrow{display:grid;grid-template-columns:26px 1fr 108px 74px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);cursor:pointer}
.catrow:first-of-type{border-top:0}
.catrow:hover{background:var(--surface-2)}
.catrow .bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:4px}
.catrow .bar>i{display:block;height:100%;border-radius:3px}
.icon-badge{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none}
.icon-badge svg{width:14px;height:14px}
.subrow{display:grid;grid-template-columns:1fr 100px 70px;gap:10px;padding:4px 0 4px 36px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-2)}

/* ---------- operations table ---------- */
.ops{width:100%;border-collapse:collapse}
.ops th{
  text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-mute);padding:0 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.ops td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ops tr:hover td{background:var(--surface-2)}
.ops tr.is-dup td{opacity:.62}
.ops tr.is-ign td{opacity:.62}
.ops .c-date{width:66px;color:var(--ink-soft);font-size:12.5px}
.ops .c-amt{width:108px;text-align:right;font-weight:600;white-space:nowrap}
.ops .c-cat{width:200px}
.ops .c-imp{width:104px}
.ops .c-act{width:96px;text-align:right;white-space:nowrap}
.merchant{font-weight:550}
.rawlabel{font-size:11.5px;color:var(--ink-mute);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;display:block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.dup{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ign{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.todo{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.selcat{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:100%}
.catbtn{border:1px solid transparent;background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.catbtn:hover{border-color:var(--line);color:var(--ink)}
.catbtn.none{color:var(--neg);background:var(--neg-soft)}
.kpi .v.warn{color:var(--warn)}
.iconbtn{border:1px solid transparent;background:none;border-radius:6px;padding:3px;cursor:pointer;color:var(--ink-mute);display:inline-flex}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.iconbtn.danger:hover{color:var(--neg);border-color:var(--neg)}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  padding:6px 9px;color:var(--ink);
}
input[type=number]{font-family:var(--mono);text-align:right}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}

/* ---------- misc ---------- */
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:14px}
/* Le <b> d'un état vide sert de titre et passe donc en bloc ; pour appuyer un mot au fil du
   texte il faut ce recours, sinon la phrase se coupe en trois. */
.empty .inl,.inl{display:inline;font-weight:650;color:var(--ink);margin:0;font-size:inherit}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer;min-width:0}
.barcol .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:120px}
.barcol i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.barcol .lb{font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em}
.barcol.on .lb{color:var(--accent-ink);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:550;z-index:90;box-shadow:0 6px 24px -8px rgba(0,0,0,.4)}
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.42);display:grid;place-items:start center;padding:36px 16px;overflow:auto;z-index:80}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
.modal.wide{max-width:1000px}
.modal .mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal .mhead .spacer{flex:1}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{flex:1;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:12px;color:var(--ink-mute);background:var(--surface-2)}
.step.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:620}
.step.done{color:var(--pos);border-color:var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-soft);background:var(--surface-2)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.maptable{width:100%;border-collapse:collapse;font-size:13px}
.maptable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);padding:0 8px 6px;border-bottom:1px solid var(--line)}
.maptable td{padding:5px 8px;border-bottom:1px solid var(--line-2)}
.scroll{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.hbar{height:9px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.incgrid{width:100%;border-collapse:collapse;font-size:13px}
.incgrid th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute);padding:0 6px 6px;text-align:right}
.incgrid th:first-child{text-align:left}
.incgrid td{padding:3px 6px;border-top:1px solid var(--line-2)}
.incgrid input{width:104px;padding:4px 7px}

/* ---------- category tag ---------- */
.tag-cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:560;padding:2px 8px 2px 5px;border-radius:20px;
  border:1px solid transparent;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.tag-cat svg{flex:none;opacity:.9}
.tag-cat:hover{filter:brightness(.96);border-color:currentColor}
.tag-cat.none{background:var(--neg-soft);color:var(--neg);font-style:italic}

/* ---------- goals ---------- */
.goalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.goal{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface-2)}
.goal .gh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.goal .gh .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gv{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.goal .gv b{font-size:19px;font-weight:640;letter-spacing:-.02em}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.gbar>i{display:block;height:100%;border-radius:5px}
.gpace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.gfoot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px}
.state-ok{color:var(--pos)} .state-watch{color:var(--warn)} .state-over{color:var(--neg)}
.bg-ok{background:var(--pos)} .bg-watch{background:var(--warn)} .bg-over{background:var(--neg)}

/* ---------- comparison ---------- */
.cmprow{display:grid;grid-template-columns:210px 104px 92px 1fr 132px;gap:12px;align-items:center;padding:8px 10px;border-top:1px solid var(--line-2);border-radius:7px}
.cmprow.over{background:linear-gradient(90deg,var(--neg-soft),transparent 62%)}
.cmprow.under{background:linear-gradient(90deg,var(--pos-soft),transparent 62%)}
.cmprow.over .nm{color:var(--neg);font-weight:640}
.cmprow.under .nm{color:var(--pos);font-weight:640}

/* ---------- drill-down ---------- */
.merchrow{display:grid;grid-template-columns:1fr 62px 104px;gap:10px;padding:4px 0 4px 52px;font-size:12.5px;border-top:1px dashed var(--line-2);color:var(--ink-2)}
.warn-txt{color:var(--warn)}
.basegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.basegrid>div{background:var(--surface-2);padding:12px 14px}
.basegrid .v{font-size:20px;font-weight:600;margin:4px 0 2px;letter-spacing:-.02em}
.fixlist{display:flex;flex-direction:column}
.fixrow{display:grid;grid-template-columns:26px 1fr 190px 150px 96px 78px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px}
.fixrow:first-child{border-top:0}
.fixrow:hover{background:var(--surface-2)}
.fixrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.fixrow.off{opacity:.62}
.fixrow.off .nm{text-decoration:line-through;text-decoration-thickness:1px}
.subrow.open{background:var(--surface-2)}
.subrow{cursor:pointer}
.subrow:hover{background:var(--surface-2)}

/* ---------- review (tri des opérations) ---------- */
.rev{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-2);transition:transform .28s ease,opacity .28s ease}
.rev.out-right{transform:translateX(90px) rotate(2.5deg);opacity:0}
.rev.out-left{transform:translateX(-90px) rotate(-2.5deg);opacity:0}
.rev .rdate{font-size:12px;color:var(--ink-mute);letter-spacing:.02em}
.rev .rmerch{font-size:21px;font-weight:640;letter-spacing:-.02em;margin:3px 0 2px;text-transform:capitalize}
.rev .rlabel{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);word-break:break-all}
.rev .ramt{font-size:30px;font-weight:640;letter-spacing:-.03em;margin:10px 0 4px}
.progress{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-bottom:6px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* ---- Patrimoine ---- */
.pathero{display:grid;grid-template-columns:minmax(230px,1.05fr) 1fr;gap:24px;align-items:start}
.pathero .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.04}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);font-weight:600}
/* Variation du mois : un seul bloc, la performance en tête et le montant en appui. */
.monthdelta{display:inline-flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:9px;border:1px solid transparent}
.monthdelta .mv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.08}
.monthdelta .ms{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.monthdelta.pos{background:var(--pos-soft)} .monthdelta.pos .mv{color:var(--pos)}
.monthdelta.neg{background:var(--neg-soft)} .monthdelta.neg .mv{color:var(--neg)}
.monthdelta.flat{background:var(--surface-2);border-color:var(--line)} .monthdelta.flat .mv{color:var(--ink-soft)}
.dpill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:650;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dpill.pos{background:var(--pos-soft);color:var(--pos)}
.dpill.neg{background:var(--neg-soft);color:var(--neg)}
.dpill.flat{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.splitbar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.splitbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:9px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink)}
.sw{display:inline-block;flex:none;width:9px;height:9px;border-radius:3px}
.allocbar{display:flex;height:32px;border-radius:7px;overflow:hidden;gap:2px}
.allocbar i{display:block;height:100%;min-width:2px}
.alloclist{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:4px 18px;margin-top:12px;font-size:12.5px}
.alloclist span{display:flex;align-items:center;gap:7px;color:var(--ink-2);min-width:0}
.alloclist em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloclist b{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);padding-left:8px}
/* Barres de performance centrées sur zéro : la forme dit le signe avant la couleur. */
.dvrow{display:grid;grid-template-columns:46px 1fr 118px;align-items:center;gap:10px;padding:3px 0;font-size:12px}
.dvrow .dvval{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.dvrow .dvval b{font-weight:650}
.dvrow .dvval em{font-style:normal;font-size:10.5px;color:var(--ink-mute)}
/* Grille mois par mois : une case par mois, teinte selon le signe et l'ampleur. */
.ygrid{display:flex;flex-direction:column;gap:3px;overflow-x:auto;padding-bottom:2px}
.grow{display:grid;grid-template-columns:42px repeat(12,minmax(20px,1fr)) 76px 62px;gap:3px;align-items:center;
  font-size:11.5px;min-width:540px}
.grow .gy{font-family:var(--mono);font-weight:650;color:var(--ink-2)}
.grow .gh{text-align:center;font-size:9.5px;color:var(--ink-mute);font-weight:600}
.gcell{height:21px;border-radius:3px;background:var(--line-2)}
.gcell.on{cursor:help}
.grow .gtot{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650}
.grow .gcnt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.ghead .gtot,.ghead .gcnt{font-size:9.5px;font-weight:600;color:var(--ink-mute);text-transform:uppercase;font-family:var(--sans)}
/* Meilleure année d'un compte : soulignée plutôt que colorée, la couleur portant déjà le signe. */
td.bestyear{font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
th.curyear{color:var(--accent-ink)}
/* Point d'aide : l'explication ne mérite pas d'occuper l'écran en permanence. */
.help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  border:1px solid var(--line);color:var(--ink-mute);font-size:10.5px;font-weight:700;cursor:help;flex:none}
.help:hover,.help:focus-visible{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
tr.rowoff td{opacity:.55}
tr.rowoff td:first-child{opacity:.8}
.dvtrack{position:relative;height:16px;background:var(--line-2);border-radius:3px}
.dvtrack::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dvtrack i{position:absolute;top:2px;bottom:2px;border-radius:2px;min-width:2px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac,var(--accent))}
.acard.todo{border-style:dashed;border-color:var(--ink-mute)}
.acard .an{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;min-width:0}
.acard .an em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .av{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;letter-spacing:-.02em}
.acard .am{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft)}
.acard .am b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650}
.acard input{width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.acard .go{position:absolute;top:8px;right:8px;opacity:.45}
.acard:hover .go{opacity:1}
.msbar{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden;margin:11px 0 6px}
.msbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
/* Jalons : des médaillons, pas des lignes de tableau. Un badge acquis prend la couleur de
   son rang ; un badge à venir garde un anneau de progression, pour rester une cible et non
   un échec. Les rangs vont du bronze au platine selon la place du jalon dans sa famille. */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;cursor:help}
.bmed{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:5px}
/* Anneau de progression du jalon non acquis : la part remplie est la distance parcourue. */
.bmed::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--accent) var(--p,0%),var(--line-2) 0)}
.bmed::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.bic{position:relative;z-index:1;color:var(--ink-mute);display:flex}
.badge.on .bmed::before{background:var(--tier-l)}
.badge.on .bmed::after{inset:5px;background:var(--tier)}
.badge.on .bic{color:#fff}
.btick{position:absolute;z-index:2;right:-1px;bottom:-1px;width:19px;height:19px;border-radius:50%;
  background:var(--pos);color:#fff;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--surface)}
.badge .bn{font-size:11.5px;font-weight:650;color:var(--ink-soft);line-height:1.25}
.badge .bs{font-size:10px;color:var(--ink-mute);font-family:var(--mono);line-height:1.3}
.badge.on .bn{color:var(--ink)}
.badge.on .bs{color:var(--ink-2)}
/* Famille complète : bordure et fond dorés, coupe dans le titre, pastille « Complet ». */
.mgroup.full{border-color:var(--done-b);background:var(--done-bg)}
.mgroup.full h2{color:var(--done-ink)}
.mtrophy{display:flex;color:var(--done-ink)}
.mfull{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;
  background:var(--done-ink);color:var(--done-on);font-size:11px;font-weight:700}
.t-bronze{--tier:#A9683A;--tier-l:#CD8B58}
.t-silver{--tier:#78829A;--tier-l:#A2ABBE}
.t-gold{--tier:#BE922A;--tier-l:#E3BE4C}
.t-plat{--tier:#5F4FC0;--tier-l:#9284E8}
html[data-theme="dark"] .t-bronze{--tier:#C4864F;--tier-l:#E0A87A}
html[data-theme="dark"] .t-silver{--tier:#98A2B6;--tier-l:#BFC7D6}
html[data-theme="dark"] .t-gold{--tier:#DDB447;--tier-l:#F0D585}
html[data-theme="dark"] .t-plat{--tier:#8A79E4;--tier-l:#B4A8F5}
.patgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
/* Six colonnes de chiffres tiennent mal sous 1100 px : plutôt que de couper « +1,50 % »
   en deux lignes, on laisse le conteneur défiler — les montants restent lisibles d'un bloc. */
.patnum td.num,.patnum th{white-space:nowrap}
.patnum td:first-child{min-width:150px}
/* La réserve de 150 px vaut pour une colonne de noms de compte ; une colonne d'années n'en
   a pas besoin et faisait déborder le tableau pour quelques pixels. */
.patnum.narrow td:first-child{min-width:0}
@media (max-width:1080px){.pathero,.patgrid{grid-template-columns:1fr}}
.catgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.catchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.catchip:hover{border-color:var(--ink-mute)}
.catchip.on{color:#fff;border-color:transparent;font-weight:600}
.catchip.sugg{border-style:dashed;border-color:var(--accent)}
.grouplab{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:9px 0 2px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-mute)}

/* ---------- review, second pass ---------- */
.revhead{display:flex;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-weight:700;font-size:19px;letter-spacing:-.03em;flex:none}
.avatar svg{width:24px;height:24px}
.revwho{min-width:0;flex:1}
.revamt{font-size:34px;font-weight:660;letter-spacing:-.035em;text-align:right;white-space:nowrap}
.revwhy{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-mute);margin-top:3px}
.revwhy svg{width:12px;height:12px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 11px;font-size:13px;cursor:pointer;
  color:var(--ink);display:inline-flex;align-items:center;gap:7px;font-weight:520;transition:border-color .12s,transform .08s}
.pick:hover{border-color:var(--ink-mute)}
.pick:active{transform:scale(.97)}
.pick.on{border-width:1.5px;font-weight:640}
.pick .dot{width:9px;height:9px;border-radius:50%;flex:none}
.moreline{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.moreline .hr{flex:1;height:1px;background:var(--line)}
.moreline button{background:none;border:0;color:var(--accent-ink);font-size:12px;cursor:pointer;font-weight:600;padding:2px 6px;border-radius:5px}
.moreline button:hover{background:var(--accent-soft)}
/* Destination patrimoine d'un virement interne : un bloc à part, sous les catégories,
   parce qu'il répond à une autre question et n'a de sens que pour ces opérations-là. */
.destbox{margin-top:14px;padding:12px 13px 11px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.destbox.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.destlab{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:620;color:var(--ink-soft);margin-bottom:8px}
.destlab svg{width:12px;height:12px}
.destsum{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:9px;line-height:1.45}
.destsum svg{width:12px;height:12px;flex:none;margin-top:2px}
.destsum.muted{color:var(--ink-mute)}
.tag.lnk{display:inline-flex;align-items:center;gap:5px}
/* Fenêtre périmée : on emprunte les couleurs du danger, parce que c'en est un. */
.stale{display:flex;align-items:flex-start;gap:11px;margin-bottom:18px;padding:13px 15px;border-radius:12px;
  border:1px solid var(--neg);background:var(--neg-soft);color:var(--ink);font-size:13px;line-height:1.5}
.stale svg{flex:none;color:var(--neg);margin-top:1px}
.stale button{flex:none;margin-left:auto;align-self:center}
.segbar{display:flex;gap:3px;margin-bottom:14px}
.segbar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segbar i.done{background:var(--pos)}
.segbar i.now{background:var(--accent)}
.revfoot{display:flex;gap:10px;margin-top:16px;align-items:center}
.btn.big{padding:11px 18px;font-size:14px;border-radius:10px;font-weight:620}
.memo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer;user-select:none;
  border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:var(--surface)}
.memo input{accent-color:var(--accent);margin:0;width:13px;height:13px}
.memo.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.doneburst{width:64px;height:64px;border-radius:50%;background:var(--pos-soft);color:var(--pos);display:grid;place-items:center;margin:0 auto 14px}
.doneburst svg{width:30px;height:30px}
.similar{font-size:11.5px;color:var(--ink-mute);margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- segmented switch ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{padding:3px 11px;background:none;border:0;cursor:pointer;font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.cmpprev{opacity:0;transition:opacity .12s}
.cmprow:hover .cmpprev,.cmprow:focus-within .cmpprev{opacity:1}

/* ---------- misc ---------- */
.ops thead th{position:sticky;top:0;background:var(--surface);z-index:2}
.suggestrow td{color:var(--ink-soft)}
.dupbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================================
   MOIS V2 — refonte visuelle, entièrement cloisonnée sous .v2
   -------------------------------------------------------------------------
   Rien ici ne fuit vers le reste de l'application : les jetons sont redéfinis
   sur .v2 et chaque sélecteur en descend. Tant que les deux onglets coexistent,
   « Mois » garde son apparence d'origine au pixel près.

   Palette vérifiée sous deutéranopie et protanopie (simulation Viénot 1999).
   Le rouge tire vers le carmin et le vert vers l'émeraude : ainsi écartés sur
   l'axe bleu-jaune, seul axe préservé, ils restent distincts. Les trois états

.v2{
  --bg:#F6F2E9; --surface:#FFFDF8; --surface-2:#FBF7EE; --sunk:#EFEADD;
  --ink:#1C201A; --ink-2:#535A4E; --ink-3:#8A9082; --ink-4:#B2B7AA;
  --line:#E2DCCE; --line-2:#EDE8DC;
  --win:#0B7A5E; --win-ink:#096851; --win-bg:#D2EBE6; --win-line:#9FD3C9;
  --bad:#A82438; --bad-ink:#8E1E30; --bad-bg:#EFC0BE; --bad-line:#DDA09E;
  --hot:#8F6206; --hot-ink:#7A5305; --hot-bg:#F8E3B8; --hot-line:#DEC287;
  --ringtrack:#E7E1D3; --on:#FFFDF8;
  --disp:"Archivo",system-ui,sans-serif;
  --prose:"Newsreader",Georgia,serif;

  margin:-22px -26px -60px; padding:24px 30px 70px; min-height:calc(100vh - 0px);
  background:var(--bg); color:var(--ink);
  font-family:var(--disp); font-size:14px; line-height:1.5;
  font-variation-settings:"wght" 450,"wdth" 100;
}
html[data-theme="dark"] .v2{
  --bg:#0E1210; --surface:#171C18; --surface-2:#1D231E; --sunk:#12170F;
  --ink:#E9EEE6; --ink-2:#AEB6AA; --ink-3:#7E867B; --ink-4:#5A6157;
  --line:#2A312B; --line-2:#222823;
  --win:#3FCFA4; --win-ink:#63DDB6; --win-bg:#0F2E26; --win-line:#235A4A;
  --bad:#F74D65; --bad-ink:#FA7F90; --bad-bg:#331A20; --bad-line:#632E3A;
  --hot:#E39E06; --hot-ink:#EFB43A; --hot-bg:#2E2410; --hot-line:#5C4718;
  --ringtrack:#252C26; --on:#0E1210;
}
.v2 *{box-sizing:border-box}
/* L'application impose une police mono à .num ; ici les chiffres tabulaires
   d'Archivo font le travail et doivent reprendre la main. */
.v2 .num{font-family:var(--disp);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:0}
.v2 button{font-family:inherit}
.v2 :focus-visible{outline:2px solid var(--win);outline-offset:2px}

/* ---------- barre de période et sous-onglets ---------- */
.v2 .top{display:flex;align-items:flex-end;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.v2 .per{display:flex;align-items:baseline;gap:11px}
/* Largeur fixe : sans elle, les flèches se décalaient à chaque mois — « mai »
   et « septembre » n'ont pas la même chasse — et l'on ne pouvait pas cliquer
   plusieurs fois de suite sans repointer. La barre d'origine réglait déjà le
   problème ainsi ; v2 avait perdu le réglage en route. */
.v2 .per h1{margin:0;font-size:15px;font-variation-settings:"wght" 700,"wdth" 100;text-transform:uppercase;letter-spacing:.15em;min-width:184px;text-align:center;background:none;border:0;color:inherit;cursor:pointer;padding:3px 8px;border-radius:7px;font-family:inherit}
.v2 .per h1:hover{background:var(--surface)}
.v2 .per h1[aria-expanded="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.v2 .per{position:relative}

/* Sélecteur de période : l'année d'abord, puis le mois. Les mois qui portent
   des opérations sont marqués d'un point — sauter sur un mois vide est le
   seul faux pas que ce panneau puisse faire commettre. */
.v2 .mpick{position:absolute;top:100%;left:0;margin-top:6px;z-index:40;width:268px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;box-shadow:0 14px 34px -12px rgba(0,0,0,.34)}
.v2 .mpick .yr{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.v2 .mpick .yr b{flex:1;text-align:center;font-size:14px;font-variation-settings:"wght" 700,"wdth" 100;font-variant-numeric:tabular-nums}
.v2 .mpick .yr button{background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--ink-2);font:inherit;line-height:1}
.v2 .mpick .yr button:hover:not([disabled]){border-color:var(--ink);color:var(--ink)}
.v2 .mpick .yr button[disabled]{opacity:.3;cursor:not-allowed}
.v2 .mpick .ms{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.v2 .mpick .ms button{position:relative;background:var(--surface-2);border:1px solid transparent;border-radius:7px;padding:7px 4px;cursor:pointer;color:var(--ink-2);font:inherit;font-size:12px;font-variation-settings:"wght" 580,"wdth" 100;text-transform:capitalize}
.v2 .mpick .ms button:hover{background:var(--sunk);color:var(--ink)}
.v2 .mpick .ms button.has::after{content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.v2 .mpick .ms button.on{background:var(--ink);color:var(--bg);font-variation-settings:"wght" 700,"wdth" 100}
.v2 .mpick .ms button.on.has::after{background:var(--bg)}
.v2 .mpick .ms button.now{box-shadow:inset 0 0 0 1px var(--ink-3)}
.v2 .mpick .ft{margin-top:9px;display:flex}
.v2 .mpick .ft button{flex:1;background:none;border:1px solid var(--line);border-radius:7px;padding:5px;cursor:pointer;color:var(--ink-2);font:inherit;font-size:12px;font-variation-settings:"wght" 580,"wdth" 100}
.v2 .mpick .ft button:hover{border-color:var(--ink);color:var(--ink)}
.v2 .per .st{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-variation-settings:"wght" 640,"wdth" 100;border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.v2 .per button{background:none;border:0;padding:2px 5px;cursor:pointer;color:var(--ink-3);font:inherit;font-size:15px;line-height:1}
.v2 .per button:hover{color:var(--ink)}
.v2 .tabs{display:flex;margin-left:auto;border-bottom:1px solid var(--line)}
.v2 .tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:6px 15px 8px;cursor:pointer;color:var(--ink-3);font:inherit;font-size:13px;font-variation-settings:"wght" 550,"wdth" 100}
.v2 .tabs button:hover{color:var(--ink-2)}
.v2 .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-variation-settings:"wght" 700,"wdth" 100}

/* ---------- tableau de bord : la fiche et l'anneau ---------- */
.v2 .board{display:grid;grid-template-columns:minmax(0,1fr) 268px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.v2 .fiche{padding:20px 24px 18px}
.v2 .cap{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);font-variation-settings:"wght" 680,"wdth" 100;margin-bottom:12px}
.v2 .ftab{width:100%;border-collapse:collapse}
.v2 .ftab th{text-align:left;font-size:13.5px;font-variation-settings:"wght" 520,"wdth" 100;color:var(--ink-2);padding:5px 0}
.v2 .ftab td{text-align:right;font-size:19px;font-variation-settings:"wght" 580,"wdth" 90;letter-spacing:-.015em;padding:5px 0;white-space:nowrap}
.v2 .ftab td .op{color:var(--ink-4);font-variation-settings:"wght" 450,"wdth" 90;margin-right:3px}
.v2 .ftab tr.sum th,.v2 .ftab tr.sum td{border-top:1.5px solid var(--ink);padding-top:11px}
.v2 .ftab tr.sum th{font-size:14px;text-transform:uppercase;letter-spacing:.09em;font-variation-settings:"wght" 700,"wdth" 100;color:var(--ink)}
.v2 .ftab tr.sum td{font-size:31px;font-variation-settings:"wght" 700,"wdth" 86;letter-spacing:-.028em;color:var(--win)}
.v2 .ftab tr.sum.down td{color:var(--bad)}
/* Le cumul de l'année n'a ni succès ni échec : sa place est sous l'épargne du
   mois, dont il est le prolongement, et non parmi les pastilles d'état. */
.v2 .ftab tr.run th,.v2 .ftab tr.run td{padding-top:2px;padding-bottom:0}
.v2 .ftab tr.run th{font-size:11.5px;color:var(--ink-3);font-variation-settings:"wght" 500,"wdth" 100}
.v2 .ftab tr.run td{font-size:13.5px;color:var(--ink-3);font-variation-settings:"wght" 600,"wdth" 92}

/* l'anneau se ferme quand l'objectif est atteint */
.v2 .gauge{border-left:1px solid var(--line);background:var(--surface-2);padding:18px 20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.v2 .gauge.done{background:var(--win-bg);border-left-color:var(--win-line)}
.v2 .ringwrap{position:relative;width:154px;height:154px}
.v2 .ring{width:154px;height:154px;transform:rotate(-90deg)}
.v2 .ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.v2 .ring .rt{stroke:var(--ringtrack)}
.v2 .ring .rp{stroke:var(--hot);transition:stroke-dashoffset .85s cubic-bezier(.22,1,.36,1)}
.v2 .gauge.done .ring .rp{stroke:var(--win)}
.v2 .rlabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.v2 .rlabel .rv{font-size:34px;font-variation-settings:"wght" 720,"wdth" 84;letter-spacing:-.035em;line-height:1}
.v2 .gauge.done .rlabel .rv{color:var(--win-ink)}
.v2 .rlabel .rk{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-variation-settings:"wght" 660,"wdth" 100}
.v2 .ringmark{display:block;text-align:left;gap:0;position:absolute;right:2px;top:4px;width:36px;height:36px;color:var(--win);filter:drop-shadow(0 2px 6px rgba(0,0,0,.28))}
.v2 .ringmark svg{width:36px;height:36px;display:block}
.v2 .gverdict{margin-top:13px;font-size:13px;font-variation-settings:"wght" 620,"wdth" 100;line-height:1.35}
.v2 .gauge.done .gverdict{color:var(--win-ink)}
.v2 .gsub{margin-top:3px;font-size:11.5px;color:var(--ink-3);font-variation-settings:"wght" 480,"wdth" 100}

/* ---------- bande de récompenses ---------- */
.v2 .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:26px}
.v2 .chip{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.v2 .chip.win{background:var(--win-bg);border-color:var(--win-line)}
.v2 .chip.hot{background:var(--hot-bg);border-color:var(--hot-line)}
.v2 .chip .ic{width:26px;height:26px;flex:none;display:grid;place-items:center;color:var(--ink-4)}
.v2 .chip.win .ic{color:var(--win)} .v2 .chip.hot .ic{color:var(--hot)}
.v2 .chip .ic svg{width:24px;height:24px}
.v2 .chip .tx{min-width:0;display:flex;flex-direction:column}
.v2 .chip .v{display:block;font-size:14.5px;font-variation-settings:"wght" 700,"wdth" 90;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2 .chip.win .v{color:var(--win-ink)} .v2 .chip.hot .v{color:var(--hot-ink)}
.v2 .chip .k{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-variation-settings:"wght" 620,"wdth" 100;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- section ---------- */
.v2 .sect{margin-bottom:26px}
.v2 .shead{display:flex;align-items:baseline;gap:11px;margin-bottom:10px;flex-wrap:wrap}
.v2 .shead .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.15em;font-variation-settings:"wght" 700,"wdth" 100}
.v2 .shead .c{font-size:11.5px;color:var(--ink-3);font-variation-settings:"wght" 520,"wdth" 100}
.v2 .shead .sp{flex:1}
.v2 .shead .leg{font-size:10.5px;color:var(--ink-3);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.v2 .leg .lgi{display:inline-flex;align-items:center;gap:4px}
.v2 .leg .lgb{width:12px;height:12px;display:block}
.v2 .leg .lgb svg{width:12px;height:12px;display:block}
.v2 .leg .lgi.win{color:var(--win-ink)} .v2 .leg .lgi.hot{color:var(--hot-ink)} .v2 .leg .lgi.bad{color:var(--bad-ink)}

/* La bascule : le pourcentage dit la proportion, l'euro dit l'ampleur. */
.v2 .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.v2 .seg button{background:var(--surface);border:0;padding:3px 11px;cursor:pointer;font:inherit;font-size:12px;color:var(--ink-3);font-variation-settings:"wght" 620,"wdth" 100}
.v2 .seg button + button{border-left:1px solid var(--line)}
.v2 .seg button:hover{color:var(--ink)}
.v2 .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- pastilles d'icône ---------- */
/* Gamme d'identification prise dans l'arc froid 205°–345°, toutes à plus de 36°
   des teintes de jugement : un poste ne peut jamais se lire comme un verdict. */
.v2 .pico{flex:none;width:23px;height:23px;border-radius:7px;display:grid;place-items:center}
.v2 .pico svg{display:block}
.v2 .vrow .pico{width:21px;height:21px;border-radius:6px}

/* ---------- grille d'objectifs ---------- */
/* Des anneaux plutôt que des tuiles larges. Le reproche portait autant sur la
   forme que sur la couleur : une tuile de 278 sur 100 est trois fois plus large
   que haute, et neuf d'entre elles remplies de teinte faisaient un patchwork.
   Une vignette de 116 px, fond papier, avec la couleur au seul état, tient de
   ce que Tufte appelle un « small multiple » : même forme, même échelle, la
   comparaison se fait toute seule. */
/* Des anneaux plutôt que des tuiles larges : une tuile de 278 sur 100 est
   presque trois fois plus large que haute, et neuf d'entre elles remplies de
   teinte faisaient un patchwork. Vignette de 116 px, fond papier, couleur au
   seul état — un « small multiple » au sens de Tufte. */
.v2 .gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px}
/* La carte de survol est la sœur de la vignette, pas sa fille : un <button> ne
   peut pas contenir de tableau, et le navigateur démontait la structure. */
.v2 .objwrap{position:relative;min-width:0}
.v2 .objcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 8px 10px;width:100%;position:relative;text-align:center;font:inherit;color:inherit;display:block}
.v2 .objcard.clk{cursor:pointer}
.v2 .objwrap:hover .objcard,.v2 .objcard:focus-visible{border-color:var(--ink-4)}
/* La vignette qu'on est en train de consulter se distingue de ses voisines :
   sans quoi, le panneau ouvert plus bas ne se rattache visuellement à rien. */
.v2 .objcard.on{background:var(--surface-2);border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.v2 .objcard.on::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;
  margin-left:-6px;background:var(--surface-2);border-right:1px solid var(--bad);
  border-bottom:1px solid var(--bad);transform:rotate(45deg)}

.v2 .ringbox{display:block;position:relative;width:64px;height:64px;margin:0 auto 8px}
.v2 .ringbox>svg{display:block;width:64px;height:64px;transform:rotate(-90deg)}
.v2 .ringbox>svg circle{fill:none;stroke-width:7}
.v2 .ringbox .rt2{stroke:var(--sunk)}
.v2 .ringbox .rp2{stroke-linecap:round}
.v2 .objcard.win .rp2{stroke:var(--win)}
.v2 .objcard.hot .rp2{stroke:var(--hot)}
.v2 .objcard.bad .rp2{stroke:var(--bad)}
/* Le repère de rythme sur un arc : une encoche à l'angle du mois écoulé. */
.v2 .ringbox .pace2{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;opacity:.5}
.v2 .ringbox .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.v2 .ringbox .mid svg{display:block;width:24px;height:24px}
.v2 .objcard.win .mid{color:var(--win)}
.v2 .objcard.hot .mid{color:var(--hot)}
.v2 .objcard.bad .mid{color:var(--bad)}
/* La pastille de forme se range dans le coin de la vignette : posée sur
   l'anneau, elle en mangeait le tracé. Elle reste indispensable — un cœur
   entier et un cœur fendu à 24 px, en gris, ne se distinguent plus. */
.v2 .objcard .bdg{position:absolute;top:7px;right:7px;width:17px;height:17px;display:block}
.v2 .objcard .bdg svg{display:block;width:17px;height:17px}
.v2 .objcard.win .bdg{color:var(--win)}
.v2 .objcard.hot .bdg{color:var(--hot)}
.v2 .objcard.bad .bdg{color:var(--bad)}
.v2 .objcard .nm{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
  font-variation-settings:"wght" 720,"wdth" 87;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:block}
.v2 .objcard .v{font-size:14px;font-variation-settings:"wght" 680,"wdth" 88;display:block;margin-top:3px}
.v2 .objcard .of{font-size:10px;color:var(--ink-4);font-variation-settings:"wght" 470,"wdth" 92;display:block}

/* Carte de survol : tout en CSS, aucun état à tenir, donc rien à reconstruire
   au rendu — elle survit au fait que render() refasse le DOM entier. */
.v2 .tip{
  position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px);
  width:246px;background:var(--surface);border:1px solid var(--ink-4);border-radius:10px;
  padding:12px 14px 13px;text-align:left;z-index:40;
  box-shadow:0 16px 34px -14px rgba(0,0,0,.4);
  opacity:0;visibility:hidden;transition:opacity .13s,transform .13s;pointer-events:none;
}
.v2 .objwrap:hover .tip,.v2 .objwrap:focus-within .tip{
  opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);
}
/* En bord de grille, la carte s'aligne sur le côté de sa vignette au lieu de
   déborder — à gauche sur la barre latérale, à droite hors écran. */
.v2 .objwrap.tipL .tip{left:0;transform:translateY(-4px)}
.v2 .objwrap.tipL:hover .tip,.v2 .objwrap.tipL:focus-within .tip{transform:translateY(0)}
.v2 .objwrap.tipR .tip{left:auto;right:0;transform:translateY(-4px)}
.v2 .objwrap.tipR:hover .tip,.v2 .objwrap.tipR:focus-within .tip{transform:translateY(0)}
/* Vignette ouverte : le panneau de détail dit déjà tout, la carte se tait. */
.v2 .objwrap.open .tip{display:none}
.v2 .tip .th{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--ink-3);font-variation-settings:"wght" 700,"wdth" 100;margin-bottom:3px}
/* Quand la carte n'a pas de sous-titre, le tableau reprend l'air perdu. */
.v2 .tip .th + table{margin-top:8px}
.v2 .tip table{width:100%;border-collapse:collapse}
.v2 .tip th{text-align:left;font-size:11.5px;font-variation-settings:"wght" 500,"wdth" 100;
  color:var(--ink-2);padding:3px 0;white-space:nowrap}
.v2 .tip td{text-align:right;font-size:12px;font-variation-settings:"wght" 660,"wdth" 92;
  padding:3px 0;white-space:nowrap}
.v2 .tip tr.gap th,.v2 .tip tr.gap td{border-top:1px solid var(--line-2);padding-top:7px}
.v2 .tip tr.sum th,.v2 .tip tr.sum td{border-top:1px solid var(--ink);padding-top:7px}
.v2 .tip tr.sum th{font-variation-settings:"wght" 660,"wdth" 100;color:var(--ink)}
.v2 .tip td.up{color:var(--bad-ink)}
.v2 .tip td.down{color:var(--win-ink)}
.v2 .tip td.q{color:var(--ink-3);font-variation-settings:"wght" 470,"wdth" 92}
.v2 .tip .note{display:block;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2);
  font-family:var(--prose);font-size:12px;color:var(--ink-3);line-height:1.45}

/* La grille d'objectifs se termine en dents de scie et laissait un vide en bas
   à droite. Un panneau fixe referme la composition — et il n'est pas là pour
   combler : c'est la seule chose qui dise si le mois entier dérape. */
/* Mêmes colonnes et même gouttière que .chips : les deux rangées se lisent
   comme un seul appareil, et la bordure du panneau prolonge celle de la
   pastille qui le surmonte au lieu de la manquer de quelques dizaines de
   pixels. Toute retouche ici doit se faire des deux côtés. */
.v2 .gsplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.v2 .pulse{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px 14px}
/* La colonne de droite porte deux blocs empilés, à la largeur de la pastille
   qui les surmonte : où en est le mois, puis ce qui se rapproche. */
.v2 .prail{display:grid;gap:10px;align-content:start;min-width:0}
.v2 .pbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.v2 .pbody .pnum{min-width:0}
/* Le pied du panneau : ce qui reste à venir sur un mois en cours, ce qui a
   bougé sur un mois clos. */
.v2 .pfoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2)}
.v2 .pfoot .fh{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);
  font-variation-settings:"wght" 700,"wdth" 100;margin-bottom:8px}
.v2 .pfoot .st{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:9px}
.v2 .pfoot .st:last-child{margin-bottom:0}
.v2 .pfoot .st b{font-variation-settings:"wght" 660,"wdth" 92;color:var(--ink)}
.v2 .pfoot .st.q{color:var(--ink-4)}
.v2 .pfoot .ptl{width:100%;border-collapse:collapse}
.v2 .pfoot .ptl td{font-size:12.5px;padding:2.5px 0;color:var(--ink-2);text-align:left;
  font-variation-settings:"wght" 470,"wdth" 96}
.v2 .pfoot .ptl td.d{width:26px;color:var(--ink-4);font-variation-settings:"wght" 560,"wdth" 92}
.v2 .pfoot .ptl td.q{color:var(--ink-4)}
.v2 .pfoot .ptl td.a{text-align:right;white-space:nowrap;color:var(--ink);
  font-variation-settings:"wght" 620,"wdth" 92}
.v2 .pfoot .ptl td.a.up{color:var(--bad-ink)}
.v2 .pfoot .ptl td.a.down{color:var(--win-ink)}
/* Bientôt : l'emblème porte déjà son arc de progression, une barre de plus
   ferait doublon. */
.v2 .nextro .nrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:11px;
  align-items:center;padding:5px 0}
.v2 .nextro .nw{position:relative;width:38px}
.v2 .nextro .nw svg{display:block;overflow:visible}
.v2 .nextro .nx{min-width:0;display:block}
.v2 .nextro .nx .n{display:block;font-size:12.5px;color:var(--ink);
  font-variation-settings:"wght" 620,"wdth" 94;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .nextro .nx .k{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--rc);font-variation-settings:"wght" 660,"wdth" 100;margin-top:1px}
.v2 .nextro .p{font-size:12.5px;color:var(--ink-3);font-variation-settings:"wght" 620,"wdth" 92}
.v2 .nextro .go{margin-top:9px;width:100%;background:none;border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font:inherit;font-size:11.5px;color:var(--ink-2);
  font-variation-settings:"wght" 560,"wdth" 96;cursor:pointer}
.v2 .nextro .go:hover{border-color:var(--ink-4);color:var(--ink)}
.v2 .pulse .ph{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);
  font-variation-settings:"wght" 700,"wdth" 100;margin-bottom:10px}
/* La courbe ne prend plus que la moitié du panneau, et retrouve donc à peu
   près le rapport qu'elle avait quand celui-ci faisait 296 px. Étirée sur
   toute la largeur, sa pente s'aplatissait et les deux tracés se lisaient
   comme une seule bande — c'est l'inclinaison, pas l'écart vertical, qui
   permet de suivre une ligne. Hauteur fixe pour que la mise en page repliée,
   où le panneau reprend toute la largeur, ne la fasse pas enfler. */
.v2 .pchart svg{display:block;width:100%;height:120px;overflow:visible}
.v2 .pchart svg *{vector-effect:non-scaling-stroke}
.v2 .pulse .axis{stroke:var(--line);stroke-width:1}
/* Le mois habituel est une plage, pas une seconde ligne. Deux traits de même
   nature se confondent dès que la pente faiblit ; un trait posé sur une aire,
   jamais. */
.v2 .pulse .usualfill{fill:var(--ink-4);opacity:.28;stroke:none}
.v2 .pulse .usual{fill:none;stroke:var(--ink-4);stroke-width:1.3;stroke-dasharray:none;opacity:.85}
.v2 .pulse .now{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.v2 .pulse .proj{fill:none;stroke-width:1.8;stroke-dasharray:3 3;stroke-linecap:round}
.v2 .pulse .proj.up{stroke:var(--bad)} .v2 .pulse .proj.down{stroke:var(--win)}
.v2 .pulse .dot{stroke:var(--ink);stroke-width:5.2;stroke-linecap:round}
.v2 .pulse .dayline{stroke:var(--ink);stroke-width:1;opacity:.25;stroke-dasharray:2 3}
.v2 .pulse .lg{display:flex;gap:12px;flex-wrap:wrap;margin:9px 0 11px;font-size:10px;color:var(--ink-3)}
.v2 .pulse .lg i{display:inline-block;width:14px;height:0;border-top-width:2px;border-top-style:solid;
  margin-right:5px;vertical-align:3px}
.v2 .pulse .lg .l1 i{border-color:var(--ink)}
.v2 .pulse .lg .l2 i{border-color:var(--ink-4)}
.v2 .pulse table{width:100%;border-collapse:collapse}
.v2 .pulse th{text-align:left;font-size:11.5px;font-variation-settings:"wght" 500,"wdth" 100;
  color:var(--ink-2);padding:3px 0;white-space:nowrap}
.v2 .pulse td{text-align:right;font-size:12.5px;font-variation-settings:"wght" 660,"wdth" 92;
  padding:3px 0;white-space:nowrap}
.v2 .pulse td.q{color:var(--ink-3);font-variation-settings:"wght" 470,"wdth" 92}
.v2 .pulse td.up{color:var(--bad-ink)} .v2 .pulse td.down{color:var(--win-ink)}
.v2 .pulse tr.sum th,.v2 .pulse tr.sum td{border-top:1px solid var(--ink);padding-top:7px}
.v2 .pulse tr.sum th{font-variation-settings:"wght" 660,"wdth" 100;color:var(--ink)}
/* Point d'aide : l'explication ne mérite pas d'occuper l'écran en permanence,
   mais « habituellement » ne se devine pas. */
.v2 .pulse .help{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:13px;height:13px;margin-left:5px;padding:0;border-radius:50%;border:1px solid var(--ink-4);
  background:none;color:var(--ink-4);font:inherit;font-size:9px;line-height:1;
  font-variation-settings:"wght" 700,"wdth" 100;cursor:help;vertical-align:1px;flex:none}
.v2 .pulse .help:hover,.v2 .pulse .help:focus-visible{border-color:var(--ink-2);color:var(--ink-2)}
.v2 .pulse .hbox{position:absolute;bottom:calc(100% + 8px);right:-9px;width:252px;
  background:var(--surface);border:1px solid var(--ink-4);border-radius:9px;padding:10px 12px;
  font-family:var(--prose);font-size:12px;line-height:1.45;color:var(--ink-2);text-align:left;
  white-space:normal;text-transform:none;letter-spacing:0;font-variation-settings:normal;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.38);z-index:50;
  opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.v2 .pulse .help:hover .hbox,.v2 .pulse .help:focus-visible .hbox{opacity:1;visibility:visible}
.v2 .pulse .hbox b{font-family:var(--disp);font-variation-settings:"wght" 640,"wdth" 100;
  font-size:11.5px;color:var(--ink)}
.v2 .pulse .soon{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2);
  font-family:var(--prose);font-size:12px;color:var(--ink-3);line-height:1.45}
.v2 .pulse .soon b{font-family:var(--disp);font-variation-settings:"wght" 640,"wdth" 100;
  font-size:11.5px;color:var(--ink-2)}


/* ---------- détail d'un dépassement ---------- */
.v2 .detail{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px}
.v2 .detail .dh{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.v2 .detail .dh .t{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-variation-settings:"wght" 700,"wdth" 100}
.v2 .detail .dh .s{font-size:12.5px;color:var(--bad-ink);font-variation-settings:"wght" 660,"wdth" 100}
.v2 .detail .dh .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:5px;color:var(--ink-3);cursor:pointer;font:inherit;font-size:11px;padding:3px 9px}
.v2 .detail .dh .x:hover{border-color:var(--ink);color:var(--ink)}
.v2 .dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}
.v2 .dt{width:100%;border-collapse:collapse}
.v2 .dt caption{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-variation-settings:"wght" 680,"wdth" 100;padding-bottom:5px}
.v2 .dt th,.v2 .dt td{padding:4px 8px;font-size:12.5px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.v2 .dt th{text-align:left;font-variation-settings:"wght" 540,"wdth" 100;width:99%}
.v2 .dt td{text-align:right;font-variation-settings:"wght" 620,"wdth" 92;width:1%}
.v2 .dt td.q{color:var(--ink-3);font-variation-settings:"wght" 470,"wdth" 92}
.v2 .dt td.d{text-align:left;color:var(--ink-4);font-variation-settings:"wght" 560,"wdth" 100}
.v2 .dt tr:last-child th,.v2 .dt tr:last-child td{border-bottom:0}
.v2 .dt tr.tot th,.v2 .dt tr.tot td{border-top:1px solid var(--ink);border-bottom:0;padding-top:6px;font-variation-settings:"wght" 700,"wdth" 92}

/* ---------- à traiter ---------- */
.v2 .todo{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
/* Rien à signaler ne mérite pas d'être peint : la coche suffit. */
.v2 .todo.clean{background:var(--surface);border-color:var(--line)}
.v2 .todo .n{font-size:23px;font-variation-settings:"wght" 700,"wdth" 84;letter-spacing:-.02em;color:var(--hot-ink)}
.v2 .todo .ic{width:24px;height:24px;color:var(--win);flex:none}
.v2 .todo .ic svg{width:24px;height:24px;display:block}
.v2 .todo .tx{font-size:13.5px;color:var(--ink-2)}
.v2 .todo.clean .tx{color:var(--ink-2)}
.v2 .todo .tx b{font-variation-settings:"wght" 680,"wdth" 100;color:var(--ink)}
.v2 .act{margin-left:auto;background:var(--ink);color:var(--bg);border:0;border-radius:7px;padding:7px 15px;cursor:pointer;font:inherit;font-size:12.5px;font-variation-settings:"wght" 640,"wdth" 100;white-space:nowrap}
.v2 .act:hover{opacity:.86}

/* ---------- OÙ ÇA PART ---------- */
.v2 .split{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px 20px 18px;margin-bottom:26px}
.v2 .sp-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:11px}
.v2 .sp-tot .sp-v{font-size:29px;font-variation-settings:"wght" 700,"wdth" 86;letter-spacing:-.027em;margin-top:2px}
.v2 .sp-legs{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.v2 .sp-leg{display:flex;flex-direction:column;gap:1px}
.v2 .sp-leg .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-variation-settings:"wght" 660,"wdth" 100;display:flex;align-items:center;gap:5px}
.v2 .sp-leg .k i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.v2 .sp-leg .v{font-size:17px;font-variation-settings:"wght" 660,"wdth" 90;letter-spacing:-.015em}
.v2 .sp-leg .p{font-size:11px;color:var(--ink-3);font-variation-settings:"wght" 560,"wdth" 100}
.v2 .sp-bar{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.v2 .sp-bar .fx{background:var(--ink-4)}
.v2 .sp-bar .vr{background:var(--ink-2)}
.v2 .sp-note{margin-top:9px;font-size:11.5px;color:var(--ink-3)}

.v2 .vt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.v2 .vhead,.v2 .vrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 52px 116px 62px 76px 78px;gap:13px;align-items:center;padding:0 15px}
.v2 .vhead{padding-top:9px;padding-bottom:8px;border-bottom:1px solid var(--ink);font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-variation-settings:"wght" 680,"wdth" 96}
.v2 .vhead .r,.v2 .vrow .r{text-align:right}
.v2 .vhead .c2,.v2 .vhead .sp6{text-align:center}
.v2 .vrow{padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line-2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.v2 .vrow:first-child{border-top:0}
.v2 .vrow.lv1{cursor:pointer}
.v2 .vrow.lv1:hover,.v2 .vrow.lv1[aria-expanded="true"]{background:var(--surface-2)}
.v2 .vrow .nm{display:flex;align-items:center;gap:7px;min-width:0}
.v2 .vrow .nm .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .vrow .ar{flex:none;width:9px;color:var(--ink-4);font-size:9px;transition:transform .14s}
.v2 .vrow[aria-expanded="true"] .ar{transform:rotate(90deg);color:var(--ink-2)}
.v2 .vrow.lv1 .nm{font-size:13.5px;font-variation-settings:"wght" 620,"wdth" 100}
.v2 .vrow.lv1 .amt{font-size:14.5px;font-variation-settings:"wght" 660,"wdth" 90}
.v2 .vrow.lv2{background:var(--surface-2);cursor:pointer}
.v2 .vrow.lv2:hover{background:var(--sunk)}
.v2 .vrow.lv2 .nm{padding-left:22px;font-size:12.5px;color:var(--ink-2);font-variation-settings:"wght" 540,"wdth" 100}
.v2 .vrow.lv2 .amt{font-size:12.5px;font-variation-settings:"wght" 620,"wdth" 92;color:var(--ink-2)}
.v2 .vrow.lv3{background:var(--surface-2)}
.v2 .vrow.lv3 .nm{padding-left:44px;font-size:12px;color:var(--ink-3);font-variation-settings:"wght" 480,"wdth" 100;text-transform:capitalize}
.v2 .vrow.lv3 .amt{font-size:12px;color:var(--ink-3);font-variation-settings:"wght" 580,"wdth" 92}
.v2 .vrow .pt{text-align:right;font-size:11.5px;color:var(--ink-3);font-variation-settings:"wght" 560,"wdth" 92}
.v2 .vrow .cnt{font-size:10.5px;color:var(--ink-4);font-variation-settings:"wght" 560,"wdth" 100;margin-left:6px}
.v2 .vrow.tot{border-top:1.5px solid var(--ink);background:var(--surface-2)}
.v2 .vrow.tot .nm{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-variation-settings:"wght" 700,"wdth" 100}
.v2 .vrow.tot .r{font-size:14.5px;font-variation-settings:"wght" 700,"wdth" 90}
.v2 .pbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.v2 .pbar .fx{position:absolute;left:0;top:0;bottom:0;background:var(--ink-4)}
.v2 .pbar .vr{position:absolute;top:0;bottom:0;background:var(--ink-2)}
/* Des barres plutôt qu'une courbe : un mois est une valeur close, pas un point
   sur un continuum. Le mois consulté prend la teinte du poste. */
.v2 .spark{display:flex;align-items:flex-end;gap:2px;height:17px}
.v2 .spark i{display:block;flex:1;min-height:1.5px;border-radius:1.5px;background:var(--ink-4);opacity:.55}
.v2 .spark i.now{opacity:1}
.v2 .dv{text-align:right;font-size:12.5px;font-variation-settings:"wght" 660,"wdth" 92;white-space:nowrap}
.v2 .dv.up{color:var(--bad-ink)} .v2 .dv.down{color:var(--win-ink)} .v2 .dv.flat{color:var(--ink-3)}
.v2 .dbar{position:relative;height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.v2 .dbar .band{position:absolute;top:0;bottom:0;background:var(--line);opacity:.85}
.v2 .dbar .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-3);opacity:.6}
.v2 .dbar .f{position:absolute;top:3px;bottom:3px;border-radius:2px}
.v2 .dbar .f.up{background:var(--bad)} .v2 .dbar .f.down{background:var(--win)} .v2 .dbar .f.flat{background:var(--ink-4)}

/* ---------- OPÉRATIONS ---------- */
.v2 .imp{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.v2 .imp .src{display:flex;flex-direction:column;gap:1px}
.v2 .imp .src .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-variation-settings:"wght" 660,"wdth" 100}
.v2 .imp .src .v{font-size:14px;font-variation-settings:"wght" 640,"wdth" 100}
.v2 .imp .fig{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap}
.v2 .imp .fig div{display:flex;flex-direction:column;gap:1px;text-align:right}
.v2 .imp .fig .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-variation-settings:"wght" 660,"wdth" 100}
.v2 .imp .fig .v{font-size:17px;font-variation-settings:"wght" 660,"wdth" 90;letter-spacing:-.015em}
.v2 .imp .fig .v.in{color:var(--win-ink)}
/* Des filtres nommés et comptés plutôt que des cases à cocher : le travail
   restant se voit au lieu de se cacher. */
.v2 .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.v2 .fbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink-2);padding:5px 13px;cursor:pointer;font:inherit;font-size:12.5px;font-variation-settings:"wght" 580,"wdth" 100}
.v2 .fbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.v2 .fbtn .n{font-variant-numeric:tabular-nums;font-variation-settings:"wght" 700,"wdth" 92;color:var(--ink-3)}
.v2 .fbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.v2 .fbtn[aria-pressed="true"] .n{color:var(--bg)}
.v2 .fbtn.todo{border-color:var(--hot-line);background:var(--hot-bg);color:var(--hot-ink)}
.v2 .fbtn.todo .n{color:var(--hot-ink)}
.v2 .fbtn.todo[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:var(--on)}
.v2 .fbtn.todo[aria-pressed="true"] .n{color:inherit}
.v2 .fsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.v2 .fsub .lb{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-variation-settings:"wght" 660,"wdth" 100}
.v2 .fsub .fbtn{padding:4px 11px;font-size:12px}
.v2 .opt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.v2 .ohead,.v2 .orow{display:grid;grid-template-columns:52px minmax(0,1fr) 188px 106px 74px;gap:13px;align-items:center;padding:0 15px}
.v2 .ohead{padding-top:9px;padding-bottom:8px;border-bottom:1px solid var(--ink);font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-variation-settings:"wght" 680,"wdth" 96}
.v2 .ohead .r,.v2 .orow .r{text-align:right}
.v2 .orow{padding-top:7px;padding-bottom:7px;border-top:1px solid var(--line-2);position:relative}
.v2 .orow:first-child{border-top:0}
.v2 .orow:hover{background:var(--surface-2)}
/* Le jour ne se répète pas : les journées se détachent alors d'elles-mêmes. */
.v2 .orow .d{font-size:12px;color:var(--ink-3);font-variation-settings:"wght" 620,"wdth" 92}
.v2 .orow.same .d{visibility:hidden}
.v2 .orow.newday{border-top-color:var(--line)}
.v2 .orow .who{display:flex;align-items:baseline;gap:10px;min-width:0}
.v2 .orow .mer{flex:none;max-width:46%;font-size:13.5px;font-variation-settings:"wght" 600,"wdth" 100;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .orow .raw{flex:1;min-width:0;font-size:10.5px;color:var(--ink-4);font-variation-settings:"wght" 470,"wdth" 96;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .orow .amt{text-align:right;font-size:14px;font-variation-settings:"wght" 640,"wdth" 90;white-space:nowrap}
/* L'encre verte seule passait pour du gris foncé : la pastille rend la couleur
   lisible sans toucher au contraste du texte. */
.v2 .orow .amt.in{color:var(--win-ink);background:var(--win-bg);border-radius:20px;padding:2px 8px;display:inline-block}
.v2 .otag{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px 2px 4px;font-size:11.5px;font-variation-settings:"wght" 580,"wdth" 100;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .otag .pico{width:17px;height:17px;border-radius:5px}
.v2 .otag.none{border:1px dashed var(--hot-line);background:var(--hot-bg);color:var(--hot-ink);padding:2px 10px;cursor:pointer;font-variation-settings:"wght" 660,"wdth" 100}
.v2 .otag.none:hover{border-style:solid;border-color:var(--hot)}
.v2 .orow.f-todo{background:var(--hot-bg)}
.v2 .orow.f-todo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hot)}
.v2 .orow.f-dup,.v2 .orow.f-ign{color:var(--ink-3)}
.v2 .orow.f-dup .mer,.v2 .orow.f-ign .mer{font-variation-settings:"wght" 520,"wdth" 100;color:var(--ink-3)}
.v2 .orow.f-dup .amt,.v2 .orow.f-ign .amt{color:var(--ink-3)}
.v2 .flag{display:inline-block;border-radius:20px;padding:1px 8px;font-size:10.5px;font-variation-settings:"wght" 660,"wdth" 100;white-space:nowrap;flex:none}
.v2 .flag.dup{background:var(--bad-bg);color:var(--bad-ink)}
.v2 .flag.ign{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.v2 .soctag{border-radius:20px;padding:1px 8px;font-size:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);font-variation-settings:"wght" 600,"wdth" 100;white-space:nowrap;flex:none}
/* Un virement interne ne se juge pas sur sa catégorie mais sur sa destination :
   est-il seulement arrivé quelque part dans le patrimoine ? */
.v2 .dest{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 10px 2px 7px;font-size:11.5px;font-variation-settings:"wght" 600,"wdth" 100;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .dest .sw{width:9px;height:9px;border-radius:3px;flex:none}
.v2 .dest .ar{color:var(--ink-4);font-size:10px}
.v2 .dest.orphan{background:var(--hot-bg);border-color:var(--hot-line);color:var(--hot-ink)}
/* Les actions ne s'affichent qu'au survol : trois icônes sur chaque ligne
   faisaient un rideau de pictogrammes au-dessus des chiffres. */
.v2 .acts{display:flex;justify-content:flex-end;gap:3px;opacity:0;transition:opacity .12s}
.v2 .orow:hover .acts,.v2 .orow:focus-within .acts{opacity:1}
.v2 .iconbtn{border:1px solid transparent;background:none;border-radius:6px;padding:3px;cursor:pointer;color:var(--ink-3);display:inline-flex}
.v2 .iconbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.v2 .iconbtn.danger:hover{color:var(--bad-ink);border-color:var(--bad-line)}
.v2 .oempty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}
.v2 .oempty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px;font-variation-settings:"wght" 660,"wdth" 100}
.v2 .ofoot{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.v2 .ofoot .sp{flex:1}

/* ---------- animation ---------- */
/* Elle ne se déclenche que sur un changement de contexte, jamais sur un
   dépliement : rejouer la séquence à chaque clic rendait l'analyse pénible. */
@keyframes v2rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes v2grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes v2growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes v2pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.v2 .anim-all.gg .objcard,.v2 .anim-all .vrow.lv1,.v2 .anim-all.chips .chip{animation:v2rise .34s cubic-bezier(.22,1,.36,1) both}
.v2 .anim-sub .vrow.lv2.new{animation:v2rise .26s cubic-bezier(.22,1,.36,1) both}
.v2 .anim-all .fx,.v2 .anim-all .vr,.v2 .anim-all .dbar .f{transform-origin:left center;animation:v2grow .52s cubic-bezier(.22,1,.36,1) both}
.v2 .anim-all .dbar .f{transform-origin:center}
.v2 .anim-all .spark i{transform-origin:center bottom;animation:v2growy .52s cubic-bezier(.22,1,.36,1) both}
.v2 .ringmark.cheer{animation:v2pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.62s}

@media(max-width:1000px){
  .v2 .vhead,.v2 .vrow{grid-template-columns:minmax(0,1fr) 96px 52px 76px;gap:11px}
  .v2 .vhead .c2,.v2 .vhead .sp6,.v2 .vrow .pbar,.v2 .vrow .dbar,.v2 .vrow .spark{display:none}
  .v2 .vrow .dv{grid-column:4}
}
@media(max-width:940px){
  .v2 .board{grid-template-columns:1fr}
  .v2 .gauge{border-left:0;border-top:1px solid var(--line)}
  /* Les pastilles et le partage du dessous se replient ensemble : décalés, ils
     laissaient une bande de largeurs où les deux rangées ne s'alignaient plus.
     v2GoalCells() interroge ce même seuil pour compter ses colonnes. */
  .v2 .chips,.v2 .gsplit{grid-template-columns:1fr}
}
@media(max-width:900px){
  .v2 .ohead,.v2 .orow{grid-template-columns:44px minmax(0,1fr) 96px;gap:10px}
  .v2 .ohead span:nth-child(3),.v2 .ohead span:nth-child(5),.v2 .orow .otag,.v2 .orow .dest,.v2 .orow .acts,.v2 .orow .raw{display:none}
}
@media(max-width:720px){.v2 .dgrid{grid-template-columns:1fr;gap:16px}}
@media(max-width:660px){
  .v2{margin:-22px -16px -60px;padding:18px 16px 60px}
  /* Sur une seule colonne, la carte est plus large que la vignette : centrée
     sur elle, elle passait le bord de l'écran. Elle s'aligne alors sur ses
     deux côtés plutôt que de garder une largeur fixe. */
  .v2 .tip{left:0;right:0;width:auto;transform:translateY(-4px)}
  .v2 .objwrap:hover .tip,.v2 .objwrap:focus-within .tip{transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){.v2 *{transition:none!important;animation:none!important}}


/* =========================================================================
   TROPHÉES
   -------------------------------------------------------------------------
   Échelle de rareté propre au Budget : ni bronze, ni argent, ni or — de la
   pierre à la braise, en passant par le bleu, l'indigo et l'améthyste. Les
   jalons du Patrimoine gardent leurs médaillons ronds et leurs métaux ; on ne
   confond jamais les deux collections.

   La forme de l'emblème dit la famille, la couleur ne parle que de rareté, et
   l'ornement s'enrichit à chaque rang — liseré, rayons, laurier, couronne
   fermée et gemme. Un point de plus ne se sent pas ; une couronne, si. Comme
   l'ornement porte le rang autant que la teinte, l'échelle survit au
   daltonisme.
   ========================================================================= */
.v2{

.v2 .tro .ttip{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%) translateY(-4px);

  padding:10px 12px 11px;text-align:left;z-index:45;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);
