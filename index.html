      const edge = cols > 1 ? (i % cols === 0 ? " tipL" : i % cols === cols - 1 ? " tipR" : "") : "";
      const tag = canOpen ? "button" : "div";
      return '<div class="objwrap' + edge + (isOpen ? " open" : "") +
          '" style="animation-delay:' + (i * 26) + 'ms">' +
        "<" + tag + ' class="objcard ' + r.st + (canOpen ? " clk" : "") + (isOpen ? " on" : "") + '"' +
          (canOpen ? ' data-act="v2goal" data-goal="' + esc(r.id) + '" aria-expanded="' + isOpen + '"' : "") + ">" +
          '<span class="ringbox"><svg viewBox="0 0 64 64" aria-hidden="true">' +
            '<circle class="rt2" cx="32" cy="32" r="' + R + '"></circle>' +
            '<circle class="rp2" cx="32" cy="32" r="' + R + '" stroke-dasharray="' + CIRC.toFixed(1) +
              '" stroke-dashoffset="' + (CIRC * (1 - frac)).toFixed(1) + '"></circle>' + notch + "</svg>" +
            '<span class="mid">' + v2Glyph(r.grp, r.st) + "</span></span>" +
          '<span class="bdg">' + V2_BADGE[r.st] + "</span>" +
          '<span class="nm">' + esc(r.name) + "</span>" +
          '<span class="v num">' + esc(fmtEurShort(r.spent)) + "</span>" +
          '<span class="of num">sur ' + esc(fmtEurShort(r.target)) + "</span>" +
        "</" + tag + ">" + v2Tip(r, c) + "</div>";
    });
    const open = rows.findIndex(r => r.id === UI.v2goal);
    /* Le panneau se glisse sous la rangée de la vignette ouverte. */
    if (open >= 0) cells.splice(Math.min((Math.floor(open / cols) + 1) * cols, cells.length), 0, v2GoalDetail(rows[open], s));
    html += '<div class="gsplit"><div class="gg' + v2AnimClass("all") + '">' + cells.join("") + "</div>" +
      '<div class="prail">' + v2Pulse(c, rows) + v2Next() + "</div></div>";
  }
  html += "</div>";

  /* --- à traiter --- */
  html += '<div class="sect"><div class="shead"><span class="t">À traiter</span></div>';
  html += s.todoCount
    ? '<div class="todo"><div class="n num">' + s.todoCount + "</div>" +
      '<div class="tx">opération' + (s.todoCount > 1 ? "s" : "") + " sans catégorie, <b>" + esc(fmtEur(s.todoAmount)) +
      "</b> hors des totaux ci-dessus.</div>" +
      '<button class="act" data-act="v2tab" data-tab="ops">Les voir</button></div>'
    : '<div class="todo clean"><span class="ic">' + V2_WIN + "</span>" +
      '<div class="tx">Toutes les opérations du mois sont classées.</div></div>';
  return html + "</div>";
}

function v2Chips(c, rows, held) {
  const goal = c.goal, rate = savingsRate(c.s.income, c.s.expense);
  const all = rows.length, perfect = all > 0 && held === all;
  const out = [];
  if (all) out.push({
    cls: perfect || held >= all - 1 ? "win" : "hot", ic: perfect || held >= all - 1 ? V2_WIN : V2_HOT,
    v: held + " objectif" + (held > 1 ? "s" : "") + " sur " + all + (c.running ? " dans les clous" : " tenus"),
    k: perfect ? "sans faute" : (all - held) + " dépassement" + (all - held > 1 ? "s" : ""),
  });
  const streak = v2Streak(goal);
  if (goal) out.push(streak > 0
    ? { cls: "win", ic: V2_FLAME,
        v: streak === 1 ? "1er mois au-dessus de " + fmtRate(goal) : streak + " mois d’affilée à " + fmtRate(goal) + " ou plus",
        k: streak === 1 ? "une série commence" : "série en cours" }
    : { cls: "hot", ic: V2_HOT, v: "Série interrompue",
        k: rate == null ? "revenus non saisis" : "objectif manqué de " + v2Pts(goal - rate) });
  if (!out.length) return "";
  return out.map(x =>
    '<div class="chip ' + x.cls + '"><span class="ic">' + x.ic + "</span>" +
    '<span class="tx"><span class="v">' + esc(x.v) + '</span><span class="k">' + esc(x.k) + "</span></span></div>").join("");
}

/* Le pourquoi d'un dépassement, en chiffres : la ventilation interne du poste et
   les plus grosses dépenses. Jamais un paragraphe. */
function v2GoalDetail(r, s) {
  const g = GROUP_BY_ID[r.id];
  const cats = g ? CATS.filter(x => x.group === r.id && s.cats[x.id])
      .map(x => ({ n: x.name, v: s.cats[x.id] })).sort((a, b) => b.v - a.v) : [];
  const tot = cats.reduce((a, x) => a + x.v, 0);
  const ops = s.ops.filter(t => t.cat && t.amount < 0 && (g ? (CAT_BY_ID[t.cat] || {}).group === r.id : t.cat === r.id))
    .sort((a, b) => a.amount - b.amount).slice(0, 4);

  let html = '<div class="detail"><div class="dh"><span class="t">' + esc(r.name) + "</span>" +
    '<span class="s num">▲ ' + esc(fmtEur(r.spent - r.target)) + " au-dessus du plafond</span>" +
    '<button class="x" data-act="v2goal" data-goal="' + esc(r.id) + '">Fermer</button></div><div class="dgrid">';

  html += '<table class="dt"><caption>Par sous-catégorie</caption><tbody>' +
    (cats.length
      ? cats.map(x => "<tr><th>" + esc(x.n) + '</th><td class="num">' + esc(fmtEur(x.v, {})) +
          '</td><td class="q num">' + esc(fmtRate(x.v / tot * 100)) + "</td></tr>").join("") +
        '<tr class="tot"><th>Total</th><td class="num">' + esc(fmtEur(tot, {})) + '</td><td class="q num">100 %</td></tr>'
      : '<tr><th>Pas de sous-catégorie</th><td></td><td></td></tr>') +
    "</tbody></table>";

  html += '<table class="dt"><caption>Plus grosses dépenses</caption><tbody>' +
    (ops.length
      ? ops.map(t => '<tr><td class="d num">' + t.date.slice(8, 10) + "</td><th>" +
          esc(t.merchantRaw || merchantFromLabel(t.label) || "—") + '</th><td class="q">' + esc(catName(t.cat)) +
          '</td><td class="num">' + esc(fmtEur(-t.amount, {})) + "</td></tr>").join("")
      : "<tr><th>Aucune dépense</th><td></td></tr>") +
    "</tbody></table>";
  return html + "</div></div>";
}

/* Cumul des dépenses jour par jour sur un mois. */
function v2Cumul(key) {
  const dim = new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate();
  const byDay = new Array(dim).fill(0);
  opsOfMonth(key).filter(isExpense).forEach(t => { byDay[dayOf(t.date) - 1] += -t.amount; });
  const out = []; let run = 0;
  for (let i = 0; i < dim; i++) { run += byDay[i]; out.push(run); }
  return out;
}
/* Les mois effectivement retenus pour la référence : ceux qui portent au moins
   une dépense. Un mois vide fausserait la moyenne vers le bas. */
function v2UsualKeys(key, n) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    const k = addMonth(key, -i);
    if (opsOfMonth(k).filter(isExpense).length) out.push(k);
  }
  return out;
}
/* La même chose, moyennée sur les mois précédents. L'échantillonnage se fait à
   fraction de mois égale et non à jour égal, sans quoi un février de 28 jours
   se comparerait mal à un mois de 31. */
function v2Usual(key, n) {
  const series = v2UsualKeys(key, n).map(v2Cumul);
  if (!series.length) return null;
  const dim = new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate(), out = [];
  for (let d = 1; d <= dim; d++) {
    const vals = series.map(x => x[Math.min(Math.ceil(d / dim * x.length), x.length) - 1]);
    out.push(vals.reduce((a, b) => a + b, 0) / vals.length);
  }
  return out;
}

/* Ce que « habituellement » veut dire, en clair et avec les mois retenus. */
function v2UsualHelp(key) {
  const ks = v2UsualKeys(key, 3);
  if (!ks.length) return "";
  const noms = ks.map(k => monthLabel(k));
  const liste = noms.length > 1 ? noms.slice(0, -1).join(", ") + " et " + noms[noms.length - 1] : noms[0];
  return '<button class="help" type="button" aria-label="Comment est calculé ce chiffre">?' +
    '<span class="hbox"><b>Moyenne des ' + ks.length + " mois précédents</b> — " + esc(liste) +
    ". Les mois sans dépense sont écartés. La comparaison se fait à <b>fraction de mois égale</b> " +
    "et non à jour égal, pour qu\u2019un février de 28 jours se compare correctement à un mois de 31." +
    "</span></button>";
}

/* Le panneau « Où en est le mois ». Les anneaux répondent poste par poste ;
   celui-ci répond pour le mois entier, et surtout dit depuis quand ça dérape. */
function v2Pulse(c, rows) {
  const key = c.key, dim = c.days, day = c.day;
  const cur = v2Cumul(key), usual = v2Usual(key, 3);
  const spent = cur[day - 1] || 0;
  const p = c.running ? day / dim : 1;
  const proj = p > 0 ? spent / p : spent;
  const W = 268, H = 104;

  let html = '<div class="pulse"><div class="ph">Où en est le mois</div>';

  if (!cur.length || (!usual && !spent)) {
    return html + '<div class="soon">Pas encore assez d’historique pour situer ce mois.</div></div>';
  }

  const top = Math.max(cur[day - 1] || 0, usual ? usual[dim - 1] : 0, c.running ? proj : 0, 1) * 1.06;
  const X = d => ((d - 1) / (dim - 1)) * W;
  const Y = v => H - (v / top) * H;
  const path = (arr, upto) => arr.slice(0, upto).map((v, i) => (i ? "L" : "M") + X(i + 1).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");

  html += '<div class="pbody"><div class="pchart">' +
    '<svg viewBox="-2 -6 ' + (W + 8) + " " + (H + 20) + '" preserveAspectRatio="none"' +
    ' role="img" aria-label="Dépenses cumulées du mois">' +
    '<line class="axis" x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '"></line>';
  if (usual) html += '<path class="usualfill" d="' + path(usual, dim) +
    "L" + X(dim).toFixed(1) + " " + H + "L" + X(1).toFixed(1) + " " + H + 'Z"></path>' +
    '<path class="usual" d="' + path(usual, dim) + '"></path>';
  html += '<path class="now" d="' + path(cur, day) + '"></path>';
  if (c.running && day < dim) {
    html += '<path class="proj ' + (usual && proj > usual[dim - 1] ? "up" : "down") + '" d="M' +
      X(day).toFixed(1) + " " + Y(spent).toFixed(1) + "L" + X(dim).toFixed(1) + " " + Y(proj).toFixed(1) + '"></path>' +
      '<line class="dayline" x1="' + X(day).toFixed(1) + '" y1="0" x2="' + X(day).toFixed(1) + '" y2="' + H + '"></line>';
  }
  /* Un cercle s'ovaliserait sous l'étirement horizontal. Un segment de longueur
     nulle à bout rond reste rond : son épaisseur échappe à la transformation. */
  const dx = X(day).toFixed(1), dy = Y(spent).toFixed(1);
  html += '<line class="dot" x1="' + dx + '" y1="' + dy + '" x2="' + dx + '" y2="' + dy + '"></line></svg>';

  html += '<div class="lg"><span class="l1"><i></i>ce mois</span>' +
    (usual ? '<span class="l2"><i></i>habituellement</span>' : "") + "</div></div>";

  html += '<div class="pnum">';

  const ecart = usual ? spent - usual[day - 1] : null;
  html += "<table><tbody>" +
    "<tr><th>" + (c.running ? "Dépensé au " + day : "Dépensé") + "</th><td class=\"num\">" + esc(fmtEur(spent)) + "</td></tr>";
  if (usual) html += "<tr><th>Habituellement" + v2UsualHelp(key) + "</th><td class=\"num q\">" +
    esc(fmtEur(usual[day - 1])) + "</td></tr>" +
    '<tr><th>Écart</th><td class="num ' + (ecart > 0 ? "up" : "down") + '">' + esc(fmtEur(ecart, { plus: true })) + "</td></tr>";
  if (c.running) html += '<tr class="sum"><th>Fin de mois estimée</th><td class="num ' +
    (usual && proj > usual[dim - 1] ? "up" : "down") + '">' + esc(fmtEur(proj)) + "</td></tr>";
  /* Sur un mois clos, le dernier jour et le total sont la même valeur : la
     répéter ne dit rien de plus. */
  if (usual && c.running) html += "<tr><th>Mois habituel</th><td class=\"num q\">" +
    esc(fmtEur(usual[dim - 1])) + "</td></tr>";
  html += "</tbody></table></div></div>";

  /* Le pied change de sujet avec l'état du mois. Tant qu'il court, la seule
     question qui vaille est ce qu'il reste ; une fois clos, elle n'a plus de
     sens et c'est l'écart affiché juste au-dessus qu'il faut expliquer. */
  html += c.running ? v2PulseAvenir(c, rows, key, dim, day) : v2PulseBilan(key);
  return html + "</div>";
}

/* Ce qui reste : la marge encore libre sous les plafonds, ce qui en est déjà
   réservé par des prélèvements à venir, et ce qui reste vraiment disponible.
   Sans le deuxième terme, un mois calme au 20 paraît confortable alors que
   200 € de charges attendent le 28. */
function v2PulseAvenir(c, rows, key, dim, day) {
  const soon = baseCost().kept
    .filter(r => r.period === 1 && r.months[key] == null && r.day > day)
    .sort((a, b) => a.day - b.day);
  const engage = soon.reduce((a, r) => a + r.monthly, 0);
  /* Un plafond déjà dépassé ne rend pas de marge aux autres : on somme les
     marges positives, pas leur solde net. */
  const marge = (rows || []).reduce((a, r) => a + Math.max(r.target - r.spent, 0), 0);
  const jours = Math.max(dim - day, 0), libre = marge - engage;

  let html = '<div class="pfoot"><div class="fh">Ce qu’il reste</div>';
  if (rows && rows.length) {
    html += '<div class="st">Il reste <b>' + fmtEur(marge) + "</b> sous vos plafonds" +
      (engage > 0 ? ", dont <b>" + fmtEur(engage) + "</b> déjà réservés par " + soon.length +
        " charge" + (soon.length > 1 ? "s" : "") + " à venir" : "") + "." +
      (jours > 0 && libre > 0
        ? " Soit <b>" + fmtEur(libre / jours) + "</b> par jour sur les " + jours + " jours restants."
        : libre <= 0 ? " Les charges à venir absorbent toute la marge." : "") + "</div>";
  } else if (engage > 0) {
    html += '<div class="st"><b>' + fmtEur(engage) + "</b> de charges fixes à passer d’ici la fin du mois.</div>";
  }
  html += soon.length
    ? '<table class="ptl"><tbody>' + soon.slice(0, 4).map(r =>
        '<tr><td class="d num">' + r.day + "</td><td>" + esc(r.name) +
        '</td><td class="a num">' + esc(fmtEur(r.monthly)) + "</td></tr>").join("") +
      (soon.length > 4 ? '<tr><td class="d"></td><td class="q">et ' + (soon.length - 4) +
        " autre" + (soon.length - 4 > 1 ? "s" : "") + "</td><td></td></tr>" : "") + "</tbody></table>"
    : '<div class="st q">Toutes les charges fixes du mois sont passées.</div>';
  return html + "</div>";
}

/* Sur un mois clos, « ce qu'il reste » ne veut plus rien dire. La question
   devient d'où vient l'écart affiché juste au-dessus : on le décompose par
   poste, contre la même référence de trois mois, sans quoi le chiffre reste un
   verdict sans explication. */
function v2PulseBilan(key) {
  const refs = v2UsualKeys(key, 3);
  if (!refs.length) return "";
  const now = groupTotals(opsOfMonth(key)), av = {};
  const posts = GROUPS.filter(x => x.kind === KIND_EXPENSE);
  refs.forEach(k => {
    const g = groupTotals(opsOfMonth(k));
    posts.forEach(x => { av[x.id] = (av[x.id] || 0) + (g[x.id] || 0) / refs.length; });
  });
  /* Sous 5 €, l'écart relève du bruit d'arrondi entre trois mois. */
  const mv = posts.map(x => ({ n: x.name, d: (now[x.id] || 0) - (av[x.id] || 0) }))
    .filter(x => Math.abs(x.d) >= 5)
    .sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 4);

  return '<div class="pfoot"><div class="fh">Ce qui a bougé</div>' + (mv.length
    ? '<table class="ptl"><tbody>' + mv.map(x => "<tr><td>" + esc(x.n) +
        '</td><td class="a num ' + (x.d > 0 ? "up" : "down") + '">' +
        esc(fmtEur(x.d, { plus: true })) + "</td></tr>").join("") + "</tbody></table>"
    : '<div class="st q">Aucun poste ne s’écarte nettement de son habitude.</div>') + "</div>";
}

/* Ce qui se rapproche. Une collection ne se visite que si l'écran principal en
   parle : trois trophées non acquis, les plus avancés. C'est la seule chose de
   l'écran qui regarde devant — tout le reste constate. */
function v2Next() {
  /* Un seul par famille. Les paliers d'une même famille tombent ensemble, si
     bien que les trois premiers du classement brut disaient trois fois la même
     chose à un mot près. Trois promesses distinctes valent mieux qu'une répétée. */
  const best = {};
  v2Trophies().filter(t => !t.at && t.pct > 0).forEach(t => {
    const k = best[t.fam];
    if (!k || t.pct > k.pct || (t.pct === k.pct && t.tier > k.tier)) best[t.fam] = t;
  });
  const near = Object.keys(best).map(f => best[f])
    .sort((a, b) => b.pct - a.pct || b.tier - a.tier).slice(0, 3);
  if (!near.length) return "";
  return '<div class="pulse nextro"><div class="ph">Bientôt</div>' +
    near.map(t => '<div class="nrow" style="--rc:var(--r' + t.tier + ')">' +
      '<span class="nw">' + v2TroSvg(t.fam, t.tier, false, t.pct, 38) + "</span>" +
      '<span class="nx"><span class="n">' + esc(t.name) + "</span>" +
      '<span class="k">' + esc(V2_RANK[t.tier - 1]) + "</span></span>" +
      '<span class="p num">' + Math.round(t.pct) + " %</span></div>").join("") +
    '<button class="go" data-act="view" data-view="trophees">Voir la collection</button></div>';
}

/* ---------------- onglet « Où ça part » ---------------- */
function v2DeltaBar(frac, bandFrac) {
  const half = 50, f = Math.max(-1, Math.min(1, frac || 0));
  const w = Math.abs(f) * half, bw = (bandFrac || 0) * half;
  const cls = f > (bandFrac || 0) ? "up" : f < -(bandFrac || 0) ? "down" : "flat";
  return '<span class="dbar">' +
    (bw ? '<span class="band" style="left:' + (half - bw) + "%;width:" + (bw * 2) + '%"></span>' : "") +
    '<span class="zero" style="left:' + half + '%"></span>' +
    '<span class="f ' + cls + '" style="' + (f >= 0 ? "left:" + half + "%;" : "left:" + (half - w) + "%;") +
      "width:" + Math.max(w, 0.8) + '%"></span></span>';
}
function v2Spark(series, groupId) {
  if (!series || !series.length) return "<span></span>";
  const mx = Math.max.apply(null, series) || 1, col = v2Colour(groupId);
  return '<span class="spark">' + series.map((v, i) => {
    const last = i === series.length - 1;
    return '<i class="' + (last ? "now" : "") + '" style="height:' + Math.max(v / mx * 100, 6).toFixed(0) + "%" +
      (last ? ";background:" + col : "") + '"></i>';
  }).join("") + "</span>";
}

function v2Ou(c) {
  const s = c.s, tot = s.expense;
  const fixedBy = v2FixedByGroup();
  const socle = Object.keys(fixedBy).reduce((a, k) => a + fixedBy[k], 0);
  const arb = Math.max(tot - socle, 0);
  const cmp = {};
  comparisonRows(c.key).forEach(r => { cmp[r.group.id] = r; });
  const band = DB.settings.band || 5;

  let html = '<div class="split"><div class="sp-head">' +
    '<div class="sp-tot"><div class="cap">Dépensé ce mois</div><div class="sp-v num">' + esc(fmtEur(tot)) + "</div></div>" +
    '<div class="sp-legs">' +
      '<span class="sp-leg"><span class="k"><i style="background:var(--ink-4)"></i>Charges fixes</span>' +
        '<span class="v num">' + esc(fmtEur(socle)) + '</span><span class="p num">' +
        (tot ? esc(fmtRate(socle / tot * 100)) + " du total" : "—") + "</span></span>" +
      '<span class="sp-leg"><span class="k"><i style="background:var(--ink-2)"></i>Arbitrable</span>' +
        '<span class="v num">' + esc(fmtEur(arb)) + '</span><span class="p num">' +
        (tot ? esc(fmtRate(arb / tot * 100)) + " du total" : "—") + "</span></span>" +
    "</div></div>" +
    '<div class="sp-bar"><span class="fx" style="width:' + (tot ? socle / tot * 100 : 0) + '%"></span>' +
      '<span class="vr" style="width:' + (tot ? arb / tot * 100 : 0) + '%"></span></div>' +
    '<div class="sp-note">Les charges fixes sont ce qui repasse chaque mois au même montant. Le reste est ce sur quoi vous décidez.</div></div>';

  const groups = GROUPS.filter(g => g.kind === KIND_EXPENSE && (s.groups[g.id] || 0) !== 0)
    .map(g => ({ g, v: s.groups[g.id] })).sort((a, b) => b.v - a.v);

  html += '<div class="sect"><div class="shead"><span class="t">Ventilation</span>' +
    '<span class="c">' + groups.length + " postes</span><span class=\"sp\"></span>" +
    '<span class="c">écart contre ' + esc(monthLabel(addMonth(c.key, -12))) + ", revalorisé de " +
      String(DB.settings.inflation).replace(".", ",") + " % d’inflation" +
      (c.running ? " et arrêté au " + c.day + " des deux mois" : "") + "</span>" +
    '<span class="seg"><button data-act="v2cmp" data-mode="pct" aria-pressed="' + (UI.v2cmp !== "eur") + '">%</button>' +
      '<button data-act="v2cmp" data-mode="eur" aria-pressed="' + (UI.v2cmp === "eur") + '">€</button></span></div>';

  if (!groups.length) {
    html += '<div class="opt"><div class="oempty"><b>Aucune dépense classée sur ce mois</b>' +
      "Importez un relevé, ou classez les opérations en attente.</div></div></div>";
    return html;
  }

  const max = groups.reduce((a, r) => Math.max(a, r.v), 0);
  const maxAbs = groups.reduce((a, r) => {
    const k = cmp[r.g.id];
    return k ? Math.max(a, Math.abs(r.v - k.ref)) : a;
  }, 0) || 1;

  html += '<div class="vt"><div class="vhead"><span>Poste</span><span class="r">Montant</span>' +
    '<span class="r">Part</span><span class="c2">Fixe / arbitrable</span><span class="sp6">6 mois</span>' +
    '<span class="r">Écart</span><span class="c2">vs ' + esc(MONTHS[+addMonth(c.key, -12).slice(5) - 1].slice(0, 4)) + "</span></div>" +
    '<div class="' + (UI.v2anim ? "anim-" + UI.v2anim : "") + '">';

  groups.forEach((row, gi) => {
    const g = row.g, open = UI.v2group === g.id, k = cmp[g.id];
    const ns = k && k.ref < 20 && UI.v2cmp !== "eur";
    const dpct = k ? k.pct : null, deur = k ? row.v - k.ref : null;
    const dcls = dpct == null || ns ? "flat" : dpct > band ? "up" : dpct < -band ? "down" : "flat";
    const dtxt = dpct == null ? "—" : ns ? "n.s."
      : UI.v2cmp === "eur" ? fmtEur(deur, { plus: true }) : fmtPct(dpct);
    const dfrac = ns ? 0 : UI.v2cmp === "eur" ? (deur || 0) / maxAbs : (dpct || 0) / 60;
    const fx = Math.min(fixedBy[g.id] || 0, row.v);
    const fxw = fx / max * 100, w = row.v / max * 100;

    html += '<button class="vrow lv1" data-act="v2group" data-group="' + g.id + '" aria-expanded="' + open +
        '" style="animation-delay:' + (gi * 24) + 'ms">' +
      '<span class="nm"><span class="ar">▶</span>' + v2Poste(g.id, 14) + '<span class="tx">' + esc(g.name) + "</span></span>" +
      '<span class="r amt num">' + esc(fmtEur(row.v)) + "</span>" +
      '<span class="pt num">' + esc(fmtRate(row.v / tot * 100)) + "</span>" +
      '<span class="pbar"><span class="fx" style="width:' + fxw.toFixed(1) + '%"></span>' +
        '<span class="vr" style="left:' + fxw.toFixed(1) + "%;width:" + Math.max(w - fxw, 0).toFixed(1) + '%"></span></span>' +
      v2Spark(v2History(g.id, 6), g.id) +
      '<span class="dv ' + dcls + ' num">' + esc(dtxt) + "</span>" +
      v2DeltaBar(dfrac, UI.v2cmp === "eur" ? 0 : band / 60) + "</button>";

    if (!open) return;
    const cats = CATS.filter(x => x.group === g.id && s.cats[x.id])
      .map(x => ({ c: x, v: s.cats[x.id] })).sort((a, b) => b.v - a.v);
    cats.forEach((x, ci) => {
      const co = UI.v2cat === x.c.id;
      html += '<button class="vrow lv2' + (UI.v2anim === "sub" ? " new" : "") + '" data-act="v2cat" data-cat="' + x.c.id +
          '" aria-expanded="' + co + '" style="animation-delay:' + (ci * 30) + 'ms">' +
        '<span class="nm"><span class="ar">▶</span><span class="tx">' + esc(x.c.name) + "</span></span>" +
        '<span class="r amt num">' + esc(fmtEur(x.v)) + "</span>" +
        '<span class="pt num">' + esc(fmtRate(x.v / row.v * 100)) + "</span>" +
        "<span></span><span></span><span></span><span></span></button>";
      if (!co) return;
      merchantsOfCat(s.ops, x.c.id).slice(0, 6).forEach(m => {
        html += '<div class="vrow lv3"><span class="nm"><span class="tx">' + esc(m.name) +
          '</span><span class="cnt num">' + m.n + " ×</span></span>" +
          '<span class="r amt num">' + esc(fmtEur(m.v)) + "</span>" +
          '<span class="pt num">' + esc(fmtRate(m.v / x.v * 100)) + "</span>" +
          "<span></span><span></span><span></span><span></span></div>";
      });
    });
  });

  html += '</div><div class="vrow tot"><span class="nm">Total des dépenses</span>' +
    '<span class="r num">' + esc(fmtEur(tot)) + '</span><span class="r num">100 %</span>' +
    "<span></span><span></span><span></span><span></span></div></div></div>";
  return html;
}

/* ---------------- onglet « Opérations » ---------------- */
function v2Ops(c) {
  const s = c.s;
  const kept = baseCost().kept;
  const socKey = {};
  kept.forEach(r => { socKey[r.key] = PERIOD_NAME[r.period] + (r.period === 1 ? " · vers le " + r.day : ""); });
  const rhythmOf = t => {
    const k = canonOf(t);
    return socKey[k] || socKey[k + "|" + (t.cat || "")] || "";
  };
  const stateOf = t => t.status === ST_DUP || t.status === ST_DUP_MAYBE ? "dup"
    : t.status === ST_IGNORED ? "ign" : !t.cat ? "todo" : "";

  const batches = DB.imports.filter(i => s.ops.some(t => t.imp === i.id));
  const inBatch = UI.v2batch === "all" ? s.ops : s.ops.filter(t => String(t.imp) === UI.v2batch);
  const ops = inBatch.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

  const inc = ops.filter(t => stateOf(t) !== "dup" && t.amount > 0).reduce((a, t) => a + t.amount, 0);
  const deb = ops.filter(t => { const st = stateOf(t); return (st === "" || st === "todo") && t.amount < 0; })
    .reduce((a, t) => a - t.amount, 0);
  const todo = ops.filter(t => stateOf(t) === "todo");
  const dup = ops.filter(t => stateOf(t) === "dup");
  const ign = ops.filter(t => stateOf(t) === "ign");
  const soc = ops.filter(t => rhythmOf(t));
  const orph = ign.filter(t => !patLinkedMove(t));
  const todoSum = todo.reduce((a, t) => a - Math.min(t.amount, 0), 0);

  const b = UI.v2batch === "all" ? null : batches.filter(x => String(x.id) === UI.v2batch)[0];
  let html = '<div class="imp"><div class="src"><span class="k">' +
    (b ? "Importé le " + esc(b.date) : batches.length > 1 ? batches.length + " imports"
      : batches.length ? "Importé le " + esc(batches[0].date) : "Aucun import") + "</span>" +
    '<span class="v">' + esc(b ? b.name : batches.length === 1 ? batches[0].name : monthLabel(c.key)) + "</span></div>" +
    '<div class="fig">' +
      '<div><span class="k">Opérations</span><span class="v num">' + ops.length + "</span></div>" +
      '<div><span class="k">Encaissé</span><span class="v in num">' + esc(fmtEur(inc)) + "</span></div>" +
      '<div><span class="k">Débité</span><span class="v num">' + esc(fmtEur(deb)) + "</span></div>" +
    "</div></div>";

  const f = [["all", "Toutes", ops.length, ""]];
  if (todo.length) f.push(["todo", "À catégoriser", todo.length, "todo"]);
  if (dup.length) f.push(["dup", "Doublon probable", dup.length, ""]);
  if (ign.length) f.push(["ign", "Virement interne", ign.length, ""]);
  if (soc.length) f.push(["soc", "Charges fixes", soc.length, ""]);
  html += '<div class="filters">' + f.map(x =>
    '<button class="fbtn ' + x[3] + '" data-act="v2ops" data-f="' + x[0] + '" aria-pressed="' + (UI.v2ops === x[0]) + '">' +
    esc(x[1]) + '<span class="n">' + x[2] + "</span></button>").join("") + "</div>";

  if (batches.length > 1) {
    html += '<div class="fsub"><span class="lb">Lot d’import</span>' +
      '<button class="fbtn" data-act="v2batch" data-batch="all" aria-pressed="' + (UI.v2batch === "all") + '">Tous' +
        '<span class="n">' + s.ops.length + "</span></button>" +
      batches.map(x => {
        const n = s.ops.filter(t => t.imp === x.id).length;
        return '<button class="fbtn" data-act="v2batch" data-batch="' + x.id + '" aria-pressed="' +
          (UI.v2batch === String(x.id)) + '" title="' + esc(x.name) + '">' + esc(x.date) +
          '<span class="n">' + n + "</span></button>";
      }).join("") + "</div>";
  }

  const shown = UI.v2ops === "all" ? ops
    : UI.v2ops === "soc" ? ops.filter(t => rhythmOf(t))
    : ops.filter(t => stateOf(t) === UI.v2ops);

  html += '<div class="opt"><div class="ohead"><span>Jour</span><span>Opération</span>' +
    '<span>Catégorie</span><span class="r">Montant</span><span></span></div>';

  if (!shown.length) {
    html += '<div class="oempty"><b>Rien à afficher</b>' +
      (s.ops.length ? "Revenez à « Toutes » pour voir le relevé complet." : "Importez un relevé pour remplir ce mois.") + "</div>";
  } else {
    let prev = null;
    html += shown.map(t => {
      const day = t.date.slice(8, 10), same = day === prev;
      prev = day;
      const st = stateOf(t), isIn = t.amount > 0, rhythm = rhythmOf(t);
      const flag = st === "dup" ? '<span class="flag dup">' + (t.status === ST_DUP ? "doublon" : "doublon probable") + "</span>"
        : st === "ign" ? '<span class="flag ign">virement interne</span>' : "";
      const linked = patLinkedMove(t);
      const acct = linked ? (DB.patAccounts || []).find(a => a.id === linked.accountId) : null;
      const mid = st === "ign"
        ? (acct
            ? '<span class="dest"><span class="ar">→</span>' + patSwatch(acct, 9) + esc(acct.name) + "</span>"
            : '<span class="dest orphan"><span class="ar">→</span>aucun compte</span>')
        : t.cat
          ? '<span class="otag" title="' + esc(catGroup(t.cat).name + " · " + catName(t.cat)) + '">' +
            v2Poste(catGroup(t.cat).id, 12) + "<span>" + esc(catName(t.cat)) + "</span></span>"
          : '<button class="otag none" data-act="editcat" data-id="' + t.id + '">Choisir une catégorie</button>';
      const acts = st === "dup"
        ? '<button class="iconbtn" title="Ce n’est pas un doublon" data-act="undup" data-id="' + t.id + '">' + icon("undo", 14) + "</button>" +
          '<button class="iconbtn danger" title="Supprimer" data-act="del" data-id="' + t.id + '">' + icon("trash", 14) + "</button>"
        : st === "ign"
        ? '<button class="iconbtn" title="Recompter cette opération" data-act="unignore" data-id="' + t.id + '">' + icon("undo", 14) + "</button>"
        : '<button class="iconbtn" title="Ignorer (virement interne)" data-act="ignore" data-id="' + t.id + '">' + icon("vault", 14) + "</button>" +
          '<button class="iconbtn" title="Marquer comme doublon" data-act="mkdup" data-id="' + t.id + '">' + icon("warn", 14) + "</button>" +
          '<button class="iconbtn danger" title="Supprimer" data-act="del" data-id="' + t.id + '">' + icon("trash", 14) + "</button>";
      return '<div class="orow' + (st ? " f-" + st : "") + (same ? " same" : " newday") + '">' +
        '<span class="d num">' + day + "</span>" +
        '<span class="who"><span class="mer">' + esc(t.merchantRaw || merchantFromLabel(t.label) || "—") + "</span>" +
          '<span class="raw">' + esc(t.label) + "</span>" + flag +
          (rhythm ? '<span class="soctag">' + esc(rhythm) + "</span>" : "") + "</span>" +
        "<span>" + mid + "</span>" +
        '<span class="amt num' + (isIn ? " in" : "") + '">' + esc(fmtEur(t.amount, { plus: true })) + "</span>" +
        '<span class="acts">' + acts + "</span></div>";
    }).join("");
  }
  html += "</div>";

  let msg;
  if (UI.v2ops === "soc") msg = soc.length + " opérations reconnues comme charges fixes sur ce mois.";
  else if (orph.length) msg = orph.length + " virement" + (orph.length > 1 ? "s" : "") + " interne" +
    (orph.length > 1 ? "s" : "") + " sans compte de destination : l’argent a quitté le budget sans entrer dans le patrimoine.";
  else if (todo.length) msg = todo.length + " opération" + (todo.length > 1 ? "s" : "") +
    " sans catégorie : le débit du relevé (" + fmtEur(deb) + ") dépasse de " + fmtEur(todoSum) +
    " les dépenses comptées (" + fmtEur(deb - todoSum) + ").";
  else msg = "Toutes les opérations sont classées : le débit du relevé est intégralement compté.";
  return html + '<div class="ofoot"><span>' + esc(msg) + '</span><span class="sp"></span><span>' +
    shown.length + " ligne" + (shown.length > 1 ? "s" : "") + " affichée" + (shown.length > 1 ? "s" : "") + "</span></div>";
}


/* =========================================================================
   Trophées — catalogue et moteur
   -------------------------------------------------------------------------
   Tout se calcule sur l'historique complet : un succès mérité ne devrait pas
   dépendre de la date d'installation. Chaque trophée porte donc le mois où il
   a été gagné, pas celui où on le découvre. En contrepartie, les paliers hauts
   sont calibrés pour rester hors d'atteinte des années durant.

   Réserve honnête : les objectifs mensuels sont ceux d'aujourd'hui, appliqués
   au passé — l'application ne conserve pas l'historique des plafonds. Les
   familles Discipline et Régularité s'en trouvent légèrement optimistes.
   ========================================================================= */
const V2_HEX = "M44 14 66 27 66 53 44 66 22 53 22 27Z";
const V2_HEXIN = "M44 19 61.5 29.4 61.5 50.6 44 61 26.5 50.6 26.5 29.4Z";
const V2_HEXLEN = 152;
const V2_RANK = ["Commun", "Peu commun", "Rare", "Très rare", "Exceptionnel"];

const V2_FAM = {
  epargne: { n: "Épargne", d: "ce que vous mettez de côté",
    em: '<path d="M32 38v5.4c0 3.4 5.4 6.2 12 6.2s12-2.8 12-6.2V38"/>' +
        '<path d="M32 31.5c0-3.4 5.4-6.2 12-6.2s12 2.8 12 6.2-5.4 6.2-12 6.2-12-2.8-12-6.2z"/>' },
  regularite: { n: "Régularité", d: "tenir dans la durée",
    em: '<rect x="28" y="33" width="18" height="14" rx="7"/><rect x="42" y="33" width="18" height="14" rx="7"/>' },
  discipline: { n: "Discipline", d: "des objectifs tenus",
    em: '<path d="M44 25c4 2.6 8.4 3.6 12 3.6v9.6c0 6.6-5 11.4-12 14.2-7-2.8-12-7.6-12-14.2v-9.6c3.6 0 8-1 12-3.6z"/>' +
        '<path d="M39.5 39.5 43 43l6-7"/>' },
  sobriete: { n: "Sobriété", d: "dépenser moins qu'avant",
    em: '<path d="M56 25c0 13-7 21-16 21-3 0-5-1-5-1s-1-14 7-19 14-1 14-1z"/><path d="M32 54c2-6 6-11 12-15"/>' },
  loufoque: { n: "Défis loufoques", d: "aucun rapport avec la bonne gestion",
    em: '<rect x="30" y="27" width="28" height="26" rx="5" transform="rotate(-8 44 40)"/>' +
        '<circle cx="38" cy="35" r="2.2" fill="currentColor" stroke="none"/>' +
        '<circle cx="50" cy="45" r="2.2" fill="currentColor" stroke="none"/>' +
        '<circle cx="44" cy="40" r="2.2" fill="currentColor" stroke="none"/>' },
};

/* L'ornement s'enrichit à chaque rang. C'est là que se joue la rareté : un
   point de plus ne se sent pas, une couronne si. */
function v2Rays() {
  const a = [[44,8],[70.5,23],[70.5,57],[44,72],[17.5,57],[17.5,23]];
  const b = [[44,2],[75.5,20],[75.5,60],[44,78],[12.5,60],[12.5,20]];
  return a.map((p, i) => '<line class="orn" x1="' + p[0] + '" y1="' + p[1] +
    '" x2="' + b[i][0] + '" y2="' + b[i][1] + '"/>').join("");
}
function v2Laurel(closed) {
  const branch = side => {
    const stem = side > 0 ? "M62 70 C74 62 78 48 74 34" : "M26 70 C14 62 10 48 14 34";
    const xs = side > 0 ? [72, 75.5, 77, 76.5] : [16, 12.5, 11, 11.5];
    const ys = [58, 50, 42, 34];
    return '<path class="orn" d="' + stem + '"/>' + xs.map((x, i) =>
      '<ellipse class="leaf" cx="' + x + '" cy="' + ys[i] + '" rx="5" ry="2.4" transform="rotate(' +
      ((side > 0 ? -1 : 1) * (34 - i * 10)) + " " + x + " " + ys[i] + ')"/>').join("");
  };
  return branch(1) + branch(-1) + (closed
    ? '<path class="orn" d="M74 34 C70 24 60 18 52 17"/><path class="orn" d="M14 34 C18 24 28 18 36 17"/>' : "");
}
function v2TroSvg(fam, tier, on, pct, size) {
  let deco = "";
  if (tier >= 3) deco += v2Rays();
  if (tier === 4) deco += v2Laurel(false);
  if (tier >= 5) deco += v2Laurel(true);
  const prog = !on && pct > 0
    ? '<path class="prog" d="' + V2_HEX + '" stroke-dasharray="' + (V2_HEXLEN * pct / 100).toFixed(1) +
      " " + V2_HEXLEN + '"/>' : "";
  return '<svg viewBox="0 0 88 82" aria-hidden="true"' + (size ? ' style="width:' + size + 'px;height:' + (size * 82 / 88) + 'px"' : "") + ">" +
    (tier >= 5 ? '<path class="halo" d="' + V2_HEX + '"/>' : "") + deco +
    '<path class="frame" d="' + V2_HEX + '"/>' + prog +
    (tier >= 2 ? '<path class="inner" d="' + V2_HEXIN + '"/>' : "") +
    '<g class="em">' + V2_FAM[fam].em + "</g>" +
    (tier >= 5 ? '<path class="gem" d="M44 3 49.5 9.5 44 16 38.5 9.5Z"/>' : "") + "</svg>";
}

/* -------------------------------------------------------------------------
   Résumé mensuel, calculé une seule fois et partagé par les soixante succès.
   ------------------------------------------------------------------------- */

/* Le budget n'est vraiment tenu que depuis octobre 2023. Ce qui précède est
   soit incomplet, soit importé après coup : compté, il gonflerait les cumuls
   et découperait les séries sur des mois que personne n'a suivis. Le moteur
   part donc de cette date, quelle que soit la profondeur de l'historique. */
const V2_TRO_DEBUT = "2023-10";

let V2_MS_CACHE = null, V2_MS_STAMP = "";
function v2MonthSeries() {
  const stamp = DB.tx.length + "|" + Object.keys(DB.goals).join() + "|" +
    (DB.settings.savingsGoal || 0) + "|" + monthKey(todayISO());
  if (V2_MS_CACHE && V2_MS_STAMP === stamp) return V2_MS_CACHE;
  /* Seuls les mois clos comptent. Un mois en cours porte un salaire entier et
     des dépenses partielles : son taux d'épargne est flatteur et son total
     tronqué. Un trophée décroché là-dessus ne voudrait rien dire — il apparaît
     donc quand le mois se ferme, pas avant. */
  const running = monthKey(todayISO());
  const keys = Array.from(new Set(DB.tx.map(t => monthKey(t.date))))
    .filter(k => k >= V2_TRO_DEBUT && k < running).sort();
  const goalIds = Object.keys(DB.goals).filter(id => (DB.goals[id].m || 0) > 0);
  V2_MS_CACHE = keys.map(k => {
    const s = monthStats(k);
    const held = goalIds.filter(id => spentOn(id, s.ops) <= DB.goals[id].m);
    const byDay = {};
    s.ops.filter(isExpense).forEach(t => { byDay[dayOf(t.date)] = (byDay[dayOf(t.date)] || 0) + 1; });
    return {
      k, s, exp: s.expense, bal: s.balance, rate: savingsRate(s.income, s.expense),
      groups: s.groups, cats: s.cats, todo: s.todoCount,
      goalTotal: goalIds.length, held: held.length, heldIds: held,
      nOps: s.ops.filter(isExpense).length, maxDay: Object.keys(byDay).reduce((m, d) => Math.max(m, byDay[d]), 0),
    };
  });
  V2_MS_STAMP = stamp;
  return V2_MS_CACHE;
}

/* -------------------------------------------------------------------------
   Le catalogue
   ------------------------------------------------------------------------- */
function v2Trophies() {
  const ms = v2MonthSeries(), out = [];
  const goal = DB.settings.savingsGoal || 0;
  const add = (fam, tier, name, desc, at, cur, tgt) =>
    out.push({ fam, tier, name, desc, at: at || null, cur: cur || 0, tgt: tgt || 1,
      /* Un défi tout-ou-rien passe 1 et 1 en repère : le rapport y vaudrait
         toujours cent, et l'arc se remplirait sous un emblème éteint. Sans
         palier à gravir, la progression ne peut être que zéro ou cent. */
      pct: tgt > 1 ? Math.min(100, Math.max(0, (cur || 0) / tgt * 100)) : (at ? 100 : 0) });
  /* premier mois satisfaisant une condition, et le meilleur score atteint */
  const first = pred => { for (const m of ms) if (pred(m)) return m.k; return null; };
  const best = val => ms.reduce((a, m) => Math.max(a, val(m) || 0), 0);
  /* premier mois qui clôt une série de n mois consécutifs, et la plus longue série */
  const streak = (pred, n) => {
    let r = 0;
    for (const m of ms) { r = pred(m) ? r + 1 : 0; if (r >= n) return m.k; }
    return null;
  };
  const longest = pred => {
    let r = 0, mx = 0;
    for (const m of ms) { r = pred(m) ? r + 1 : 0; mx = Math.max(mx, r); }
    return mx;
  };
  /* mois où un cumul franchit un seuil */
  const cumAt = (val, tgt) => {
    let c = 0;
    for (const m of ms) { c += val(m) || 0; if (c >= tgt) return m.k; }
    return null;
  };
  const cumTotal = val => ms.reduce((a, m) => a + (val(m) || 0), 0);

  /* ---------- Épargne ---------- */
  [[1, 20], [2, 30], [3, 40], [4, 55], [5, 70]].forEach(([t, p]) =>
    add("epargne", t, p + " % épargnés", "Un mois où vous mettez de côté au moins " + p + " % de vos revenus.",
      first(m => m.rate != null && m.rate >= p), best(m => m.rate), p));
  [[1, 5000], [2, 15000], [3, 35000], [4, 80000], [5, 200000]].forEach(([t, c]) =>
    add("epargne", t, fmtEurShort(c) + " de côté", "Épargne cumulée depuis le début de votre historique.",
      cumAt(m => Math.max(m.bal, 0), c), Math.max(cumTotal(m => Math.max(m.bal, 0)), 0), c));
  [[1, 800], [2, 1400], [3, 2200], [4, 4000]].forEach(([t, c]) =>
    add("epargne", t, fmtEurShort(c) + " en un mois", "Un seul mois à " + fmtEurShort(c) + " épargnés.",
      first(m => m.bal >= c), best(m => m.bal), c));

  /* ---------- Régularité ---------- */
  if (goal > 0) [[1, 6], [2, 12], [3, 24], [4, 42], [5, 60]].forEach(([t, n]) =>
    add("regularite", t, n + " mois d’affilée", n + " mois consécutifs au-dessus de votre objectif d’épargne.",
      streak(m => m.rate != null && m.rate >= goal, n), longest(m => m.rate != null && m.rate >= goal), n));
  [[1, 12], [2, 30], [3, 48]].forEach(([t, n]) =>
    add("regularite", t, n + " mois dans le vert", n + " mois consécutifs terminés avec un solde positif.",
      streak(m => m.bal > 0, n), longest(m => m.bal > 0), n));
  [[1, 24], [2, 36], [3, 60], [5, 120]].forEach(([t, n]) =>
    add("regularite", t, n + " mois suivis", n + " mois d’affilée avec au moins une opération enregistrée.",
      streak(() => true, n), ms.length, n));

  /* ---------- Discipline ---------- */
  const sansFaute = m => m.goalTotal > 0 && m.held === m.goalTotal;
  [[1, 1], [2, 6], [3, 15], [4, 30], [5, 48]].forEach(([t, n]) =>
    add("discipline", t, n === 1 ? "Un mois sans faute" : n + " mois sans faute",
      n === 1 ? "Un mois où aucun objectif n’est dépassé." : n + " mois consécutifs sans le moindre dépassement.",
      streak(sansFaute, n), longest(sansFaute), n));
  [[1, 3], [2, 15], [3, 36]].forEach(([t, n]) =>
    add("discipline", t, "Tout classé " + n + " mois",
      n + " mois consécutifs sans une seule opération en attente.",
      streak(m => m.todo === 0 && m.nOps > 0, n), longest(m => m.todo === 0 && m.nOps > 0), n));
  [[2, 18], [4, 36]].forEach(([t, n]) => {
    /* un même objectif tenu n mois d'affilée, quel qu'il soit */
    let at = null, mx = 0;
    const ids = Object.keys(DB.goals).filter(id => (DB.goals[id].m || 0) > 0);
    ids.forEach(id => {
      let r = 0;
      ms.forEach(m => {
        r = m.heldIds.indexOf(id) >= 0 ? r + 1 : 0;
        mx = Math.max(mx, r);
        if (r === n && !at) at = m.k;
      });
    });
    add("discipline", t, "Un poste tenu " + n + " mois",
      "Un même objectif respecté " + n + " mois consécutifs.", at, mx, n);
  });

  /* ---------- Sobriété ---------- */
  /* Dépense du mois comparée à la médiane des douze mois qui le précèdent. */
  const medPrev = i => {
    const w = ms.slice(Math.max(0, i - 12), i).map(m => m.exp).filter(v => v > 0).sort((a, b) => a - b);
    if (w.length < 6) return null;
    const h = w.length >> 1;
    return w.length % 2 ? w[h] : (w[h - 1] + w[h]) / 2;
  };
  const lighter = ratio => {
    for (let i = 0; i < ms.length; i++) {
      const md = medPrev(i);
      if (md && ms[i].exp > 0 && ms[i].exp <= md * ratio) return ms[i].k;
    }
    return null;
  };
  const bestLight = () => {
    let b = 0;
    for (let i = 0; i < ms.length; i++) {
      const md = medPrev(i);
      if (md && ms[i].exp > 0) b = Math.max(b, (1 - ms[i].exp / md) * 100);
    }
    return b;
  };
  [[1, 0.9, 10], [2, 0.75, 25], [4, 0.6, 40]].forEach(([t, r, p]) =>
    add("sobriete", t, "Un mois à −" + p + " %", "Un mois dont les dépenses tombent " + p +
      " % sous votre médiane des douze mois précédents.", lighter(r), bestLight(), p));
  const noCat = id => m => !(m.cats[id] > 0) && m.nOps > 0;
  [[1, 2], [2, 6], [4, 24]].forEach(([t, n]) =>
    add("sobriete", t, n + " mois sans livraison",
      n + " mois consécutifs sans une seule livraison de repas.",
      streak(noCat("c_delivery"), n), longest(noCat("c_delivery")), n));
  add("sobriete", 3, "Ni resto ni livraison", "Un mois sans restaurant ni livraison de repas.",
    first(m => !(m.cats.c_resto > 0) && !(m.cats.c_delivery > 0) && m.nOps > 0),
    first(m => !(m.cats.c_resto > 0) && !(m.cats.c_delivery > 0) && m.nOps > 0) ? 1 : 0, 1);
  /* un poste dont les douze derniers mois pèsent nettement moins que les douze d'avant */
  const postePlonge = ratio => {
    let at = null, bestDrop = 0;
    GROUPS.filter(g => g.kind === KIND_EXPENSE).forEach(g => {
      for (let i = 24; i <= ms.length; i++) {
        const recent = ms.slice(i - 12, i).reduce((a, m) => a + (m.groups[g.id] || 0), 0);
        const older = ms.slice(i - 24, i - 12).reduce((a, m) => a + (m.groups[g.id] || 0), 0);
        /* Sous 100 € par mois en moyenne, une baisse de moitié ne prouve rien :
           un achat exceptionnel l'année d'avant suffit à la produire. */
        if (older < 1200 || recent + older < 2400) continue;
        bestDrop = Math.max(bestDrop, (1 - recent / older) * 100);
        if (recent <= older * ratio && !at) at = ms[i - 1].k;
      }
    });
    return { at, bestDrop };
  };
  [[3, 0.75, 25], [5, 0.4, 60]].forEach(([t, r, p]) => {
    const x = postePlonge(r);
    add("sobriete", t, "Un poste à −" + p + " %",
      "Un poste dont les douze derniers mois pèsent " + p + " % de moins que les douze précédents.",
      x.at, x.bestDrop, p);
  });

  /* ---------- Défis loufoques ---------- */
  const ops = DB.tx.filter(t => isExpense(t) && monthKey(t.date) >= V2_TRO_DEBUT);
  const cents = n => Math.round(Math.abs(n) * 100);
  add("loufoque", 1, "Compte rond", "Terminer un mois sur un total de dépenses pile à l’euro.",
    first(m => m.exp > 0 && cents(m.exp) % 100 === 0), 1, 1);
  add("loufoque", 1, "Chiffre rond", "Une opération d’au moins 100 € tombant sur un montant pile.",
    ops.some(t => cents(t.amount) >= 10000 && cents(t.amount) % 10000 === 0)
      ? monthKey(ops.find(t => cents(t.amount) >= 10000 && cents(t.amount) % 10000 === 0).date) : null, 1, 1);
  [[2, 12], [3, 18], [4, 30]].forEach(([t, n]) =>
    add("loufoque", t, n + " opérations en un jour", "Enchaîner " + n + " dépenses dans la même journée.",
      first(m => m.maxDay >= n), best(m => m.maxDay), n));
  add("loufoque", 2, "La réponse", "Une opération à exactement 42,00 €.",
    ops.some(t => cents(t.amount) === 4200) ? monthKey(ops.find(t => cents(t.amount) === 4200).date) : null, 1, 1);
  const palin = t => { const s = String(cents(t.amount)); return s.length >= 3 && s === s.split("").reverse().join(""); };
  add("loufoque", 3, "Palindrome", "Un montant qui se lit pareil dans les deux sens, comme 12,21 €.",
    ops.some(palin) ? monthKey(ops.find(palin).date) : null, 1, 1);
  /* la plus longue traversée sans la moindre dépense, à l'intérieur d'un mois */
  const vide = n => {
    for (const m of ms) {
      const days = new Set(m.s.ops.filter(isExpense).map(t => dayOf(t.date)));
      const dim = new Date(+m.k.slice(0, 4), +m.k.slice(5, 7), 0).getDate();
      let run = 0;
      for (let d = 1; d <= dim; d++) { run = days.has(d) ? 0 : run + 1; if (run >= n) return m.k; }
    }
    return null;
  };
  const videMax = () => {
    let mx = 0;
    for (const m of ms) {
      const days = new Set(m.s.ops.filter(isExpense).map(t => dayOf(t.date)));
      const dim = new Date(+m.k.slice(0, 4), +m.k.slice(5, 7), 0).getDate();
      let run = 0;
      for (let d = 1; d <= dim; d++) { run = days.has(d) ? 0 : run + 1; mx = Math.max(mx, run); }
    }
    return mx;
  };
  [[3, 8], [4, 20]].forEach(([t, n]) =>
    add("loufoque", t, n + " jours sans rien", n + " jours consécutifs sans la moindre dépense.",
      vide(n), videMax(), n));
  add("loufoque", 4, "Jumeaux parfaits", "Deux mois de suite dépensés au centime près.",
    (() => { for (let i = 1; i < ms.length; i++) if (ms[i].exp > 0 && cents(ms[i].exp) === cents(ms[i - 1].exp)) return ms[i].k; return null; })(), 1, 1);
  add("loufoque", 2, "Triplés", "Trois opérations du même montant dans un même mois.",
    first(m => { const c = {}; return m.s.ops.filter(isExpense).some(t => (c[cents(t.amount)] = (c[cents(t.amount)] || 0) + 1) >= 3); }), 1, 1);
  /* Rétrogradé : n'importe quel historique couvrant un 29 février le décroche.
     C'est une curiosité de calendrier, pas une performance. */
  add("loufoque", 2, "Année bissextile", "Dépenser un 29 février.",
    ops.some(t => t.date.slice(5) === "02-29") ? monthKey(ops.find(t => t.date.slice(5) === "02-29").date) : null, 1, 1);
  add("loufoque", 4, "Le mois à cent cinquante", "Cent cinquante opérations ou plus dans un seul mois.",
    first(m => m.nOps >= 150), best(m => m.nOps), 150);

  /* Deux sommets délibérément lointains : sans eux, le rang cinq se viderait
     et la collection n'aurait plus rien à promettre. */
  add("epargne", 5, "Une année à 50 %", "Une année civile entière dont le taux d’épargne moyen dépasse 50 %.",
    (() => {
      const yrs = {};
      ms.forEach(m => { const y = m.k.slice(0, 4); (yrs[y] = yrs[y] || []).push(m); });
      const done2 = Object.keys(yrs).filter(y => yrs[y].length === 12);
      for (const y of done2) {
        const inc = yrs[y].reduce((a, m) => a + m.s.income, 0);
        const exp = yrs[y].reduce((a, m) => a + m.exp, 0);
        if (inc > 0 && (inc - exp) / inc * 100 >= 50) return yrs[y][11].k;
      }
      return null;
    })(),
    (() => {
      const yrs = {};
      ms.forEach(m => { const y = m.k.slice(0, 4); (yrs[y] = yrs[y] || []).push(m); });
      let b = 0;
      Object.keys(yrs).filter(y => yrs[y].length === 12).forEach(y => {
        const inc = yrs[y].reduce((a, m) => a + m.s.income, 0);
        const exp = yrs[y].reduce((a, m) => a + m.exp, 0);
        if (inc > 0) b = Math.max(b, (inc - exp) / inc * 100);
      });
      return b;
    })(), 50);
  add("discipline", 5, "Sans une faute, cinq ans",
    "Soixante mois consécutifs sans le moindre objectif dépassé.",
    streak(sansFaute, 60), longest(sansFaute), 60);

  return out;
}

/* Le plus rare des trophées gagnés dans un mois donné. */
function v2TrophyOfMonth(key) {
  const won = v2Trophies().filter(t => t.at === key);
  if (!won.length) return null;
  won.sort((a, b) => b.tier - a.tier);
  return { top: won[0], n: won.length };
}

  const ySgoal = DB.settings.savingsGoal || 0;
  html += '<div class="kpis k5">' +
    kpi("Revenus " + year, fmtEur(proj.income), proj.complete ? "année complète" : "depuis le 1er janvier") +
    kpi("Dépenses " + year, fmtEur(proj.expense), proj.complete ? "année complète" : "depuis le 1er janvier") +
    kpi("Balance " + year, fmtEur(proj.balance), proj.balance >= 0 ? "mise de côté" : "déficit", proj.balance >= 0 ? "pos" : "neg") +

        yRate == null ? "revenus de l\u2019année non saisis"
          : ySgoal ? savingsVerdict(yRate, ySgoal)
          : (proj.complete ? "sur l\u2019année complète" : "cumul depuis janvier"),
        yRate == null ? "warn" : ySgoal ? SAVINGS_CLASS[savingsState(yRate, ySgoal)] : (yRate >= 0 ? "" : "neg"),
        yRate == null ? "Le taux se calcule sur les revenus : saisissez-les dans Réglages."
          : "(" + fmtEur(proj.income) + " − " + fmtEur(proj.expense) + ") ÷ " + fmtEur(proj.income) +
            ". Le taux annuel ne bouge pas avec la projection : cumul et projection sont dans le même rapport.") +
    kpi(proj.complete ? "Balance finale" : "Projection fin " + year, fmtEur(proj.balanceYear),
        proj.complete ? "réalisé" : "au rythme actuel (moyenne YTD)", proj.balanceYear >= 0 ? "pos" : "neg") +
    "</div>";

  const yearOps = DB.tx.filter(t => yearOf(t.date) === year);

  /* monthly bars */
  html += '<div class="card"><div class="chead"><h2>Mois par mois</h2><div class="spacer"></div>' +
    '<span class="legendline" style="border:0;margin:0;padding:0"><span class="chip"><span class="sw" style="background:var(--pos)"></span>revenus</span>' +
    '<span class="chip"><span class="sw" style="background:var(--neg)"></span>dépenses</span></span></div>';
  html += '<div class="bars">' + months.map(x => {
    const he = Math.round(x.expense / maxV * 118), hi = Math.round(x.income / maxV * 118);
    const on = x.key === UI.month;
    return '<div class="barcol ' + (on ? "on" : "") + '" data-act="openmonth" data-month="' + x.key + '" title="' + esc(monthLabel(x.key) + " · dépenses " + fmtEur(x.expense) + " · revenus " + fmtEur(x.income)) + '">' +
      '<div class="stack" style="flex-direction:row;align-items:flex-end;gap:2px;height:118px">' +
        '<i style="flex:1;height:' + Math.max(hi, x.income ? 2 : 0) + 'px;background:var(--pos)"></i>' +
        '<i style="flex:1;height:' + Math.max(he, x.expense ? 2 : 0) + 'px;background:var(--neg)"></i>' +
      "</div><span class=\"lb\">" + MONTHS_SHORT[x.m - 1] + "</span></div>";
  }).join("") + "</div></div>";

  /* projection vs previous years */
  const years = yearsWithData().filter(y => y <= yearOf(todayISO()));
  const bal = years.map(y => ({ y, p: yearProjection(y) }));
  const maxB = Math.max(1, ...bal.map(b => Math.abs(b.p.balanceYear)));
  html += '<div class="grid2"><div class="card"><div class="chead"><h2>Balance et taux d\u2019épargne par année</h2><div class="spacer"></div>' +
    '<span class="tiny muted">' + (proj.complete ? "" : "estimation " + year + " au rythme actuel") + "</span></div>" +
    bal.map(b => {
      const v = b.p.balanceYear, w = Math.abs(v) / maxB * 100, cur = b.y === year;
      const r = savingsRate(b.p.incomeYear, b.p.expenseYear);
      const rc = r == null ? "muted" : ySgoal ? SAVINGS_CLASS[savingsState(r, ySgoal)] : "muted";
      return '<div style="display:grid;grid-template-columns:52px 1fr 108px 72px;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line-2)">' +
        '<span class="num" style="font-weight:' + (cur ? 700 : 400) + '">' + b.y + (b.p.complete ? "" : " *") + "</span>" +
        '<div class="hbar"><i style="width:' + w.toFixed(1) + "%;background:" + (v >= 0 ? "var(--pos)" : "var(--neg)") + '"></i></div>' +
        '<span class="num ' + (v >= 0 ? "pos" : "neg") + '" style="text-align:right">' + esc(fmtEur(v)) + "</span>" +
        '<span class="num ' + rc + '" style="text-align:right" title="taux d\u2019épargne ' + b.y + '">' +
          (r == null ? "—" : esc(fmtRate(r))) + "</span></div>";
    }).join("") +
    '<div class="tiny muted" style="margin-top:8px">* année en cours, projetée depuis la moyenne mensuelle constatée (' +
      esc(fmtEur(proj.monthlyExpense || 0)) + " de dépenses par mois).</div></div>";

  /* YTD comparison with last year */
  const prevY = ytdTotals(year - 1, (year - 1) + todayISO().slice(4));
  const curY = ytdTotals(year);
  const infl = 1 + (DB.settings.inflation || 0) / 100;
  const band = (DB.settings.band || 5) / 100;
  html += '<div class="card"><div class="chead"><h2>Cumul depuis janvier vs ' + (year - 1) + "</h2></div>";
  const cmpRows = GROUPS.filter(g => g.kind === KIND_EXPENSE).map(g => {
    const now = curY.groups[g.id] || 0, ref = (prevY.groups[g.id] || 0) * infl;
    return { g, now, ref, delta: now - ref, pct: ref > 0 ? (now - ref) / ref * 100 : 0 };
  }).filter(r => r.now || r.ref).sort((a, b) => b.now - a.now);
  if (!cmpRows.length) html += '<div class="empty">Pas de données sur les deux années.</div>';
  else html += cmpRows.map(r => {
    const over = r.delta > r.ref * band, under = r.delta < -r.ref * band;
    const cls = over ? "neg" : under ? "pos" : "muted";
    const arrow = over ? "▲" : under ? "▼" : "＝";
    return '<div style="display:grid;grid-template-columns:1fr 100px 96px;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);align-items:center">' +
      '<span style="display:flex;gap:8px;align-items:center">' + groupBadge(r.g) + esc(r.g.name) + "</span>" +
      '<span class="num" style="text-align:right">' + esc(fmtEur(r.now)) + "</span>" +
      '<span class="num ' + cls + '" style="text-align:right">' + arrow + " " + esc(r.ref >= 20 ? fmtPct(r.pct) : "n.s.") + "</span></div>";
  }).join("");
  html += "</div></div>";

  html += topMerchants(yearOps);
  return html;
}

function topMerchants(ops) {
  const agg = {};
  ops.forEach(t => {
    if (!isExpense(t)) return;
    const k = canonOf(t) || normalize(t.merchantRaw || merchantFromLabel(t.label)) || "divers";
    (agg[k] = agg[k] || { n: 0, v: 0, name: t.merchantRaw || merchantFromLabel(t.label) }).n++;
    agg[k].v -= t.amount;
  });
  const top = Object.values(agg).sort((a, b) => b.v - a.v).slice(0, 12);
  let html = '<div class="card"><div class="chead"><h2>Où part l\u2019argent</h2><div class="spacer"></div><span class="tiny muted">top 12</span></div>';
  if (!top.length) return html + '<div class="empty">Aucune dépense.</div></div>';
  const max = top[0].v || 1;
  return html + top.map((m, i) =>
    '<div style="display:grid;grid-template-columns:20px 1fr 104px 52px;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line-2)">' +
    '<span class="num muted tiny">' + (i + 1) + "</span>" +
    "<div><div style=\"text-transform:capitalize\">" + esc(m.name || "—") + '</div><div class="hbar" style="height:5px;margin-top:3px"><i style="width:' + (m.v / max * 100).toFixed(1) + '%;background:var(--accent)"></i></div></div>' +
    '<span class="num" style="text-align:right">' + esc(fmtEur(m.v)) + "</span>" +
    '<span class="num muted tiny" style="text-align:right">' + m.n + " ×</span></div>").join("") + "</div>";
}
