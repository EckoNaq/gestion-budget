      '<div style="margin-top:10px"><button class="btn sm" data-act="newcat">' + icon("plus") + "Créer une sous-catégorie</button></div>" + dupBox();
  }

  if (WIZ.step === 3 && wizard) {
    const months = Array.from(new Set(WIZ.rows.map(r => monthKey(r.date)))).sort();
    const years = Array.from(new Set(months.map(m => m.slice(0, 4))));
    body = '<p class="tiny muted" style="margin-top:0">Un mois sans revenu saisi comptera 0 € de revenu : la balance de ce mois sera négative. ' +
      "Le bouton en tête d\u2019année recopie la première ligne remplie sur les mois suivants.</p>";
    body += years.map(y => {
      const ms = months.filter(m => m.startsWith(y));
      return '<div style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
        "<h3>" + y + "</h3><button class=\"btn sm ghost\" data-act=\"wizfill\" data-year=\"" + y + "\">Recopier sur l\u2019année</button></div>" +
        '<table class="incgrid"><thead><tr><th>Mois</th><th>Salaire</th><th>Bonus</th><th>Divers</th><th>Depuis le relevé</th></tr></thead><tbody>' +
        ms.map(k => { const a = DB.income[k] || [0, 0, 0], fromStmt = statementIncome(k);
          return "<tr><td>" + MONTHS[+k.slice(5) - 1] + "</td>" + [0, 1, 2].map(i =>
            '<td style="text-align:right"><input type="number" step="0.01" value="' + (a[i] || "") +
            '" data-chg="income" data-key="' + k + '" data-slot="' + i + '"></td>').join("") +
            '<td class="num muted" style="text-align:right">' + (fromStmt ? esc(fmtEur(fromStmt)) : "—") + "</td></tr>"; }).join("") +
        "</tbody></table></div>";
    }).join("");
  }

  if (wizard && WIZ.step === 4) {
    const r = WIZ.result;
    body = '<div class="grid3" style="margin-bottom:14px">' +
      kpi("Ajoutées", String(r.added), "opérations comptées") +
      kpi("Doublons", String(r.dup), r.dup ? "masqués, à vérifier" : "aucun") +
      kpi("À catégoriser", String(r.todo), r.todo ? "en attente de catégorie" : "tout est classé") + "</div>" +
      '<div class="note">' + icon("check") + " Import « " + esc(r.name) + " » terminé." +
      (r.ignored ? " " + r.ignored + " virement(s) interne(s) sortis des calculs." : "") +
      (r.rules ? " " + r.rules + " règles vendeur apprises." : "") + "</div>";
  }

  const canNext = WIZ.step === 1 ? WIZ.rows.length > 0 : true;
  const isLast = WIZ.step === 4 && wizard;
  let foot = '<div style="display:flex;gap:8px;margin-top:18px">';
  if (WIZ.step > 1 && !isLast) foot += '<button class="btn" data-act="wizback">Retour</button>';
  foot += '<div class="spacer" style="flex:1"></div>';
  if (isLast) foot += '<button class="btn primary" data-act="wizclose">Terminer</button>';
  else {
    foot += '<button class="btn ghost" data-act="wizclose">Annuler</button>';
    const toImport = wizard ? WIZ.rows.length : WIZ.verdicts ? WIZ.verdicts.filter(v => v.status === ST_OK || WIZ.importDups).length : 0;
    foot += '<button class="btn primary" data-act="wiznext" ' + (canNext ? "" : "disabled") + ">" +
      (WIZ.step === (wizard ? 3 : 2) ? "Importer " + toImport + " opérations" : "Continuer") + "</button>";
  }
  foot += "</div>";

  return '<div class="modal-back" data-act="backdrop"><div class="modal ' + (wizard ? "wide" : "") + '">' +
    '<div class="mhead"><div><h1>' + (wizard ? "Reprise de l\u2019historique" : "Importer un relevé") + "</h1>" +
    '<div class="tiny muted">' + (wizard ? "Tout le tableur, en une fois : catégories reprises, règles apprises, revenus saisis."
      : "Les doublons sont détectés puis masqués, jamais supprimés sans votre accord.") + "</div></div>" +
    '<div class="spacer" style="flex:1"></div><button class="iconbtn" data-act="wizclose">' + icon("x") + "</button></div>" +
    stepsHtml + body + foot + '<input type="file" id="filein" accept=".csv,.txt,.tsv" style="display:none">' + "</div></div>";
}

function readFileText(file, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(fr.result); }
    catch (e) { text = new TextDecoder("windows-1252").decode(fr.result); }
    cb(text, file.name);
  };
  fr.readAsArrayBuffer(file);
}
function ingest(text, name) {
  const res = parseStatement(text);
  if (res.error) { WIZ.error = res.error; WIZ.rows = []; }
  else { WIZ.rows = res.rows; WIZ.error = null; WIZ.name = name || "collé"; WIZ.step = 2; WIZ.noMerchantCol = res.merchantColumnIsCategory; }
  if (WIZ.rows.length) analyseDuplicates();
  render();
}

function commitImport() {
  const rows = WIZ.rows;
  rows.forEach(r => r.merchantKey = merchantKey(r));
  const idx = buildMerchantIndex(DB.tx.map(t => t.merchantKey).concat(rows.map(r => r.merchantKey)));
  const legacy = WIZ.mode === "history" ? Object.assign({}, LEGACY_MAP, DB.legacyMap, WIZ.mapping) : Object.assign({}, LEGACY_MAP, DB.legacyMap);
  const dup = WIZ.verdicts || detectDuplicates(rows, DB.tx, { windowDays: DB.settings.dupWindow, amountTol: (DB.settings.dupTol || 5) / 100 });
  const impId = (DB.imports.reduce((m, i) => Math.max(m, i.id), 0) || 0) + 1;
  const label = WIZ.mode === "history" ? "Reprise historique" : todayISO().split("-").reverse().join("/");
  let added = 0, dupCount = 0, ignored = 0;
  const fresh = [];
  const history = WIZ.mode === "history";
  dup.forEach(({ row, status }) => {
    if (status !== ST_OK && !WIZ.importDups && !history) return;      // skipped entirely, as chosen
    const c = categorise(row, DB.rules, idx, legacy);
    const st = status !== ST_OK ? status : (history ? c.status : ST_OK);
    const t = { date: row.date, label: row.label, merchantRaw: row.merchantRaw, amount: row.amount,
                /* a new operation is never categorised behind the user's back: only the reprise
                   inherits the categories a human already assigned in the spreadsheet */
                cat: history ? c.cat : null, status: st, imp: impId, bankCat: row.bankCat, merchantKey: row.merchantKey };
    fresh.push(t);
    if (st === ST_DUP || st === ST_DUP_MAYBE) dupCount++; else if (st === ST_IGNORED) ignored++; else added++;
  });
  DB.tx = DB.tx.concat(fresh);
  if (WIZ.mode === "history") DB.legacyMap = Object.assign({}, DB.legacyMap, WIZ.mapping);
  reindex();
  let learned = 0;
  if (WIZ.mode === "history") {
    learned = learnRulesFromHistory(0.6);
    // second pass: vendor rules fill in what the old spreadsheet never categorised
    fresh.forEach(t => {
      if (t.cat || t.status === ST_DUP || t.status === ST_DUP_MAYBE) return;
      const c = categorise(t, DB.rules, MERCHANT_INDEX, legacy);
      if (c.cat) { t.cat = c.cat; if (c.status === ST_IGNORED) { t.status = ST_IGNORED; ignored++; added--; } }
    });
  }
  DB.imports.push({ id: impId, date: label, name: label, file: WIZ.name, n: fresh.length });
  const todo = fresh.filter(t => t.status === ST_OK && !t.cat).length;
  saveDB(); reindex();
  WIZ.result = { added, dup: dupCount, todo, ignored, rules: learned, name: label };
  UI.showDup = false;
  const dates = fresh.map(t => t.date).sort();
  if (dates.length) { UI.month = monthKey(dates[dates.length - 1]); UI.year = yearOf(dates[dates.length - 1]); }
  if (history) { WIZ.step = 4; render(); }
  else {                                   // straight into one-by-one sorting
    const ids = fresh.filter(t => t.status === ST_OK).map(t => t.id);
    UI.modal = null; WIZ = null;
    if (ids.length) startReview(ids, "Import du " + label);
    else { render(); toast("Rien de nouveau à trier."); }
  }
}

/* =========================================================================
   Passerelle Budget → Patrimoine.

   Un virement interne ne se volatilise pas : il quitte le compte courant pour un
   autre compte qui nous appartient. C'est, mot pour mot, un versement au
   patrimoine. Le classer et l'enregistrer sont donc le même geste, et le tri est
   le seul moment où l'on a la destination en tête.

   Le lien est porté par l'opération (t.patMove → id du mouvement) et non
   l'inverse : les identifiants d'opérations sont des positions de tableau que
   reindex() renumérote à chaque suppression, alors que ceux des mouvements sont
   stables et sauvegardés. Le mouvement porte tx:1 pour qu'on sache le distinguer
   d'une saisie manuelle, à laquelle aucun ménage ne doit jamais toucher.
   ========================================================================= */
/* Un compte clôturé ne reçoit plus rien ; les autres sont tous proposés, y compris ceux qui
   n'ont pas encore de valorisation : on alimente souvent avant de valoriser.

   L'ordre compte autant que la liste. Les comptes alimentés sur la fiche de paie passent en
   dernier — un virement bancaire n'y va jamais — et les autres se rangent par nombre de
   versements déjà reçus : la bonne réponse est presque toujours dans les deux premiers. */
function patLinkAccounts() {
  const uses = a => (DB.patMovements || []).filter(m => m.accountId === a.id).length;
  return (DB.patAccounts || []).filter(a => !a.closed)
    .sort((a, b) => ((patIsOffBudget(a) ? 1 : 0) - (patIsOffBudget(b) ? 1 : 0)) || (uses(b) - uses(a)));
}
function patLinkedMove(t) {
  if (!t || !t.patMove) return null;
  return (DB.patMovements || []).find(m => m.id === t.patMove) || null;
}
/* Sortie du compte courant = dépôt sur le compte d'épargne, et réciproquement : le
   signe s'inverse en passant d'un côté à l'autre du pont. */
function patLinkAmount(t) { return -t.amount; }
function patAttachTx(t, accountId) {
  if (!accountId) { patDetachTx(t); return null; }
  const existing = patLinkedMove(t);
  if (existing) {
    existing.accountId = accountId; existing.date = t.date; existing.amount = patLinkAmount(t);
    return existing.id;
  }
  DB.patMovements = DB.patMovements || [];
  const id = (DB.patMovements.reduce((m, x) => Math.max(m, x.id), 0) || 0) + 1;
  DB.patMovements.push({ id, accountId, date: t.date, amount: patLinkAmount(t), tx: 1 });
  t.patMove = id;
  return id;
}
function patDetachTx(t) {
  if (!t || !t.patMove) return false;
  const id = t.patMove;
  t.patMove = null;
  DB.patMovements = (DB.patMovements || []).filter(m => !(m.id === id && m.tx));
  return true;
}
/* Ménage : supprimer une opération, vider un mois ou restaurer une sauvegarde ne
   passe pas par le tri. Un mouvement né du budget dont l'opération n'existe plus est
   un fantôme, et un fantôme se compte comme de la performance — c'est exactement ce
   qui gonflait le PEL de 1 404 € en janvier 2024. */
function patPruneTxMovements() {
  const live = new Set();
  DB.tx.forEach(t => { if (t.patMove) live.add(t.patMove); });
  const before = (DB.patMovements || []).length;
  DB.patMovements = (DB.patMovements || []).filter(m => !m.tx || live.has(m.id));
  return before - DB.patMovements.length;
}
/* Destination retenue pour ce libellé, à condition que le compte existe encore :
   une règle qui désigne un compte supprimé ne doit rien présélectionner. */
function patRuleFor(t) {
  const rules = DB.patRules || {};
  const id = rules[canonOf(t)] || rules[labelKey(t)];
  return id && (DB.patAccounts || []).some(a => a.id === id) ? id : null;
}
/* Destination affichée sur une carte de tri : le choix en cours, sinon le lien déjà
   posé, sinon la règle retenue. "" veut dire « aucun compte », et c'est un choix. */
function patDestFor(t) {
  if (REVIEW && REVIEW.dest !== undefined) return REVIEW.dest;
  const m = patLinkedMove(t);
  return m ? m.accountId : (patRuleFor(t) || "");
}

/* =========================================================================
   One-by-one sorting. New operations are never filed automatically: the app
   proposes, the user decides.
   ========================================================================= */
let REVIEW = null;
function startReview(ids, title) {
  REVIEW = { ids: ids.slice(), i: 0, sel: undefined, dest: undefined, remember: true, title: title || "Tri des opérations", total: ids.length, history: [] };
  UI.modal = reviewModal; render();
}
function reviewCurrent() { return REVIEW && REVIEW.i < REVIEW.ids.length ? DB.tx[REVIEW.ids[REVIEW.i]] : null; }
function reviewSuggestion(t) {
  const c = categorise(t, DB.rules, MERCHANT_INDEX, DB.legacyMap);
  return c;
}
function reviewModal() {
  const t = reviewCurrent();
  if (!t) {
    return '<div class="modal-back"><div class="modal" style="max-width:420px;text-align:center">' +
      '<div class="doneburst">' + icon("check", 30) + "</div>" +
      '<h1 style="text-align:center">Tri terminé</h1>' +
      '<p class="muted" style="margin:6px 0 20px">' + REVIEW.total + " opération" + (REVIEW.total > 1 ? "s" : "") +
      " passée" + (REVIEW.total > 1 ? "s" : "") + " en revue. Le mois est à jour.</p>" +
      '<button class="btn primary big" data-act="revclose">Voir le mois</button>' +
      (REVIEW.history.length ? '<div style="margin-top:12px"><button class="btn ghost sm" data-act="revback">' + icon("undo", 14) +
        "Revenir sur la dernière</button></div>" : "") + "</div></div>";
  }
  const sug = reviewSuggestion(t);
  const sel = REVIEW.sel === undefined ? sug.cat : REVIEW.sel;
  const expense = t.amount < 0;
  const merchant = t.merchantRaw || merchantFromLabel(t.label) || "Opération";
  const kind = /CARTE/i.test(t.label) ? "Carte" : /VIR/i.test(t.label) ? "Virement" : /PRLV|PREL/i.test(t.label) ? "Prélèvement" : /RETRAIT|DAB/i.test(t.label) ? "Retrait" : "Opération";
  const selGroup = sel ? catGroup(sel) : null;
  const accent = selGroup ? selGroup.color : "var(--ink-mute)";

  /* avatar: the group icon once a category is on the table, initials before that */
  const initials = merchant.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, " ").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
  const avatar = '<div class="avatar" style="background:' + (selGroup ? selGroup.color + "1F" : "var(--line-2)") + ";color:" + accent + '">' +
    (selGroup ? icon(selGroup.icon, 24) : esc(initials)) + "</div>";

  /* why this suggestion, in four words rather than a sentence */
  const why = { rule: "déjà classé ainsi", legacy: "d\u2019après le relevé", keyword: "commerçant reconnu", neutral: "transfert interne probable" }[sug.source];
  const twins = sug.source === "rule" ? DB.tx.filter(x => x.cat === sug.cat && x !== t && canonOf(x) === canonOf(t)).length : 0;

  /* quick picks: the suggestion, then the categories actually used the most */
  const used = {};
  DB.tx.forEach(x => { if (x.cat && !CAT_BY_ID[x.cat].legacy) used[x.cat] = (used[x.cat] || 0) + 1; });
  const quick = [];
  if (sug.cat) quick.push(sug.cat);
  Object.keys(used).sort((a, b) => used[b] - used[a]).forEach(c => { if (quick.length < 6 && quick.indexOf(c) < 0) quick.push(c); });
  if (sel && quick.indexOf(sel) < 0) quick.unshift(sel);

  const pickBtn = cid => {
    const c = CAT_BY_ID[cid], g = GROUP_BY_ID[c.group], on = sel === cid;
    return '<button class="pick ' + (on ? "on" : "") + '" data-act="revsel" data-cat="' + cid + '"' +
      (on ? ' style="border-color:' + g.color + ";background:" + g.color + '14;color:' + g.color + '"' : "") + ">" +
      '<span class="dot" style="background:' + g.color + '"></span>' + esc(c.name) + "</button>";
  };

  let picker = '<div class="pickrow">' + quick.map(pickBtn).join("") + "</div>";
  if (REVIEW.expand) {
    picker += GROUPS.map(g => {
      const list = CATS.filter(c => c.group === g.id && (!c.legacy || c.id === sel) && quick.indexOf(c.id) < 0);
      if (!list.length) return "";
      return '<div class="grouplab">' + esc(g.name) + '</div><div class="pickrow">' + list.map(c => pickBtn(c.id)).join("") + "</div>";
    }).join("");
  }

  /* Épargne & transferts : l'argent va quelque part, et ce quelque part nous appartient.
     Le demander ici évite d'aller le ressaisir dans le patrimoine un mois plus tard, de
     mémoire. « Aucun » reste un choix de plein droit : retrait d'espèces, virement entre
     deux comptes courants, compte non suivi. */
  const neutral = sel && catKind(sel) === KIND_NEUTRAL;
  const destAccounts = patLinkAccounts();
  let dest = "";
  if (neutral && destAccounts.length) {
    const cur = patDestFor(t);
    const back = t.amount > 0;
    const destBtn = a => {
      const col = patAccountColor(a);
      return '<button class="pick ' + (cur === a.id ? "on" : "") + '" data-act="revdest" data-dest="' + esc(a.id) + '"' +
        (cur === a.id ? ' style="border-color:' + col + ";background:color-mix(in oklab," + col + ' 12%,transparent)"' : "") +
        ">" + patSwatch(a, 9) + esc(a.name) + "</button>";
    };
    const chosen = destAccounts.find(a => a.id === cur);
    dest = '<div class="destbox' + (chosen ? " on" : "") + '">' +
      '<div class="destlab">' + icon("vault", 12) +
        (back ? "D’où revient cet argent ?" : "Où part cet argent ?") + "</div>" +
      '<div class="pickrow">' +
        '<button class="pick ' + (chosen ? "" : "on") + '" data-act="revdest" data-dest=""' +
          (chosen ? "" : ' style="border-color:var(--ink-mute);color:var(--ink-soft)"') +
          ' title="Retrait, compte non suivi, virement entre deux comptes courants">Aucun</button>' +
        destAccounts.map(destBtn).join("") + "</div>" +
      (chosen
        ? '<div class="destsum">' + icon("check", 12) + "<span><b>" + esc(fmtEur(patLinkAmount(t), { plus: true })) +
          "</b> sur <b>" + esc(chosen.name) + "</b> au " + esc(t.date.slice(8, 10) + "/" + t.date.slice(5, 7)) +
          ", enregistré en même temps que le classement.</span></div>"
        : '<div class="destsum muted">' + icon("eye", 12) + "<span>Rien ne sera écrit dans le patrimoine.</span></div>") +
      "</div>";
  }

  const segments = [];
  for (let i = 0; i < Math.min(REVIEW.total, 24); i++) {
    const at = Math.floor(i * REVIEW.total / Math.min(REVIEW.total, 24));
    segments.push('<i class="' + (at < REVIEW.i ? "done" : at === REVIEW.i ? "now" : "") + '"></i>');
  }

  return '<div class="modal-back"><div class="modal" style="max-width:600px">' +
    '<div class="mhead"><div><h1>' + esc(REVIEW.title) + "</h1>" +
    '<div class="tiny muted"><b class="num">' + (REVIEW.i + 1) + "</b> sur " + REVIEW.total + " · " + (REVIEW.total - REVIEW.i - 1) + " restantes</div></div>" +
    '<div class="spacer" style="flex:1"></div><button class="iconbtn" data-act="revclose" title="Fermer — le reste part dans « À catégoriser »">' + icon("x") + "</button></div>" +
    '<div class="segbar">' + segments.join("") + "</div>" +
    '<div class="rev" id="revcard">' +
      '<div class="revhead">' + avatar +
        '<div class="revwho"><div class="rmerch" style="margin:0">' + esc(merchant.toLowerCase()) + "</div>" +
        '<div class="rdate">' + esc(t.date.slice(8, 10) + "/" + t.date.slice(5, 7)) + " · " + kind + "</div></div>" +
        '<div class="revamt num ' + (expense ? "" : "pos") + '">' + esc(fmtEur(t.amount, { plus: true })) + "</div>" +
      "</div>" +
      '<div class="rlabel" style="margin-top:10px">' + esc(t.label) + "</div>" +
      (sug.cat && sug.source ? '<div class="revwhy">' + icon(sug.source === "rule" ? "check" : "eye", 12) + esc(why) +
        (twins ? " · " + twins + " opération" + (twins > 1 ? "s" : "") + " de ce commerçant" : "") + "</div>" : "") +
      (!expense ? '<div class="revwhy">' + icon("income", 12) + "montant reçu : revenu, ou remboursement à déduire d\u2019un poste</div>" : "") +
      '<div class="moreline"><span class="hr"></span><button data-act="revexpand">' +
        (REVIEW.expand ? "Réduire" : "Toutes les catégories") + "</button><span class=\"hr\"></span></div>" +
      picker + dest +
    "</div>" +
    '<div class="revfoot">' +
      '<button class="btn" data-act="revback" ' + (REVIEW.history.length ? "" : "disabled") +
        ' title="Annule l\u2019opération précédente et y revient">' + icon("undo") + "Précédent</button>" +
      '<button class="btn" data-act="revignore" title="Sort l\u2019opération des calculs">' + icon("vault") + "Ignorer</button>" +
      '<button class="btn ghost" data-act="revskip">Plus tard</button>' +
      '<div class="spacer" style="flex:1"></div>' +
      '<label class="memo ' + (REVIEW.remember ? "on" : "") + '" title="Crée une règle pour ce commerçant"><input type="checkbox" data-chg="revremember" ' +
        (REVIEW.remember ? "checked" : "") + "> Mémoriser</label>" +
      '<button class="btn primary big" data-act="revvalidate" ' + (sel ? "" : "disabled") +
        (sel && selGroup ? ' style="background:' + selGroup.color + ";border-color:" + selGroup.color + '"' : "") + ">" +
        icon("check") + (sel ? esc(CAT_BY_ID[sel].name) : "Choisir une catégorie") + "</button>" +
    "</div>" +
    '<div class="tiny muted" style="margin-top:10px;text-align:right"><span class="kbd">Entrée</span> valider · <span class="kbd">←</span> ignorer · ' +
      '<span class="kbd">→</span> plus tard · <span class="kbd">Retour arrière</span> revenir</div>' +
    "</div></div>";
}
function reviewAct(action) {
  const t = reviewCurrent();
  if (!t || REVIEW.busy) return;      // one card at a time, even on a double tap
  const card = document.getElementById("revcard");
  const sug = reviewSuggestion(t);
  const sel = REVIEW.sel === undefined ? sug.cat : REVIEW.sel;
  if (action === "validate" && !sel) { toast("Choisissez une catégorie."); return; }
  /* Destination patrimoine : le choix de la carte, sinon le lien déjà posé, sinon la règle
     retenue — et rien du tout dès que la catégorie n'est plus un transfert. */
  const dest = action === "validate" && catKind(sel) === KIND_NEUTRAL ? patDestFor(t) : "";
  const before = patLinkedMove(t);
  REVIEW.busy = true;
  /* everything this action touches is recorded, so it can be taken back */
  const undo = { at: REVIEW.i, id: t.id, action: action, sel: sel, dest: dest,
                 prevCat: t.cat, prevStatus: t.status, rules: [], patRules: [], siblings: [],
                 move: before ? { id: before.id, accountId: before.accountId, date: before.date, amount: before.amount } : null };
  const apply = () => {
    REVIEW.busy = false;
    if (action === "validate") {
      t.cat = sel;
      t.status = catKind(sel) === KIND_NEUTRAL ? ST_IGNORED : ST_OK;
      patAttachTx(t, dest);                       // "" détache : reclasser en dépense défait le lien
      const key = canonOf(t) || labelKey(t);
      const legacy = CAT_BY_ID[sel] && CAT_BY_ID[sel].legacy;
      if (REVIEW.remember && !legacy && key && key.length > 2 && /[a-z]{3}/.test(key) && !OPAQUE_MERCHANTS.has(key)) {
        const lk = labelKey(t);
        [key, lk].forEach(k => {
          if (!k || k.length < 3 || OPAQUE_MERCHANTS.has(k) || DB.rules[k] === sel) return;
          undo.rules.push([k, DB.rules[k]]);
          DB.rules[k] = sel;
          /* La destination se retient comme la catégorie : le prochain virement du même
             libellé arrivera avec son compte déjà coché. */
          DB.patRules = DB.patRules || {};
          if (DB.patRules[k] !== dest) { undo.patRules.push([k, DB.patRules[k]]);
            if (dest) DB.patRules[k] = dest; else delete DB.patRules[k]; }
        });
        /* Le reste du lot du même commerçant est réglé en même temps — sauf si un compte
           de destination est en jeu. Chacun de ces virements a son montant et sa date, et
           rien n'entre dans le patrimoine sans un geste : ils restent donc dans la file,
           où la règle qu'on vient de retenir les présentera déjà remplis, à un Entrée près. */
        if (!dest) {
          const removals = [];
          DB.tx.forEach(x => {
            if (x === t || !isTodo(x) || canonOf(x) !== canonOf(t)) return;
            const at = REVIEW.ids.indexOf(x.id);
            if (at <= REVIEW.i) return;
            undo.siblings.push({ id: x.id, at: at, prevCat: x.cat, prevStatus: x.status });
            x.cat = sel;
            if (catKind(sel) === KIND_NEUTRAL) x.status = ST_IGNORED;
            removals.push(at);
          });
          removals.sort((a, b) => b - a).forEach(at => REVIEW.ids.splice(at, 1));
        }
      }
    } else if (action === "ignore") {
      t.status = ST_IGNORED; t.cat = t.cat || "c_transfer";
    }
    REVIEW.history.push(undo);
    REVIEW.i++; REVIEW.sel = undefined; REVIEW.dest = undefined;
    saveDB(); render();
  };
  if (card && action !== "skip") {
    card.classList.add(action === "ignore" ? "out-left" : "out-right");
    setTimeout(apply, 240);
  } else apply();
}

/* Step back one card and undo what that card's action changed. */
function reviewBack() {
  if (!REVIEW || !REVIEW.history.length || REVIEW.busy) return;
  const u = REVIEW.history.pop();
  const t = DB.tx[u.id];
  if (t) {
    t.cat = u.prevCat; t.status = u.prevStatus;
    /* Le mouvement de patrimoine créé par cette carte repart avec elle, et celui qui
       existait avant revient tel quel — même identifiant, pour ne pas casser le lien. */
    patDetachTx(t);
    if (u.move) {
      DB.patMovements = DB.patMovements || [];
      DB.patMovements.push({ id: u.move.id, accountId: u.move.accountId, date: u.move.date, amount: u.move.amount, tx: 1 });
      t.patMove = u.move.id;
    }
  }
  u.rules.forEach(([k, prev]) => { if (prev === undefined) delete DB.rules[k]; else DB.rules[k] = prev; });
  u.patRules.forEach(([k, prev]) => {
    DB.patRules = DB.patRules || {};
    if (prev === undefined) delete DB.patRules[k]; else DB.patRules[k] = prev;
  });
  u.siblings.slice().sort((a, b) => a.at - b.at).forEach(s => {
    const x = DB.tx[s.id];
    if (x) { x.cat = s.prevCat; x.status = s.prevStatus; }
    REVIEW.ids.splice(s.at, 0, s.id);
  });
  REVIEW.i = u.at;
  REVIEW.sel = u.action === "validate" ? u.sel : undefined;   // the previous pick comes back selected
  REVIEW.dest = u.action === "validate" ? u.dest : undefined;
  saveDB(); render();
}

function download(filename, content, type) {
  const blob = new Blob([content], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const EXPORT_SCOPES = { all: "complet", budget: "budget", pat: "patrimoine" };
function exportJSON(scope) {
  const sc = EXPORT_SCOPES[scope] ? scope : "all";
  /* Le nom du fichier dit ce qu'il contient : au moment de restaurer, six mois plus tard,
     c'est la seule chose qu'on ait sous les yeux. */
  download("budget-" + EXPORT_SCOPES[sc] + "-" + todayISO() + ".json", serialize(DB, sc), "application/json");
  toast(sc === "budget" ? "Partie Budget exportée."
      : sc === "pat" ? "Partie Patrimoine exportée." : "Sauvegarde complète exportée.");
}
function exportCSV() {
  const head = ["date", "libelle", "vendeur", "montant", "groupe", "categorie", "statut", "import"];
  const statusLabel = { 0: "compte", 1: "doublon", 2: "doublon probable", 3: "ignore" };
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [head.join(";")].concat(DB.tx.map(t => [
    t.date, t.label, t.merchantRaw || "", String(t.amount).replace(".", ","),
    t.cat && catGroup(t.cat) ? catGroup(t.cat).name : "", t.cat ? catName(t.cat) : "",
    statusLabel[t.status], importLabel(t.imp),
  ].map(q).join(";")));
  download("budget-operations-" + todayISO() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
  toast("Export CSV terminé.");
}
/* Restauration en deux temps : on lit le fichier, on montre ce qu'il contient, puis
   l'utilisateur choisit ce qu'il en reprend. Écraser d'un bloc un patrimoine de trois ans
   parce qu'on venait chercher des opérations serait trop facile autrement. */
let RESTORE = null;
function openRestore(text, name) {
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { toast("Fichier illisible : ce n’est pas une sauvegarde Budget."); return; }
  const sum = backupSummary(raw);
  if (!sum.hasBudget && !sum.hasPat) { toast("Cette sauvegarde ne contient aucune donnée."); return; }
  RESTORE = { text, name, sum };
  UI.small = restoreModal; renderSmall();
}
function restoreModal() {

  const part = (on, title, detail) =>

    '</b><br><span class="tiny muted">' + (on ? esc(detail) : "absent de ce fichier") + "</span></div>";
  const btn = (scope, label, on) =>
    '<button class="btn ' + (on ? "primary" : "") + '" data-act="dorestore" data-scope="' + scope + '"' +
    (on ? "" : " disabled") + ">" + esc(label) + "</button>";
  return '<div class="modal-back" data-act="backdrop"><div class="modal" style="max-width:520px">' +
    '<div class="mhead"><div><h1>Restaurer une sauvegarde</h1>' +

    part(s.hasBudget, "Budget", s.tx + " opération(s) · " + s.imports + " import(s) · " + s.rules + " règle(s) vendeur") +
    part(s.hasPat, "Patrimoine", s.accounts + " compte(s) · " + s.values + " valorisation(s) · " +
      s.movements + " mouvement(s)" + (s.liabilities ? " · " + s.liabilities + " crédit(s)" : "")) +
    '<div class="note warn">' + icon("warn") +
    " La partie restaurée remplace entièrement l’actuelle. L’autre n’est pas touchée.</div>" +
    '<div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center">' +
    '<button class="btn ghost" data-act="closesmall">Annuler</button>' +
    '<div class="spacer" style="flex:1"></div>' +
    btn("budget", "Budget seul", s.hasBudget) +
    btn("pat", "Patrimoine seul", s.hasPat) +
    btn("all", "Les deux", s.hasBudget && s.hasPat) +
    "</div></div></div>";
}
function restoreJSON(text, scope) {
  try {
    const src = deserialize(text);
    if (!scope || scope === "all") {
      DB = src;
    } else if (scope === "budget") {
      DB.tx = src.tx; DB.rules = src.rules; DB.income = src.income; DB.goals = src.goals;
      DB.imports = src.imports; DB.legacyMap = src.legacyMap; DB.fixed = src.fixed;
      DB.customCats = src.customCats;
      Object.keys(src.settings).forEach(k => {
        if (PAT_SETTING_KEYS.indexOf(k) < 0) DB.settings[k] = src.settings[k];
      });
    } else {
      DB.patAccounts = src.patAccounts; DB.patValues = src.patValues; DB.patMovements = src.patMovements;
      DB.patLiabilities = src.patLiabilities; DB.patDebtValues = src.patDebtValues;
      PAT_SETTING_KEYS.forEach(k => { DB.settings[k] = src.settings[k]; });
    }
    /* Une restauration partielle recolle deux moitiés qui ne se connaissent pas : les liens
       virement ↔ mouvement de l'une désigneraient au hasard des identifiants de l'autre. On
       les coupe, sans rien supprimer — les mouvements restent, simplement redevenus des
       saisies ordinaires. Inventer un rattachement serait pire que n'en garder aucun. */
    if (scope && scope !== "all") {
      DB.tx.forEach(t => { t.patMove = null; });
      (DB.patMovements || []).forEach(m => { delete m.tx; });
    }
    (DB.customCats || []).forEach(registerCat);
    recoverMissingCats(DB);
    reindex(); saveDB();
    UI.small = null; RESTORE = null; renderSmall(); render();
    toast(scope === "budget" ? "Partie Budget restaurée."
        : scope === "pat" ? "Partie Patrimoine restaurée." : "Sauvegarde complète restaurée.");
  } catch (e) { toast("Fichier illisible : ce n’est pas une sauvegarde Budget."); }
}

/* Effacement en deux temps, comme la restauration et pour la même raison : on montre ce
   qu'on s'apprête à détruire, moitié par moitié, puis l'utilisateur choisit. Le découpage
   suit celui de l'export — on peut vouloir repartir d'un budget vierge sans y perdre
   l'historique de ses placements, et le seul chemin qui existait pour ça passait par un
   export, un effacement total et une restauration. */
function resetModal() {
  const s = currentSummary();

  const hasPat = s.accounts > 0 || s.movements > 0 || s.liabilities > 0;

    (on && link ? '<br><span class="tiny muted">' + esc(link) + "</span>" : "") + "</div>";
  const btn = (scope, label, on) =>
    '<button class="btn' + (on ? " danger" : "") + '" data-act="doreset" data-scope="' + scope + '"' +
    (on ? "" : " disabled") + ">" + esc(label) + "</button>";
  return '<div class="modal-back" data-act="backdrop"><div class="modal" style="max-width:520px">' +
    '<div class="mhead"><div><h1>Effacer des données</h1>' +
    '<div class="tiny muted">' + esc(STORE_KEY) + "</div></div>" +
    '<div class="spacer" style="flex:1"></div><button class="iconbtn" data-act="closesmall">' + icon("x") + "</button></div>" +
    part(hasBudget, "Budget", s.tx + " opération(s) · " + s.imports + " import(s) · " + s.rules + " règle(s) vendeur",
      s.linkedMoves ? "Les " + s.linkedMoves + " mouvement(s) de patrimoine nés d’un virement classé ici restent, " +
        "redevenus des saisies ordinaires." : "") +
    part(hasPat, "Patrimoine", s.accounts + " compte(s) · " + s.values + " valorisation(s) · " +
      s.movements + " mouvement(s)" + (s.liabilities ? " · " + s.liabilities + " crédit(s)" : ""),
      s.linkedTx ? s.linkedTx + " opération(s) perdent leur marque de versement, sans changer de catégorie." : "") +
    '<div class="note warn">' + icon("warn") +
    " Effacé ne se restaure pas : seul un export JSON permet de revenir en arrière.</div>" +
    '<div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center">' +
    '<button class="btn ghost" data-act="closesmall">Annuler</button>' +
    '<div class="spacer" style="flex:1"></div>' +
    btn("budget", "Budget seul", hasBudget) +
    btn("pat", "Patrimoine seul", hasPat) +
    btn("all", "Tout", hasBudget || hasPat) +
    "</div></div></div>";
}
function resetScope(scope) {
  const s = currentSummary();
  const budget = s.tx + " opération(s), " + s.imports + " import(s), " + s.rules + " règle(s) vendeur";
  const pat = s.accounts + " compte(s), " + s.values + " valorisation(s), " + s.movements + " mouvement(s)" +
    (s.liabilities ? ", " + s.liabilities + " crédit(s)" : "");
  /* La modale a montré les chiffres ; cette dernière question ne sert qu'à obtenir un geste
     délibéré, là où la restauration peut se contenter d'un clic parce qu'elle, au moins,
     remet quelque chose à la place. */
  const what = scope === "budget" ? "la partie Budget (" + budget + ")"
             : scope === "pat" ? "la partie Patrimoine (" + pat + ")"
             : "toutes les données (" + budget + " côté Budget, " + pat + " côté Patrimoine)";
  if (!confirm("Dernière confirmation : effacer " + what + " ?\n\n" +
               "Rien n’est récupérable ensuite : annulez si vous n’avez pas exporté de sauvegarde.")) return;
  /* Les valeurs vierges viennent d'emptyDB() comme celles de restoreJSON viennent du
     fichier : même découpage, même partage des réglages. patRules suit le Budget, où
     l'export le range déjà — c'est au tri qu'une règle de destination sert. */
  const src = emptyDB();
  if (!scope || scope === "all") {
    DB = src;
  } else if (scope === "budget") {
    DB.tx = src.tx; DB.rules = src.rules; DB.income = src.income; DB.goals = src.goals;
    DB.imports = src.imports; DB.legacyMap = src.legacyMap; DB.fixed = src.fixed;
    DB.customCats = src.customCats; DB.patRules = src.patRules;
    Object.keys(src.settings).forEach(k => {
      if (PAT_SETTING_KEYS.indexOf(k) < 0) DB.settings[k] = src.settings[k];
    });
  } else {
    DB.patAccounts = src.patAccounts; DB.patValues = src.patValues; DB.patMovements = src.patMovements;
    DB.patLiabilities = src.patLiabilities; DB.patDebtValues = src.patDebtValues;
    PAT_SETTING_KEYS.forEach(k => { DB.settings[k] = src.settings[k]; });
  }
  /* Le lien virement ↔ mouvement enjambe les deux moitiés : effacer l'une laisserait
     l'autre pleine de renvois dans le vide. On le coupe avant reindex(), sinon
     patPruneTxMovements() prendrait pour des fantômes les mouvements dont l'opération
     vient de disparaître et amputerait le Patrimoine qu'on voulait justement garder. */
  if (scope && scope !== "all") {
    DB.tx.forEach(t => { t.patMove = null; });
    (DB.patMovements || []).forEach(m => { delete m.tx; });
  }
  reindex(); saveDB();
  UI.small = null; renderSmall(); render();
  toast(scope === "budget" ? "Partie Budget effacée, Patrimoine intact."
      : scope === "pat" ? "Partie Patrimoine effacée, Budget intact."
      : "Toutes les données ont été effacées.");
}

/* =========================================================================
   Events

function txById(id) { return DB.tx[+id]; }
function setStatus(id, status) {
  const t = txById(id); if (!t) return;
  t.status = status; saveDB(); render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "backdrop" && e.target !== el) return;

  switch (act) {
    case "view": UI.view = el.dataset.view; render(); break;
    case "prev":
      UI.view === "year" ? UI.year-- : isPatView() ? (UI.patMonth = addMonth(UI.patMonth, -1)) : (UI.month = addMonth(UI.month, -1));
      render(); break;
    case "next":
      UI.view === "year" ? UI.year++ : isPatView() ? (UI.patMonth = addMonth(UI.patMonth, 1)) : (UI.month = addMonth(UI.month, 1));
      render(); break;
    case "today":
      UI.month = monthKey(todayISO()); UI.year = yearOf(todayISO()); UI.patMonth = monthKey(todayISO()); render(); break;
    case "prevyear": UI.year--; render(); break;
    case "nextyear": UI.year++; render(); break;
    case "openmonth": UI.month = el.dataset.month; UI.view = "month"; render(); break;
    case "togglegroup":
      UI.openGroup = UI.openGroup === el.dataset.group ? null : el.dataset.group; UI.openCat = null; render(); break;
    case "togglecat":
      e.stopPropagation();
      UI.openCat = UI.openCat === el.dataset.cat ? null : el.dataset.cat; render(); break;
    case "batch": UI.batch = el.dataset.batch; render(); break;
    case "theme": cycleTheme(); break;
    case "import": openImport(DB.tx.length ? "month" : "history"); break;
    case "wizard": openImport("history"); break;
    case "undup": setStatus(el.dataset.id, ST_OK); toast("Opération réintégrée dans les totaux."); break;
    case "mkdup": setStatus(el.dataset.id, ST_DUP); toast("Marquée comme doublon."); break;
    case "ignore": setStatus(el.dataset.id, ST_IGNORED); break;
    case "unignore": setStatus(el.dataset.id, ST_OK); break;
    case "del": {
      const t = txById(el.dataset.id); if (!t) break;
      if (!confirm("Supprimer définitivement « " + t.label + " » ?")) break;
      DB.tx.splice(+el.dataset.id, 1); reindex(); saveDB(); render(); toast("Opération supprimée."); break;
    }
    case "addop": addManual(); break;
    case "cmpmode": UI.cmpMode = el.dataset.mode; render(); break;
    case "revexpand": REVIEW.expand = !REVIEW.expand; render(); break;
    case "delmonth": {
      const ops = opsOfMonth(UI.month);
      if (!ops.length) break;
      if (!confirm("Supprimer les " + ops.length + " opérations de " + monthLabel(UI.month) +
                   " ? Doublons et virements internes compris. Les règles, objectifs et revenus ne bougent pas.")) break;
      const doomed = new Set(ops.map(o => o.id));
      DB.tx = DB.tx.filter(t => !doomed.has(t.id));
      reindex(); saveDB(); render();
      toast(ops.length + " opérations supprimées — le mois est vide.");
      break;
    }
    case "editcat": {                       // the picker is built only for the row being edited
      const t = txById(el.dataset.id); if (!t) break;
      const cell = el.parentNode;
      cell.innerHTML = catSelect(t.cat, 'data-chg="cat" data-id="' + t.id + '"');
      const sel = cell.querySelector("select"); if (sel) sel.focus();
      break;
    }
    case "pick": $("#filein").click(); break;
    case "paste": { const v = $("#pastebox").value.trim(); if (v) ingest(v, "collé"); break; }
    case "wiznext":
      if (WIZ.mode === "history" && WIZ.step === 3) commitImport();
      else if (WIZ.mode === "history") { WIZ.step++; render(); }
      else commitImport();
      break;
    case "wizback": WIZ.step--; render(); break;
    case "wizclose": closeModal(); break;
    case "wizfill": fillYear(el.dataset.year, WIZ); break;
    case "fillyear": fillYear(String(UI.year)); break;
    case "newcat": UI.small = newCatModal; renderSmall(); break;
    case "closesmall": UI.small = null; renderSmall(); break;
    case "createcat": {
      const name = ($("#newcatname").value || "").trim();
      if (!name) { toast("Il faut un nom."); break; }
      createCategory(name, $("#newcatgroup").value);
      UI.small = null; render(); toast("Catégorie « " + name + " » créée."); break;
    }
    case "reviewall": {
      const ids = DB.tx.filter(isTodo).map(t => t.id);
      if (!ids.length) { toast("Rien à trier."); break; }
      startReview(ids, "Tri des opérations"); break;
    }
    case "revsel": REVIEW.sel = el.dataset.cat === REVIEW.sel ? null : el.dataset.cat; render(); break;
    case "revdest": REVIEW.dest = el.dataset.dest || ""; render(); break;
    case "revvalidate": reviewAct("validate"); break;
    case "revignore": reviewAct("ignore"); break;
    case "revskip": reviewAct("skip"); break;
    case "revback": reviewBack(); break;
    case "revclose": {
      const left = REVIEW ? REVIEW.ids.length - REVIEW.i : 0;
      REVIEW = null; UI.modal = null; render();
      if (left > 0) toast(left + " opération(s) restent dans « À catégoriser ».");
      break;
    }
    case "suggest": {
      const sg = suggestedGoals();
      if (!sg.income) { toast("Saisissez d\u2019abord vos revenus."); break; }
      if (!confirm("Poser un objectif sur chacun des grands groupes, aux montants suggérés ? Vos objectifs déjà saisis ne bougent pas, et les sous-catégories restent libres (cliquez un montant suggéré pour en adopter un).")) break;
      GROUPS.forEach(gr => {
        const v = sg.byId[gr.id]; if (!v) return;
        const g = DB.goals[gr.id] || { m: 0, y: 0 };
        if (!g.m) g.m = v;
        if (!g.y) g.y = v * 12;
        DB.goals[gr.id] = g;
      });
      saveDB(); UI.view = "settings"; render(); toast("Objectifs proposés appliqués — ajustez-les à votre guise.");
      break;
    }
    case "showcand": UI.showCand = !UI.showCand; render(); break;
    case "usesaverate": {
      const v = +el.dataset.v;
      DB.settings.savingsGoal = DB.settings.savingsGoal === v ? 0 : v;
      saveDB(); render();
      toast(DB.settings.savingsGoal ? "Objectif de taux d\u2019épargne : " + fmtRate(v) : "Objectif de taux d\u2019épargne retiré.");
      break;
    }
    case "usesugg": {
      const id = el.dataset.id, v = +el.dataset.v;
      const g = DB.goals[id] || { m: 0, y: 0 };
      g.m = v; if (!g.y) g.y = v * 12;
      DB.goals[id] = g; saveDB(); render(); break;
    }
    case "export-json": exportJSON(el.dataset.scope); break;
    case "export-csv": exportCSV(); break;
    case "import-json": {
      const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
      inp.onchange = () => inp.files[0] && readFileText(inp.files[0], (t, n) => openRestore(t, n));
      inp.click(); break;
    }
    case "dorestore": restoreJSON(RESTORE.text, el.dataset.scope); break;
    case "learn": { const n = learnRulesFromHistory(0.6); saveDB(); render(); toast(n + " nouvelle(s) règle(s) apprise(s)."); break; }
    case "newpataccount": UI.small = newPatAccountModal; renderSmall(); break;
    case "createpataccount": {
      const name = ($("#newpataccountname").value || "").trim();
      if (!name) { toast("Il faut un nom."); break; }
      const type = $("#newpataccounttype").value;
      const perfExcluded = !$("#newpataccountperf").checked;
      DB.patAccounts = DB.patAccounts || [];
      DB.patAccounts.push({ id: newPatAccountId(name), name, type, perfExcluded });
      UI.small = null; renderSmall(); saveDB(); render(); toast("Compte « " + name + " » créé."); break;
    }
    case "delpataccount": {
      const id = el.dataset.id, a = (DB.patAccounts || []).find(x => x.id === id); if (!a) break;
      if (!confirm("Supprimer le compte « " + a.name + " » ? Ses valorisations et mouvements seront perdus.")) break;
      DB.patAccounts = DB.patAccounts.filter(x => x.id !== id);
      if (DB.patValues) delete DB.patValues[id];
      const gone = new Set((DB.patMovements || []).filter(m => m.accountId === id).map(m => m.id));
      DB.patMovements = (DB.patMovements || []).filter(m => m.accountId !== id);
      DB.tx.forEach(t => { if (gone.has(t.patMove)) t.patMove = null; });
      Object.keys(DB.patRules || {}).forEach(k => { if (DB.patRules[k] === id) delete DB.patRules[k]; });
      saveDB(); render(); toast("Compte supprimé."); break;
    }
    case "addpatmovement": {
      const accSel = $("#patmovaccount"), dateInp = $("#patmovdate"), amtInp = $("#patmovamount");
      if (!accSel || !accSel.value) { toast("Créez d’abord un compte."); break; }
      const amount = parseAmount(amtInp.value);
      if (!amount) { toast("Montant illisible."); break; }
      DB.patMovements = DB.patMovements || [];
      const id = (DB.patMovements.reduce((m, x) => Math.max(m, x.id), 0) || 0) + 1;
      DB.patMovements.push({ id, accountId: accSel.value, date: dateInp.value || todayISO(), amount });
      saveDB(); render(); toast("Mouvement ajouté."); break;
    }
    case "delpatmovement": {
      const id = +el.dataset.id;
      DB.patMovements = (DB.patMovements || []).filter(m => m.id !== id);
      /* Un mouvement issu d'un virement laisse une opération qui le désigne : sans ce
         nettoyage, l'opération continuerait d'annoncer un versement qui n'existe plus. */
      DB.tx.forEach(t => { if (t.patMove === id) t.patMove = null; });
      saveDB(); render(); break;
    }
    case "patopenacct": UI.patAccount = el.dataset.id; UI.view = "patacct"; render(); break;
    case "patback": UI.view = "pat"; UI.patAccount = null; render(); break;
    case "patbackhome": UI.view = "pathome"; render(); break;
    case "patmilestones": UI.view = "patmilestones"; render(); break;
    case "pattoggleinactive": UI.patShowInactive = !UI.patShowInactive; render(); break;
    case "pattoggleclosed": {
      const a = (DB.patAccounts || []).find(x => x.id === el.dataset.id); if (!a) break;
      a.closed = !a.closed;
      saveDB(); render();
      toast(a.closed ? "« " + a.name + " » clôturé : il sort de la saisie mensuelle, son historique est conservé."
                     : "« " + a.name + " » rouvert.");
      break;
    }
    /* Changer de période retire aussi les repères : la fenêtre change, autant en profiter
       pour en montrer d'autres plutôt que de resservir les mêmes. */
    case "patrange": UI.patRange = el.dataset.range; UI.patHlSeed = (UI.patHlSeed || 0) + 1; render(); break;
    case "pathlshuffle": UI.patHlSeed = (UI.patHlSeed || 0) + 1; render(); break;
    case "patyearunit": UI.patYearUnit = el.dataset.unit; render(); break;
    case "patmovfilter": UI.patMovFilter = el.dataset.id; render(); break;
    case "newpatliability": {
      DB.patLiabilities = DB.patLiabilities || [];
      const name = "Crédit " + (DB.patLiabilities.length + 1);
      DB.patLiabilities.push({ id: newPatLiabilityId(name), name, mode: "auto",
        principal: 0, rate: 0, months: 240, start: UI.patMonth, share: 100 });
      saveDB(); render(); break;
    }
    case "delpatliability": {
      const id = el.dataset.id, l = (DB.patLiabilities || []).find(x => x.id === id); if (!l) break;
      if (!confirm("Supprimer le crédit « " + l.name + " » ?")) break;
      DB.patLiabilities = DB.patLiabilities.filter(x => x.id !== id);
      if (DB.patDebtValues) delete DB.patDebtValues[id];
      saveDB(); render(); toast("Crédit supprimé."); break;
    }
    case "patimportcsv": PATIMP = { comptesText: null, comptesName: null, mouvementsText: null, mouvementsName: null, error: null };
      UI.small = patImportModal; renderSmall(); break;
    case "patpickcomptes": $("#patfilecomptes").click(); break;
    case "patpickmouvements": $("#patfilemouvements").click(); break;
    case "patrunimport": {
      if ((DB.patAccounts || []).length && !confirm("Remplacer tout l’onglet Patrimoine par le contenu de ces fichiers ? Les comptes, valorisations et mouvements actuels seront perdus.")) break;
      const res = importPatrimoineCsv(PATIMP.comptesText, PATIMP.mouvementsText);
      if (res.error) { PATIMP.error = res.error; renderSmall(); break; }
      UI.small = null; renderSmall(); render();
      /* Un mois dont la date n'est pas comprise laisse un trou dans les graphiques sans rien
         dire : on le signale dans le même toast, avec les libellés fautifs. */
      const skipped = res.datesSkipped || [];
      toast("Onglet Patrimoine remplacé : " + res.accountsCreated + " compte(s), " + res.valuesImported + " valorisation(s) et " +
        res.movementsImported + " mouvement(s) importés" +
        (res.movementsSkipped ? " (" + res.movementsSkipped + " mouvement(s) ignoré(s), compte inconnu)" : "") + "." +
        (skipped.length ? " ⚠ " + skipped.length + " ligne(s) sans date comprise, non importée(s) : " +
          skipped.slice(0, 3).join(", ") + (skipped.length > 3 ? "…" : "") : ""));
      break;
    }
    case "reset": UI.small = resetModal; renderSmall(); break;
    case "doreset": resetScope(el.dataset.scope); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-chg]");
  if (!el) return;
  const kind = el.dataset.chg;
  if (kind === "cat") {
    const t = txById(el.dataset.id); if (!t) return;
    t.cat = el.value || null;
    if (t.cat && catKind(t.cat) === KIND_NEUTRAL) t.status = ST_IGNORED;
    else {
      if (t.status === ST_IGNORED) t.status = ST_OK;
      /* Ce n'était pas un virement, donc pas un versement : le mouvement s'en va avec
         la catégorie plutôt que de rester à gonfler le patrimoine. */
      if (patDetachTx(t)) toast("Le mouvement de patrimoine lié a été retiré.");
    }
    saveDB();
    const key = canonOf(t);
    if (t.cat && key && DB.rules[key] !== t.cat) {
      const others = DB.tx.filter(x => x.id !== t.id && canonOf(x) === key);
      const msg = others.length
        ? "Classer aussi les " + others.length + " autre(s) opération(s) de « " + (t.merchantRaw || key) + " » en « " + catName(t.cat) + " » et retenir la règle ?"
        : "Retenir « " + catName(t.cat) + " » pour les prochaines opérations de « " + (t.merchantRaw || key) + " » ?";
      if (confirm(msg)) {
        DB.rules[key] = t.cat;
        others.forEach(x => {
          if (x.status === ST_DUP) return;
          x.cat = t.cat;
          if (catKind(t.cat) === KIND_NEUTRAL) x.status = ST_IGNORED; else patDetachTx(x);
        });
        saveDB();
      }
    }
    render();
  } else if (kind === "bulkcat") {
    const key = el.dataset.key, cat = el.value || null;
    if (!cat) return;
    DB.tx.forEach(t => { if (isTodo(t) && (canonOf(t) || normalize(t.merchantRaw || merchantFromLabel(t.label))) === key) {
      t.cat = cat;
      if (catKind(cat) === KIND_NEUTRAL) t.status = ST_IGNORED; else patDetachTx(t); } });
    if (!OPAQUE_MERCHANTS.has(key)) DB.rules[key] = cat;
    saveDB(); render(); toast("Classé, et la règle est retenue.");
  } else if (kind === "showdup") { UI.showDup = el.checked; render(); }
  else if (kind === "showign") { UI.showIgnored = el.checked; render(); }
  else if (kind === "map") { WIZ.mapping[el.dataset.key] = el.value || ""; }
  else if (kind === "impdup") { WIZ.importDups = el.checked; render(); }
  else if (kind === "revremember") { REVIEW.remember = el.checked; }
  else if (kind === "income") {
    const key = el.dataset.key, slot = +el.dataset.slot;
    const a = DB.income[key] || [0, 0, 0];
    a[slot] = parseAmount(el.value) || 0;
    if (a[0] || a[1] || a[2]) DB.income[key] = a; else delete DB.income[key];
    saveDB();
    if (!WIZ) render();
  } else if (kind === "goal") {
    const id = el.dataset.id, slot = el.dataset.slot;
    const g = DB.goals[id] || { m: 0, y: 0 };
    g[slot] = parseAmount(el.value) || 0;
    if (g.m || g.y) DB.goals[id] = g; else delete DB.goals[id];
    saveDB();
  } else if (kind === "fixed") {
    const key = el.dataset.key;
    DB.fixed = DB.fixed || {};
    DB.fixed[key] = el.checked ? 1 : 0;
    saveDB(); render();
  } else if (kind === "catgroup") {
    const c = CAT_BY_ID[el.dataset.id]; if (!c) return;
    c.group = el.value;
    const dc = (DB.customCats || []).find(x => x.id === c.id); if (dc) dc.group = el.value;
    saveDB(); render(); toast("Catégorie déplacée.");
  } else if (kind === "setting") {
    const v = parseAmount(el.value);
    DB.settings[el.dataset.key] = v == null ? DEFAULT_SETTINGS[el.dataset.key] : v;
    saveDB(); render();
  } else if (kind === "patvalue") {
    const id = el.dataset.id, v = parseAmount(el.value);
    DB.patValues = DB.patValues || {};
    DB.patValues[id] = DB.patValues[id] || {};
    if (v == null) delete DB.patValues[id][UI.patMonth]; else DB.patValues[id][UI.patMonth] = v;
    saveDB(); render();
  } else if (kind === "patperfexcluded") {
    const a = (DB.patAccounts || []).find(x => x.id === el.dataset.id); if (!a) return;
    a.perfExcluded = !el.checked;
    saveDB(); render();
  } else if (kind === "patmonthsel") {
    UI.patMonth = UI.patMonth.slice(0, 5) + pad2(+el.value);
    render();
  } else if (kind === "patyearsel") {
    UI.patMonth = el.value + UI.patMonth.slice(4);
    render();
  } else if (kind === "patoffbudget") {
    const a = (DB.patAccounts || []).find(x => x.id === el.dataset.id); if (!a) return;
    /* On écrit la valeur explicitement, y compris quand elle rejoint le défaut du type :
       une décision prise vaut mieux qu'un défaut qui changerait si le type change. */
    a.offBudget = el.checked;
    saveDB(); render();
  } else if (kind === "pataccounttype") {
    const a = (DB.patAccounts || []).find(x => x.id === el.dataset.id); if (!a) return;
    a.type = el.value;
    saveDB(); render();
  /* Champ vidé = hypothèse rendue à l'historique, d'où le null plutôt que zéro : un
     rendement de 0 % et « pas d'avis » ne veulent pas dire la même chose. */
  } else if (kind === "patreturn" || kind === "patcontribution") {
    const key = kind === "patreturn" ? "patReturn" : "patContribution";
    DB.settings[key] = el.value.trim() === "" ? null : parseAmount(el.value);
    saveDB(); render();
  } else if (kind === "pattarget") {
    DB.settings.patTarget = el.value.trim() === "" ? 0 : Math.max(0, parseAmount(el.value) || 0);
    saveDB(); render();
  } else if (kind === "patsafetytarget") {
    DB.settings.patSafetyTarget = Math.max(0, parseAmount(el.value) || 0);
    saveDB(); render();
  } else if (kind === "patliab") {
    const l = (DB.patLiabilities || []).find(x => x.id === el.dataset.id); if (!l) return;
    const f = el.dataset.f;
    if (f === "name" || f === "mode" || f === "start") l[f] = el.value;
    else l[f] = parseAmount(el.value) || 0;
    saveDB(); render();
  } else if (kind === "patdebtvalue") {
    const id = el.dataset.id;
    DB.patDebtValues = DB.patDebtValues || {};
    DB.patDebtValues[id] = DB.patDebtValues[id] || {};
    const v = parseAmount(el.value);
    if (v == null) delete DB.patDebtValues[id][UI.patMonth]; else DB.patDebtValues[id][UI.patMonth] = v;
    saveDB(); render();
  }
});

document.addEventListener("dragover", e => {
  if (!WIZ) return;
  e.preventDefault(); const d = $("#drop"); if (d) d.classList.add("hot");
});
document.addEventListener("dragleave", () => { const d = $("#drop"); if (d) d.classList.remove("hot"); });
document.addEventListener("drop", e => {
  if (!WIZ) return;
  e.preventDefault(); const d = $("#drop"); if (d) d.classList.remove("hot");
  const f = e.dataTransfer.files[0]; if (f) readFileText(f, (text, name) => ingest(text, name));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (UI.small) { UI.small = null; renderSmall(); }
    else if (REVIEW) { REVIEW = null; UI.modal = null; render(); }
    else if (UI.modal) closeModal();
    return;
  }
  if (!REVIEW) return;
  if (!reviewCurrent()) {
    if (e.key === "Backspace" || (e.key === "z" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); reviewBack(); }
    return;
  }
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "Enter") { e.preventDefault(); reviewAct("validate"); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); reviewAct("ignore"); }
  else if (e.key === "ArrowRight") { e.preventDefault(); reviewAct("skip"); }
  else if (e.key === "Backspace" || (e.key === "z" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); reviewBack(); }
});

function fillYear(year, wiz) {
  const months = [];
  for (let m = 1; m <= 12; m++) months.push(year + "-" + pad2(m));
  const first = months.find(k => DB.income[k]);
  if (!first) { toast("Renseignez d\u2019abord un mois, il sera recopié."); return; }
  const src = DB.income[first];
  const scope = wiz ? Array.from(new Set(wiz.rows.map(r => monthKey(r.date)))).filter(k => k.startsWith(year)) : months;
  scope.forEach(k => { if (!DB.income[k]) DB.income[k] = src.slice(); });
  saveDB(); render();
}
function addManual() {
  const label = prompt("Libellé de l\u2019opération ?");
  if (!label) return;
  const raw = prompt("Montant ? (négatif pour une dépense, ex. -23,90)");
  const amount = parseAmount(raw);
  if (amount == null) { toast("Montant illisible."); return; }
  const d = prompt("Date ? (JJ/MM/AAAA)", todayISO().split("-").reverse().join("/"));
  const date = parseDate(d) || todayISO();
  let impId = DB.imports.find(i => i.name === "Saisie manuelle");
  if (!impId) { impId = { id: (DB.imports.reduce((m, i) => Math.max(m, i.id), 0) || 0) + 1, date: "manuel", name: "Saisie manuelle", n: 0 }; DB.imports.push(impId); }
  const row = { date, label, amount, merchantRaw: "", bankCat: "" };
  row.merchantKey = merchantKey(row);
  const c = categorise(row, DB.rules, MERCHANT_INDEX, DB.legacyMap);
  DB.tx.push({ ...row, cat: c.cat, status: c.status, imp: impId.id });
  UI.month = monthKey(date);
  reindex(); saveDB(); render();
}

/* =========================================================================
   Theme
   ========================================================================= */
function applyTheme() {
  const t = DB.settings.theme || "auto";
  const dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function cycleTheme() {
  const order = ["auto", "light", "dark"];
  DB.settings.theme = order[(order.indexOf(DB.settings.theme || "auto") + 1) % 3];
  saveDB(); applyTheme();
  toast("Thème : " + { auto: "automatique", light: "clair", dark: "sombre" }[DB.settings.theme]);
}

/* =========================================================================
   Boot
   ========================================================================= */
function renderSmall() {
  const old = document.getElementById("smallmodal");
  if (old) old.remove();
  if (!UI.small) return;
  const d = document.createElement("div");
  d.id = "smallmodal"; d.innerHTML = UI.small();
  document.body.appendChild(d);
  const inp = document.getElementById("newcatname"); if (inp) inp.focus();
}
document.addEventListener("change", e => {
  if (e.target && e.target.id === "filein" && e.target.files[0]) readFileText(e.target.files[0], (t, n) => ingest(t, n));
  if (e.target && e.target.id === "patfilecomptes" && e.target.files[0])
    readFileText(e.target.files[0], (t, n) => { PATIMP.comptesText = t; PATIMP.comptesName = n; PATIMP.error = null; renderSmall(); });
  if (e.target && e.target.id === "patfilemouvements" && e.target.files[0])
    readFileText(e.target.files[0], (t, n) => { PATIMP.mouvementsText = t; PATIMP.mouvementsName = n; PATIMP.error = null; renderSmall(); });
});

DB = loadDB();
(DB.customCats || []).forEach(registerCat);
recoverMissingCats(DB);
reindex();
applyTheme();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", applyTheme);
}
render();
if (!DB.tx.length) {
  setTimeout(() => {
    const app = $(".main");
    if (app && !DB.tx.length) app.insertAdjacentHTML("afterbegin",
      '<div class="note" style="margin-bottom:16px">' + icon("inbox") +
      " Premier lancement : <b>Données → Reprise de l’historique</b> pour charger plusieurs années d’un coup, " +
      "ou <b>Importer</b> pour un simple relevé mensuel. Le patrimoine se reprend depuis " +
      "<b>Données → Patrimoine depuis Excel</b>.</div>");
  }, 0);
}

</script>
