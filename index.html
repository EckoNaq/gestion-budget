<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget</title>
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#FAFBFC; --raised:#FFFFFF;
  --ink:#131722; --ink-2:#4A5263;
  --ink-soft:#5A6272; --ink-mute:#8A92A3;
  --line:#E3E6EC; --line-2:#EEF0F4;
  --accent:#3B5BDB; --accent-soft:#EDF0FD; --accent-ink:#2A45B0;
  --pos:#0F7A55; --pos-soft:#E6F4EE;
  --neg:#C1272D; --neg-soft:#FBECEC;
  --warn:#9A6700; --warn-soft:#FFF6E0;
  --focus:#3B5BDB;
  /* Une teinte par classe d'actif. Aucune n'est un vert ni un rouge saturé : ces deux
     couleurs restent réservées au gain et à la perte, sinon un compte se lirait comme
     une performance. Deux comptes d'une même classe se départagent par une nuance,
     calculée dans patAccountColor(). */
  --c-pea:#3B5BDB; --c-av:#0F8B84; --c-livret:#0B6FA4; --c-pee:#7B4AD1;
  --c-per:#8E3F6B; --c-crypto:#B0740A; --c-immo:#6E7A18; --c-courant:#5A6478; --c-autre:#6B7280;
  /* Famille de jalons entièrement décrochée : un doré discret, distinct de l accent. */
  --done-ink:#8A6A15; --done-b:#DFC77A; --done-bg:#FCF7E8; --done-on:#FFFFFF;
  --radius:10px; --radius-sm:7px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A22; --surface-2:#1B2029; --raised:#1E242E;
  --ink:#E7EAF0; --ink-2:#B7BECD; --ink-soft:#98A1B2; --ink-mute:#78808F;
  --line:#272D38; --line-2:#20262F;
  --accent:#7C93F5; --accent-soft:#1C2440; --accent-ink:#A8B8FF;
  --pos:#3FBF8F; --pos-soft:#12301F;
  --neg:#F4726F; --neg-soft:#331A1C;
  --warn:#E0B04A; --warn-soft:#2E2611;
  --focus:#7C93F5;
  --c-pea:#7C93F5; --c-av:#3EC1B6; --c-livret:#4FADD8; --c-pee:#AC8CF2;
  --c-per:#CE86AC; --c-crypto:#E0A63C; --c-immo:#AEBC4E; --c-courant:#99A4B8; --c-autre:#9AA3B2;
  /* Sur le doré clair du thème sombre, un texte blanc tomberait à 1,9:1 : il passe en
     encre sombre pour rester lisible. */
  --done-ink:#E0BA55; --done-b:#5C4C1E; --done-bg:#1E1B10; --done-on:#191509;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
::selection{background:var(--accent-soft)}

/* ---------- typography utilities ---------- */
.eyebrow{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:14.5px}
h3{font-size:13px}
.muted{color:var(--ink-soft)}
.tiny{font-size:12px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto;
  display:flex; flex-direction:column; gap:18px;
}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 6px 2px}
.brand b{font-size:17px;font-weight:660;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-mute)}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navlabel{padding:14px 8px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mute)}
.navlabel:first-child{padding-top:2px}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:7px 8px;border-radius:var(--radius-sm);
  color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:500;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:20px}
.navbtn svg{flex:none;opacity:.85}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

.main{padding:22px 26px 60px;max-width:1220px;width:100%}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.periodnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.periodnav button{background:none;border:0;padding:5px 9px;border-radius:5px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center}
.periodnav button:hover{background:var(--surface-2);color:var(--ink)}
.periodnav .label{padding:4px 10px;font-weight:620;min-width:132px;text-align:center;font-size:13.5px}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  font-size:13px;font-weight:550;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;gap:5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--neg);border-color:var(--line)}
.btn.danger:hover{background:var(--neg-soft);border-color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}

/* ---------- cards / layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card>.chead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card>.chead .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1080px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-size:22px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.kpis.k5 .kpi .v{font-size:20px}
.kpi .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- comparison strip (signature) ---------- */
.cmp{display:flex;flex-direction:column}
.cmprow{display:grid;grid-template-columns:172px 96px 84px 1fr 130px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}
.cmprow:first-child{border-top:0}
.cmpname{display:flex;align-items:center;gap:8px;min-width:0}
.cmpname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:520}
.cmpdelta{display:flex;align-items:center;gap:5px;font-weight:620;font-size:13px}
.track{position:relative;height:22px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:var(--line);opacity:.75}
.track .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-mute);opacity:.5}
.track .fill{position:absolute;top:4px;bottom:4px;border-radius:2px}
.track .fill.over{background:var(--neg)}
.track .fill.under{background:var(--pos)}
.track .fill.flat{background:var(--ink-mute)}
.cmpprev{text-align:right;font-size:12px;color:var(--ink-soft)}
.legendline{display:flex;gap:16px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip .sw{width:11px;height:11px;border-radius:3px;flex:none}

/* ---------- category rows ---------- */
.catrow{display:grid;grid-template-columns:26px 1fr 108px 74px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);cursor:pointer}
.catrow:first-of-type{border-top:0}
.catrow:hover{background:var(--surface-2)}
.catrow .bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:4px}
.catrow .bar>i{display:block;height:100%;border-radius:3px}
.icon-badge{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none}
.icon-badge svg{width:14px;height:14px}
.subrow{display:grid;grid-template-columns:1fr 100px 70px;gap:10px;padding:4px 0 4px 36px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-2)}

/* ---------- operations table ---------- */
.ops{width:100%;border-collapse:collapse}
.ops th{
  text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-mute);padding:0 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.ops td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ops tr:hover td{background:var(--surface-2)}
.ops tr.is-dup td{opacity:.62}
.ops tr.is-ign td{opacity:.62}
.ops .c-date{width:66px;color:var(--ink-soft);font-size:12.5px}
.ops .c-amt{width:108px;text-align:right;font-weight:600;white-space:nowrap}
.ops .c-cat{width:200px}
.ops .c-imp{width:104px}
.ops .c-act{width:96px;text-align:right;white-space:nowrap}
.merchant{font-weight:550}
.rawlabel{font-size:11.5px;color:var(--ink-mute);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;display:block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.dup{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ign{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.todo{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.selcat{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:100%}
.catbtn{border:1px solid transparent;background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.catbtn:hover{border-color:var(--line);color:var(--ink)}
.catbtn.none{color:var(--neg);background:var(--neg-soft)}
.kpi .v.warn{color:var(--warn)}
.iconbtn{border:1px solid transparent;background:none;border-radius:6px;padding:3px;cursor:pointer;color:var(--ink-mute);display:inline-flex}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.iconbtn.danger:hover{color:var(--neg);border-color:var(--neg)}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  padding:6px 9px;color:var(--ink);
}
input[type=number]{font-family:var(--mono);text-align:right}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}

/* ---------- misc ---------- */
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:14px}
/* Le <b> d'un état vide sert de titre et passe donc en bloc ; pour appuyer un mot au fil du
   texte il faut ce recours, sinon la phrase se coupe en trois. */
.empty .inl,.inl{display:inline;font-weight:650;color:var(--ink);margin:0;font-size:inherit}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer;min-width:0}
.barcol .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:120px}
.barcol i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.barcol .lb{font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em}
.barcol.on .lb{color:var(--accent-ink);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:550;z-index:90;box-shadow:0 6px 24px -8px rgba(0,0,0,.4)}
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.42);display:grid;place-items:start center;padding:36px 16px;overflow:auto;z-index:80}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
.modal.wide{max-width:1000px}
.modal .mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal .mhead .spacer{flex:1}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{flex:1;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:12px;color:var(--ink-mute);background:var(--surface-2)}
.step.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:620}
.step.done{color:var(--pos);border-color:var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-soft);background:var(--surface-2)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.maptable{width:100%;border-collapse:collapse;font-size:13px}
.maptable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);padding:0 8px 6px;border-bottom:1px solid var(--line)}
.maptable td{padding:5px 8px;border-bottom:1px solid var(--line-2)}
.scroll{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.hbar{height:9px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.incgrid{width:100%;border-collapse:collapse;font-size:13px}
.incgrid th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute);padding:0 6px 6px;text-align:right}
.incgrid th:first-child{text-align:left}
.incgrid td{padding:3px 6px;border-top:1px solid var(--line-2)}
.incgrid input{width:104px;padding:4px 7px}

/* ---------- category tag ---------- */
.tag-cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:560;padding:2px 8px 2px 5px;border-radius:20px;
  border:1px solid transparent;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.tag-cat svg{flex:none;opacity:.9}
.tag-cat:hover{filter:brightness(.96);border-color:currentColor}
.tag-cat.none{background:var(--neg-soft);color:var(--neg);font-style:italic}

/* ---------- goals ---------- */
.goalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.goal{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface-2)}
.goal .gh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.goal .gh .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gv{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.goal .gv b{font-size:19px;font-weight:640;letter-spacing:-.02em}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.gbar>i{display:block;height:100%;border-radius:5px}
.gpace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.gfoot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px}
.state-ok{color:var(--pos)} .state-watch{color:var(--warn)} .state-over{color:var(--neg)}
.bg-ok{background:var(--pos)} .bg-watch{background:var(--warn)} .bg-over{background:var(--neg)}

/* ---------- comparison ---------- */
.cmprow{display:grid;grid-template-columns:210px 104px 92px 1fr 132px;gap:12px;align-items:center;padding:8px 10px;border-top:1px solid var(--line-2);border-radius:7px}
.cmprow.over{background:linear-gradient(90deg,var(--neg-soft),transparent 62%)}
.cmprow.under{background:linear-gradient(90deg,var(--pos-soft),transparent 62%)}
.cmprow.over .nm{color:var(--neg);font-weight:640}
.cmprow.under .nm{color:var(--pos);font-weight:640}

/* ---------- drill-down ---------- */
.merchrow{display:grid;grid-template-columns:1fr 62px 104px;gap:10px;padding:4px 0 4px 52px;font-size:12.5px;border-top:1px dashed var(--line-2);color:var(--ink-2)}
.warn-txt{color:var(--warn)}
.basegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.basegrid>div{background:var(--surface-2);padding:12px 14px}
.basegrid .v{font-size:20px;font-weight:600;margin:4px 0 2px;letter-spacing:-.02em}
.fixlist{display:flex;flex-direction:column}
.fixrow{display:grid;grid-template-columns:26px 1fr 190px 150px 96px 78px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px}
.fixrow:first-child{border-top:0}
.fixrow:hover{background:var(--surface-2)}
.fixrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.fixrow.off{opacity:.62}
.fixrow.off .nm{text-decoration:line-through;text-decoration-thickness:1px}
.subrow.open{background:var(--surface-2)}
.subrow{cursor:pointer}
.subrow:hover{background:var(--surface-2)}

/* ---------- review (tri des opérations) ---------- */
.rev{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-2);transition:transform .28s ease,opacity .28s ease}
.rev.out-right{transform:translateX(90px) rotate(2.5deg);opacity:0}
.rev.out-left{transform:translateX(-90px) rotate(-2.5deg);opacity:0}
.rev .rdate{font-size:12px;color:var(--ink-mute);letter-spacing:.02em}
.rev .rmerch{font-size:21px;font-weight:640;letter-spacing:-.02em;margin:3px 0 2px;text-transform:capitalize}
.rev .rlabel{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);word-break:break-all}
.rev .ramt{font-size:30px;font-weight:640;letter-spacing:-.03em;margin:10px 0 4px}
.progress{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-bottom:6px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* ---- Patrimoine ---- */
.pathero{display:grid;grid-template-columns:minmax(230px,1.05fr) 1fr;gap:24px;align-items:start}
.pathero .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.04}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);font-weight:600}
/* Variation du mois : un seul bloc, la performance en tête et le montant en appui. */
.monthdelta{display:inline-flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:9px;border:1px solid transparent}
.monthdelta .mv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.08}
.monthdelta .ms{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.monthdelta.pos{background:var(--pos-soft)} .monthdelta.pos .mv{color:var(--pos)}
.monthdelta.neg{background:var(--neg-soft)} .monthdelta.neg .mv{color:var(--neg)}
.monthdelta.flat{background:var(--surface-2);border-color:var(--line)} .monthdelta.flat .mv{color:var(--ink-soft)}
.dpill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:650;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dpill.pos{background:var(--pos-soft);color:var(--pos)}
.dpill.neg{background:var(--neg-soft);color:var(--neg)}
.dpill.flat{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.splitbar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.splitbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:9px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink)}
.sw{display:inline-block;flex:none;width:9px;height:9px;border-radius:3px}
.allocbar{display:flex;height:32px;border-radius:7px;overflow:hidden;gap:2px}
.allocbar i{display:block;height:100%;min-width:2px}
.alloclist{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:4px 18px;margin-top:12px;font-size:12.5px}
.alloclist span{display:flex;align-items:center;gap:7px;color:var(--ink-2);min-width:0}
.alloclist em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloclist b{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);padding-left:8px}
/* Barres de performance centrées sur zéro : la forme dit le signe avant la couleur. */
.dvrow{display:grid;grid-template-columns:46px 1fr 118px;align-items:center;gap:10px;padding:3px 0;font-size:12px}
.dvrow .dvval{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.dvrow .dvval b{font-weight:650}
.dvrow .dvval em{font-style:normal;font-size:10.5px;color:var(--ink-mute)}
/* Grille mois par mois : une case par mois, teinte selon le signe et l'ampleur. */
.ygrid{display:flex;flex-direction:column;gap:3px;overflow-x:auto;padding-bottom:2px}
.grow{display:grid;grid-template-columns:42px repeat(12,minmax(20px,1fr)) 76px 62px;gap:3px;align-items:center;
  font-size:11.5px;min-width:540px}
.grow .gy{font-family:var(--mono);font-weight:650;color:var(--ink-2)}
.grow .gh{text-align:center;font-size:9.5px;color:var(--ink-mute);font-weight:600}
.gcell{height:21px;border-radius:3px;background:var(--line-2)}
.gcell.on{cursor:help}
.grow .gtot{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650}
.grow .gcnt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.ghead .gtot,.ghead .gcnt{font-size:9.5px;font-weight:600;color:var(--ink-mute);text-transform:uppercase;font-family:var(--sans)}
/* Meilleure année d'un compte : soulignée plutôt que colorée, la couleur portant déjà le signe. */
td.bestyear{font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
th.curyear{color:var(--accent-ink)}
/* Point d'aide : l'explication ne mérite pas d'occuper l'écran en permanence. */
.help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  border:1px solid var(--line);color:var(--ink-mute);font-size:10.5px;font-weight:700;cursor:help;flex:none}
.help:hover,.help:focus-visible{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
tr.rowoff td{opacity:.55}
tr.rowoff td:first-child{opacity:.8}
.dvtrack{position:relative;height:16px;background:var(--line-2);border-radius:3px}
.dvtrack::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dvtrack i{position:absolute;top:2px;bottom:2px;border-radius:2px;min-width:2px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac,var(--accent))}
.acard.todo{border-style:dashed;border-color:var(--ink-mute)}
.acard .an{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;min-width:0}
.acard .an em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .av{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;letter-spacing:-.02em}
.acard .am{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft)}
.acard .am b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650}
.acard input{width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.acard .go{position:absolute;top:8px;right:8px;opacity:.45}
.acard:hover .go{opacity:1}
.msbar{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden;margin:11px 0 6px}
.msbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
/* Jalons : des médaillons, pas des lignes de tableau. Un badge acquis prend la couleur de
   son rang ; un badge à venir garde un anneau de progression, pour rester une cible et non
   un échec. Les rangs vont du bronze au platine selon la place du jalon dans sa famille. */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;cursor:help}
.bmed{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:5px}
/* Anneau de progression du jalon non acquis : la part remplie est la distance parcourue. */
.bmed::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--accent) var(--p,0%),var(--line-2) 0)}
.bmed::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.bic{position:relative;z-index:1;color:var(--ink-mute);display:flex}
.badge.on .bmed::before{background:var(--tier-l)}
.badge.on .bmed::after{inset:5px;background:var(--tier)}
.badge.on .bic{color:#fff}
.btick{position:absolute;z-index:2;right:-1px;bottom:-1px;width:19px;height:19px;border-radius:50%;
  background:var(--pos);color:#fff;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--surface)}
.badge .bn{font-size:11.5px;font-weight:650;color:var(--ink-soft);line-height:1.25}
.badge .bs{font-size:10px;color:var(--ink-mute);font-family:var(--mono);line-height:1.3}
.badge.on .bn{color:var(--ink)}
.badge.on .bs{color:var(--ink-2)}
/* Famille complète : bordure et fond dorés, coupe dans le titre, pastille « Complet ». */
.mgroup.full{border-color:var(--done-b);background:var(--done-bg)}
.mgroup.full h2{color:var(--done-ink)}
.mtrophy{display:flex;color:var(--done-ink)}
.mfull{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;
  background:var(--done-ink);color:var(--done-on);font-size:11px;font-weight:700}
.t-bronze{--tier:#A9683A;--tier-l:#CD8B58}
.t-silver{--tier:#78829A;--tier-l:#A2ABBE}
.t-gold{--tier:#BE922A;--tier-l:#E3BE4C}
.t-plat{--tier:#5F4FC0;--tier-l:#9284E8}
html[data-theme="dark"] .t-bronze{--tier:#C4864F;--tier-l:#E0A87A}
html[data-theme="dark"] .t-silver{--tier:#98A2B6;--tier-l:#BFC7D6}
html[data-theme="dark"] .t-gold{--tier:#DDB447;--tier-l:#F0D585}
html[data-theme="dark"] .t-plat{--tier:#8A79E4;--tier-l:#B4A8F5}
.patgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
/* Six colonnes de chiffres tiennent mal sous 1100 px : plutôt que de couper « +1,50 % »
   en deux lignes, on laisse le conteneur défiler — les montants restent lisibles d'un bloc. */
.patnum td.num,.patnum th{white-space:nowrap}
.patnum td:first-child{min-width:150px}
/* La réserve de 150 px vaut pour une colonne de noms de compte ; une colonne d'années n'en
   a pas besoin et faisait déborder le tableau pour quelques pixels. */
.patnum.narrow td:first-child{min-width:0}
@media (max-width:1080px){.pathero,.patgrid{grid-template-columns:1fr}}
.catgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.catchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.catchip:hover{border-color:var(--ink-mute)}
.catchip.on{color:#fff;border-color:transparent;font-weight:600}
.catchip.sugg{border-style:dashed;border-color:var(--accent)}
.grouplab{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:9px 0 2px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-mute)}

/* ---------- review, second pass ---------- */
.revhead{display:flex;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-weight:700;font-size:19px;letter-spacing:-.03em;flex:none}
.avatar svg{width:24px;height:24px}
.revwho{min-width:0;flex:1}
.revamt{font-size:34px;font-weight:660;letter-spacing:-.035em;text-align:right;white-space:nowrap}
.revwhy{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-mute);margin-top:3px}
.revwhy svg{width:12px;height:12px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 11px;font-size:13px;cursor:pointer;
  color:var(--ink);display:inline-flex;align-items:center;gap:7px;font-weight:520;transition:border-color .12s,transform .08s}
.pick:hover{border-color:var(--ink-mute)}
.pick:active{transform:scale(.97)}
.pick.on{border-width:1.5px;font-weight:640}
.pick .dot{width:9px;height:9px;border-radius:50%;flex:none}
.moreline{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.moreline .hr{flex:1;height:1px;background:var(--line)}
.moreline button{background:none;border:0;color:var(--accent-ink);font-size:12px;cursor:pointer;font-weight:600;padding:2px 6px;border-radius:5px}
.moreline button:hover{background:var(--accent-soft)}
/* Destination patrimoine d'un virement interne : un bloc à part, sous les catégories,
   parce qu'il répond à une autre question et n'a de sens que pour ces opérations-là. */
.destbox{margin-top:14px;padding:12px 13px 11px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.destbox.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.destlab{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:620;color:var(--ink-soft);margin-bottom:8px}
.destlab svg{width:12px;height:12px}
.destsum{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:9px;line-height:1.45}
.destsum svg{width:12px;height:12px;flex:none;margin-top:2px}
.destsum.muted{color:var(--ink-mute)}
.tag.lnk{display:inline-flex;align-items:center;gap:5px}
.segbar{display:flex;gap:3px;margin-bottom:14px}
.segbar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segbar i.done{background:var(--pos)}
.segbar i.now{background:var(--accent)}
.revfoot{display:flex;gap:10px;margin-top:16px;align-items:center}
.btn.big{padding:11px 18px;font-size:14px;border-radius:10px;font-weight:620}
.memo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer;user-select:none;
  border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:var(--surface)}
.memo input{accent-color:var(--accent);margin:0;width:13px;height:13px}
.memo.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.doneburst{width:64px;height:64px;border-radius:50%;background:var(--pos-soft);color:var(--pos);display:grid;place-items:center;margin:0 auto 14px}
.doneburst svg{width:30px;height:30px}
.similar{font-size:11.5px;color:var(--ink-mute);margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- segmented switch ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{padding:3px 11px;background:none;border:0;cursor:pointer;font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.cmpprev{opacity:0;transition:opacity .12s}
.cmprow:hover .cmpprev,.cmprow:focus-within .cmpprev{opacity:1}

/* ---------- misc ---------- */
.ops thead th{position:sticky;top:0;background:var(--surface);z-index:2}
.suggestrow td{color:var(--ink-soft)}
.dupbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<script>
/* =========================================================================
   Budget — single-file expense tracker. All data stays in this browser.
   ========================================================================= */
/* ==== PURE START ==== */

const STORE_KEY = "budget.app.v1";          // distinct from any other local app
/* 2 : ajout des passifs (patLiabilities / patDebtValues) et des réglages de projection.
   Aucune migration n'est nécessaire — deserialize() donne une valeur par défaut à toute
   clé absente, donc une sauvegarde v1 se restaure telle quelle. */
const SCHEMA_VERSION = 2;

const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_SHORT = ["jan","fév","mar","avr","mai","jun","jui","aoû","sep","oct","nov","déc"];

/* Operation status */
const ST_OK = 0, ST_DUP = 1, ST_DUP_MAYBE = 2, ST_IGNORED = 3;

/* Category kinds: how a group takes part in the numbers */
const KIND_EXPENSE = "expense", KIND_INCOME = "income", KIND_NEUTRAL = "neutral";

/* -------------------------------------------------------------------------
   Taxonomy: groups carry the analysis, subcategories carry the detail.
   `legacy` subcategories are kept so imported history stays exactly as it was
   recorded, but they are never offered when categorising something new.
   ------------------------------------------------------------------------- */
const GROUPS = [
  { id:"g_home",    name:"Logement",              kind:KIND_EXPENSE, color:"#3B5BDB", icon:"home"     },
  { id:"g_car",     name:"Véhicule & transports", kind:KIND_EXPENSE, color:"#0E7C86", icon:"car"      },
  { id:"g_food",    name:"Alimentation",          kind:KIND_EXPENSE, color:"#B0520E", icon:"cart"     },
  { id:"g_subs",    name:"Abonnements & télécom", kind:KIND_EXPENSE, color:"#7048B6", icon:"signal"   },
  { id:"g_health",  name:"Santé & soins",         kind:KIND_EXPENSE, color:"#1F8A4C", icon:"heart"    },
  { id:"g_shop",    name:"Achats & équipement",   kind:KIND_EXPENSE, color:"#C2255C", icon:"bag"      },
  { id:"g_leisure", name:"Sorties & vacances",    kind:KIND_EXPENSE, color:"#946200", icon:"ticket"   },
  { id:"g_fees",    name:"Frais & obligations",   kind:KIND_EXPENSE, color:"#5C6270", icon:"receipt"  },
  { id:"g_legacy",  name:"Divers (historique)",   kind:KIND_EXPENSE, color:"#8A6E5D", icon:"dots"     },
  { id:"g_income",  name:"Revenus",               kind:KIND_INCOME,  color:"#0F7A55", icon:"income"   },
  { id:"g_neutral", name:"Épargne & transferts",  kind:KIND_NEUTRAL, color:"#6B7280", icon:"vault"    },
];

const CATS = [
  ["c_rent",       "g_home",    "Loyer"],
  ["c_power",      "g_home",    "Électricité & gaz"],
  ["c_water",      "g_home",    "Eau"],
  ["c_homeins",    "g_home",    "Assurance habitation"],
  ["c_homegear",   "g_home",    "Équipement & déco"],
  ["c_works",      "g_home",    "Travaux & entretien"],
  ["c_homemisc",   "g_home",    "Divers logement", true],

  ["c_carins",     "g_car",     "Assurance auto"],
  ["c_fuel",       "g_car",     "Carburant"],
  ["c_carfix",     "g_car",     "Entretien & réparation"],
  ["c_parking",    "g_car",     "Parking & péages"],
  ["c_transit",    "g_car",     "Transports"],
  ["c_carmisc",    "g_car",     "Divers véhicule", true],

  ["c_grocery",    "g_food",    "Courses"],
  ["c_delivery",   "g_food",    "Livraison de repas"],
  ["c_resto",      "g_food",    "Restaurants & bars"],

  ["c_internet",   "g_subs",    "Internet"],
  ["c_mobile",     "g_subs",    "Mobile"],
  ["c_subs",       "g_subs",    "Abonnements"],

  ["c_doctor",     "g_health",  "Médecin & soins"],
  ["c_pharmacy",   "g_health",  "Pharmacie"],
  ["c_hair",       "g_health",  "Coiffeur & beauté"],
  ["c_sport",      "g_health",  "Sport"],

  ["c_clothes",    "g_shop",    "Vêtements"],
  ["c_games",      "g_shop",    "Jeux & objets"],
  ["c_tech",       "g_shop",    "High-tech"],
  ["c_gifts",      "g_shop",    "Cadeaux"],

  ["c_outings",    "g_leisure", "Sorties"],
  ["c_holidays",   "g_leisure", "Vacances & voyages"],
  ["c_leisuremisc","g_leisure", "Divers loisirs", true],

  ["c_bankfees",   "g_fees",    "Frais bancaires"],
  ["c_tax",        "g_fees",    "Impôts & taxes"],
  ["c_fines",      "g_fees",    "Amendes"],
  ["c_otherins",   "g_fees",    "Assurances diverses"],

  ["c_dailymisc",  "g_legacy",  "Divers vie quotidienne", true],
  ["c_unknown",    "g_legacy",  "Inconnu", true],

  ["c_salary",     "g_income",  "Salaire"],
  ["c_bonus",      "g_income",  "Bonus"],
  ["c_incmisc",    "g_income",  "Revenus divers"],
  ["c_refund",     "g_income",  "Remboursements"],

  ["c_savings",    "g_neutral", "Épargne & investissement"],
  ["c_transfer",   "g_neutral", "Virement interne"],
].map(([id, group, name, legacy]) => ({ id, group, name, legacy: !!legacy }));

const CAT_BY_ID = Object.fromEntries(CATS.map(c => [c.id, c]));
const GROUP_BY_ID = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const catGroup = catId => (CAT_BY_ID[catId] ? GROUP_BY_ID[CAT_BY_ID[catId].group] : null);
const catKind = catId => { const g = catGroup(catId); return g ? g.kind : null; };
const catName = catId => (CAT_BY_ID[catId] ? CAT_BY_ID[catId].name : "—");

/* -------------------------------------------------------------------------
   Legacy spreadsheet values (column D) -> categories of this app.
   `null` means "no safe guess, ask during the import".
   ------------------------------------------------------------------------- */
const LEGACY_MAP = {
  // categories the user maintained himself
  "loyer":"c_rent", "assurance maison":"c_homeins", "electricite gaz":"c_power", "eau":"c_water",
  "divers logement":"c_homemisc", "assurance auto":"c_carins", "essence":"c_fuel",
  "entretien":"c_carfix", "divers vehicule":"c_carmisc", "courses":"c_grocery",
  "deliveroo":"c_delivery", "restaurants bars":"c_resto", "internet":"c_internet",
  "mobile":"c_mobile", "abonnements":"c_subs", "vetements":"c_clothes", "coiffeur":"c_hair",
  "sport":"c_sport", "vacances":"c_holidays", "sorties":"c_outings", "jeux objets":"c_games",
  "divers loisirs":"c_leisuremisc", "divers vie quotidienne":"c_dailymisc", "inconnu":"c_unknown",
  // categories left as the bank had labelled them
  "restaurants bars discotheques":"c_resto", "restaurants":"c_resto", "alimentation":"c_grocery",

function canonMerchant(row, merchantIndex) {

/* ---------------- small helpers ---------------- */
const pad2 = n => String(n).padStart(2, "0");
const monthKey = iso => iso.slice(0, 7);
const yearOf = iso => +iso.slice(0, 4);
const dayOf = iso => +iso.slice(8, 10);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
function monthLabel(key) { const [y, m] = key.split("-"); return MONTHS[+m - 1] + " " + y; }
function addMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}
function daysBetween(isoA, isoB) {
  return Math.abs((Date.parse(isoA) - Date.parse(isoB)) / 86400000);
}
function normalize(s) {
  return (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
}
function fmtEur(n, opts) {
  /* Un calcul qui rend exactement zéro peut produire −0 : sans ce garde-fou, un gain nul
     s'afficherait « -0,00 € ». Même précaution que dans fmtPerf. */
  const v = Math.abs(n) < 0.005 ? 0 : n;
  const sign = v < 0 ? "-" : (opts && opts.plus && v > 0 ? "+" : "");
  return sign + Math.abs(v).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}
function fmtEurShort(n) {
  return (n < 0 ? "-" : "") + Math.round(Math.abs(n)).toLocaleString("fr-FR") + " €";
}
function fmtPct(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1).replace(".", ",") + " %"; }
/* Plain rate, no leading sign except for a genuine negative. One decimal,
   dropped when it says nothing: 20 % rather than 20,0 %. */
function trim1(n) { return Math.abs(n).toFixed(1).replace(/\.0$/, "").replace(".", ","); }
function fmtRate(n) { return (n < 0 ? "−" : "") + trim1(n) + " %"; }
/* Performance d'un placement : toujours deux décimales, signe explicite. Sur un PEA à
   cinq chiffres, un dixième de point vaut des dizaines d'euros — le trim1() des taux
   d'épargne serait ici une perte d'information. Un calcul qui rend exactement zéro peut
   produire −0 en JS, ce qui s'afficherait « −0,00 % » : on le ramène à zéro. */
function fmtPerf(n) {
  if (n == null) return "—";
  const v = Math.abs(n) < 0.005 ? 0 : n;
  return (v < 0 ? "−" : v > 0 ? "+" : "") + Math.abs(v).toFixed(2).replace(".", ",") + " %";
}
function fmtPts(n) { return trim1(n) + " pt" + (Math.abs(n) >= 2 ? "s" : ""); }

/* ---------------- amount parsing ----------------
   Handles 1 234,56 / 1,234.56 / -2,000.00 / (12.30) / 12.30 EUR         */
function parseAmount(raw) {
  let s = (raw == null ? "" : String(raw)).replace(/[\s\u00a0\u202f]/g, "").replace(/€|EUR/gi, "");
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.indexOf("-") >= 0) { neg = true; s = s.replace(/-/g, ""); }
  s = s.replace(/\+/g, "");
  const hasComma = s.indexOf(",") >= 0, hasDot = s.indexOf(".") >= 0;
  if (hasComma && hasDot) {
    // the right-most separator is the decimal one
    s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (hasComma) {
    s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
  }
  const v = parseFloat(s);
  if (isNaN(v)) return null;
  return neg ? -Math.abs(v) : v;
}

/* ---------------- date parsing ---------------- */
function parseDate(raw) {
  const s = (raw == null ? "" : String(raw)).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (!m) return null;
  let d = +m[1], mo = +m[2], y = +m[3];
  if (d > 12 && mo <= 12) { /* day first, fine */ }
  else if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; }   // month-first export
  if (y < 100) y += 2000;
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  return y + "-" + pad2(mo) + "-" + pad2(d);
}

/* ---------------- CSV ---------------- */
function detectSeparator(text) {
  const line = text.split(/\r?\n/).find(l => l.trim()) || "";
  const counts = [[",", 0], [";", 0], ["\t", 0]];
  let inQuotes = false;
  for (const ch of line) {
    if (ch === '"') inQuotes = !inQuotes;
    else if (!inQuotes) for (const c of counts) if (ch === c[0]) c[1]++;
  }
  counts.sort((a, b) => b[1] - a[1]);
  return counts[0][1] > 0 ? counts[0][0] : ";";
}
function parseCSV(text, sep) {
  sep = sep || detectSeparator(text);
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === sep) { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

/* Column names are matched by header, never by position: the bank has already
   shifted its columns once and would happily do it again. */
const COLUMN_ALIASES = {
  date:     ["dateop", "date operation", "date de l operation", "date", "date comptable"],
  dateVal:  ["dateval", "date de valeur", "date valeur"],
  label:    ["label", "libelle", "libelle operation", "libelle simplifie", "nature de l operation", "description"],
  bankCat:  ["category", "categorie", "categorie operation"],
  merchant: ["supplierfound", "supplier", "fournisseur", "vendeur", "commercant", "beneficiaire"],
  bankParent: ["categoryparent", "categorie parente", "categorie parent"],
  amount:   ["amount", "montant", "montant eur", "montant operation"],
  debit:    ["debit", "montant debit"],
  credit:   ["credit", "montant credit"],
};
function mapHeader(headerRow) {
  const norm = headerRow.map(h => normalize(h));
  const found = {};
  for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
    let idx = -1;
    for (const a of aliases) { idx = norm.indexOf(a); if (idx >= 0) break; }
    if (idx < 0) for (const a of aliases) { idx = norm.findIndex(h => h && h.startsWith(a)); if (idx >= 0) break; }
    if (idx >= 0) found[key] = idx;
  }
  return found;
}

function parseStatement(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { rows: [], error: "Fichier vide." };
  const cols = mapHeader(rows[0]);
  if (cols.date == null || cols.label == null || (cols.amount == null && cols.debit == null))
    return { rows: [], error: "Colonnes introuvables. Il faut au minimum une date, un libellé et un montant." };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const date = parseDate(r[cols.date]);
    const label = (r[cols.label] || "").trim();
    let amount = cols.amount != null ? parseAmount(r[cols.amount]) : null;
    if (amount == null && cols.debit != null) {
      const d = parseAmount(r[cols.debit]), c = cols.credit != null ? parseAmount(r[cols.credit]) : null;
      amount = d != null && d !== 0 ? -Math.abs(d) : (c || null);
    }
    if (!date || !label || amount == null) continue;
    out.push({
      date, label, amount,
      merchantRaw: cols.merchant != null ? (r[cols.merchant] || "").trim() : "",
      bankCat: cols.bankCat != null ? (r[cols.bankCat] || "").trim() : "",
      bankParent: cols.bankParent != null ? (r[cols.bankParent] || "").trim() : "",
    });
  }
  /* Since mid-2026 the bank ships its own category where the merchant used to be.
     When that is what the file holds, drop the column and read merchants off the label. */
  const named = out.filter(r => r.merchantRaw);
  const categoryLike = named.filter(r => BANK_PARENTS.has(normalize(r.merchantRaw))).length;
  const merchantColumnIsCategory = named.length > 4 && categoryLike / named.length > 0.5;
  if (merchantColumnIsCategory) out.forEach(r => { r.bankParent = r.bankParent || r.merchantRaw; r.merchantRaw = ""; });
  return { rows: out, error: out.length ? null : "Aucune ligne exploitable dans ce fichier.", merchantColumnIsCategory };
}

/* ---------------- merchant ----------------
   Column F when the bank fills it, the raw label otherwise. */
const LABEL_NOISE = /\b(CARTE|CB|PAIEMENT|PRLV|PRELEVEMENT|PREL|VIR|VIREMENT|SEPA|INST|RECU|EMIS|ACHAT|FACTURE|RETRAIT|DAB|AVOIR|REMBT?)\b/g;
const COMPANY_NOISE = /\b(SAS|SASU|SARL|SA|EURL|SNC|GMBH|LTD|LLC|INC|BV|NV|PLC|FRANCE|EUROPE|INTERNATIONAL|GROUP|GROUPE|SERVICES?|PAYMENTS?|LIMITED|IRELAND|COM|FR|EU)\b/g;

function merchantFromLabel(label) {
  let s = " " + (label || "").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + " ";
  s = s.replace(/\bCB\*?\d+\b/g, " ").replace(/\b\d{2}\/\d{2}\/\d{2,4}\b/g, " ");
  if (s.indexOf("*") >= 0) s = s.split("*").pop();
  s = s.replace(LABEL_NOISE, " ").replace(COMPANY_NOISE, " ");
  const tokens = s.split(/[^A-Z0-9&']+/).filter(t => t.length >= 2 && !/^\d+$/.test(t));
  return tokens.slice(0, 3).join(" ").trim();
}
function merchantKey(row) {
  let raw = (row.merchantRaw || "").trim();
  if (/^[\d\s.,]+$/.test(raw)) raw = "";       // some export batches slide a number into that column
  if (BANK_PARENTS.has(normalize(raw))) raw = "";  // a category, not a shop: read the label instead
  const base = raw || merchantFromLabel(row.label);
  return normalize(base).replace(/\b(sas|sarl|sa|fr|com|france|ltd|inc|bv|gmbh|limited|ireland|europe)\b/g, " ")
    .replace(/\s+/g, " ").trim();
}
function labelKey(row) {
  return normalize(merchantFromLabel(row.label))
    .replace(/\b(sas|sarl|sa|fr|com|france|ltd|inc|bv|gmbh|limited|ireland|europe)\b/g, " ")
    .replace(/\s+/g, " ").trim();
}
/* "maxicoffee nord" and "maxicoffee com" both fold into "maxicoffee" as soon as
   the shorter name exists somewhere in the data. */
function buildMerchantIndex(keys) {
  const uniq = Array.from(new Set(keys.filter(Boolean))).sort((a, b) => a.length - b.length);
  const index = {};
  for (const k of uniq) {
    let canon = k;
    for (const cand of uniq) {
      if (cand.length >= 4 && cand.length < k.length && k.startsWith(cand + " ")) { canon = index[cand] || cand; break; }
    }
    index[k] = canon;
  }
  return index;
}

/* ---------------- categorisation ---------------- */
function looksNeutral(row) {
  const s = (row.label || "").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return NEUTRAL_PATTERNS.some(re => re.test(s));
}
/* Returns { cat, status, source } — status is ST_IGNORED for internal moves. */
function categorise(row, rules, merchantIndex, legacyMap) {
  const mk = canonMerchant(row, merchantIndex);
  const lk = labelKey(row);
  const hitKey = (mk && rules[mk]) ? mk : (lk.length > 2 && !OPAQUE_MERCHANTS.has(lk) && rules[lk]) ? lk : null;
  if (hitKey) {
    const cat = rules[hitKey];
    return { cat, status: catKind(cat) === KIND_NEUTRAL ? ST_IGNORED : ST_OK, source: "rule" };
  }
  if (legacyMap && row.bankCat) {
    const hit = legacyMap[normalize(row.bankCat)];
    if (hit) return { cat: hit, status: catKind(hit) === KIND_NEUTRAL ? ST_IGNORED : ST_OK, source: "legacy" };
  }
  if (looksNeutral(row)) return { cat: "c_transfer", status: ST_IGNORED, source: "neutral" };
  const up = (row.label || "").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const hay = up + " " + (row.merchantRaw || "").toUpperCase();
  for (const [re, cat] of KEYWORDS) if (re.test(hay)) return { cat, status: ST_OK, source: "keyword" };
  return { cat: null, status: ST_OK, source: "none" };
}

/* ---------------- duplicate detection ----------------
   A bank never sends the same line twice inside one file, so duplicates can only
   appear between two imports. Each stored operation may absorb at most one
   incoming line: three identical coffees stay three coffees.                */
function cardDate(label) {
  const m = (label || "").match(/\b(\d{2})\/(\d{2})\/(\d{2,4})\b/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000;
  return y + "-" + m[2] + "-" + m[1];
}
function dupAnchor(row) { return cardDate(row.label) || row.date; }

function detectDuplicates(incoming, existing, opts) {
  const windowDays = (opts && opts.windowDays) || 5;
  const amountTol = (opts && opts.amountTol) || 0.05;
  const byCents = new Map(), byMerchant = new Map();
  existing.forEach(t => {
    if (t.status === ST_DUP) return;            // an already-flagged copy cannot absorb another
    const c = { t, taken: false, anchor: dupAnchor(t), mk: t.merchantKey || "", cents: Math.round(t.amount * 100) };
    if (!byCents.has(c.cents)) byCents.set(c.cents, []);
    byCents.get(c.cents).push(c);               // same objects in both indexes: "taken" is shared
    if (c.mk) { if (!byMerchant.has(c.mk)) byMerchant.set(c.mk, []); byMerchant.get(c.mk).push(c); }
  });
  const results = [];
  for (const row of incoming) {
    const anchor = dupAnchor(row);
    let hit = null;
    for (const c of byCents.get(Math.round(row.amount * 100)) || []) {
      if (c.taken || daysBetween(anchor, c.anchor) > windowDays) continue;
      if (row.merchantKey && c.mk && row.merchantKey !== c.mk) continue;
      hit = { cand: c, level: ST_DUP }; break;
    }
    if (!hit && row.merchantKey) {              // same shop, same week, amount adjusted after the fact
      for (const c of byMerchant.get(row.merchantKey) || []) {
        if (c.taken || daysBetween(anchor, c.anchor) > windowDays) continue;
        if (Math.sign(c.t.amount) !== Math.sign(row.amount)) continue;
        const ref = Math.max(Math.abs(c.t.amount), 0.01);
        if (Math.abs(Math.abs(c.t.amount) - Math.abs(row.amount)) / ref > amountTol) continue;
        hit = { cand: c, level: ST_DUP_MAYBE }; break;
      }
    }
    if (hit) { hit.cand.taken = true; results.push({ row, status: hit.level, twin: hit.cand.t }); }
    else results.push({ row, status: ST_OK, twin: null });
  }
  return results;
}

const DEFAULT_SETTINGS = { inflation: 1.9, band: 5, dupWindow: 5, dupTol: 5, theme: "auto", savingsGoal: 0,

function emptyDB() {

function serialize(db, scope) {

    t: db.tx.map(t => [t.date, t.label, t.merchantRaw || "", t.amount, t.cat || "", t.status, t.imp, t.bankCat || "", t.patMove || 0]),
    r: db.rules, i: db.income, g: db.goals, m: db.imports, l: db.legacyMap, f: db.fixed, s: db.settings,
    c: db.customCats || [], pr: db.patRules || {},

    pl: db.patLiabilities || [], pd: db.patDebtValues || {},

  if (!scope || scope === "all") return JSON.stringify(full);
  const out = { v: SCHEMA_VERSION, scope, s: {} };
  (scope === "pat" ? PAT_KEYS : BUDGET_KEYS).forEach(k => { out[k] = full[k]; });
  Object.keys(full.s || {}).forEach(k => {

  const liabilities = (raw.pl || []).length;

    accounts: (DB.patAccounts || []).length, movements: (DB.patMovements || []).length,

function deserialize(json) {

let DB = emptyDB();

  patMonth: monthKey(todayISO()),

/* Majority vote per merchant over everything already categorised by hand. */
function learnRulesFromHistory(minShare) {
  const votes = {};
  const vote = (k, cat) => {
    if (!k || k.length < 3 || OPAQUE_MERCHANTS.has(k) || BANK_PARENTS.has(k)) return;
    if (!/[a-z]{3}/.test(k)) return;                     // reference numbers are not merchants
    (votes[k] = votes[k] || {})[cat] = (votes[k][cat] || 0) + 1;
  };
  DB.tx.forEach(t => {
    /* a rule never points at a legacy "Divers" bucket: those exist to keep the past
       intact, not to file anything new */
    if (!t.cat || t.status === ST_DUP || (CAT_BY_ID[t.cat] && CAT_BY_ID[t.cat].legacy)) return;
    vote(canonOf(t), t.cat);
    vote(labelKey(t), t.cat);      // the label works even when the bank drops the merchant column
  });
  let added = 0;
  for (const [k, v] of Object.entries(votes)) {
    const ranked = Object.entries(v).sort((a, b) => b[1] - a[1]);
    const total = ranked.reduce((s, x) => s + x[1], 0);
    if (ranked[0][1] / total >= (minShare || 0.6)) { if (!DB.rules[k]) added++; DB.rules[k] = ranked[0][0]; }
  }
  return added;
}

/* =========================================================================
   Numbers
   ========================================================================= */
const isCounted = t => t.status === ST_OK && !!t.cat;
const isExpense = t => isCounted(t) && catKind(t.cat) === KIND_EXPENSE;
const isIncomeOp = t => isCounted(t) && catKind(t.cat) === KIND_INCOME;
const isTodo = t => t.status === ST_OK && !t.cat;

function opsOfMonth(key) { return DB.tx.filter(t => monthKey(t.date) === key); }
function manualIncome(key) { const a = DB.income[key]; return a ? (a[0] || 0) + (a[1] || 0) + (a[2] || 0) : 0; }
function statementIncome(key) { return opsOfMonth(key).filter(isIncomeOp).reduce((s, t) => s + t.amount, 0); }

/* Spending per group. Refunds (positive amounts on an expense category) lower it. */
function groupTotals(ops) {
  const out = {};
  GROUPS.forEach(g => { if (g.kind === KIND_EXPENSE) out[g.id] = 0; });
  ops.forEach(t => { if (isExpense(t)) out[catGroup(t.cat).id] -= t.amount; });
  return out;
}
function catTotals(ops) {
  const out = {};
  ops.forEach(t => { if (isExpense(t)) out[t.cat] = (out[t.cat] || 0) - t.amount; });
  return out;
}
function monthStats(key) {
  const ops = opsOfMonth(key);
  const expense = ops.filter(isExpense).reduce((s, t) => s - t.amount, 0);
  const incomeOps = ops.filter(isIncomeOp).reduce((s, t) => s + t.amount, 0);
  const income = manualIncome(key) + incomeOps;
  const todo = ops.filter(isTodo);
  return {
    key, ops, expense, income, incomeOps, balance: income - expense,
    todoCount: todo.length, todoAmount: todo.reduce((s, t) => s - Math.min(t.amount, 0), 0),
    dupCount: ops.filter(t => t.status === ST_DUP || t.status === ST_DUP_MAYBE).length,
    ignoredCount: ops.filter(t => t.status === ST_IGNORED).length,
    groups: groupTotals(ops), cats: catTotals(ops),
  };
}

/* Same month one year earlier, cut at the same day when the month is still running. */
function comparisonRows(key) {
  const prevKey = addMonth(key, -12);
  const running = key === monthKey(todayISO());
  const cutDay = running ? dayOf(todayISO()) : 31;
  const cur = opsOfMonth(key);
  const prev = opsOfMonth(prevKey).filter(t => dayOf(t.date) <= cutDay);
  const a = groupTotals(cur), b = groupTotals(prev);
  const infl = 1 + (DB.settings.inflation || 0) / 100;
  const band = (DB.settings.band || 5) / 100;
  return GROUPS.filter(g => g.kind === KIND_EXPENSE).map(g => {
    const now = a[g.id] || 0, before = b[g.id] || 0, ref = before * infl;
    const delta = now - ref;
    const pct = ref > 0 ? delta / ref * 100 : (now > 0 ? 100 : 0);
    let verdict = "flat";
    if (ref === 0 && now === 0) verdict = "none";
    else if (ref === 0) verdict = "over";
    else if (delta > ref * band) verdict = "over";
    else if (delta < -ref * band) verdict = "under";
    return { group: g, now, before, ref, delta, pct, verdict };
  }).filter(r => !(r.verdict === "none"));
}

function ytdTotals(year, cutISO) {
  const cut = cutISO || (year < yearOf(todayISO()) ? year + "-12-31" : todayISO());
  let expense = 0, income = 0;
  const groups = {}; GROUPS.forEach(g => { if (g.kind === KIND_EXPENSE) groups[g.id] = 0; });
  DB.tx.forEach(t => {
    if (yearOf(t.date) !== year || t.date > cut) return;
    if (isExpense(t)) { expense -= t.amount; groups[catGroup(t.cat).id] -= t.amount; }
    else if (isIncomeOp(t)) income += t.amount;
  });
  const cutMonth = monthKey(cut);
  for (let m = 1; m <= 12; m++) {
    const key = year + "-" + pad2(m);
    if (key <= cutMonth) income += manualIncome(key);
  }
  return { expense, income, balance: income - expense, groups };
}

/* Year-end estimate from the year-to-date average, as in the spreadsheet. */
function yearProjection(year) {
  const today = todayISO(), curYear = yearOf(today);
  const done = ytdTotals(year);
  if (year < curYear) return { ...done, projected: true, elapsed: 1, expenseYear: done.expense, incomeYear: done.income, balanceYear: done.balance, complete: true };
  if (year > curYear) return { ...done, expenseYear: 0, incomeYear: 0, balanceYear: 0, elapsed: 0, complete: false };
  const m = +today.slice(5, 7), d = dayOf(today);
  const daysInMonth = new Date(curYear, m, 0).getDate();
  const elapsed = Math.max(((m - 1) + d / daysInMonth) / 12, 0.02);
  return {
    ...done, complete: false, elapsed,
    expenseYear: done.expense / elapsed, incomeYear: done.income / elapsed,
    balanceYear: done.balance / elapsed,
    monthlyExpense: done.expense / (elapsed * 12), monthlyIncome: done.income / (elapsed * 12),

}
function yearsWithData() {
  const s = new Set(DB.tx.map(t => yearOf(t.date)));
  Object.keys(DB.income).forEach(k => s.add(+k.slice(0, 4)));
  return Array.from(s).sort();
}
function patYearsWithData() {
  const s = new Set([yearOf(todayISO())]);
  Object.values(DB.patValues || {}).forEach(v => Object.keys(v).forEach(k => s.add(+k.slice(0, 4))));
  return Array.from(s).sort();

/* -------------------------------------------------------------------------
   Base cost — what comes back on its own. A merchant qualifies when it bills
   at a steady rhythm for a steady amount over a long window; everything else
   is discretionary, however regular the habit feels. The detector proposes,
   the user decides, and the decision is stored per merchant.
   ------------------------------------------------------------------------- */
const FIXED_WINDOW = 36;                       // months of history examined
const FIXED_PERIODS = [1, 2, 3, 6, 12];
const PERIOD_NAME = { 1: "mensuelle", 2: "bimestrielle", 3: "trimestrielle", 6: "semestrielle", 12: "annuelle" };
/* Groups where regularity proves a habit, never a commitment. */
const DISCRETIONARY_GROUPS = new Set(["g_food", "g_shop", "g_leisure"]);

function median(vals) {
  if (!vals.length) return 0;
  const a = vals.slice().sort((x, y) => x - y), h = a.length >> 1;
  return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2;
}

function relSpread(vals) {

  if (!m) return 1;
  return median(vals.map(v => Math.abs(v - m))) / m;
}
function monthDiff(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }

function detectRecurring() {
  const cur = monthKey(todayISO());
  const from = addMonth(cur, -(FIXED_WINDOW - 1));
  const by = {};
  DB.tx.forEach(t => {
    const mk = monthKey(t.date);
    if (!isExpense(t) || mk < from || mk > cur) return;
    const k = canonOf(t);                       // "" for opaque merchants: skipped
    if (!k) return;
    const e = (by[k] = by[k] || { key: k, name: t.merchantRaw || merchantFromLabel(t.label) || k, cat: t.cat, ops: 0, days: [], months: {} });
    e.months[mk] = (e.months[mk] || 0) - t.amount;
    e.ops++; e.days.push(dayOf(t.date)); e.cat = t.cat;
  });
  const out = [];
  Object.values(by).forEach(e => {
    const keys = Object.keys(e.months).sort(), n = keys.length;
    if (n < 3) return;                          // no rhythm can be read from two points
    if (e.ops / n > 1.35) return;               // several bills a month: variable spending
    const amounts = keys.map(k => e.months[k]);
    const gaps = [];
    for (let i = 1; i < n; i++) gaps.push(monthDiff(keys[i - 1], keys[i]));
    /* Median gap, not span ÷ count: one missed month must not shift the rhythm,
       and a yearly charge seen three times has to read as yearly, not half-yearly. */
    const raw = median(gaps);
    const period = FIXED_PERIODS.reduce((best, p) => Math.abs(p - raw) < Math.abs(best - raw) ? p : best, 1);
    const slack = period === 1 ? 0 : 1;         // monthly must land every month
    const regular = gaps.filter(g => Math.abs(g - period) <= slack).length / gaps.length;
    /* Amount read on the recent occurrences only: a tariff raised last year is
       a fact about today's base cost, not a sign of an unstable charge. */
    const recent = amounts.slice(-Math.min(n, period === 1 ? 6 : 3));
    const amount = median(recent);
    const spread = relSpread(recent);
    if (amount <= 0) return;                    // net refunds
    const since = monthDiff(keys[n - 1], cur);
    if (since > Math.max(period * 1.6, period + 1)) return;   // stopped: no longer a charge
    /* Comfort spending can be perfectly regular — a monthly restaurant is not a
       committed charge. Steady numbers are never enough to enrol it on their own. */
    const soft = DISCRETIONARY_GROUPS.has((catGroup(e.cat) || {}).id);
    const steady = spread <= 0.12 && relSpread(amounts) <= 0.35;
    const sure = regular >= 0.7 && steady && !soft;
    const maybe = regular >= 0.5 && spread <= 0.3;
    if (!sure && !maybe) return;
    const why = sure ? "" : soft ? "dépense de confort : régulière, mais vous pouvez l\u2019arrêter demain"
      : !steady ? "montant trop variable d\u2019une fois sur l\u2019autre pour un socle"
      : "rythme irrégulier : les prélèvements ne tombent pas à intervalle fixe";
    const flag = sure ? "" : soft ? "confort" : !steady ? "variable" : "irrégulier";
    out.push({
      key: e.key, name: e.name, cat: e.cat, count: n, period, amount, spread, regular, why, flag,
      monthly: amount / period, day: Math.round(median(e.days)),
      lastMonth: keys[n - 1], firstMonth: keys[0], months: e.months,
      tier: sure ? "sure" : "maybe",
    });
  });
  return out;
}
/* Detection plus the user's own calls, which always win. */
function fixedCharges() {
  const dec = DB.fixed || {};

    r.manual = dec[r.key] != null;

/* -------------------------------------------------------------------------

function savingsRate(income, expense) {

function savingsState(rate, goal) {

}
const SAVINGS_CLASS = { ok: "pos", watch: "warn", under: "neg", none: "" };
/* Symbol + words, so the verdict never rests on colour alone. */
function savingsVerdict(rate, goal) {
  const st = savingsState(rate, goal);
  if (st === "none") return "";
  const gap = goal - rate;
  if (st === "ok") return "✓ objectif de " + fmtRate(goal) + " tenu";
  return (st === "watch" ? "● " : "▼ ") + fmtPts(gap) + " sous l\u2019objectif de " + fmtRate(goal);

function savingsRateWindow(n) {

  const keys = new Set(DB.tx.map(t => monthKey(t.date)));
  Object.keys(DB.income).forEach(k => keys.add(k));
  const list = Array.from(keys).filter(k => k < cur).sort().reverse();
  let income = 0, expense = 0, months = 0;
  for (const k of list) {
    const s = monthStats(k);
    if (s.income <= 0) continue;

const SAVINGS_STEPS = [

  { v: 20, name: "Cible", help: "cohérent avec la règle 50/30/20 des objectifs" },
  { v: 25, name: "Ambitieux", help: "constitution de patrimoine rapide" },

function suggestedSavingsGoal() {
  const w = savingsRateWindow(12);
  if (w.rate == null) return { value: 20, why: "Pas encore de mois complet avec des revenus saisis : 20 % est la cible de référence." };
  if (w.rate < 10) return { value: 10, why: "Vous êtes à " + fmtRate(w.rate) + " sur 12 mois : 10 % est la marche suivante, franchissable." };
  const held = Math.floor(w.rate / 5) * 5;

    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }
  return seen.reduce((a, b) => a + b, 0) / seen.length;
}
function suggestedGoals() {
  const income = avgIncome12();
  if (!income) return { income: 0, byId: {} };
  const byId = {};
  Object.entries(GROUP_SHARE).forEach(([gid, share]) => {
    const amount = income * share / 100;
    byId[gid] = Math.round(amount / 5) * 5;
    const subs = SUB_SHARE[gid] || {};
    Object.entries(subs).forEach(([cid, s]) => { byId[cid] = Math.round(amount * s / 100 / 5) * 5; });
  });
  return { income, byId };
}

/* Spending grouped by merchant inside one category — "which restaurants exactly". */
function merchantsOfCat(ops, catId) {
  const agg = {};
  ops.forEach(t => {
    if (!isExpense(t) || t.cat !== catId) return;
    const k = canonOf(t) || normalize(t.merchantRaw || merchantFromLabel(t.label)) || "divers";
    (agg[k] = agg[k] || { name: t.merchantRaw || merchantFromLabel(t.label) || "—", n: 0, v: 0 });
    agg[k].n++; agg[k].v -= t.amount;
  });
  return Object.values(agg).sort((a, b) => b.v - a.v);
}
function spentOn(id, ops) {
  const g = GROUP_BY_ID[id];
  return ops.reduce((s, t) => {
    if (!isExpense(t)) return s;
    return (g ? catGroup(t.cat).id === id : t.cat === id) ? s - t.amount : s;
  }, 0);
}

/* The rate is honest only if the month is closed and everything is classified. */
function rateTooltip(s, rate, running) {
  if (rate == null) return "Le taux se calcule sur les revenus : saisissez-les dans Réglages.";
  let t = "(revenus − dépenses) ÷ revenus = (" + fmtEur(s.income) + " − " + fmtEur(s.expense) + ") ÷ " + fmtEur(s.income) +
    ". Les virements vers l\u2019épargne ne sont pas des dépenses : ils restent dans la part épargnée.";
  if (running) t += " Mois en cours : le salaire est saisi en entier alors que les dépenses ne le sont pas encore, le taux paraît donc plus élevé qu\u2019il ne finira.";
  if (s.todoCount) t += " " + s.todoCount + " opération(s) sans catégorie ne sont pas comptées dans les dépenses : le taux est optimiste tant qu\u2019elles ne sont pas classées.";
  return t;
}

function goalState(spent, target, pace) {
  if (spent > target) return "over";
  if (target > 0 && pace > 0.08 && spent > target * pace * 1.15) return "watch";
  if (spent > target * 0.9) return "watch";
  return "ok";
}
function goalCard(ops, mode, pace) {
  const ids = Object.keys(DB.goals).filter(id => (DB.goals[id][mode] || 0) > 0);
  const label = mode === "m" ? "Objectifs du mois" : "Objectifs de l\u2019année";
  let html = '<div class="card"><div class="chead"><h2>' + label + "</h2><div class=\"spacer\"></div>" +
    '<button class="btn sm ghost" data-act="view" data-view="settings">Régler</button></div>';
  if (!ids.length) {
    const sg = suggestedGoals();
    return html + '<div class="empty"><b>Aucun objectif défini</b>' +
      (sg.income ? "Sur la base de " + esc(fmtEur(sg.income)) + " de revenu mensuel moyen, l\u2019application peut proposer une répartition de départ."
                 : "Saisissez d\u2019abord vos revenus : les montants proposés en dépendent.") +
      '<div style="margin-top:12px"><button class="btn ' + (sg.income ? "primary" : "") + '" data-act="' + (sg.income ? "suggest" : "view") + '" data-view="settings">' +
      (sg.income ? "Proposer des objectifs" : "Saisir mes revenus") + "</button></div></div></div>";
  }
  const cards = ids.map(id => {
    const target = DB.goals[id][mode], spent = spentOn(id, ops);
    const st = goalState(spent, target, pace || 1);
    const pct = Math.min(spent / target * 100, 100);
    const g = GROUP_BY_ID[id], c = CAT_BY_ID[id];
    const name = g ? g.name : (c ? c.name : id);
    const grp = g || (c ? GROUP_BY_ID[c.group] : null);
    const paceLeft = Math.min((pace || 1) * 100, 100);
    return '<div class="goal">' +
      '<div class="gh">' + (grp ? groupBadge(grp) : "") + '<span class="nm">' + esc(name) + "</span></div>" +
      '<div class="gv"><b class="num state-' + st + '">' + esc(fmtEur(spent)) + '</b><span class="tiny muted num">/ ' + esc(fmtEur(target)) + "</span></div>" +
      '<div class="gbar"><i class="bg-' + st + '" style="width:' + pct.toFixed(1) + '%"></i>' +
        (mode === "m" && pace < 1 ? '<span class="gpace" style="left:' + paceLeft.toFixed(1) + '%" title="rythme attendu à ce jour du mois"></span>' : "") +
      "</div>" +
      '<div class="gfoot state-' + st + '">' + (st === "over" ? "▲ dépassé de " + fmtEur(spent - target)
        : st === "watch" ? "● reste " + fmtEur(target - spent) : "✓ reste " + fmtEur(target - spent)) + "</div></div>";
  }).join("");
  return html + '<div class="goalgrid">' + cards + "</div>" +
    (mode === "m" && (pace || 1) < 1 ? '<div class="tiny muted" style="margin-top:10px">Le repère vertical marque le rythme attendu au ' + dayOf(todayISO()) + " du mois.</div>" : "") + "</div>";
}
