/* =========================================================================
   Patrimoine — comptes, valorisations mensuelles, mouvements.
   Perf = (valeur_fin − valeur_début − mouvement) / (valeur_début + mouvement),
   neutralise l'effet des dépôts/retraits sur la performance affichée.
   ========================================================================= */
/* risk : safe = capital garanti, risky = exposé aux marchés, mixed = dépend du support
   choisi (une assurance-vie peut être 100 % fonds euros comme 100 % actions), on ne
   tranche donc pas à la place de l'utilisateur.
   liquid : false quand l'argent est bloqué par la loi ou le contrat (PER jusqu'à la
   retraite, PEE cinq ans, immobilier le temps d'une vente). */
const PAT_TYPES = [
  { id: "courant", name: "Compte courant", risk: "safe",  liquid: true  },
  { id: "livret",  name: "Livret",         risk: "safe",  liquid: true  },
  { id: "pea",     name: "PEA",            risk: "risky", liquid: true  },
  { id: "av",      name: "Assurance-vie",  risk: "mixed", liquid: true  },
  { id: "per",     name: "PER",            risk: "mixed", liquid: false },
  { id: "pee",     name: "PEE",            risk: "risky", liquid: false },
  { id: "crypto",  name: "Crypto",         risk: "risky", liquid: true  },
  { id: "immo",    name: "Immobilier",     risk: "mixed", liquid: false },
  { id: "autre",   name: "Autre",          risk: "mixed", liquid: true  },
];
function patType(id) { return PAT_TYPES.find(x => x.id === id) || PAT_TYPES[PAT_TYPES.length - 1]; }
function patTypeName(id) { const t = PAT_TYPES.find(x => x.id === id); return t ? t.name : id; }
function patTypeColor(id) { return "var(--c-" + patType(id).id + ")"; }
/* Deux comptes de même classe partagent la teinte : on les sépare en tirant les suivants
   vers le fond de la carte, ce qui éclaircit en thème clair et assombrit en sombre. */
function patAccountColor(a) {
  if (!a) return "var(--c-autre)";
  const base = patTypeColor(a.type);
  const peers = (DB.patAccounts || []).filter(x => x.type === a.type);
  const i = peers.findIndex(x => x.id === a.id);
  return i <= 0 ? base : "color-mix(in oklab, " + base + " " + Math.max(40, 100 - i * 26) + "%, var(--surface))";
}
function patSwatch(a, size) {
  const s = size || 9;
  return '<i style="display:inline-block;flex:none;width:' + s + "px;height:" + s + "px;border-radius:3px;background:" +
    patAccountColor(a) + '"></i>';
}
function newPatAccountId(name) {
  let base = "pa_" + normalize(name).replace(/ /g, "_").slice(0, 22) || "pa_compte";
  let id = base, n = 2; while ((DB.patAccounts || []).some(a => a.id === id)) id = base + "_" + n++;
  return id;
}
function patAccountValue(accountId, mk) {
  const vals = (DB.patValues || {})[accountId]; if (!vals) return null;
  const keys = Object.keys(vals).filter(k => k <= mk).sort();
  return keys.length ? vals[keys[keys.length - 1]] : null;
}
function patTotalAt(mk) {
  return (DB.patAccounts || []).reduce((s, a) => s + (patAccountValue(a.id, mk) || 0), 0);
}
function patHasHistoryAt(mk) {
  return (DB.patAccounts || []).some(a => patAccountValue(a.id, mk) != null);
}
/* Un compte qui n'a jamais reçu de valorisation ne peut pas entrer dans un calcul de
   performance : ses mouvements comptent au numérateur alors qu'aucune valeur ne leur
   répond, si bien qu'un simple retrait ressort en gain. Sur des données réelles, un PEL
   vidé de 1 404 € mais jamais valorisé faisait passer janvier 2024 de +2 % à +10 %. */
function patIsValued(a) {
  return Object.keys((DB.patValues || {})[a.id] || {}).length > 0;
}
/* Un compte clôturé garde tout son historique — il a compté, et le retirer fausserait le
   passé — mais il quitte la saisie mensuelle : on ne redemande pas chaque mois la valeur
   d'un compte qui n'existe plus. Un compte jamais valorisé est traité de même : il n'a
   jamais rien eu à dire. */
function patIsClosed(a) { return !!a.closed || !patIsValued(a); }
function patActiveAccounts() { return (DB.patAccounts || []).filter(a => !patIsClosed(a)); }
/* Mouvements orphelins : à signaler à l'utilisateur, jamais à absorber dans les chiffres. */
function patOrphanMovements() {
  const rows = (DB.patAccounts || []).filter(a => !patIsValued(a))
    .map(a => ({ a, n: (DB.patMovements || []).filter(m => m.accountId === a.id).length,
                 net: patInvested(a.id) }))
    .filter(x => x.n > 0);
  return rows.length ? { rows, net: rows.reduce((s, x) => s + x.net, 0) } : null;
}
/* Comptes exclus (ex. immobilier) : gardés dans le patrimoine total mais sortis
   de la performance globale, qui n'a pas de sens sur des actifs sans valorisation régulière. */
function patPerfAccounts() {
  return (DB.patAccounts || []).filter(a => !a.perfExcluded && patIsValued(a));
}
/* Périmètre d'un mois : seuls les comptes valorisés aux deux bornes. Un compte qui reçoit sa
   première valorisation ce mois-ci partirait de zéro et afficherait un gain de 100 %. */
function patPerfScope(mk) {
  const prev = addMonth(mk, -1);
  return patPerfAccounts().filter(a =>
    patAccountValue(a.id, prev) != null && patAccountValue(a.id, mk) != null);
}
function patPerfTotalAt(mk) {
  const accs = patPerfAccounts();
  return accs.some(a => patAccountValue(a.id, mk) != null) ? accs.reduce((s, a) => s + (patAccountValue(a.id, mk) || 0), 0) : null;
}
function patMovementsInMonth(accountId, mk) {
  return (DB.patMovements || []).filter(m => monthKey(m.date) === mk && (!accountId || m.accountId === accountId))
    .reduce((s, m) => s + m.amount, 0);
}
function patMovementsInYear(accountId, year) {
  return (DB.patMovements || []).filter(m => yearOf(m.date) === year && (!accountId || m.accountId === accountId))
    .reduce((s, m) => s + m.amount, 0);
}
function patPerfMovements(period, isYear) {
  const ids = new Set(patPerfAccounts().map(a => a.id));
  return (DB.patMovements || []).filter(m => (isYear ? yearOf(m.date) === period : monthKey(m.date) === period) && ids.has(m.accountId))
    .reduce((s, m) => s + m.amount, 0);
}
function patPerf(valFin, valDebut, mouvement) {
  if (valFin == null || valDebut == null) return null;
  const denom = valDebut + mouvement;
  return denom ? (valFin - valDebut - mouvement) / denom * 100 : null;
}
/* Performance d'un périmètre donné entre deux bornes : valeurs et mouvements portent sur
   exactement les mêmes comptes, faute de quoi le résultat n'a pas de sens. */
function patScopedPerf(scope, fromKey, toKey) {
  if (!scope.length) return null;
  const ids = new Set(scope.map(a => a.id));
  const valDebut = scope.reduce((s, a) => s + (patAccountValue(a.id, fromKey) || 0), 0);
  const valFin = scope.reduce((s, a) => s + (patAccountValue(a.id, toKey) || 0), 0);
  const mouvement = (DB.patMovements || []).filter(m => {
    const k = monthKey(m.date);
    return k > fromKey && k <= toKey && ids.has(m.accountId);
  }).reduce((s, m) => s + m.amount, 0);
  return patPerf(valFin, valDebut, mouvement);
}
function patMonthlyPerf(accountId, mk) {
  const prevM = addMonth(mk, -1);
  if (accountId) {
    return patPerf(patAccountValue(accountId, mk), patAccountValue(accountId, prevM),
      patMovementsInMonth(accountId, mk));
  }
  return patScopedPerf(patPerfScope(mk), prevM, mk);
}
function patAnnualPerf(accountId, year) {
  const endKey = year + "-12", prevEndKey = (year - 1) + "-12";
  if (accountId) {
    return patPerf(patAccountValue(accountId, endKey), patAccountValue(accountId, prevEndKey),
      patMovementsInYear(accountId, year));
  }
  /* Même exigence sur l'année : un compte ouvert en cours d'année n'y entre pas. */
  const scope = patPerfAccounts().filter(a =>
    patAccountValue(a.id, prevEndKey) != null && patAccountValue(a.id, endKey) != null);
  return patScopedPerf(scope, prevEndKey, endKey);
}

/* Le même écart, mais en euros. Un pourcentage ne dit pas ce qu'il pèse : +3 % sur le PER
   et +3 % sur le PEA, ce n'est pas la même journée. Même périmètre que la version en
   pourcentage, pour que les deux affichages racontent bien la même chose. */
function patScopedGain(scope, fromKey, toKey) {
  if (!scope.length) return null;
  const ids = new Set(scope.map(a => a.id));
  const v0 = scope.reduce((s, a) => s + (patAccountValue(a.id, fromKey) || 0), 0);
  const v1 = scope.reduce((s, a) => s + (patAccountValue(a.id, toKey) || 0), 0);
  const mv = (DB.patMovements || []).filter(m => {
    const k = monthKey(m.date);
    return k > fromKey && k <= toKey && ids.has(m.accountId);
  }).reduce((s, m) => s + m.amount, 0);
  return v1 - v0 - mv;
}
function patMonthlyGain(accountId, mk) {
  const prevM = addMonth(mk, -1);
  if (accountId) {
    const v1 = patAccountValue(accountId, mk), v0 = patAccountValue(accountId, prevM);
    return v1 == null || v0 == null ? null : v1 - v0 - patMovementsInMonth(accountId, mk);
  }
  return patScopedGain(patPerfScope(mk), prevM, mk);
}
function patAnnualGain(accountId, year) {
  const endKey = year + "-12", prevEndKey = (year - 1) + "-12";
  if (accountId) {
    const v1 = patAccountValue(accountId, endKey), v0 = patAccountValue(accountId, prevEndKey);
    return v1 == null || v0 == null ? null : v1 - v0 - patMovementsInYear(accountId, year);
  }
  return patScopedGain(patPerfAccounts().filter(a =>
    patAccountValue(a.id, prevEndKey) != null && patAccountValue(a.id, endKey) != null), prevEndKey, endKey);
}

/* =========================================================================
   Effort / marché, plus-value, TWR, allocation, projection, passifs.
   ========================================================================= */

/* Toute variation de patrimoine a deux causes, et deux seulement : ce qui a été versé,
   et ce que les placements ont rendu. Les confondre fait passer un virement pour une
   performance. fromMk = null signifie « depuis l'origine » : tout est alors versement. */
function patSplit(fromMk, toMk, accountId) {
  const v0 = fromMk ? (accountId ? patAccountValue(accountId, fromMk) || 0 : patTotalAt(fromMk)) : 0;
  const v1 = accountId ? patAccountValue(accountId, toMk) || 0 : patTotalAt(toMk);
  /* Les mouvements d'un compte jamais valorisé sont écartés : sans valeur en face, ils
     basculeraient intégralement dans la performance résiduelle. */
  const versements = (DB.patMovements || []).filter(m => {
    const k = monthKey(m.date);
    if (k <= (fromMk || "") && fromMk) return false;
    if (k > toMk) return false;
    if (accountId) return m.accountId === accountId;
    const a = (DB.patAccounts || []).find(x => x.id === m.accountId);
    return a ? patIsValued(a) : false;
  }).reduce((s, m) => s + m.amount, 0);
  const perf = v1 - v0 - versements;
  return { v0, v1, delta: v1 - v0, versements, perf,
    rate: (v0 + versements) ? perf / (v0 + versements) * 100 : null };
}

/* Certaines enveloppes sont alimentées sur la fiche de paie : l'argent d'un PEE ou d'un PER
   d'entreprise ne transite jamais par le compte bancaire, donc jamais par le budget. Le
   confronter à la balance du budget n'aurait aucun sens. Par défaut on le déduit du type,
   mais un PER alimenté par virement volontaire, lui, sort bien du budget : la valeur reste
   modifiable compte par compte. L'absence du champ vaut « défaut selon le type », ce qui
   évite toute migration des données existantes. */
function patIsOffBudget(a) {
  if (!a) return false;
  const t = patType(a.type).id;
  return a.offBudget == null ? (t === "pee" || t === "per") : !!a.offBudget;
}
/* Ce qui a été versé sur une année civile, même périmètre que le reste : un compte jamais
   valorisé n'a pas de versements exploitables. budgetOnly écarte en plus les enveloppes
   alimentées hors budget. */
function patContributionsOfYear(year, budgetOnly) {
  return (DB.patMovements || []).filter(m => {
    if (yearOf(m.date) !== year) return false;
    const a = (DB.patAccounts || []).find(x => x.id === m.accountId);
    if (!a || !patIsValued(a)) return false;
    return budgetOnly ? !patIsOffBudget(a) : true;
  }).reduce((s, m) => s + m.amount, 0);
}
/* Le pont entre les deux moitiés : ce que le budget a dégagé face à ce qui est réellement
   parti au patrimoine. L'écart n'est pas une erreur, c'est une information — de l'argent
   resté sur le compte courant, ou des mouvements qui ne viennent pas du budget de l'année.
   On compare des montants réalisés, jamais la projection de fin d'année. */
function patSavingsEffort(year) {
  const b = ytdTotals(year);
  /* Seuls les versements qui sortent effectivement du compte bancaire se comparent à la
     balance : le reste vient de la fiche de paie et n'a jamais été un arbitrage de budget. */
  const versements = patContributionsOfYear(year, true);
  const offBudget = patContributionsOfYear(year, false) - versements;
  const hasBudget = b.income > 0;
  return {
    year, versements, offBudget, hasBudget,
    balance: hasBudget ? b.balance : null,
    income: b.income, expense: b.expense,
    /* Au-delà de 100 %, on a placé plus que le budget n'a dégagé cette année-là. */
    placed: hasBudget && b.balance > 0 ? versements / b.balance * 100 : null,
    gap: hasBudget ? versements - b.balance : null,
  };
}
/* Versé cumulé contre valeur du jour. Le chiffre que l'on cherche vraiment : « est-ce que
   ce compte m'a rapporté quelque chose depuis que je l'ai ouvert ». */
function patInvested(accountId, upToMk) {
  return (DB.patMovements || []).filter(m => {
    if (upToMk && monthKey(m.date) > upToMk) return false;
    if (accountId) return m.accountId === accountId;
    /* Cumul global : même périmètre que la valeur, sinon la plus-value totale ne
       correspondrait pas à la somme des lignes affichées. */
    const a = (DB.patAccounts || []).find(x => x.id === m.accountId);
    return a ? patIsValued(a) : false;
  }).reduce((s, m) => s + m.amount, 0);
}
function patUnrealized(accountId, mk) {
  const value = accountId ? patAccountValue(accountId, mk) : patTotalAt(mk);
  const invested = patInvested(accountId, mk);
  if (value == null || invested <= 0) return null;
  return { value, invested, gain: value - invested, rate: (value - invested) / invested * 100 };
}
/* La plus-value suppose que les mouvements remontent à l'ouverture du compte. Si la
   première valorisation précède le premier versement connu, l'apport initial manque et
   le gain affiché serait surévalué : on le signale plutôt que de le taire. */
function patInvestedIsComplete(accountId) {
  const firstVal = Object.keys((DB.patValues || {})[accountId] || {}).sort()[0];
  if (!firstVal) return true;
  const movs = (DB.patMovements || []).filter(m => m.accountId === accountId).map(m => monthKey(m.date)).sort();
  return movs.length > 0 && movs[0] <= firstVal;
}

/* -------------------------------------------------------------------------
   Fiscalité — ce que l'impôt prendrait sur la plus-value latente.

   Une plus-value affichée est brute. Un PEA à +6 300 € et un livret A à +200 € se
   lisent de la même façon dans le tableau du dessus, alors que le premier laisserait
   18,6 % au fisc le jour du retrait et le second rien : « 46 300 € de patrimoine »
   n'est pas 46 300 € disponibles, et c'est le genre d'écart qu'on découvre au pire
   moment. D'où un chiffrage par enveloppe, aux taux en vigueur.

   Rien n'est prélevé sur un gain latent : tout ce qui suit répond à « si je retirais
   tout aujourd'hui », pas à « ce que je dois ».
   ------------------------------------------------------------------------- */
/* Les prélèvements sociaux ne sont plus à un taux unique, et c'est le piège de 2026 :
   la CSG sur les revenus de placement est passée de 9,2 % à 10,6 %, portant le total à
   18,6 % — le PFU vaut donc 31,4 % et non plus 30 %. Le taux de 17,2 % reste celui de
   l'assurance-vie, du PEL, du CEL, du PEP et des plus-values immobilières. Deux
   constantes, donc, faute de quoi toute l'assurance-vie serait surtaxée de 1,4 point.
   Vérifié sur service-public.gouv.fr, fiche F2329. */
const PS_PLACEMENT = 18.6;   // CSG 10,6 + CRDS 0,5 + prélèvement de solidarité 7,5
const PS_AV_IMMO   = 17.2;   // CSG 9,2 + CRDS 0,5 + prélèvement de solidarité 7,5
const IR_PFU       = 12.8;   // impôt sur le revenu, taux forfaitaire de droit commun

/* Un régime répond à une seule question : sur un gain, quelle part d'impôt sur le revenu
   et quelle part de prélèvements sociaux. `rate` reçoit l'ancienneté en années parce que
   trois enveloppes sur huit en dépendent — c'est le seul paramètre qui change un taux.
   `why` est la phrase montrée en infobulle : un taux sans son motif ne se vérifie pas. */
const TAX_REGIMES = [
  { id: "exempt", name: "Exonéré (livret réglementé)",
    rate: () => ({ ir: 0, ps: 0, why: "Livret A, LDDS, LEP : ni impôt sur le revenu ni prélèvements sociaux." }) },
  { id: "pfu", name: "Flat tax (PFU)",
    rate: () => ({ ir: IR_PFU, ps: PS_PLACEMENT,
      why: "Flat tax : 12,8 % d’impôt sur le revenu et 18,6 % de prélèvements sociaux." }) },
  /* Le seuil du PEA est celui du plan, pas du versement : cinq ans après l'ouverture,
     tout le gain accumulé sort sans impôt sur le revenu. */
  { id: "pea", name: "PEA", ages: true,
    rate: age => age != null && age >= 5
      ? { ir: 0, ps: PS_PLACEMENT, why: "PEA de plus de 5 ans : gain exonéré d’impôt sur le revenu, prélèvements sociaux dus." }
      : { ir: IR_PFU, ps: PS_PLACEMENT, why: "PEA de moins de 5 ans : la flat tax s’applique encore au gain accumulé." } },
  /* 7,5 % vaut pour les intérêts des primes n'excédant pas 150 000 €, tous contrats
     confondus. Au-delà on repasse à 12,8 %, mais le plafond se compte sur le foyer et
     non sur le compte : le chiffrer ici demanderait ce que l'application ne sait pas. */
  { id: "av", name: "Assurance-vie", ages: true,
    rate: age => age != null && age >= 8
      ? { ir: 7.5, ps: PS_AV_IMMO, why: "Contrat de plus de 8 ans : 7,5 % jusqu’à 150 000 € de primes versées, plus 17,2 % de prélèvements sociaux." }
      : { ir: IR_PFU, ps: PS_AV_IMMO, why: "Contrat de moins de 8 ans : 12,8 % d’impôt sur le revenu et 17,2 % de prélèvements sociaux." } },
  { id: "pee", name: "PEE / épargne salariale",
    rate: () => ({ ir: 0, ps: PS_PLACEMENT,
      why: "Sommes retirées exonérées d’impôt sur le revenu ; les prélèvements sociaux ne portent que sur les gains du plan." }) },
  /* Un PER déduit à l'entrée se paie à la sortie : les gains à la flat tax, mais aussi le
     capital versé, imposé au barème. Cette seconde moitié dépend de la tranche marginale,
     qu'on ne connaît pas — on ne la chiffre pas, on la signale. */
  { id: "per", name: "PER (sortie en capital)", warnCapital: true,
    rate: () => ({ ir: IR_PFU, ps: PS_PLACEMENT,
      why: "Sortie en capital : les gains à la flat tax. Les versements déduits à l’entrée s’ajoutent au revenu imposable, hors de ce calcul." }) },
  { id: "immo", name: "Immobilier locatif", ages: true, abatDuree: true,
    rate: () => ({ ir: 19, ps: PS_AV_IMMO,
      why: "Plus-value immobilière : 19 % d’impôt sur le revenu et 17,2 % de prélèvements sociaux, avant abattement pour durée de détention." }) },
  { id: "rp", name: "Résidence principale",
    rate: () => ({ ir: 0, ps: 0, why: "La vente de la résidence principale est totalement exonérée de plus-value." }) },
];
function taxRegime(id) { return TAX_REGIMES.find(r => r.id === id) || TAX_REGIMES[1]; }
/* Le défaut se lit sur la classe du compte, qui est déjà saisie. Restent deux ambiguïtés
   que la classe ne tranche pas — un « Livret » peut être réglementé donc exonéré, ou un
   livret bancaire à 31,4 % ; un bien immobilier peut être la résidence principale, donc
   exonérée, ou du locatif. C'est ce que le menu Fiscalité permet de corriger. */
const TAX_BY_TYPE = { courant: "exempt", livret: "exempt", pea: "pea", av: "av",
  per: "per", pee: "pee", crypto: "pfu", immo: "immo", autre: "pfu" };
function patTaxRegime(a) {
  if (!a) return "pfu";
  return a.taxRegime == null ? (TAX_BY_TYPE[patType(a.type).id] || "pfu") : a.taxRegime;
}
/* Trois taux dépendent d'une date d'ouverture qui n'a jamais été demandée. À défaut, la
   plus ancienne trace connue du compte en tient lieu — mais ce n'est qu'un plancher : un
   PEA de 2015 dont l'historique commence en 2024 passerait pour un plan de deux ans, et
   serait surtaxé. D'où `exact`, qui dit s'il faut réclamer la vraie date. */
function patOpenedMonth(a) {
  if (a && /^\d{4}-\d{2}$/.test(a.opened || "")) return { mk: a.opened, exact: true };
  const known = Object.keys((DB.patValues || {})[a.id] || {})
    .concat((DB.patMovements || []).filter(m => m.accountId === a.id).map(m => monthKey(m.date))).sort();
  return known.length ? { mk: known[0], exact: false } : { mk: null, exact: false };
}
/* Abattement pour durée de détention sur une plus-value immobilière. Contrairement aux
   4 600 € de l'assurance-vie, il ne dépend que de la durée — donc de rien que l'application
   ne sache déjà — et il est énorme : à 21 ans de détention, 96 % de l'impôt sur le revenu
   a disparu. L'ignorer aurait affiché 36,2 % sur un bien qui n'en paiera que 6. Il est donc
   déduit, et non renvoyé aux notes. Deux calendriers distincts, l'impôt sur le revenu
   s'éteignant à 22 ans et les prélèvements sociaux seulement à 30 (fiche F10864). */
function immoAbat(age) {
  if (age == null) return { ir: 0, ps: 0 };
  const y = Math.floor(age);                       // années révolues, l'abattement n'étant pas prorata
  if (y < 6) return { ir: 0, ps: 0 };
  if (y >= 30) return { ir: 100, ps: 100 };
  const pleines = Math.min(y, 21) - 5;             // 6ᵉ à 21ᵉ année : 6 % et 1,65 % par an
  let ir = pleines * 6, ps = pleines * 1.65;
  if (y >= 22) { ir = 100; ps += 1.6; }            // 22ᵉ année révolue : 4 % et 1,6 %
  if (y >= 23) ps += Math.min(y - 22, 8) * 9;      // puis 9 % par an jusqu'à extinction
  return { ir: Math.min(100, ir), ps: Math.min(100, ps) };
}
/* Le taux effectif d'un gain, séparé de tout compte : c'est ce qui permet de rejouer le
   même calcul à une autre ancienneté que celle du jour, et donc de chiffrer l'attente. */
function taxOn(gain, reg, age) {
  const r = reg.rate(age);
  const ab = reg.abatDuree ? immoAbat(age) : { ir: 0, ps: 0 };
  const ir = r.ir * (1 - ab.ir / 100), ps = r.ps * (1 - ab.ps / 100);
  const rate = ir + ps;
  return { ir, ps, rate, tax: gain * rate / 100, abat: ab, why: r.why };
}
/* Une moins-value ne doit rien — elle ouvre même un report déficitaire, qu'on ne suit pas
   ici. On renvoie donc null plutôt qu'un impôt négatif, qui viendrait gonfler le net. */
function patTax(a, mk) {
  const u = patUnrealized(a.id, mk);
  if (!u || u.gain <= 0) return null;
  const reg = taxRegime(patTaxRegime(a));
  const open = patOpenedMonth(a);
  const age = open.mk ? monthDiff(open.mk, mk) / 12 : null;
  const r = taxOn(u.gain, reg, age);
  const rate = r.rate, tax = r.tax;
  return { gain: u.gain, value: u.value, ir: r.ir, ps: r.ps, rate, tax, net: u.value - tax,
    abat: r.abat, why: r.why, regime: reg, opened: open.mk, exact: open.exact, age,
    /* Un taux qui dépend de l'ancienneté et une ancienneté seulement devinée : le chiffre
       reste affiché, mais marqué, sinon il passerait pour établi. */
    approx: !!reg.ages && !open.exact };
}

/* Les paliers d'ancienneté qui allègent l'impôt, compte par compte. Un PEA de quatre ans
   et demi coûte 31,4 % aujourd'hui et 18,6 % dans six mois : le chiffre du jour ne dit pas
   qu'il suffit d'attendre, et c'est pourtant la seule décision que l'écran peut éclairer.
   Le gain est figé à sa valeur du jour — pas de rendement supposé : on isole l'effet fiscal,
   sinon on ne saurait plus ce qui vient du marché et ce qui vient du calendrier. */
const TAX_MARKS = { pea: [5], av: [8], immo: [6, 10, 15, 21, 22, 25, 30] };
function patTaxWait(a, mk) {
  const t = patTax(a, mk);
  if (!t || !t.regime.ages || !t.opened) return null;
  const steps = [];
  let ref = t.tax;
  for (const y of TAX_MARKS[t.regime.id] || []) {
    const when = addMonth(t.opened, y * 12);
    if (when <= mk) continue;                       // palier déjà franchi, il est dans le taux du jour
    const f = taxOn(t.gain, t.regime, y);
    if (f.tax >= ref - 0.005) continue;             // un palier qui n'allège rien n'a rien à dire
    ref = f.tax;
    steps.push({ years: y, when, months: monthDiff(mk, when), ir: f.ir, ps: f.ps, rate: f.rate,
      tax: f.tax, abat: f.abat, saved: t.tax - f.tax, net: t.value - f.tax });
  }
  return steps.length ? { now: t, steps } : null;
}

/* Performances mensuelles enchaînées. C'est la mesure comparable à un indice : elle ne
   dépend ni de la taille ni de la date des versements, contrairement au taux d'un seul
   intervalle, qu'un gros apport en cours d'année suffit à fausser. */
function patTWR(fromMk, toMk) {
  let chain = 1, n = 0;
  for (let mk = addMonth(fromMk, 1); mk <= toMk && n < 1200; mk = addMonth(mk, 1)) {
    const r = patMonthlyPerf(null, mk);
    if (r == null) continue;
    chain *= 1 + r / 100; n++;
  }
  if (!n || chain <= 0) return null;
  return { months: n, cumul: (chain - 1) * 100, annualized: (Math.pow(chain, 12 / n) - 1) * 100 };
}
/* Ce qui reste une fois l'inflation retirée : un patrimoine qui gagne 2 % quand les prix
   montent de 1,9 % n'a presque pas progressé. Réutilise le réglage du côté Budget. */
function patRealRate(nominalAnnual) {
  if (nominalAnnual == null) return null;
  const inf = Number(DB.settings.inflation) || 0;
  return ((1 + nominalAnnual / 100) / (1 + inf / 100) - 1) * 100;
}

/* La répartition qui compte n'est pas « par compte » mais par nature d'actif : deux
   lignes du même type portent le même risque, quel que soit l'établissement. */
function patAllocByType(mk) {
  const byType = {};
  (DB.patAccounts || []).forEach(a => {
    const v = patAccountValue(a.id, mk) || 0;
    if (v <= 0) return;
    const id = patType(a.type).id;
    if (!byType[id]) byType[id] = { type: id, value: 0, accounts: [] };
    byType[id].value += v;
    byType[id].accounts.push({ a, v });
  });
  const rows = Object.values(byType);
  const total = rows.reduce((s, x) => s + x.value, 0) || 1;
  rows.forEach(x => { x.pct = x.value / total * 100; x.accounts.sort((p, q) => q.v - p.v); });
  return rows.sort((x, y) => y.value - x.value);
}
/* Les répartitions risqué/sécurisé et liquide/bloqué ont été retirées de l'écran : sans
   allocation cible à confronter, ces pourcentages n'appelaient aucune décision. Les
   métadonnées risk/liquid de PAT_TYPES restent utilisées par l'épargne de précaution, et
   suffiraient à les reconstruire le jour où une allocation cible existera.

   Une ligne qui pèse la moitié du patrimoine, en revanche, est un risque en soi,
   indépendamment de sa qualité : cela reste la première chose qu'un suivi doit montrer. */
function patConcentration(mk) {
  const rows = (DB.patAccounts || []).map(a => ({ a, v: patAccountValue(a.id, mk) || 0 }))
    .filter(x => x.v > 0).sort((x, y) => y.v - x.v);
  if (!rows.length) return null;
  const total = rows.reduce((s, x) => s + x.v, 0);
  return { top: rows[0], pct: total ? rows[0].v / total * 100 : 0, count: rows.length };
}

/* Records mesurés sur le patrimoine net, celui que le bandeau affiche : annoncer un plus
   haut calculé sur les actifs bruts à côté d'un net négatif n'aurait aucun sens. */
function patATH(upToMk) {
  let best = null;
  allPatMonths(upToMk).forEach(mk => {
    const t = patNetAt(mk);
    if (!best || t > best.total) best = { mk, total: t };
  });
  return best;
}
function patRiseStreak(mk) {
  const months = allPatMonths(mk);
  let n = 0;
  for (let i = months.length - 1; i > 0; i--) {
    if (patNetAt(months[i]) > patNetAt(months[i - 1])) n++; else break;
  }
  return n;
}

/* Hypothèses de projection, déduites de l'historique tant que l'utilisateur n'a rien fixé :
   rendement annualisé observé et versement moyen des douze derniers mois. C'est une
   extrapolation du passé récent, pas une prévision — l'écran doit le dire en toutes lettres. */
function patAssumptions(mk) {
  const s = DB.settings;
  let rate = s.patReturn;
  if (rate == null) {
    const months = allPatMonths(mk);
    const twr = months.length > 1 ? patTWR(months[0], mk) : null;
    rate = twr ? twr.annualized : 0;
  }
  let contrib = s.patContribution;
  if (contrib == null) {
    const from = addMonth(mk, -12);
    contrib = (DB.patMovements || []).filter(m => {
      const k = monthKey(m.date); return k > from && k <= mk;
    }).reduce((x, m) => x + m.amount, 0) / 12;
  }
  return { rate: Number(rate) || 0, contrib: Number(contrib) || 0,
    autoRate: s.patReturn == null, autoContrib: s.patContribution == null };
}
/* Nombre de mois pour passer de current à target, en capitalisant chaque mois puis en
   ajoutant le versement. null quand la cible est hors de portée des hypothèses. */
function patMonthsToTarget(current, target, annualRate, monthly) {
  if (target <= current) return 0;
  const r = Math.pow(1 + Math.max(annualRate, -99) / 100, 1 / 12) - 1;
  if (monthly <= 0 && (r <= 0 || current <= 0)) return null;
  let v = current, n = 0;
  while (v < target && n < 720) { v = v * (1 + r) + monthly; n++; }
  return n >= 720 ? null : n;
}
function patNextMilestone(total) {
  if (DB.settings.patTarget > 0) return DB.settings.patTarget;
  const step = total < 100000 ? 10000 : total < 500000 ? 50000 : 100000;
  return Math.floor(total / step) * step + step;
}

/* ---- Passifs ------------------------------------------------------------
   Un crédit se suit de deux façons : en laissant l'app dérouler le tableau
   d'amortissement à partir du capital, du taux et de la durée, ou en recopiant le capital
   restant dû de l'échéancier de la banque. share couvre un bien détenu à plusieurs. */
function patMonthsBetween(a, b) {
  const [ya, ma] = a.split("-").map(Number), [yb, mb] = b.split("-").map(Number);
  return (yb - ya) * 12 + (mb - ma);
}
function patAmortBalance(l, mk) {
  if (!l.principal || !l.months || !l.start) return 0;
  const n = patMonthsBetween(l.start, mk);
  if (n <= 0) return l.principal;
  if (n >= l.months) return 0;
  const r = (Number(l.rate) || 0) / 100 / 12;
  if (!r) return l.principal * (1 - n / l.months);
  /* Capital restant dû après n échéances d'un prêt à mensualité constante. */
  return l.principal * (Math.pow(1 + r, l.months) - Math.pow(1 + r, n)) / (Math.pow(1 + r, l.months) - 1);
}
function patDebtAt(liabilityId, mk) {
  const l = (DB.patLiabilities || []).find(x => x.id === liabilityId);
  if (!l) return 0;
  const share = (l.share == null ? 100 : Number(l.share)) / 100;
  if (l.mode === "manual") {
    const vals = (DB.patDebtValues || {})[liabilityId] || {};
    const keys = Object.keys(vals).filter(k => k <= mk).sort();
    return keys.length ? vals[keys[keys.length - 1]] * share : 0;
  }
  return patAmortBalance(l, mk) * share;
}
function patDebtTotalAt(mk) {
  return (DB.patLiabilities || []).reduce((s, l) => s + patDebtAt(l.id, mk), 0);
}
function patNetAt(mk) { return patTotalAt(mk) - patDebtTotalAt(mk); }
function patHasDebt() { return (DB.patLiabilities || []).length > 0; }
function newPatLiabilityId(name) {
  let base = "pl_" + normalize(name).replace(/ /g, "_").slice(0, 22) || "pl_credit";
  let id = base, n = 2; while ((DB.patLiabilities || []).some(l => l.id === id)) id = base + "_" + n++;
  return id;
}

/* ---- Épargne de précaution ---------------------------------------------
   Ce qui est mobilisable tout de suite, rapporté aux dépenses mensuelles réelles calculées
   côté Budget. Se mesure en mois couverts, jamais en euros : 10 000 € ne veulent rien dire
   tant qu'on ne sait pas ce qu'ils tiennent. */
function patSafeLiquid(mk) {
  return (DB.patAccounts || []).reduce((s, a) => {
    const t = patType(a.type);
    return s + (t.risk === "safe" && t.liquid ? (patAccountValue(a.id, mk) || 0) : 0);
  }, 0);
}
function avgMonthlyExpense(n) {
  const cur = monthKey(todayISO());
  const keys = Array.from(new Set(DB.tx.map(t => monthKey(t.date)))).filter(k => k < cur).sort().reverse();
  let sum = 0, months = 0;
  for (const k of keys) {
    const s = monthStats(k);
    if (s.expense <= 0) continue;
    sum += s.expense; months++;
    if (months >= n) break;
  }
  return months ? { avg: sum / months, months } : null;
}
function patSafetyMonths(mk) {
  const e = avgMonthlyExpense(12);
  if (!e || !e.avg) return null;
  const liquid = patSafeLiquid(mk);
  return { liquid, avg: e.avg, months: liquid / e.avg, basis: e.months };
}

/* =========================================================================
   Import CSV — reprise de l'historique Excel (Data-Comptes / Data-Mouvements)
   ========================================================================= */
let PATIMP = null;
/* Le mois est écrit dans la langue du tableur qui a exporté : "1 janv 2023" en Excel FR,
   "1 Jan 2023" en Excel/Sheets EN. Il faut donc les deux — oct/nov/dec sont les seuls mois
   qui s'écrivent pareil, et ne reconnaître que le français perdait silencieusement les neuf
   autres. Chaque entrée liste les préfixes acceptés pour un mois, dans l'ordre janvier→décembre. */
const MONTH_ABBR = [
  ["janv", "jan"], ["fevr", "feb"], ["mars", "mar"], ["avr", "apr"], ["mai", "may"], ["juin", "jun"],
  ["juil", "jul"], ["aout", "aug"], ["sept", "sep"], ["oct"], ["nov"], ["dec"],
];
/* Un seul jour est saisi par mois dans le tableur, donc on ne garde que le mois. */
function parseCompteMonth(raw) {
  const parts = normalize(raw).split(" ").filter(Boolean);
  const year = parts.find(p => /^\d{4}$/.test(p));
  if (!year) return null;
  const idx = MONTH_ABBR.findIndex(aliases => aliases.some(a => parts.some(p => p.startsWith(a))));
  return idx < 0 ? null : year + "-" + pad2(idx + 1);
}
function guessPatType(name) {
  const n = normalize(name);
  if (n.includes("courant")) return "courant";
  if (n.includes("livret") || n.includes("lld") || n.includes("pel")) return "livret";
  if (n.includes(" av ") || n.startsWith("av") || n.includes("assurance")) return "av";
  if (n.includes("pea")) return "pea";
  if (n.includes("per")) return "per";
  if (n.includes("pee")) return "pee";
  if (n.includes("crypto") || n.includes("bitcoin") || n.includes("btc") || n.includes("ether")) return "crypto";
  if (n.includes("immo")) return "immo";
  return "autre";
}
/* Le tableur exporte en « ; » (Excel FR) ou en « , » (Excel US, Google Sheets, LibreOffice)
   selon la machine. Plutôt que de deviner sur la première ligne — qui n'est pas toujours
   l'en-tête dans ces exports — on essaie chaque délimiteur et on garde celui qui retrouve la
   ligne « Date » : un mauvais délimiteur laisse la ligne entière dans une seule cellule et se
   disqualifie tout seul. À égalité, le plus grand nombre de colonnes gagne. */
function parsePatCSV(text) {
  let best = { rows: [], hIdx: -1, cols: 0 };
  for (const sep of [";", ",", "\t"]) {
    const rows = parseCSV(text, sep);
    const hIdx = rows.findIndex(r => normalize(r[0]) === "date" && r.length > 1);
    if (hIdx >= 0 && rows[hIdx].length > best.cols) best = { rows, hIdx, cols: rows[hIdx].length };
  }
  return best;
}
const SEP_HINT = " (colonnes séparées par « ; » ou « , »)";
/* Tableau large : une ligne par mois, une colonne par compte. Les colonnes après le
   dernier compte réel ("Colonne5"…, "Total"…) sont des calculs du tableur, pas des comptes. */
function parsePatComptesCSV(text) {
  const { rows, hIdx } = parsePatCSV(text);
  if (hIdx < 0) return { error: "Colonne « Date » introuvable dans Data-Comptes" + SEP_HINT + "." };
  const header = rows[hIdx], accCols = [];
  for (let i = 1; i < header.length; i++) {
    const h = (header[i] || "").trim();
    if (!h) continue;
    const n = normalize(h);
    if (n.startsWith("colonne") || n.startsWith("total")) break;
    accCols.push({ idx: i, name: h });
  }
  if (!accCols.length) return { error: "Aucune colonne de compte trouvée dans Data-Comptes." };
  const values = {}, datesSkipped = [];
  accCols.forEach(a => (values[a.name] = {}));
  for (let r = hIdx + 1; r < rows.length; r++) {
    const raw = (rows[r][0] || "").trim();
    /* Les dernières lignes du tableur ne portent plus de date, juste des totaux calculés :
       on les passe. Une date présente mais illisible, en revanche, est une valorisation
       perdue — on la remonte à l'utilisateur au lieu de la laisser disparaître. */
    if (!raw) continue;
    const mkRaw = parseCompteMonth(raw);
    if (!mkRaw) { datesSkipped.push(raw); continue; }
    /* La ligne "1 janv 2023" est l'état des comptes AU 1er janvier, donc la valorisation
       de clôture de décembre 2022 — même convention que les valeurs saisies dans l'app
       (patAccountValue traite une clé "YYYY-MM" comme la valeur de FIN de ce mois-là). */
    const mk = addMonth(mkRaw, -1);
    accCols.forEach(a => {
      const v = parseAmount(rows[r][a.idx]);
      if (v != null) values[a.name][mk] = v;
    });
  }
  return { accounts: accCols.map(a => a.name), values, datesSkipped, error: null };
}
function parsePatMouvementsCSV(text) {
  const { rows, hIdx } = parsePatCSV(text);
  if (hIdx < 0) return { error: "Colonne « Date » introuvable dans Data-Mouvements" + SEP_HINT + "." };
  const norm = rows[hIdx].map(normalize);
  const ci = { date: norm.indexOf("date"), compte: norm.indexOf("compte"), montant: norm.findIndex(h => h.startsWith("montant")) };
  if (ci.date < 0 || ci.compte < 0 || ci.montant < 0)
    return { error: "Colonnes Date/Compte/Montant introuvables dans Data-Mouvements" + SEP_HINT + "." };
  const movements = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const date = parseDate(row[ci.date]), compte = (row[ci.compte] || "").trim(), amount = parseAmount(row[ci.montant]);
    if (!date || !compte || amount == null) continue;
    movements.push({ compte, date, amount });
  }
  return { movements, error: null };
}
function importPatrimoineCsv(comptesText, mouvementsText) {
  const c = parsePatComptesCSV(comptesText);
  if (c.error) return { error: c.error };
  const m = parsePatMouvementsCSV(mouvementsText);
  if (m.error) return { error: m.error };

  /* Le CSV est la source de vérité : on remplace tout l'onglet Patrimoine plutôt que de
     fusionner, pour qu'un ré-import après mise à jour du tableur reflète exactement le fichier
     (pas de doublons, pas de compte fantôme). On garde juste le réglage "perf. globale" par
     compte, qui n'existe pas dans le CSV. */
  const prevPerfExcluded = {};
  (DB.patAccounts || []).forEach(a => { prevPerfExcluded[normalize(a.name)] = a.perfExcluded; });

  DB.patAccounts = []; DB.patValues = {}; DB.patMovements = [];
  /* Le tableur remplace tout : les mouvements nés d'un virement du budget aussi, puisqu'ils
     s'y trouvent déjà. Les opérations qui les désignaient perdent donc leur lien. */
  DB.tx.forEach(t => { t.patMove = null; });
  DB.patRules = {};
  const nameToId = {};
  c.accounts.forEach(name => {
    const key = normalize(name);
    const id = newPatAccountId(name);
    DB.patAccounts.push({ id, name, type: guessPatType(name), perfExcluded: prevPerfExcluded[key] || false });
    nameToId[key] = id;
  });
  let valuesImported = 0;
  c.accounts.forEach(name => {
    const id = nameToId[normalize(name)];
    DB.patValues[id] = { ...c.values[name] };
    valuesImported += Object.keys(c.values[name]).length;
  });
  let nextId = 1, movementsImported = 0, movementsSkipped = 0;
  m.movements.forEach(mv => {
    const accountId = nameToId[normalize(mv.compte)];
    if (!accountId) { movementsSkipped++; return; }
    DB.patMovements.push({ id: nextId++, accountId, date: mv.date, amount: mv.amount });
    movementsImported++;
  });

  saveDB();
  return { accountsCreated: c.accounts.length, valuesImported, movementsImported, movementsSkipped,
    datesSkipped: c.datesSkipped, error: null };
}

function last12Months(endKey) {
  const out = []; for (let i = 11; i >= 0; i--) out.push(addMonth(endKey, -i));
  return out;
}
/* Tout l'historique saisi, du plus ancien mois valorisé (sur n'importe quel compte) jusqu'à endKey. */
function allPatMonths(endKey) {
  const vals = DB.patValues || {};
  let minKey = endKey;
  Object.values(vals).forEach(v => Object.keys(v).forEach(k => { if (k < minKey) minKey = k; }));
  const out = []; let k = minKey;
  while (k <= endKey) { out.push(k); k = addMonth(k, 1); }
  return out;
}
/* =========================================================================
   Patrimoine — les cinq écrans.
   Aperçu : combien j'ai et pourquoi ça a bougé. Analyse : comment c'est réparti et ce que
   ça rapporte. Comptes : la saisie mensuelle. Crédits : les passifs. Plus le détail d'un
   compte, atteint depuis une carte.
   ========================================================================= */
function patTypeTotalAt(typeId, mk) {
  return (DB.patAccounts || []).filter(a => patType(a.type).id === typeId)
    .reduce((s, a) => s + (patAccountValue(a.id, mk) || 0), 0);
}
/* Classes réellement utilisées, la plus lourde d'abord. Un compte créé mais jamais valorisé
   ne compte pas : sa classe encombrerait la légende sans jamais dessiner de segment. */
function patTypesUsed(mk) {
  const seen = [];
  (DB.patAccounts || []).forEach(a => {
    const vals = (DB.patValues || {})[a.id] || {};
    if (!Object.keys(vals).some(k => vals[k] > 0)) return;
    const t = patType(a.type).id;
    if (seen.indexOf(t) < 0) seen.push(t);
  });
  return seen.map(t => ({ t, v: patTypeTotalAt(t, mk) })).sort((x, y) => y.v - x.v).map(x => x.t);
}

/* Une seule étiquette pour la variation du mois : deux pastilles côte à côte donnaient

function patMonthDelta(pct, eur) {
  const v = pct == null ? eur : pct;
  const cls = v == null ? "flat" : v > 0.005 ? "pos" : v < -0.005 ? "neg" : "flat";
  const arrow = cls === "pos" ? "↑" : cls === "neg" ? "↓" : "→";

    '<span class="ms">' + (eur == null ? "" : esc(fmtEur(eur, { plus: true })) + " · ") + "sur le mois</span></div>";
}

const PAT_RANGES = [["3m", 3], ["6m", 6], ["1a", 12], ["2a", 24], ["3a", 36], ["5a", 60], ["all", 0]];
const PAT_RANGE_LABEL = { "3m": "3 mois", "6m": "6 mois", "1a": "1 an", "2a": "2 ans", "3a": "3 ans", "5a": "5 ans", all: "Tout" };
function patRangeMonths(endMk) {
  const all = allPatMonths(endMk);
  const r = PAT_RANGES.find(x => x[0] === UI.patRange) || PAT_RANGES[PAT_RANGES.length - 1];
  if (!r[1]) return all;
  /* r[1] mois de performance demandent r[1]+1 points, la borne de départ comprise. */
  return all.slice(Math.max(0, all.length - (r[1] + 1)));

/* =========================================================================
   Catalogue des jalons — la version « tableau de trophées » des repères du graphique.
   Chaque entrée sait dire si elle est acquise et quand, et sinon où l'on en est. Montrer
   les jalons non atteints en grisé n'a d'intérêt que si l'on voit la distance qui reste :
   sans progression, c'est une liste de choses ratées.
   ========================================================================= */
function patAchievements(mk) {
  const months = allPatMonths(mk);
  if (!months.length) return [];
  /* La série est calculée une fois : chaque patTotalAt refait un tri des valorisations,
     et le catalogue interroge une trentaine de seuils. */
  const series = months.map(m => ({
    mk: m, total: patTotalAt(m), inv: patInvested(null, m),
    perf: patMonthlyPerf(null, m), mov: patMovementsInMonth(null, m),
  }));
  const last = series[series.length - 1];
  const out = [];
  /* Premier mois où la valeur atteint le seuil ; null si jamais. */
  const crossed = (pick, target) => {
    for (const p of series) if (pick(p) >= target) return p.mk;
    return null;
  };
  const add = (group, name, desc, at, current, target, fmt) => out.push({
    group, name, desc, at, done: !!at, current, target, fmt: fmt || fmtEurShort,
    pct: target > 0 ? Math.min(100, Math.max(0, current / target * 100)) : (at ? 100 : 0),
  });

  [10000, 25000, 50000, 75000, 100000, 250000, 500000, 1000000].forEach(c => {
    add("Paliers", fmtEurShort(c), "Patrimoine total atteint",
      crossed(p => p.total, c), last.total, c);
  });

  [1000, 5000, 10000, 25000, 50000, 100000].forEach(c => {
    add("Plus-value", fmtEurShort(c) + " de gains", "Écart cumulé entre ce qui est versé et ce que ça vaut",
      crossed(p => p.total - p.inv, c), last.total - last.inv, c);
  });

  const base = series[0].total;
  if (base > 0) [2, 3, 5, 10].forEach(x => {
    add("Multiplicateurs", "×" + x, "Patrimoine multiplié par " + x + " depuis " + monthLabel(series[0].mk),
      crossed(p => p.total, base * x), last.total, base * x);
  });

  /* --- Jalons de comportement : ils racontent une manière d'épargner, pas un montant. --- */
  let beatMk = null;
  for (let i = 1; i < series.length; i++) {
    const gain = series[i].total - series[i - 1].total - series[i].mov;
    if (series[i].mov > 0 && gain > series[i].mov) { beatMk = series[i].mk; break; }
  }
  add("Trajectoire", "Le marché vous dépasse", "Un mois où les placements rapportent plus que votre versement",
    beatMk, beatMk ? 1 : 0, 1, () => "");

  let streak = 0, bestStreak = 0;
  series.forEach(p => {
    if (p.perf != null && p.perf > 0) { streak++; if (streak > bestStreak) bestStreak = streak; }
    else streak = 0;
  });
  [3, 6, 12].forEach(n => {
    let hit = null, run = 0;
    for (const p of series) {
      if (p.perf != null && p.perf > 0) { run++; if (run >= n) { hit = p.mk; break; } } else run = 0;
    }
    add("Trajectoire", n + " mois gagnants d’affilée", "Série de hausses consécutives, hors versements",
      hit, bestStreak, n, v => v + " mois");
  });

  const years = [...new Set(months.map(m => +m.slice(0, 4)))];
  const goodYear = years.find(y => { const r = patAnnualPerf(null, y); return r != null && r > 0; });
  add("Trajectoire", "Une année dans le vert", "Une année civile entière en performance positive",
    goodYear ? goodYear + "-12" : null, goodYear ? 1 : 0, 1, () => "");

  /* Sortir d'un creux compte autant qu'y échapper : c'est ce que mesurent les suivis
     sérieux sous le nom de « temps de récupération ». */
  let peak = 0, peakMk = "", dd = 0, ddPeak = "", ddTrough = "";
  series.forEach(p => {
    if (p.total > peak) { peak = p.total; peakMk = p.mk; }
    const d = peak ? (p.total - peak) / peak * 100 : 0;
    if (d < dd) { dd = d; ddPeak = peakMk; ddTrough = p.mk; }
  });
  const recovered = dd < -4 && ddTrough
    ? (series.find(p => p.mk > ddTrough && p.total >= patTotalAt(ddPeak)) || {}).mk || null : null;
  add("Trajectoire", "Sommet retrouvé", "Revenir au plus haut après une baisse d’au moins 4 %",
    recovered, recovered ? 1 : 0, 1, () => "");

  add("Trajectoire", "Trois ans de suivi", "Trente-six mois de valorisations enregistrées",
    months.length >= 36 ? months[35] : null, months.length, 36, v => v + " mois");

  /* --- Régularité des versements : la constance compte autant que le montant --- */
  let runMov = 0, bestMov = 0, hitMov = {};
  series.forEach(p => {
    if (p.mov > 0) { runMov++; if (runMov > bestMov) bestMov = runMov; } else runMov = 0;
    [3, 6, 12, 24].forEach(n => { if (runMov === n && !hitMov[n]) hitMov[n] = p.mk; });
  });
  [3, 6, 12, 24].forEach(n => {
    add("Régularité", n + " mois de suite", "Verser quelque chose " + n + " mois consécutifs",
      hitMov[n] || null, bestMov, n, v => v + " mois");
  });
  /* Le premier mois est écarté : il n'enregistre que ce qui dormait déjà sur les comptes,
     et décrocherait d'un coup tous les paliers de versement. */
  const later = series.slice(1);
  const bestMov2 = Math.max(0, ...later.map(p => p.mov));
  [500, 1000, 2500, 5000].forEach(c => {
    const hit = later.find(p => p.mov >= c);
    add("Régularité", "Un mois à " + fmtEurShort(c), "Verser au moins " + fmtEurShort(c) + " en un seul mois",
      hit ? hit.mk : null, bestMov2, c);
  });

  /* --- Coups d'éclat : ce que les placements ont rapporté sur un seul mois ---
     Le pourcentage flatte les petits patrimoines, le montant flatte les gros : les deux
     méritent leur famille, celle-ci récompense la somme réellement gagnée en un mois. */
  const monthGains = series.map((p, i) => i ? p.total - series[i - 1].total - p.mov : 0);
  const bestGain = Math.max(0, ...monthGains);
  [250, 500, 1000, 2500, 5000, 10000].forEach(c => {
    let at = null;
    for (let i = 1; i < series.length; i++) if (monthGains[i] >= c) { at = series[i].mk; break; }
    add("Coups d’éclat", fmtEurShort(c) + " en un mois", "Gagner " + fmtEurShort(c) +
      " en un seul mois, hors versements", at, bestGain, c);
  });

  /* --- Diversification et sécurité --- */
  const classes = patAllocByType(mk).length;
  [3, 5].forEach(n => {
    add("Diversification", n + " classes d’actifs", "Répartir sur au moins " + n + " natures de placement",
      classes >= n ? mk : null, classes, n, v => v + " classes");
  });

  const safety = patSafetyMonths(mk);
  [3, 6].forEach(n => {
    add("Sécurité", n + " mois de dépenses", "Épargne de précaution couvrant " + n + " mois",
      safety && safety.months >= n ? mk : null, safety ? safety.months : 0, n,
      v => (Math.round(v * 10) / 10).toString().replace(".", ",") + " mois");
  });

  /* --- Indépendance : le patrimoine mesuré en années de dépenses ---
     Vingt-cinq ans de dépenses, c'est la règle des 4 % : le seuil à partir duquel le
     patrimoine peut, en théorie, financer le train de vie indéfiniment. */
  const yearlySpend = avgMonthlyExpense(12);
  const spend = yearlySpend ? yearlySpend.avg * 12 : 0;
  const yearsHeld = spend ? last.total / spend : 0;
  [1, 3, 5, 10, 25].forEach(n => {
    add("Indépendance", n + (n > 1 ? " ans" : " an") + " de dépenses",
      n === 25 ? "Le seuil de la règle des 4 %, où le patrimoine peut financer le train de vie"
               : "Patrimoine équivalent à " + n + (n > 1 ? " années" : " année") + " de dépenses",
      spend && yearsHeld >= n ? mk : null, yearsHeld, n,
      v => (Math.round(v * 10) / 10).toString().replace(".", ",") + (v >= 2 ? " ans" : " an"));
  });

  /* --- Repères français ---
     Médianes INSEE 2024 du patrimoine BRUT des ménages, résidence principale comprise.
     La comparaison se fait donc sur les actifs bruts, et reste flatteuse pour qui n'est pas
     propriétaire : c'est dit dans le libellé plutôt que caché. */
  PAT_INSEE.forEach(r => {
    add("Repères français", r.label, "Dépasser le patrimoine brut médian des ménages " + r.desc +
      " (INSEE 2024, résidence principale comprise)",
      crossed(p => p.total, r.amount), last.total, r.amount);
  });

  /* --- Rendement : une belle année, ça se fête --- */
  const yearRates = years.map(y => ({ y, r: patAnnualPerf(null, y) })).filter(x => x.r != null);
  [5, 10, 20].forEach(n => {
    const hit = yearRates.find(x => x.r >= n);
    add("Rendement", "Une année à +" + n + " %", "Une année civile terminée au-dessus de " + n + " % de performance",
      hit ? hit.y + "-12" : null, Math.max(0, ...yearRates.map(x => x.r)), n, v => fmtPerf(v));
  });

  /* --- Coups durs : les mauvais mois méritent leur trophée ---
     Un tableau qui ne récompense que les hausses laisse entendre qu'une baisse est une
     faute. Elle fait partie du métier d'investisseur : autant l'encadrer et lui donner un
     nom, quitte à sourire en le lisant. */
  const worstGain = Math.min(0, ...monthGains);
  const worstPerf = Math.min(0, ...series.map(p => (p.perf == null ? 0 : p.perf)));
  /* Montants et pourcentages entrelacés par sévérité croissante : le rang du badge suit
     ainsi la difficulté, alors que traiter les deux échelles séparément faisait d'un
     petit −2 % un trophée d'or et d'une perte de 2 500 € un simple argent. */
  [
    { pct: 2, name: "Petit frisson" },
    { eur: 250, name: "Ça pique" },
    { pct: 5, name: "Sueurs froides" },
    { eur: 500, name: "Aïe" },
    { eur: 1000, name: "Ouille" },
    { pct: 10, name: "Chute libre" },
    { eur: 2500, name: "Coup de massue" },
    { pct: 20, name: "Krach personnel" },
    { eur: 5000, name: "Cataclysme" },
  ].forEach(x => {
    if (x.eur) {
      let at = null;
      for (let k = 1; k < series.length; k++) if (monthGains[k] <= -x.eur) { at = series[k].mk; break; }
      add("Coups durs", x.name, "Perdre " + fmtEurShort(x.eur) + " en un seul mois, hors versements",
        at, Math.abs(worstGain), x.eur);
    } else {
      const hit = series.find(p => p.perf != null && p.perf <= -x.pct);
      add("Coups durs", x.name, "Un mois terminé à −" + x.pct + " % ou moins",
        hit ? hit.mk : null, Math.abs(worstPerf), x.pct, v => fmtPerf(-v));
    }
  });

  /* --- Traversées : les creux qui durent, et le temps qu'il faut pour en sortir ---
     Ordonnées par sévérité, pour que le rang du badge veuille dire quelque chose. */
  let down = 0, worstDown = 0, hitDown = {};
  series.forEach(p => {
    if (p.perf != null && p.perf < 0) { down++; if (down > worstDown) worstDown = down; } else down = 0;
    [2, 3, 6].forEach(n => { if (down === n && !hitDown[n]) hitDown[n] = p.mk; });
  });
  /* Profondeur du plus fort creux depuis un sommet : la mesure que suivent les gérants. */
  let pk = 0, deepest = 0, deepAt = {};
  series.forEach(p => {
    if (p.total > pk) pk = p.total;
    const d = pk ? (pk - p.total) / pk * 100 : 0;
    if (d > deepest) deepest = d;
    [5, 10, 20].forEach(n => { if (d >= n && !deepAt[n]) deepAt[n] = p.mk; });
  });
  /* Combien de mois le sommet est-il resté hors d'atteinte ? */
  let high = 0, since = 0, longestWait = 0, waitAt = null;
  series.forEach(p => {
    if (p.total >= high) { high = p.total; since = 0; }
    else { since++; if (since > longestWait) { longestWait = since; if (since === 6) waitAt = p.mk; } }
  });
  /* Verser et finir le mois plus bas qu'on ne l'avait commencé. */
  let rowing = null;
  for (let i = 1; i < series.length && !rowing; i++) {
    if (series[i].mov > 0 && series[i].total < series[i - 1].total) rowing = series[i].mk;
  }
  /* Repasser sous un palier rond déjà franchi. */
  let backward = null;
  [10000, 25000, 50000, 75000, 100000, 250000].forEach(c => {
    if (backward) return;
    let seen = false;
    for (const p of series) {
      if (p.total >= c) seen = true;
      else if (seen) { backward = p.mk; return; }
    }
  });
  const badYear = years.map(y => ({ y, r: patAnnualPerf(null, y) })).find(x => x.r != null && x.r < 0);
  const redLine = (DB.patAccounts || []).some(a => {
    const u = patUnrealized(a.id, mk); return u && u.gain < 0;
  });
  const months2 = v => v + " mois";
  [
    ["Ramer", "Verser de l’argent et voir quand même le patrimoine baisser", rowing, rowing ? 1 : 0, 1, () => ""],
    ["Deux mois dans le rouge", "Deux mois de baisse consécutifs", hitDown[2], worstDown, 2, months2],
    ["Ligne rouge", "Un compte dont la plus-value reste négative", redLine ? mk : null, redLine ? 1 : 0, 1, () => ""],
    ["Creux de 5 %", "Voir le patrimoine reculer de 5 % depuis son sommet", deepAt[5], deepest, 5, fmtRate],
    ["Trimestre noir", "Trois mois de baisse consécutifs", hitDown[3], worstDown, 3, months2],
    ["Marche arrière", "Repasser sous un palier déjà franchi", backward, backward ? 1 : 0, 1, () => ""],
    ["Creux de 10 %", "Voir le patrimoine reculer de 10 % depuis son sommet", deepAt[10], deepest, 10, fmtRate],
    ["Semestre noir", "Six mois de baisse consécutifs", hitDown[6], worstDown, 6, months2],
    ["Traversée du désert", "Six mois sans retrouver son plus haut", waitAt, longestWait, 6, months2],
    ["Douche froide", "Une année civile entière terminée en perte",
      badYear ? badYear.y + "-12" : null, badYear ? 1 : 0, 1, () => ""],
    ["Creux de 20 %", "Voir le patrimoine reculer de 20 % depuis son sommet", deepAt[20], deepest, 20, fmtRate],
  ].forEach(x => add("Traversées", x[0], x[1], x[2] || null, x[3], x[4], x[5]));

  /* --- Curiosités : aucune valeur financière, uniquement le plaisir de la coïncidence.
     Ces jalons-là ne se travaillent pas, ils se croisent — c'est tout leur intérêt. --- */
  const flag = (name, desc, at) => add("Curiosités", name, desc, at, at ? 1 : 0, 1, () => "");
  const near123 = series.find(p => p.perf != null && Math.abs(p.perf - 1.23) < 0.005);
  flag("1,23 %", "Une performance mensuelle de 1,23 % pile", near123 ? near123.mk : null);
  /* Deux décimales identiques : +4,44 %, −7,77 %… */
  const twin = series.find(p => {
    if (p.perf == null || Math.abs(p.perf) < 0.005) return false;
    const d = Math.abs(p.perf).toFixed(2).slice(-2);
    return d[0] === d[1];
  });
  flag("Décimales jumelles", "Une performance mensuelle dont les deux décimales sont identiques",
    twin ? twin.mk : null);
  const palin = series.find(p => {
    const s = String(Math.round(p.total));
    return s.length >= 4 && s === s.split("").reverse().join("");
  });
  flag("Patrimoine palindrome", "Un patrimoine qui se lit pareil dans les deux sens",
    palin ? palin.mk : null);
  const repdigit = series.find(p => /^(\d)\1{3,}$/.test(String(Math.round(p.total))));
  flag("Chiffres identiques", "Un patrimoine du genre 55 555 €", repdigit ? repdigit.mk : null);
  const roundTotal = series.find(p => p.total >= 1000 && Math.round(p.total) % 1000 === 0);
  flag("Compte rond", "Un patrimoine tombant pile sur un millier d’euros",
    roundTotal ? roundTotal.mk : null);
  /* Le gain du mois égale, à l'euro près, ce qui a été versé ce mois-là. */
  let mirror = null;
  for (let i = 1; i < series.length && !mirror; i++) {
    if (series[i].mov > 0 && Math.abs(monthGains[i] - series[i].mov) < 1) mirror = series[i].mk;
  }
  flag("Pile poil", "Un mois où les placements rapportent exactement ce que vous avez versé", mirror);
  const fri13 = (DB.patMovements || []).find(m => {
    const d = new Date(m.date + "T12:00:00");
    return d.getDate() === 13 && d.getDay() === 5;
  });
  flag("Vendredi 13", "Un versement enregistré un vendredi 13", fri13 ? monthKey(fri13.date) : null);
  const feb29 = (DB.patMovements || []).find(m => m.date.slice(5) === "02-29");
  flag("29 février", "Un versement un jour qui n’existe que tous les quatre ans",
    feb29 ? monthKey(feb29.date) : null);
  const newYear = (DB.patMovements || []).find(m => m.date.slice(5) === "01-01");
  flag("Bonne année", "Un versement le 1er janvier", newYear ? monthKey(newYear.date) : null);
  /* Deux comptes exactement à la même valeur le même mois. */
  let twins = null;
  for (const m of months) {
    const vals = (DB.patAccounts || []).map(a => patAccountValue(a.id, m)).filter(v => v != null && v > 0)
      .map(v => Math.round(v * 100));
    if (new Set(vals).size < vals.length) { twins = m; break; }
  }
  flag("Faux jumeaux", "Deux comptes exactement à la même valeur le même mois", twins);

  /* Un rang par famille : le premier jalon d'une série est facile, le dernier se mérite. */
  const groups = {};
  out.forEach(a => (groups[a.group] = groups[a.group] || []).push(a));
  Object.keys(groups).forEach(g => {
    const list = groups[g];
    list.forEach((a, i) => {
      const p = list.length > 1 ? i / (list.length - 1) : 0;
      a.tier = p <= 0.25 ? "bronze" : p <= 0.5 ? "silver" : p <= 0.78 ? "gold" : "plat";
    });
  });
  return out;
}

/* Générateur pseudo-aléatoire à graine : le tirage doit rester stable tant que
   l'utilisateur ne redemande pas un nouveau, sinon l'affichage changerait à chaque
   redessin de l'écran. */
function patRng(seed) {
  let t = (seed >>> 0) + 0x6D2B79F5;
  return function () {
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function patShuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* Repères de la trajectoire. On calcule bien plus de candidats qu'on n'en affichera : ne
   méritent l'encombrement que ceux qui sortent vraiment du lot, et le tri par priorité
   suivi d'un espacement minimal fait le ménage. Un patrimoine qui n'a rien vécu
   d'inhabituel n'affiche rien, et c'est très bien. */
function patHighlightCandidates(months) {
  const out = [], first = months[0];
  const at = mk => patTotalAt(mk);
  const gainAt = mk => at(mk) - patInvested(null, mk);
  const movIn = mk => (DB.patMovements || []).filter(m => monthKey(m.date) === mk).reduce((s, m) => s + m.amount, 0);
  const push = (mk, label, prio) => { if (mk && mk > first) out.push({ mk, label, prio }); };
  /* Premier mois où une valeur seuil est dépassée. */
  const crossing = (f, c) => {
    for (let i = 1; i < months.length; i++) if (f(months[i - 1]) < c && f(months[i]) >= c) return months[i];
    return null;
  };

  /* Caps ronds : seuls les deux derniers franchis, sinon toute la frise se remplit. */
  const caps = [10000, 25000, 50000, 75000, 100000, 150000, 200000, 250000, 500000, 1000000]
    .map(c => ({ c, mk: crossing(at, c) })).filter(x => x.mk);
  caps.slice(-2).forEach((x, i, arr) => push(x.mk, fmtEurShort(x.c) + " franchis", i === arr.length - 1 ? 1 : 5));

  /* Plus-value cumulée : le plus haut palier de gains atteint. */
  const gcross = [1000, 5000, 10000, 25000, 50000, 100000, 250000]
    .map(c => ({ c, mk: crossing(gainAt, c) })).filter(x => x.mk);
  if (gcross.length) push(gcross[gcross.length - 1].mk, fmtEurShort(gcross[gcross.length - 1].c) + " de gains", 2);

  /* Le patrimoine a doublé, triplé… par rapport au point de départ. */
  const base = at(first);
  if (base > 0) {
    const mult = [2, 3, 4, 5, 10].map(x => ({ x, mk: crossing(at, base * x) })).filter(y => y.mk);
    if (mult.length) push(mult[mult.length - 1].mk, "Patrimoine ×" + mult[mult.length - 1].x, 4);
  }

  /* Le mois où les placements ont rapporté plus que le versement du mois : le moment où
     l'argent commence à travailler plus fort que l'épargnant. */
  for (let i = 1; i < months.length; i++) {
    const mk = months[i], mv = movIn(mk), gain = at(mk) - at(months[i - 1]) - mv;
    if (mv > 0 && gain > mv) { push(mk, "Le marché dépasse vos versements", 2); break; }
  }

  const perfs = months.map(mk => ({ mk, r: patMonthlyPerf(null, mk) })).filter(x => x.r != null);
  if (perfs.length > 3) {
    const best = perfs.reduce((a, b) => (b.r > a.r ? b : a));
    const worst = perfs.reduce((a, b) => (b.r < a.r ? b : a));
    if (best.r > 2) push(best.mk, "Meilleur mois " + fmtPerf(best.r), 3);
    if (worst.r < -2) push(worst.mk, "Pire mois " + fmtPerf(worst.r), 3);
  }

  /* Plus forte baisse depuis un sommet, et le mois où le sommet est retrouvé : c'est la
     mesure que retiennent les suivis de portefeuille sérieux, parce qu'elle dit combien de
     temps il a fallu pour effacer une mauvaise passe. */
  let peak = 0, peakMk = "", dd = 0, ddPeak = "", ddTrough = "";
  months.forEach(mk => {
    const v = at(mk);
    if (v > peak) { peak = v; peakMk = mk; }
    const d = peak ? (v - peak) / peak * 100 : 0;
    if (d < dd) { dd = d; ddPeak = peakMk; ddTrough = mk; }
  });
  if (dd < -4 && ddTrough) {
    const rec = months.find(mk => mk > ddTrough && at(mk) >= at(ddPeak));
    if (rec) push(rec, "Sommet retrouvé en " + patMonthsBetween(ddPeak, rec) + " mois", 3);
  }

  /* Plus gros versement, en écartant le premier mois : cette ligne-là ne fait
     qu'initialiser le suivi avec ce qui dormait déjà sur les comptes. */
  const later = months.slice(1).map(mk => ({ mk, v: movIn(mk) })).filter(x => x.v > 0);
  if (later.length > 2) {
    const top = later.reduce((a, b) => (b.v > a.v ? b : a));
    const median = later.map(x => x.v).sort((a, b) => a - b)[Math.floor(later.length / 2)];
    /* Ne mérite un repère que s'il sort nettement de l'ordinaire. */
    if (top.v > median * 1.8) push(top.mk, "Plus gros versement " + fmtEurShort(top.v), 4);
  }
  const out2 = later.length ? months.slice(1).map(mk => ({ mk, v: movIn(mk) })).filter(x => x.v < 0) : [];
  if (out2.length) {
    const worstOut = out2.reduce((a, b) => (b.v < a.v ? b : a));
    if (Math.abs(worstOut.v) > 500) push(worstOut.mk, "Plus gros retrait " + fmtEurShort(worstOut.v), 5);
  }
  return out;
}
/* Sélection : priorité d'abord, puis un écart minimal entre deux repères pour que les
   étiquettes ne se chevauchent pas. minGapMonths dépend de la largeur disponible. */
function patHighlights(months, maxCount) {
  if (months.length < 5) return [];
  const max = maxCount || 5;
  const rnd = patRng(UI.patHlSeed || 0);
  /* Les étiquettes alternent sur deux niveaux : deux repères voisins ne sont donc jamais
     sur la même ligne, et peuvent se serrer bien plus qu'une largeur d'étiquette. */
  const gap = Math.max(2, Math.round(months.length / 12));
  const keep = [];
  const tryAdd = (h, g) => {
    if (keep.length >= max) return;
    if (keep.some(k => Math.abs(patMonthsBetween(k.mk, h.mk)) < g)) return;
    keep.push(h);
  };
  /* Deux repères de marché au plus, tirés au sort parmi ceux qui tombent dans la fenêtre :
     ils situent la courbe dans son époque sans monopoliser la place. */
  patShuffle(PAT_EVENTS.filter(e => months.indexOf(e.mk) >= 0), rnd)
    .slice(0, 2).forEach(e => tryAdd({ mk: e.mk, label: e.label, event: true }, gap));
  const cand = patShuffle(patHighlightCandidates(months), rnd);
  cand.forEach(h => tryAdd(h, gap));
  /* Second passage plus tolérant : on cherche à remplir les cinq places, quitte à serrer. */
  if (keep.length < max) cand.forEach(h => {
    if (keep.some(k => k.mk === h.mk)) return;
    tryAdd(h, Math.max(1, Math.floor(gap / 2)));
  });
  return keep.sort((a, b) => (a.mk < b.mk ? -1 : 1));
}
/* Frise des paliers : ceux déjà franchis à gauche, ceux à venir à droite, « aujourd'hui »
   au milieu. Voir le chemin parcouru à côté du chemin restant rend la projection concrète
   au lieu de la laisser flotter dans un futur abstrait. */
function patMilestoneTimeline(month, net, asm, target) {
  const months = allPatMonths(month);
  const caps = [10000, 25000, 50000, 75000, 100000, 150000, 200000, 300000, 500000, 1000000];
  const past = [];
  caps.forEach(c => {
    for (let i = 1; i < months.length; i++) {
      if (patTotalAt(months[i - 1]) < c && patTotalAt(months[i]) >= c) { past.push({ c, mk: months[i], done: true }); return; }
    }
  });
  const future = [];
  caps.filter(c => c > net).forEach(c => {
    if (future.length >= 3) return;
    const m = patMonthsToTarget(net, c, asm.rate, asm.contrib);
    if (m != null && m > 0) future.push({ c, mk: addMonth(month, m), done: false });
  });
  const pts = past.slice(-2).concat(future);
  if (pts.length < 2) return "";
  /* Échelle en mois, du plus ancien repère au plus lointain, « aujourd'hui » compris. */
  const lo = pts[0].mk < month ? pts[0].mk : month;
  const hi = pts[pts.length - 1].mk > month ? pts[pts.length - 1].mk : month;
  const span = Math.max(1, patMonthsBetween(lo, hi));
  /* Trois niveaux d'étiquettes : « aujourd'hui » tout en haut, puis les paliers en
     quinconce au-dessus et au-dessous de l'axe. Sur deux niveaux seulement, un palier
     franchi récemment venait buter contre le repère du présent. */
  const W = 460, H = 104, AXIS = 56;
  const X = mk => 28 + (patMonthsBetween(lo, mk) / span) * (W - 56);
  const nowX = X(month);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H +
    '" role="img" aria-label="' + esc("Paliers de patrimoine franchis et projetés, de " + monthLabel(lo) + " à " + monthLabel(hi)) +
    '" style="display:block;margin-top:14px;overflow:visible">';
  s += '<line x1="28" y1="' + AXIS + '" x2="' + nowX.toFixed(1) + '" y2="' + AXIS + '" stroke="var(--accent)" stroke-width="2.5"/>';
  s += '<line x1="' + nowX.toFixed(1) + '" y1="' + AXIS + '" x2="' + (W - 28) + '" y2="' + AXIS +
    '" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="4 4"/>';
  const nowAnchor = nowX < 40 ? "start" : nowX > W - 40 ? "end" : "middle";
  s += '<line x1="' + nowX.toFixed(1) + '" y1="' + (AXIS - 40) + '" x2="' + nowX.toFixed(1) + '" y2="' + (AXIS - 7) +
      '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 2" opacity=".55"/>' +
    '<circle cx="' + nowX.toFixed(1) + '" cy="' + AXIS + '" r="4.5" fill="var(--accent)"/>' +
    '<text x="' + nowX.toFixed(1) + '" y="' + (AXIS - 44) + '" text-anchor="' + nowAnchor +
      '" font-size="9.5" font-weight="700" fill="var(--accent-ink)">aujourd’hui</text>';
  pts.forEach((p, i) => {
    const x = X(p.mk);
    /* Au-dessus de l'axe, le montant coiffe la date ; en dessous, l'ordre s'inverse. Dans
       les deux cas la ligne la plus proche garde ses onze pixels de dégagement, faute de
       quoi le texte vient buter contre l'axe. */
    const above = i % 2 === 0;
    const amountY = above ? AXIS - 28 : AXIS + 21;
    const dateY = above ? AXIS - 17 : AXIS + 32;
    const anchor = x < 44 ? "start" : x > W - 44 ? "end" : "middle";
    const tx = anchor === "start" ? 2 : anchor === "end" ? W - 2 : x;
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + AXIS + '" r="3.5" fill="' +
      (p.done ? "var(--accent)" : "var(--surface)") + '" stroke="' + (p.done ? "var(--accent)" : "var(--ink-mute)") + '" stroke-width="2"/>' +
      '<text x="' + tx.toFixed(1) + '" y="' + amountY + '" text-anchor="' + anchor + '" font-size="11" font-weight="650" fill="' +
        (p.done ? "var(--ink)" : "var(--ink-soft)") + '">' + esc(fmtEurShort(p.c)) + "</text>" +
      '<text x="' + tx.toFixed(1) + '" y="' + dateY + '" text-anchor="' + anchor +
      '" font-size="9.5" fill="var(--ink-mute)" font-family="ui-monospace,monospace">' + esc(monthLabel(p.mk)) + "</text>";
  });
  return s + "</svg>";
}
function patAreaChart(months) {
  if (months.length < 2) return '<div class="empty" style="padding:26px 14px">Il faut au moins deux mois valorisés pour tracer une évolution.</div>';
  const pts = months.map(mk => ({ mk, val: patTotalAt(mk), inv: patInvested(null, mk) }));
  const max = Math.max(1, ...pts.map(p => Math.max(p.val, p.inv)));
  const W = 920, H = 250, TOP = 54, BOT = 26;
  const X = i => (i / (pts.length - 1)) * (W - 8) + 4;
  const Y = v => H - BOT - (v / max) * (H - TOP - BOT);
  const line = key => pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p[key]).toFixed(1)).join(" ");
  const area = key => line(key) + " L" + X(pts.length - 1).toFixed(1) + "," + (H - BOT) + " L" + X(0).toFixed(1) + "," + (H - BOT) + " Z";

  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H +
    '" role="img" aria-label="' + esc("Évolution du patrimoine de " + monthLabel(months[0]) + " à " +
      monthLabel(months[months.length - 1]) + ", versements cumulés et performance") +
    '" style="display:block;max-width:100%">';
  /* Ligne de base et graduations discrètes, pour situer les montants sans grille lourde. */
  [0.5, 1].forEach(f => {
    const y = Y(max * f);
    svg += '<line x1="4" y1="' + y.toFixed(1) + '" x2="' + (W - 4) + '" y2="' + y.toFixed(1) +
      '" stroke="var(--line-2)" stroke-width="1"/>' +
      '<text x="8" y="' + (y - 4).toFixed(1) + '" font-size="10" fill="var(--ink-mute)" font-family="ui-monospace,monospace">' +
      esc(fmtEurShort(max * f)) + "</text>";
  });
  svg += '<path d="' + area("val") + '" fill="var(--pos)" fill-opacity=".18"/>';
  svg += '<path d="' + area("inv") + '" fill="var(--accent)" fill-opacity=".30"/>';
  svg += '<path d="' + line("inv") + '" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3"/>';
  svg += '<path d="' + line("val") + '" fill="none" stroke="var(--pos)" stroke-width="2"/>';

  /* Repères : trait vertical depuis la courbe jusqu'à l'étiquette, alternée sur deux
     niveaux pour que deux dates proches ne se recouvrent pas. */
  const hi = patHighlights(months);
  hi.forEach((h, n) => {
    const i = months.indexOf(h.mk);
    if (i < 0) return;
    const x = X(i), y = Y(pts[i].val), ly = n % 2 ? 38 : 16;
    const anchor = x < 90 ? "start" : x > W - 90 ? "end" : "middle";
    const tx = anchor === "start" ? 4 : anchor === "end" ? W - 4 : x;
    /* Un repère de marché n'appartient pas à votre trajectoire : losange creux et libellé
       en retrait, pour qu'on ne le confonde pas avec un jalon personnel. */
    const mark = h.event
      ? '<path d="M' + x.toFixed(1) + "," + (y - 4).toFixed(1) + "l4,4l-4,4l-4,-4Z" +
        '" fill="var(--surface)" stroke="var(--ink-soft)" stroke-width="1.6"/>'
      : '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="var(--surface)" stroke="var(--pos)" stroke-width="2"/>';
    svg += '<line x1="' + x.toFixed(1) + '" y1="' + (ly + 5) + '" x2="' + x.toFixed(1) + '" y2="' + (y - 6).toFixed(1) +
      '" stroke="var(--ink-mute)" stroke-width="1" stroke-dasharray="2 2" opacity="' + (h.event ? ".45" : ".7") + '"/>' +
      mark +
      '<text x="' + tx.toFixed(1) + '" y="' + ly + '" text-anchor="' + anchor +
      '" font-size="11" font-weight="' + (h.event ? "500" : "650") + '" fill="var(--' + (h.event ? "ink-soft" : "ink") + ')">' +
      esc(h.label) + "</text>" +
      '<text x="' + tx.toFixed(1) + '" y="' + (ly + 12) + '" text-anchor="' + anchor +
      '" font-size="10" fill="var(--ink-mute)" font-family="ui-monospace,monospace">' + esc(monthLabel(h.mk)) + "</text>";
  });
  /* Bornes de l'axe des mois. */
  svg += '<text x="4" y="' + (H - 8) + '" font-size="10" fill="var(--ink-mute)">' + esc(monthLabel(months[0])) + "</text>" +
    '<text x="' + (W - 4) + '" y="' + (H - 8) + '" text-anchor="end" font-size="10" fill="var(--ink-mute)">' +
    esc(monthLabel(months[months.length - 1])) + "</text></svg>";
  return svg;
}
function perfCell(v) {
  return '<td class="num ' + (v == null ? "muted" : v > 0.005 ? "pos" : v < -0.005 ? "neg" : "muted") +
    '" style="text-align:right">' + esc(fmtPerf(v)) + "</td>";
}
function patLegendByType(types) {
  return '<div class="legend">' + types.map(t =>
    '<span><i class="sw" style="background:' + patTypeColor(t) + '"></i>' + esc(patTypeName(t)) + "</span>").join("") + "</div>";
}

/* ---- Aperçu ------------------------------------------------------------- */
function viewPatrimoineHome() {
  const accounts = DB.patAccounts || [];
  const month = UI.patMonth, year = yearOf(month + "-01");
  let html = patTopbar("Aperçu du patrimoine",
    '<button class="btn sm ghost" data-act="patimportcsv">' + icon("down", 16) + "Importer CSV Excel</button>");
  if (!accounts.length) return html + patNoAccounts("Ajoutez un compte dans l’onglet <b class='inl'>Comptes</b>, ou reprenez votre historique depuis un export Excel, pour voir la synthèse apparaître ici.");

  const gross = patTotalAt(month), debt = patDebtTotalAt(month), net = gross - debt;
  const prevM = addMonth(month, -1);
  const netPrev = patTotalAt(prevM) - patDebtTotalAt(prevM);
  const deltaEur = patHasHistoryAt(prevM) ? net - netPrev : null;
  const perfM = patMonthlyPerf(null, month);
  const ath = patATH(month), streak = patRiseStreak(month);
  const ytd = patSplit((year - 1) + "-12", month);

  /* --- Bandeau : combien, et de combien ça a bougé ce mois-ci --- */
  html += '<div class="card"><div class="pathero"><div>' +
    '<div class="eyebrow">' + (debt ? "Patrimoine net" : "Patrimoine total") + "</div>" +
    '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
      '<div class="big">' + esc(fmtEur(net)) + "</div>" + patMonthDelta(perfM, deltaEur) + "</div>";
  const marks = [];
  if (ath && ath.mk === month && gross > 0) marks.push("Plus haut historique");
  else if (ath && gross > 0) marks.push("Plus haut : " + fmtEurShort(ath.total) + " en " + monthLabel(ath.mk));
  if (streak >= 2) marks.push(streak + " mois de hausse d’affilée");
  if (debt) marks.push(fmtEur(gross) + " d’actifs − " + fmtEur(debt) + " de dettes");
  html += marks.length ? '<div class="tiny muted" style="margin-top:7px">' + esc(marks.join(" · ")) + "</div>" : "";
  html += "</div>";

  /* --- Effort contre marché : la question « d'où vient l'évolution » --- */
  html += "<div>";
  if (ytd.delta === 0 && !ytd.versements) {
    html += '<div class="eyebrow">Depuis le 1<sup>er</sup> janvier</div>' +
      '<p class="tiny muted" style="margin:8px 0 0">Pas encore de mouvement cette année.</p>';
  } else {
    const av = Math.abs(ytd.versements), ap = Math.abs(ytd.perf), tot = av + ap || 1;
    html += '<div class="eyebrow">Depuis le 1<sup>er</sup> janvier</div>' +
      '<div class="splitbar" style="margin-top:9px">' +
        '<i style="width:' + (av / tot * 100).toFixed(2) + '%;background:var(--accent)"></i>' +
        '<i style="width:' + (ap / tot * 100).toFixed(2) + '%;background:' + (ytd.perf >= 0 ? "var(--pos)" : "var(--neg)") + '"></i>' +
      "</div>" +
      '<div class="legend">' +
        '<span><i class="sw" style="background:var(--accent)"></i>Vos versements <b>' + esc(fmtEur(ytd.versements)) + "</b></span>" +
        '<span><i class="sw" style="background:' + (ytd.perf >= 0 ? "var(--pos)" : "var(--neg)") + '"></i>Performance <b>' +
          esc(fmtEur(ytd.perf, { plus: true })) + "</b></span>" +
      "</div>" +
      '<p class="tiny muted" style="margin:10px 0 0">' + esc(fmtEur(ytd.delta, { plus: true })) + " cette année" +
        (ytd.rate != null ? ", soit <b class='inl'>" + esc(fmtPerf(ytd.rate)) + "</b> de performance hors versements" : "") + ". " +
        esc(ap > av ? "La performance dépasse l’effort." : "L’effort porte encore l’essentiel de la progression.") + "</p>";
  }
  html += "</div></div></div>";

  /* --- Évolution : versements et performance empilés, sur la période choisie --- */
  const allMonths = allPatMonths(month);
  const months = patRangeMonths(month);
  const from = months[0], last = months[months.length - 1];
  const rangeTwr = months.length > 1 ? patTWR(from, last) : null;
  const rangeDelta = patTotalAt(last) - patTotalAt(from);
  html += '<div class="card"><div class="chead"><h2>Évolution</h2>' +
    '<button class="iconbtn" data-act="pathlshuffle" title="Afficher d’autres repères">' + icon("undo", 15) + "</button>" +
    '<button class="iconbtn" data-act="patmilestones" title="Voir tous les jalons">' + icon("trophy", 15) + "</button>" +
    '<div class="spacer" style="flex:1"></div>' +
    '<div style="display:flex;gap:4px;flex-wrap:wrap">' + PAT_RANGES.map(r => {
      /* Une période plus longue que l'historique n'a rien à montrer. */
      const enough = !r[1] || allMonths.length > r[1];
      return enough ? '<span class="pill ' + ((UI.patRange || "all") === r[0] ? "on" : "") +
        '" data-act="patrange" data-range="' + r[0] + '">' + PAT_RANGE_LABEL[r[0]] + "</span>" : "";
    }).join("") + "</div></div>";
  if (months.length > 1) {
    const rangeName = (PAT_RANGE_LABEL[UI.patRange || "all"] || "Tout").toLowerCase();
    html += '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px">' +
      '<span class="num ' + perfClass(rangeTwr ? rangeTwr.cumul : null) +
        '" style="font-size:20px;font-weight:650;letter-spacing:-.02em">' +
        esc(rangeTwr ? fmtPerf(rangeTwr.cumul) : "—") + "</span>" +
      '<span class="tiny muted">de performance sur ' + esc(rangeName === "tout" ? "toute la période" : rangeName) +
        ", et " + esc(fmtEur(rangeDelta, { plus: true })) + " de patrimoine</span></div>";
  }
  html += patAreaChart(months);
  /* La légende suit la période : sur « 6 mois » on veut ce qui a été versé et gagné pendant
     ces six mois, pas un cumul depuis l'origine qui ne bougerait jamais d'un filtre à l'autre. */
  const whole = (UI.patRange || "all") === "all";
  const seg = whole
    ? { versements: patInvested(null, last), perf: patTotalAt(last) - patInvested(null, last) }
    : patSplit(from, last);
  html += '<div class="legend" style="margin-top:12px">' +
    '<span><i class="sw" style="background:var(--accent);opacity:.55"></i>' +
      (whole ? "Versements cumulés" : "Versé sur la période") + " <b>" + esc(fmtEur(seg.versements)) + "</b></span>" +
    '<span><i class="sw" style="background:var(--pos);opacity:.4"></i>' +
      (whole ? "Performance accumulée" : "Performance sur la période") + " <b>" +
      esc(fmtEur(seg.perf, { plus: true })) + "</b></span>" +
