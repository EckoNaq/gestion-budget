    (whole ? '<span class="muted">l’écart entre les deux courbes est votre gain</span>'
           : '<span class="muted">depuis l’origine : ' + esc(fmtEur(patInvested(null, last))) + " versés, " +
             esc(fmtEur(patTotalAt(last) - patInvested(null, last), { plus: true })) + " de gains</span>") +
    "</div></div>";

  /* --- Où ça va : la frise des paliers, franchis et à venir --- */
  const asm = patAssumptions(month);
  const target = patNextMilestone(net);
  const toGo = Math.max(0, target - net);
  const monthsTo = patMonthsToTarget(net, target, asm.rate, asm.contrib);
  const help = "Calculé sur " +
    (asm.autoRate ? "le rendement observé de " + fmtPerf(asm.rate) + " par an"
                  : "un rendement fixé à " + fmtPerf(asm.rate) + " par an") + " et " +
    (asm.autoContrib ? "votre versement moyen des douze derniers mois, " + fmtEur(asm.contrib)
                     : "un versement fixé à " + fmtEur(asm.contrib)) +
    " par mois. Extrapolation du passé récent, pas une prévision. Ces hypothèses se modifient dans Réglages.";
  html += '<div class="patgrid"><div class="card"><div class="chead"><h2>Prochain palier</h2>' +
    '<span class="help" tabindex="0" role="note" aria-label="' + esc(help) + '" title="' + esc(help) + '">?</span>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">' + esc(fmtEurShort(target)) + "</span></div>" +
    '<div class="msbar"><i style="width:' + Math.min(100, target ? net / target * 100 : 0).toFixed(1) + '%"></i></div>' +
    '<div style="display:flex;justify-content:space-between" class="tiny muted">' +
      '<span class="num">' + esc(fmtEurShort(net)) + '</span><span class="num">' + esc(fmtEurShort(target)) + "</span></div>" +
    '<p class="tiny" style="margin:12px 0 0;color:var(--ink-2)">Il reste <b class="num">' + esc(fmtEur(toGo)) + "</b>. " +
      (monthsTo == null ? "Les hypothèses actuelles n’y mènent pas."
        : monthsTo === 0 ? "Palier déjà atteint."
        : "Au rythme retenu, vous y êtes en <b>" + esc(monthLabel(addMonth(month, monthsTo))) + "</b>.") + "</p>";
  html += patMilestoneTimeline(month, net, asm, target) + "</div>";

  /* --- Épargne de précaution : le pont avec le côté Budget --- */
  const safety = patSafetyMonths(month);
  const goalM = Number(DB.settings.patSafetyTarget) || 4;
  html += '<div class="card"><div class="chead"><h2>Épargne de précaution</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">objectif ' + goalM + " mois</span></div>";
  if (!safety) {
    html += '<div class="empty" style="padding:22px 14px"><b>Pas encore calculable</b>' +
      "Ce chiffre se mesure en mois de dépenses couverts. Importez au moins un relevé dans l’onglet <b class='inl'>Mois</b> pour que vos dépenses moyennes soient connues.</div>";
  } else {
    const ratio = Math.min(100, safety.months / goalM * 100);
    const st = safety.months >= goalM ? "pos" : safety.months >= goalM - 1 ? "warn" : "neg";
    html += '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
      '<span class="num ' + st + '" style="font-size:26px;font-weight:600;letter-spacing:-.02em">' +
        esc(safety.months.toFixed(1).replace(".", ",")) + " mois</span>" +
      '<span class="tiny muted">de dépenses couvertes</span></div>' +
      '<div class="msbar"><i style="width:' + ratio.toFixed(1) + "%;background:var(--" + st + ')"></i></div>' +
      '<p class="tiny muted" style="margin:8px 0 0"><b class=\'inl\'>' + esc(fmtEur(safety.liquid)) +
      "</b> disponibles sur vos livrets et comptes courants, pour <b class='inl'>" + esc(fmtEur(safety.avg)) +
      "</b> de dépenses mensuelles moyennes (" + safety.basis + " mois observés). Repère usuel : trois à six mois.</p>";
  }
  html += "</div></div>";
  return html;
}

/* ---- Jalons ---------------------------------------------------------------
   Acquis en couleur, à venir en grisé, avec la distance qui reste. Un jalon barré sans
   contexte décourage ; le même avec « 62 990 sur 75 000 » donne une direction. */
function viewPatMilestones() {
  const month = UI.patMonth;
  let html = '<div class="topbar"><button class="btn sm ghost" data-act="patbackhome">' + icon("left", 14) + "Aperçu</button>" +
    "<h1>Jalons</h1>" +
    '<div class="periodnav"><button data-act="prev" aria-label="Mois précédent">' + icon("left") + "</button>" +
    '<span class="label">' + esc(monthLabel(month)) + "</span>" +
    '<button data-act="next" aria-label="Mois suivant">' + icon("right") + "</button></div>" +
    '<div class="spacer" style="flex:1"></div></div>';

  /* Sans le moindre compte, la collection entière serait grise : mieux vaut inviter à
     commencer. Dès qu'un compte existe, on montre tout le catalogue, verrouillé compris —
     c'est ce qui donne envie d'aller le décrocher. */
  if (!(DB.patAccounts || []).length) {
    return html + patNoAccounts("Les jalons se débloquent au fil des valorisations. Ajoutez un compte dans l’onglet <b class='inl'>Comptes</b> pour ouvrir la collection.");
  }
  const all = patAchievements(month);
  if (!all.length) return html + patNoAccounts("Aucun jalon à afficher pour ce mois.");

  const done = all.filter(a => a.done).length;
  html += '<div class="card"><div class="pathero"><div>' +
    '<div class="eyebrow">Jalons atteints</div>' +
    '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">' +
      '<div class="big">' + done + '<span style="font-size:20px;color:var(--ink-mute)"> / ' + all.length + "</span></div>" +
    "</div>" +
    '<div class="msbar" style="max-width:320px"><i style="width:' + (done / all.length * 100).toFixed(1) + '%"></i></div>' +
    '<div class="tiny muted">Certains ne dépendent que du temps, d’autres de ce que vous en faites.</div></div>';
  /* Le prochain jalon accessible : celui dont la progression est la plus avancée. */
  const next = all.filter(a => !a.done && a.pct > 0).sort((x, y) => y.pct - x.pct)[0];
  html += "<div>";
  if (next) {
    html += '<div class="eyebrow">Le plus proche</div>' +
      '<div style="font-size:15px;font-weight:650;margin-top:6px">' + esc(next.name) + "</div>" +
      '<div class="msbar" style="margin-top:8px"><i style="width:' + next.pct.toFixed(1) + '%"></i></div>' +
      '<div class="tiny muted">' + esc(next.fmt(next.current)) + " sur " + esc(next.fmt(next.target)) +
      " · " + esc(fmtRate(next.pct)) + "</div>";
  }
  html += "</div></div></div>";

  const groups = [];
  all.forEach(a => {
    let g = groups.filter(x => x.name === a.group)[0];
    if (!g) groups.push(g = { name: a.group, items: [] });
    g.items.push(a);
  });
  const GROUP_ICON = { "Paliers": "vault", "Plus-value": "income", "Multiplicateurs": "chart",
    "Trajectoire": "signal", "Régularité": "cal", "Coups d’éclat": "income", "Diversification": "pie",
    "Sécurité": "heart", "Indépendance": "trophy", "Repères français": "home", "Rendement": "up",
    "Curiosités": "ticket", "Coups durs": "warn", "Traversées": "undo" };
  html += groups.map(g => {
    const n = g.items.filter(x => x.done).length;
    /* Une famille entièrement décrochée change d'allure : c'est la récompense de la
       collection, et sans elle il n'y a aucune raison de viser le dernier badge. */
    const full = n === g.items.length;
    return '<div class="card mgroup' + (full ? " full" : "") + '"><div class="chead">' +
      (full ? '<span class="mtrophy">' + icon("trophy", 16) + "</span>" : "") +
      "<h2>" + esc(g.name) + "</h2>" +
      '<div class="spacer" style="flex:1"></div>' +
      (full ? '<span class="mfull">' + icon("check", 12) + "Complet</span>"
            : '<span class="tiny muted">' + n + " / " + g.items.length + "</span>") + "</div>" +
      '<div class="badges">' + g.items.map(a => {
        /* L'espace avant l'euro devient insécable : sans cela « 1 000 000 € » se coupe et
           laisse un symbole seul sur la ligne suivante. */
        const nb = s => s.replace(/ €/g, " €");
        /* Un jalon tout ou rien n'a pas de progression à montrer : plutôt que de laisser
           un blanc, on dit franchement qu'il reste à décrocher. */
        const sub = a.done ? (a.at ? monthLabel(a.at) : "atteint")
          : a.fmt(a.target) ? nb(a.fmt(a.current)) + " / " + nb(a.fmt(a.target)) : "à débloquer";
        return '<div class="badge ' + (a.done ? "on t-" + a.tier : "") + '" style="--p:' + a.pct.toFixed(1) + '%" title="' +
          esc(a.name + " — " + a.desc + (a.done ? " · atteint en " + (a.at ? monthLabel(a.at) : "?") : " · " + sub)) + '">' +
          '<div class="bmed"><span class="bic">' + icon(GROUP_ICON[g.name] || "vault", 22) + "</span>" +
          (a.done ? '<span class="btick">' + icon("check", 11) + "</span>" : "") + "</div>" +
          '<div class="bn">' + esc(a.name) + "</div>" +
          '<div class="bs">' + esc(sub) + "</div></div>";
      }).join("") + "</div></div>";
  }).join("");
  return html;
}

/* ---- Analyse ------------------------------------------------------------ */
/* Une carte à part plutôt que deux colonnes de plus dans « Où en est chaque compte » :
   ce tableau est déjà à quatre colonnes de chiffres, et un taux ne se lit pas sans son
   motif — l'ancienneté du plan, le régime retenu, ce que le calcul ne déduit pas. Autant
   de choses qui ne tiennent pas dans une cellule.
   `rows` est celui du tableau du dessus : mêmes comptes, même mois, aucun recalcul. */
/* « dans 54 mois » ne veut rien dire à personne. Au-delà de deux ans on compte en années,
   en dessous en mois, et le mois même se dit « ce mois-ci » plutôt que « dans 0 mois ». */
function waitDelay(m) {
  if (m <= 0) return "ce mois-ci";
  if (m < 24) return m + " mois";
  return trim1(m / 12) + " ans";
}
function patTaxCard(rows, month) {
  const taxed = rows.map(r => ({ a: r.a, t: patTax(r.a, month) })).filter(x => x.t);
  let html = '<div class="card"><div class="chead"><h2>Ce que l’impôt prendrait</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">si vous retiriez tout en ' +
    esc(monthLabel(month)) + "</span></div>";
  if (!taxed.length) {
    return html + '<div class="empty" style="padding:22px 14px">Aucune plus-value imposable à ce jour. ' +
      "<b>L’impôt ne porte que sur le gain</b> : sans gain, ou sur une enveloppe exonérée, il n’y a rien à prélever.</div></div>";
  }
  /* Les taux différant d'une ligne à l'autre, le total ne peut être qu'une somme de lignes
     — patUnrealized(null) donnerait bien la plus-value d'ensemble, mais aucun taux auquel
     l'appliquer. C'est aussi pourquoi la ligne finale dit « les comptes ci-dessus » : son
     périmètre est celui des comptes imposables, pas celui du tableau du dessus. */
  const sum = f => taxed.reduce((s, x) => s + f(x.t), 0);
  const gain = sum(t => t.gain), tax = sum(t => t.tax), value = sum(t => t.value);
  html += '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">' +
    kpi("Plus-value latente", fmtEur(gain), "sur les comptes imposables", "pos") +
    kpi("Impôt estimé", fmtEur(-tax), fmtRate(gain ? tax / gain * 100 : 0) + " du gain", "neg") +
    kpi("Net après impôt", fmtEur(value - tax), "sur " + fmtEur(value) + " affichés") + "</div>";
  html += '<div style="overflow-x:auto"><table class="ops patnum"><thead><tr><th>Compte</th>' +
    '<th style="text-align:right">Plus-value</th><th style="text-align:right">Taux</th>' +
    '<th style="text-align:right">Impôt</th><th style="text-align:right">Net</th></tr></thead><tbody>';
  html += taxed.map(({ a, t }) => {
    /* La ligne sous le nom porte tout ce qui explique le taux : le régime, et l'âge du
       plan quand il en dépend. Sans elle, « 18,6 % » d'un côté et « 31,4 % » de l'autre
       sur deux PEA ressembleraient à un bug. */
    const bits = [t.regime.name];
    if (t.regime.ages && t.opened) {
      bits.push("ouvert en " + monthLabel(t.opened) + " · " + trim1(Math.max(0, t.age)) + " ans");
    } else if (t.regime.ages) {
      bits.push("ancienneté inconnue");
    }
    /* Un taux immobilier tombé de 36,2 % à 8,7 % sans explication passerait pour une erreur :
       l'abattement déjà acquis se lit sous le nom, au même endroit que l'ancienneté. */
    if (t.abat && (t.abat.ir || t.abat.ps)) {
      bits.push("abattement acquis " + trim1(t.abat.ir) + " % / " + trim1(t.abat.ps) + " %");
    }
    return '<tr><td><span style="display:flex;align-items:center;gap:8px">' + patSwatch(a) + esc(a.name) +
        (t.approx ? ' <span class="tiny muted" title="La date d’ouverture n’a pas été saisie : elle est déduite de la plus ancienne donnée connue, ce qui rajeunit le compte et alourdit le taux. Renseignez-la dans Comptes › Réglages des comptes.">≈</span>' : "") +
        '</span><div class="tiny muted" style="margin-top:2px">' + esc(bits.join(" · ")) + "</div></td>" +
      '<td class="num pos" style="text-align:right">' + esc(fmtEur(t.gain, { plus: true })) + "</td>" +
      '<td class="num ' + (t.rate ? "" : "muted") + '" style="text-align:right" title="' + esc(t.why) + '">' +
        esc(fmtRate(t.rate)) + (t.rate ? ' <span class="tiny muted">(' + esc(trim1(t.ir)) + " + " +
        esc(trim1(t.ps)) + ")</span>" : "") + "</td>" +
      '<td class="num ' + (t.tax ? "neg" : "muted") + '" style="text-align:right">' +
        (t.tax ? esc(fmtEur(-t.tax)) : "—") + "</td>" +
      '<td class="num" style="text-align:right">' + esc(fmtEur(t.net)) + "</td></tr>";
  }).join("");
  html += '<tr><td style="font-weight:650">Les comptes ci-dessus</td>' +
    '<td class="num pos" style="text-align:right">' + esc(fmtEur(gain, { plus: true })) + "</td>" +
    '<td class="num muted" style="text-align:right">' + esc(fmtRate(gain ? tax / gain * 100 : 0)) + "</td>" +
    '<td class="num neg" style="text-align:right;font-weight:650">' + esc(fmtEur(-tax)) + "</td>" +
    '<td class="num" style="text-align:right;font-weight:650">' + esc(fmtEur(value - tax)) + "</td></tr>";
  html += "</tbody></table></div>";

  /* --- Si vous attendiez : le même gain, plus tard, moins taxé --------------
     Le tableau du dessus répond à « si je retirais tout aujourd'hui ». La question qui suit
     immédiatement est « et si j'attendais ? », et c'est la seule sur laquelle un écran peut
     encore agir : les paliers d'ancienneté ne coûtent rien d'autre que de la patience. */
  const waits = taxed.map(x => ({ a: x.a, w: patTaxWait(x.a, month) })).filter(x => x.w);
  if (waits.length) {
    /* Économie maximale : chaque compte à son dernier palier. C'est le haut de la fourchette,
       et le libellé le dit — atteindre le palier de 30 ans d'un bien n'est pas un plan. */
    const best = waits.reduce((s, x) => s + x.w.steps[x.w.steps.length - 1].saved, 0);
    const soon = waits.map(x => x.w.steps[0]).sort((p, q) => p.months - q.months)[0];
    html += '<div class="chead" style="margin-top:22px"><h2 style="font-size:15px">Si vous attendiez</h2>' +
      '<div class="spacer" style="flex:1"></div><span class="tiny muted">à plus-value inchangée</span></div>' +
      '<p class="tiny muted" style="margin:0 0 11px">Chaque palier d’ancienneté franchi allège le taux sans rien ' +
      "changer au placement. À gain constant, il y a <b class='inl'>" + esc(fmtEur(best)) + "</b> d’impôt à " +
      "ne pas payer en tout, dont le premier allègement dans <b class='inl'>" + esc(waitDelay(soon.months)) +
      "</b>.</p>";
    html += '<div style="overflow-x:auto"><table class="ops patnum"><thead><tr><th>Compte</th>' +
      '<th>Palier</th><th style="text-align:right">Dans</th><th style="text-align:right">Taux</th>' +
      '<th style="text-align:right">Impôt</th><th style="text-align:right">Économisé</th></tr></thead><tbody>';
    html += waits.map(({ a, w }) => w.steps.map((s, i) => {
      /* Le nom n'est répété qu'une fois par compte : un bien immobilier aligne jusqu'à six
         paliers, et six fois le même nom ferait lire six comptes. */
      const seuil = w.now.regime.id === "immo"
        ? (s.years >= 30 ? "30 ans · exonération totale"
          : s.years > 22 ? s.years + " ans · prélèvements sociaux allégés"
          : s.years === 22 ? "22 ans · impôt sur le revenu éteint"
          : s.years + " ans de détention")
        : s.years + " ans" + (w.now.regime.id === "pea" ? " · impôt sur le revenu éteint" : " · taux réduit à 7,5 %");
      return '<tr' + (i ? ' class="rowoff"' : "") + '><td>' + (i ? '<span class="tiny muted">↳</span>'
          : '<span style="display:flex;align-items:center;gap:8px">' + patSwatch(a) + esc(a.name) +
            (w.now.approx ? '<span class="tiny muted" title="Échéance calculée sur une date d’ouverture déduite, donc repoussée : le vrai palier est probablement plus proche.">≈</span>' : "") +
            "</span>") + "</td>" +
        "<td>" + esc(seuil) + '<div class="tiny muted" style="margin-top:2px">' + esc(monthLabel(s.when)) + "</div></td>" +
        '<td class="num muted" style="text-align:right">' + esc(waitDelay(s.months)) + "</td>" +
        '<td class="num" style="text-align:right">' + esc(fmtRate(s.rate)) +
          ' <span class="tiny muted">(' + esc(trim1(s.ir)) + " + " + esc(trim1(s.ps)) + ")</span></td>" +
        '<td class="num ' + (s.tax ? "neg" : "muted") + '" style="text-align:right">' +
          (s.tax ? esc(fmtEur(-s.tax)) : "—") + "</td>" +
        '<td class="num pos" style="text-align:right">' + esc(fmtEur(s.saved, { plus: true })) + "</td></tr>";
    }).join("")).join("");
    html += "</tbody></table></div>";
    html += '<p class="tiny muted" style="margin:11px 0 0">La plus-value est figée à sa valeur du jour, ' +
      "volontairement : l’écart montré ne vient que du calendrier fiscal, pas d’un rendement supposé. " +
      "En pratique le gain continue d’évoluer, à la hausse comme à la baisse — un placement qu’on garde " +
      "pour son seul avantage fiscal reste un placement qu’on garde.</p>";
  }

  html += '<p class="tiny muted" style="margin:11px 0 0">Rien n’est prélevé sur un gain latent : ' +
    "l’impôt ne se déclenche <b class='inl'>qu’au retrait</b>, et seulement sur la part de gain retirée. " +
    "Le barème progressif reste une option, parfois plus favorable que la flat tax selon vos revenus.</p>";
  /* Un majorant annoncé vaut mieux qu'une précision fausse : les deux abattements qui
     manquent dépendent du foyer et de l'année de retrait, que l'application ne connaît pas. */
  const hasAv = taxed.some(x => x.t.regime.id === "av" && x.t.age != null && x.t.age >= 8);
  const hasImmo = taxed.some(x => x.t.regime.abatDuree);
  if (hasAv || hasImmo) {
    html += '<div class="note" style="margin-top:12px">' +
      (hasImmo ? "L’<b class='inl'>abattement pour durée de détention</b> est déduit des taux immobiliers : " +
        "il ne dépend que de la durée, donc de rien qu’il faille supposer. Il court dès la 6ᵉ année, éteint " +
        "l’impôt sur le revenu à 22 ans de détention et les prélèvements sociaux à 30 ans." : "") +
      (hasAv ? (hasImmo ? " En revanche, l" : "L") + "es <b class='inl'>4 600 € d’abattement annuel</b> de " +
        "l’assurance-vie ne sont pas déduits : ils se comptent sur le foyer (9 200 € pour un couple) et sur " +
        "l’ensemble des contrats, tous deux hors de portée de l’application. Après 8 ans, un rachat modeste " +
        "peut donc ne coûter que les 17,2 % de prélèvements sociaux, et l’étaler sur deux années civiles " +
        "double l’abattement." : "") +
      "</div>";
  }
  html += '<div class="note" style="margin-top:12px">Taux 2026. Les prélèvements sociaux sur les revenus ' +
    "de placement sont passés à <b class='inl'>18,6 %</b>, la CSG ayant été portée à 10,6 % : la flat tax " +
    "vaut donc 31,4 % et non plus 30 %. Le taux de 17,2 % reste celui de l’assurance-vie, du PEL, du CEL, " +
    "du PEP et des plus-values immobilières.</div>";
  const vague = taxed.filter(x => x.t.approx);
  if (vague.length) {
    html += '<div class="note warn" style="margin-top:12px">' + icon("warn") +
      " Le taux de <b>" + esc(vague.map(x => x.a.name).join(", ")) + "</b> dépend de l’ancienneté, et " +
      (vague.length > 1 ? "leurs dates d’ouverture ne sont pas renseignées" : "sa date d’ouverture n’est pas renseignée") +
      " : elle est déduite de la plus ancienne donnée connue, ce qui rajeunit le compte et alourdit le taux. " +
      "Corrigez-la dans <b class='inl'>Comptes › Réglages des comptes</b>.</div>";
  }
  if (taxed.some(x => x.t.regime.warnCapital)) {
    html += '<div class="note warn" style="margin-top:12px">' + icon("warn") +
      " Sur un <b>PER</b>, l’impôt ci-dessus ne couvre que les gains. Les versements, déduits de vos revenus " +
      "à l’entrée, s’ajouteront à votre revenu imposable au moment de la sortie en capital : cette part-là " +
      "dépend de votre tranche marginale et n’est pas chiffrée ici.</div>";
  }
  return html + "</div>";
}

function viewPatAnalyse() {
  const accounts = DB.patAccounts || [];
  const month = UI.patMonth, year = yearOf(month + "-01");
  let html = patTopbar("Analyse du patrimoine");
  if (!accounts.length) return html + patNoAccounts("Il n’y a rien à analyser tant qu’aucun compte n’est suivi.");

  const total = patTotalAt(month);
  const alloc = patAllocByType(month);
  const conc = patConcentration(month);

  /* --- Répartition --- */
  html += '<div class="patgrid"><div class="card"><div class="chead"><h2>Répartition</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">par classe d’actif</span></div>';
  if (!alloc.length) {
    html += '<div class="empty" style="padding:22px 14px">Aucune valorisation pour ' + esc(monthLabel(month)) + ".</div>";
  } else {
    html += '<div class="allocbar">' + alloc.map(x =>
      '<i style="width:' + x.pct.toFixed(2) + "%;background:" + patTypeColor(x.type) + '" title="' +
      esc(patTypeName(x.type) + " · " + fmtEur(x.value)) + '"></i>').join("") + "</div>";
    html += '<div class="alloclist">' + alloc.map(x =>
      '<span><i class="sw" style="background:' + patTypeColor(x.type) + '"></i><em>' + esc(patTypeName(x.type)) +
      "</em><b>" + esc(fmtRate(x.pct)) + "</b></span>").join("") + "</div>";
    /* Les parts « risqué / sécurisé / liquide / bloqué » ont été retirées : sans allocation
       cible à confronter, un pourcentage brut n'appelle aucune décision. Ce qui reste utile
       de cette information est déjà dit ailleurs — la part mobilisable dans l'épargne de
       précaution, la ligne trop lourde dans l'alerte ci-dessous. */
    if (conc && conc.pct >= 40 && conc.count > 1) {
      html += '<div class="note warn" style="margin-top:12px">' + icon("warn") + " <b>" + esc(conc.top.a.name) +
        "</b> pèse " + esc(fmtRate(conc.pct)) + " du patrimoine. Une ligne aussi lourde fait porter l’essentiel du risque sur une seule décision.</div>";
    }
  }
  html += "</div>";

  /* --- Détail par compte, teintes nuancées à l'intérieur d'une classe --- */
  const withVal = accounts.map(a => ({ a, v: patAccountValue(a.id, month) || 0 }))
    .filter(x => x.v > 0).sort((x, y) => y.v - x.v);
  html += '<div class="card"><div class="chead"><h2>Par compte</h2></div>';
  html += withVal.length ? withVal.map(({ a, v }) => {
    const pct = total ? v / total * 100 : 0;
    return '<div style="display:grid;grid-template-columns:1fr 74px;gap:10px;align-items:center;padding:5px 0">' +
      '<div style="min-width:0"><div class="tiny" style="margin-bottom:3px;display:flex;align-items:center;gap:7px">' +
        patSwatch(a) + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(a.name) +
        '</span><span class="muted">' + esc(fmtEur(v)) + "</span></div>" +
      '<div class="hbar"><i style="width:' + pct.toFixed(1) + "%;background:" + patAccountColor(a) + '"></i></div></div>' +
      '<span class="num tiny muted" style="text-align:right">' + esc(fmtRate(pct)) + "</span></div>";
  }).join("") : '<div class="empty" style="padding:22px 14px">Aucun compte valorisé.</div>';
  html += "</div></div>";

  /* --- Performance et plus-value, avec les années côte à côte ---
     Comparer 2024, 2025 et 2026 sur une même ligne montre d'un coup quelles enveloppes
     tiennent la distance et lesquelles ne doivent leur bilan qu'à une bonne année. */
  /* La première année de l'historique n'a pas de borne de départ : sa colonne serait vide
     de haut en bas. On ne garde que les années réellement comparables. */
  const perfYears = patYearsWithData().filter(y => y <= year && patAnnualPerf(null, y) != null).slice(-4);
  const rows = accounts.map(a => ({
    a, v: patAccountValue(a.id, month), u: patUnrealized(a.id, month),
    pm: patMonthlyPerf(a.id, month),
    ys: perfYears.map(y => patAnnualPerf(a.id, y)),
    complete: patInvestedIsComplete(a.id),
  })).filter(x => x.v != null || x.u);
  const orphans = patOrphanMovements();
  const totU = patUnrealized(null, month);
  /* Deux questions différentes, donc deux tableaux : « combien vaut chaque compte et
     qu'a-t-il rapporté depuis l'origine », puis « comment il se comporte année par année ».
     Les mélanger donnait sept colonnes de chiffres où l'œil ne se posait nulle part. */
  rows.sort((x, y) => (y.v || 0) - (x.v || 0));
  html += '<div class="card"><div class="chead"><h2>Où en est chaque compte</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">' + esc(monthLabel(month)) + "</span></div>";
  if (!rows.length) {
    html += '<div class="empty" style="padding:22px 14px">Aucune valorisation à comparer.</div>';
  } else {
    html += '<div style="overflow-x:auto"><table class="ops patnum"><thead><tr><th>Compte</th>' +
      '<th style="text-align:right">Valeur</th><th style="text-align:right">Versé</th>' +
      '<th style="text-align:right">Plus-value</th></tr></thead><tbody>';
    html += rows.map(r =>
      '<tr><td><span style="display:flex;align-items:center;gap:8px">' + patSwatch(r.a) + esc(r.a.name) +
        (r.u && !r.complete ? ' <span class="tiny muted" title="Les mouvements ne remontent pas à l’ouverture du compte : la plus-value est surévaluée.">≈</span>' : "") +
        "</span></td>" +
      '<td class="num" style="text-align:right">' + (r.v == null ? "—" : esc(fmtEur(r.v))) + "</td>" +
      '<td class="num muted" style="text-align:right">' + (r.u ? esc(fmtEur(r.u.invested)) : "—") + "</td>" +
      '<td class="num ' + (!r.u ? "muted" : r.u.gain >= 0 ? "pos" : "neg") + '" style="text-align:right">' +
        (r.u ? esc(fmtEur(r.u.gain, { plus: true })) + ' <span class="tiny">(' + esc(fmtPerf(r.u.rate)) + ")</span>" : "—") +
        "</td></tr>").join("");
    if (totU) {
      html += '<tr><td style="font-weight:650">Ensemble</td>' +
        '<td class="num" style="text-align:right;font-weight:650">' + esc(fmtEur(totU.value)) + "</td>" +
        '<td class="num muted" style="text-align:right">' + esc(fmtEur(totU.invested)) + "</td>" +
        '<td class="num ' + (totU.gain >= 0 ? "pos" : "neg") + '" style="text-align:right;font-weight:650">' +
        esc(fmtEur(totU.gain, { plus: true })) + ' <span class="tiny">(' + esc(fmtPerf(totU.rate)) + ")</span></td></tr>";
    }
    html += "</tbody></table></div>" +
      '<p class="tiny muted" style="margin:11px 0 0">La <b class=\'inl\'>plus-value</b> compare ce que vous avez versé à ce que le compte vaut : c’est le seul chiffre qui dit si une ligne a rapporté quelque chose depuis son ouverture.</p>';
    /* Des mouvements sans aucune valorisation en face fausseraient toute la performance :
       ils sont écartés des calculs, et on dit lesquels plutôt que de les faire disparaître. */
    if (orphans) {
      html += '<div class="note warn" style="margin-top:12px">' + icon("warn") +
        " <b>" + esc(orphans.rows.map(r => r.a.name).join(", ")) + "</b> " +
        (orphans.rows.length > 1 ? "portent" : "porte") + " des mouvements (" +
        esc(fmtEur(orphans.net, { plus: true })) + " au total) mais aucune valorisation. " +
        "Ces comptes sont exclus des calculs : sans valeur en face, un retrait s’y compterait comme un gain. " +
        "Saisissez leurs valorisations, ou supprimez-les s’ils ne servent plus.</div>";
    }
  }
  html += "</div>";

  /* --- Performance année par année ---
     La meilleure année de chaque compte est mise en avant : c'est elle qu'on cherche quand
     on parcourt une ligne, et sans repère visuel il faut comparer les chiffres un à un. */
  if (rows.length && perfYears.length) {
    /* Deux lectures du même écart : le taux dit si le placement est bon, le montant dit ce
       qu'il pèse dans le patrimoine. Un bascule plutôt que deux tableaux côte à côte. */
    const inEur = UI.patYearUnit === "eur";
    const cell = v => inEur
      ? '<td class="num ' + (v == null ? "muted" : v > 0.005 ? "pos" : v < -0.005 ? "neg" : "muted") +
        '" style="text-align:right">' + (v == null ? "—" : esc(fmtEur(v, { plus: true }))) + "</td>"
      : perfCell(v);
    html += '<div class="card"><div class="chead"><h2>Performance année par année</h2>' +
      '<div class="spacer" style="flex:1"></div>' +
      '<div class="seg"><button class="' + (inEur ? "" : "on") + '" data-act="patyearunit" data-unit="pct">%</button>' +
      '<button class="' + (inEur ? "on" : "") + '" data-act="patyearunit" data-unit="eur">€</button></div></div>' +
      '<div style="overflow-x:auto"><table class="ops patnum"><thead><tr><th>Compte</th>' +
      '<th style="text-align:right">Mois</th>' +
      perfYears.map(y => '<th style="text-align:right"' + (y === year ? ' class="curyear"' : "") + ">" +
        y + (y === year ? " *" : "") + "</th>").join("") + "</tr></thead><tbody>";
    html += rows.map(r => {
      const vals = inEur ? perfYears.map(y => patAnnualGain(r.a.id, y)) : r.ys;
      const known = vals.filter(v => v != null);
      const bestY = known.length > 1 ? Math.max.apply(null, known) : null;
      return '<tr><td><span style="display:flex;align-items:center;gap:8px">' + patSwatch(r.a) + esc(r.a.name) +
        (r.a.perfExcluded ? ' <span class="tiny muted">(hors perf. globale)</span>' : "") + "</span></td>" +
        cell(inEur ? patMonthlyGain(r.a.id, month) : r.pm) +
        vals.map(v => {
          const star = bestY != null && v != null && v === bestY && v > 0;
          const cls = v == null ? "muted" : v > 0.005 ? "pos" : v < -0.005 ? "neg" : "muted";
          return '<td class="num ' + cls + (star ? " bestyear" : "") + '" style="text-align:right"' +
            (star ? ' title="Meilleure année de ce compte"' : "") + ">" +
            (v == null ? "—" : esc(inEur ? fmtEur(v, { plus: true }) : fmtPerf(v))) + "</td>";
        }).join("") + "</tr>";
    }).join("");
    html += '<tr><td style="font-weight:650">Ensemble</td>' +
      cell(inEur ? patMonthlyGain(null, month) : patMonthlyPerf(null, month)) +
      perfYears.map(y => cell(inEur ? patAnnualGain(null, y) : patAnnualPerf(null, y))).join("") + "</tr>";
    html += "</tbody></table></div>" +
      '<p class="tiny muted" style="margin:11px 0 0">La meilleure année de chaque compte est soulignée. ' +
      (inEur ? "Les montants sont les gains hors versements : ce que les placements ont ajouté d’eux-mêmes. "
             : "") +
      "L’année " + year + " est en cours (*), elle court de janvier à " + esc(monthLabel(month)) + ".</p></div>";
  }

  /* --- Effort d'épargne : le pont avec le Budget ---
     Répond à deux questions d'un coup : combien j'ai versé cette année, et est-ce que ça
     correspond à ce que mon budget a dégagé. L'écart entre les deux est le vrai sujet. */
  const effYears = patYearsWithData().filter(y => y <= year);
  const efforts = effYears.map(patSavingsEffort)
    .filter(e => e.versements !== 0 || e.offBudget !== 0 || e.hasBudget);
  if (efforts.length) {
    const firstYear = yearOf(allPatMonths(month)[0] + "-01");
    const anyBudget = efforts.some(e => e.hasBudget);
    const maxAmt = Math.max(1, ...efforts.map(e => Math.max(Math.abs(e.versements), Math.abs(e.balance || 0))));
    const offNames = (DB.patAccounts || []).filter(a => patIsOffBudget(a) && patIsValued(a)).map(a => a.name);
    const offTotal = efforts.reduce((s, e) => s + e.offBudget, 0);
    html += '<div class="card"><div class="chead"><h2>Effort d’épargne</h2>' +
      '<span class="help" tabindex="0" title="' + esc("La balance est ce que votre budget a dégagé sur l’année : revenus moins dépenses, sur les mois où un revenu est connu. Le versé est ce qui est parti du compte bancaire vers vos placements. Les enveloppes alimentées sur la fiche de paie en sont exclues : cet argent n’a jamais transité par le budget. L’écart n’est pas une erreur : c’est de l’argent resté sur le compte courant, ou des versements venus d’ailleurs.") +
      '">?</span><div class="spacer" style="flex:1"></div>' +
      '<span class="tiny muted">budget et patrimoine confrontés</span></div>';
    /* En-têtes courts : « Balance du budget » et « Versé au patrimoine » faisaient déborder
       le tableau à eux seuls. Le titre de la carte et l'aide portent déjà le sens. */
    html += '<div style="overflow-x:auto"><table class="ops patnum narrow"><thead><tr><th>Année</th>' +
      '<th style="text-align:right" title="Revenus moins dépenses de l’année">Budget</th>' +
      '<th style="text-align:right" title="Versements nets vers vos comptes de patrimoine">Versé</th>' +
      '<th style="text-align:right" title="Part de la balance effectivement placée">Placé</th>' +
      '<th style="text-align:right" title="Versé moins balance">Écart</th></tr></thead><tbody>';
    html += efforts.map(e => {
      const w = Math.abs(e.versements) / maxAmt * 100;
      return "<tr><td>" + e.year + (e.year === year ? " *" : "") +
        (e.year === firstYear ? ' <span class="tiny muted" title="Cette année contient la reprise initiale : le premier mouvement ne fait qu’enregistrer ce qui dormait déjà sur les comptes.">reprise</span>' : "") + "</td>" +
        '<td class="num ' + (!e.hasBudget ? "muted" : e.balance >= 0 ? "pos" : "neg") + '" style="text-align:right">' +
          (e.hasBudget ? esc(fmtEur(e.balance)) : "—") + "</td>" +
        '<td class="num" style="text-align:right">' + esc(fmtEur(e.versements)) + "</td>" +
        '<td style="text-align:right;white-space:nowrap">' +
          (e.placed == null ? '<span class="num muted">—</span>' :
            '<div style="display:inline-flex;align-items:center;gap:8px">' +
            '<div class="hbar" style="width:48px;flex:none"><i style="width:' + Math.min(100, e.placed).toFixed(0) +
            "%;background:" + (e.placed >= 90 ? "var(--pos)" : e.placed >= 60 ? "var(--accent)" : "var(--warn)") + '"></i></div>' +
            '<span class="num" style="white-space:nowrap">' + esc(fmtRate(e.placed)) + "</span></div>") + "</td>" +
        '<td class="num ' + (e.gap == null ? "muted" : Math.abs(e.gap) < 1 ? "muted" : e.gap > 0 ? "pos" : "warn") +
          '" style="text-align:right">' + (e.gap == null ? "—" : esc(fmtEur(e.gap, { plus: true }))) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
    const cur = efforts.filter(e => e.year === year)[0];
    if (cur && cur.hasBudget && cur.balance > 0) {
      html += '<p class="tiny muted" style="margin:11px 0 0">En ' + year + ", votre budget a dégagé <b class='inl'>" +
        esc(fmtEur(cur.balance)) + "</b> et vous en avez placé <b class='inl'>" + esc(fmtEur(cur.versements)) +
        "</b>. " + (cur.gap < -1
          ? "Les " + esc(fmtEur(-cur.gap)) + " d’écart sont restés quelque part — sur le compte courant le plus souvent, à moins que des dépenses n’aient échappé au classement."
          : cur.gap > 1
            ? "Vous avez placé " + esc(fmtEur(cur.gap)) + " de plus que ce que le budget a dégagé : une réserve entamée, ou des revenus absents du suivi."
            : "Les deux se rejoignent : tout ce que le budget dégage part effectivement au patrimoine.") + "</p>";
    } else if (!anyBudget) {
      html += '<p class="tiny muted" style="margin:11px 0 0">La balance du budget reste vide tant qu’aucun revenu n’est saisi : elle se renseigne mois par mois dans <b class=\'inl\'>Réglages</b>, et les dépenses arrivent par l’import des relevés.</p>';
    }
    /* Dire ce qui a été écarté et pourquoi : sans cela, la colonne « Versé » semblerait en
       contradiction avec le versé cumulé affiché plus haut. */
    if (offNames.length) {
      html += '<p class="tiny muted" style="margin:8px 0 0">' +
        esc(offNames.join(", ")) + (offNames.length > 1 ? " sont alimentés" : " est alimenté") +
        " sur la fiche de paie : " + (offTotal ? "leurs " + esc(fmtEur(offTotal)) + " de versements ne sont" : "ces versements ne sont") +
        " pas comptés ici, cet argent n’ayant jamais transité par le budget. Il reste bien dans le versé cumulé et dans la plus-value. " +
        "Un compte alimenté par virement volontaire se rebascule dans <b class='inl'>Comptes → Réglages des comptes</b>.</p>";
    }
    html += "</div>";
  }

  /* --- Rendement d'ensemble --- */
  const first = allPatMonths(month)[0];
  const twr = first && first < month ? patTWR(first, month) : null;
  const perfs = allPatMonths(month).map(mk => ({ mk, r: patMonthlyPerf(null, mk) })).filter(x => x.r != null);
  html += '<div class="card"><div class="chead"><h2>Rendement d’ensemble</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">performances mensuelles enchaînées</span></div>';
  if (!twr) {
    html += '<div class="empty" style="padding:22px 14px">Il faut au moins deux mois valorisés.</div>';
  } else {
    const real = patRealRate(twr.annualized);
    const best = perfs.slice().sort((a, b) => b.r - a.r)[0], worst = perfs.slice().sort((a, b) => a.r - b.r)[0];
    const up = perfs.filter(p => p.r > 0).length;
    html += '<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="eyebrow">Cumulé</div>' +
      '<div class="v num ' + (twr.cumul >= 0 ? "pos" : "neg") + '">' + esc(fmtPerf(twr.cumul)) + "</div>" +
      '<div class="s">' + twr.months + " mois</div></div>" +
      '<div class="kpi"><div class="eyebrow">Annualisé</div><div class="v num ' + (twr.annualized >= 0 ? "pos" : "neg") + '">' +
      esc(fmtPerf(twr.annualized)) + '</div><div class="s">par an</div></div>' +
      '<div class="kpi"><div class="eyebrow">Net d’inflation</div><div class="v num ' + (real >= 0 ? "pos" : "neg") + '">' +
      esc(fmtPerf(real)) + '</div><div class="s">à ' + esc(fmtRate(Number(DB.settings.inflation) || 0)) + " d’inflation</div></div></div>";

    /* Une case par mois, verte ou rouge selon le signe, d'autant plus foncée que le mois
       a été marquant. On voit ainsi *quand* les choses se sont passées — une barre de
       proportion ne disait que « combien », ce qui n'apprend presque rien. */
    const byYear = {};
    perfs.forEach(p => { const y = +p.mk.slice(0, 4); (byYear[y] = byYear[y] || {})[+p.mk.slice(5, 7)] = p.r; });
    const years = Object.keys(byYear).map(Number).sort();
    const scale = Math.max(1, ...perfs.map(p => Math.abs(p.r)));
    const gridHelp = "Une case par mois. Vert : le patrimoine a gagné ce mois-là, hors versements. " +
      "Rouge : il a perdu. Plus la case est foncée, plus le mois a été marqué. Survolez une case pour le détail.";
    html += '<div class="chead" style="margin:18px 0 10px"><h2 style="font-size:13px">Mois par mois</h2>' +
      '<span class="help" tabindex="0" title="' + esc(gridHelp) + '" aria-label="' + esc(gridHelp) + '">?</span>' +
      '<div class="spacer" style="flex:1"></div><span class="tiny muted">' + up + " mois gagnants sur " +
      perfs.length + "</span></div>";
    const MI = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
    html += '<div class="ygrid"><div class="grow ghead"><span></span>' +
      MI.map((m, i) => '<span class="gh" title="' + esc(MONTHS[i]) + '">' + m + "</span>").join("") +
      '<span class="gtot">année</span><span class="gcnt">gagnants</span></div>';
    html += years.map(y => {
      const l = byYear[y], keys = Object.keys(l).map(Number);
      const pos = keys.filter(m => l[m] > 0).length;
      const ya = patAnnualPerf(null, y);
      return '<div class="grow"><span class="gy">' + y + "</span>" +
        MI.map((_, i) => {
          const r = l[i + 1];
          if (r == null) return '<span class="gcell" title="' + esc(MONTHS[i] + " " + y + " — pas de donnée") + '"></span>';
          const int = 22 + Math.min(1, Math.abs(r) / scale) * 66;
          return '<span class="gcell on" style="background:color-mix(in oklab, var(--' + (r > 0 ? "pos" : "neg") +
            ") " + int.toFixed(0) + '%, var(--surface))" title="' +
            esc(MONTHS[i] + " " + y + " : " + fmtPerf(r)) + '"></span>';
        }).join("") +
        '<span class="gtot ' + perfClass(ya) + '">' + esc(fmtPerf(ya)) + "</span>" +
        '<span class="gcnt">' + pos + " / " + keys.length + "</span></div>";
    }).join("") + "</div>";
    html += '<p class="tiny muted" style="margin:14px 0 0">Le cumulé enchaîne les performances mois par mois : contrairement à un écart calculé de bout en bout, il ne dépend ni de la taille ni de la date de vos versements, et se compare donc à un indice.<br>' +
      (best ? "Votre meilleur mois reste <b class='inl'>" + esc(monthLabel(best.mk)) + "</b> à " + esc(fmtPerf(best.r)) + ", " : "") +
      (worst ? "le pire <b class='inl'>" + esc(monthLabel(worst.mk)) + "</b> à " + esc(fmtPerf(worst.r)) + "." : "") + "</p>";
  }
  html += "</div>";

  /* --- Performance mensuelle : le pourcentage, et ce qu'il pèse en euros ---
     Un même +2 % ne représente pas la même chose sur 15 000 € et sur 60 000 € : la barre
     cède un peu de largeur pour laisser place au montant. */
  const last12 = last12Months(month).map(mk => {
    const r = patMonthlyPerf(null, mk), prev = addMonth(mk, -1);
    const base = patPerfTotalAt(prev);
    return { mk, r, eur: r == null || base == null ? null : base * r / 100 };
  });
  const maxAbs = Math.max(1, ...last12.map(x => Math.abs(x.r || 0)));
  html += '<div class="card"><div class="chead"><h2>Performance mensuelle</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">douze mois · axe centré sur zéro</span></div>' +
    last12.map(x => {
      const w = x.r == null ? 0 : Math.abs(x.r) / maxAbs * 50;
      const pos = x.r != null && x.r >= 0;
      /* Pourcentage et montant dans une seule cellule : deux colonnes séparées laissaient
         croire à deux mesures, alors que la seconde ne fait que traduire la première. */
      return '<div class="dvrow"><span class="muted">' + MONTHS_SHORT[+x.mk.slice(5, 7) - 1] + "</span>" +
        '<div class="dvtrack">' + (x.r == null ? "" :
          '<i style="' + (pos ? "left:50%" : "right:50%") + ";width:" + w.toFixed(2) + "%;background:" +
          (pos ? "var(--pos)" : "var(--neg)") + '"></i>') + "</div>" +
        '<span class="dvval"><b class="num ' + perfClass(x.r) + '">' + esc(fmtPerf(x.r)) + "</b>" +
        '<em class="num">' + (x.eur == null ? "" : esc(fmtEur(x.eur, { plus: true }))) + "</em></span></div>";
    }).join("") + "</div>";

  /* --- Ce que l'impôt prendrait, en dernier ---
     La fiscalité ne se lit pas en passant : elle ferme l'écran, après que la performance a
     dit ce que le patrimoine a gagné. C'est aussi la seule carte qui parle d'un montant
     qu'on ne possède pas encore vraiment. */
  if (rows.length) html += patTaxCard(rows, month);
  return html;
}

/* ---- Comptes : l'écran où l'on saisit ----------------------------------- */
function viewPatrimoine() {
  const accounts = DB.patAccounts || [];
  const month = UI.patMonth;
  let html = patTopbar("Comptes",
    '<button class="btn sm" data-act="newpataccount">' + icon("plus") + "Compte</button>" +
    '<button class="btn sm ghost" data-act="patimportcsv">' + icon("down", 16) + "Importer CSV Excel</button>");
  if (!accounts.length) return html + patNoAccounts("Créez un compte pour commencer à saisir vos valorisations mensuelles, ou reprenez votre historique depuis un export Excel.");

  /* La saisie ne porte que sur les comptes vivants. Les clôturés restent consultables sous
     un repli : leur histoire compte encore dans les performances passées. */
  const active = patActiveAccounts(), closed = accounts.filter(patIsClosed);
  const shown = UI.patShowInactive ? active.concat(closed) : active;
  const missing = active.filter(a => ((DB.patValues || {})[a.id] || {})[month] == null);

  /* --- Saisie du mois, les comptes manquants en tête --- */
  html += '<div class="card"><div class="chead"><h2>Valorisations de ' + esc(monthLabel(month)) + "</h2>" +
    '<div class="spacer" style="flex:1"></div>' +
    (missing.length
      ? '<span class="tag" style="color:var(--warn);border-color:var(--warn)">' + missing.length + " à saisir</span>"
      : '<span class="tag" style="color:var(--pos);border-color:var(--pos)">' + icon("check", 13) + " complet</span>") + "</div>";
  const order = active.slice().sort((a, b) => {
    const ma = ((DB.patValues || {})[a.id] || {})[month] == null ? 0 : 1;
    const mb = ((DB.patValues || {})[b.id] || {})[month] == null ? 0 : 1;
    if (ma !== mb) return ma - mb;
    return (patAccountValue(b.id, month) || 0) - (patAccountValue(a.id, month) || 0);
  });
  html += '<div class="acards">' + order.map(a => {
    const raw = ((DB.patValues || {})[a.id] || {})[month];
    const pm = patMonthlyPerf(a.id, month), u = patUnrealized(a.id, month);
    const prev = patAccountValue(a.id, addMonth(month, -1));
    return '<div class="acard ' + (raw == null ? "todo" : "") + '" style="--ac:' + patAccountColor(a) + '">' +
      '<button class="iconbtn go" data-act="patopenacct" data-id="' + a.id + '" title="Voir le détail du compte">' +
        icon("right", 14) + "</button>" +
      '<span class="an">' + patSwatch(a) + "<em>" + esc(a.name) + "</em></span>" +
      '<input type="number" step="10" inputmode="decimal" value="' + (raw != null ? raw : "") +
        '" placeholder="' + (prev != null ? Math.round(prev) : "—") + '" data-chg="patvalue" data-id="' + a.id +
        '" aria-label="Valorisation de ' + esc(a.name) + ' en ' + esc(monthLabel(month)) + '">' +
      '<span class="am">' +
        (raw == null && prev != null ? '<span class="muted">' + esc(monthLabel(addMonth(month, -1))) + " : " + esc(fmtEur(prev)) + "</span>"
          : '<span>mois <b class="' + (pm == null ? "muted" : pm >= 0 ? "pos" : "neg") + '">' + esc(fmtPerf(pm)) + "</b></span>") +
        (u ? '<span>P/V <b class="' + (u.gain >= 0 ? "pos" : "neg") + '">' + esc(fmtEur(u.gain, { plus: true })) + "</b></span>" : "") +
      "</span></div>";
  }).join("") + "</div>";
  if (!order.length) {
    html += '<div class="empty" style="padding:22px 14px">Tous vos comptes sont clôturés.</div>';
  }
  if (closed.length) {
    html += '<div style="margin-top:12px"><button class="btn sm ghost" data-act="pattoggleinactive">' +
      (UI.patShowInactive ? "Masquer" : "Afficher") + " les " + closed.length + " compte(s) clôturé(s)</button></div>";
  }
  html += "</div>";

  /* --- Réglages des comptes, hors du chemin de saisie --- */
  html += '<div class="card"><div class="chead"><h2>Réglages des comptes</h2></div>' +
    '<div style="overflow-x:auto"><table class="ops"><thead><tr><th>Nom</th><th>Classe</th>' +
    '<th style="text-align:center" title="Inclure ce compte dans la performance globale">Perf. globale</th>' +
    '<th style="text-align:center" title="Coché si l’argent arrive directement dans l’enveloppe, sans passer par votre compte bancaire — un PEE ou un PER d’entreprise. Ces versements sont alors exclus de la comparaison avec le budget.">Hors budget</th>' +
    '<th title="Le taux d’imposition dépend de l’ancienneté du plan : 5 ans pour un PEA, 8 ans pour une assurance-vie. Sans cette date, l’application prend la plus ancienne donnée connue, ce qui rajeunit le compte et alourdit le taux.">Ouvert le</th>' +
    '<th title="Le régime fiscal appliqué à la plus-value. « D’après la classe » suffit dans la plupart des cas ; à corriger pour un livret bancaire fiscalisé, ou pour distinguer une résidence principale (exonérée) d’un bien locatif.">Fiscalité</th>' +
    '<th style="text-align:center">État</th><th></th></tr></thead><tbody>' +
    active.concat(closed).map(a => {
      const isClosed = patIsClosed(a), neverValued = !patIsValued(a);
      const open = patOpenedMonth(a), auto = taxRegime(TAX_BY_TYPE[patType(a.type).id] || "pfu");
      return '<tr' + (isClosed ? ' class="rowoff"' : "") + '><td><span style="display:flex;align-items:center;gap:8px">' +
        patSwatch(a) + esc(a.name) + "</span></td>" +
      '<td><select data-chg="pataccounttype" data-id="' + a.id + '">' +
        PAT_TYPES.map(t => '<option value="' + t.id + '"' + (t.id === patType(a.type).id ? " selected" : "") + ">" +
          esc(t.name) + "</option>").join("") + "</select></td>" +
      '<td style="text-align:center"><input type="checkbox" data-chg="patperfexcluded" data-id="' + a.id + '" ' +
        (a.perfExcluded ? "" : "checked") + ' title="Inclure dans le calcul de performance"></td>' +
      '<td style="text-align:center"><input type="checkbox" data-chg="patoffbudget" data-id="' + a.id + '" ' +
        (patIsOffBudget(a) ? "checked" : "") + ' title="Alimenté hors du compte bancaire"></td>' +
      /* Le mois déduit part en placeholder : l'hypothèse en cours reste visible, sans se
         faire passer pour une saisie — et vider le champ y ramène. */
      '<td><input type="month" data-chg="patopened" data-id="' + a.id + '" value="' + esc(a.opened || "") + '"' +
        (open.mk && !open.exact ? ' placeholder="' + esc(open.mk) + '" title="Déduit de la plus ancienne donnée connue (' +
          esc(monthLabel(open.mk)) + '). Saisissez la vraie date d’ouverture si elle est antérieure."' : "") + "></td>" +

          esc(r.name) + "</option>").join("") + "</select></td>" +

        (neverValued
          ? '<span class="tag" title="Aucune valorisation n’a jamais été saisie sur ce compte.">jamais valorisé</span>'

            (a.closed ? "Rouvrir" : "Clôturer") + "</button>") + "</td>" +
      '<td style="text-align:right"><button class="iconbtn danger" title="Supprimer le compte et tout son historique" data-act="delpataccount" data-id="' +
        a.id + '">' + icon("trash", 14) + "</button></td></tr>";
    }).join("") +
    "</tbody></table></div>" +
    '<p class="tiny muted" style="margin:10px 0 0">La classe détermine la couleur du compte, sa place dans la répartition et son classement en risqué, sécurisé ou bloqué. ' +
    "<b class='inl'>Clôturer</b> retire le compte de la saisie mensuelle sans toucher à son historique : ses performances passées restent comptées. " +
    "Supprimer, au contraire, efface tout.</p>" +
    '<p class="tiny muted" style="margin:8px 0 0"><b class=\'inl\'>Ouvert le</b> et <b class=\'inl\'>Fiscalité</b> ne servent qu’à l’estimation d’impôt de l’onglet Analyse. ' +
    "La date compte parce que le taux dépend de l’ancienneté : un PEA franchit ses 5 ans, une assurance-vie ses 8 ans. " +
    "La fiscalité se déduit de la classe, sauf là où la classe ne tranche pas — un livret réglementé est exonéré, un livret bancaire non ; " +
    "une résidence principale est exonérée, un bien locatif non.</p></div>";

  html += patMovementsCard(accounts, null);
  return html;
}

/* Bloc mouvements, partagé entre l'écran Comptes et le détail d'un compte. */
function patMovementsCard(accounts, onlyAccountId) {
  const filter = onlyAccountId || UI.patMovFilter;
  let movs = (DB.patMovements || []).slice().sort((x, y) => y.date < x.date ? -1 : y.date > x.date ? 1 : 0);
  if (filter && filter !== "all") movs = movs.filter(m => m.accountId === filter);
  let html = '<div class="card"><div class="chead"><h2>Mouvements</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">dépôts et retraits, hors performance</span></div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px">' +
    '<div class="field"><label>Compte</label><select id="patmovaccount">' +
      accounts.map(a => '<option value="' + a.id + '"' + (onlyAccountId === a.id ? " selected" : "") + ">" +
        esc(a.name) + "</option>").join("") + "</select></div>" +
    '<div class="field"><label>Date</label><input type="date" id="patmovdate" value="' + todayISO() + '"></div>' +
    '<div class="field"><label>Montant (+ dépôt / − retrait)</label><input type="number" step="0.01" id="patmovamount"></div>' +
    '<button class="btn primary" data-act="addpatmovement">' + icon("plus") + "Ajouter</button></div>";
  if (!onlyAccountId && accounts.length > 1) {
    html += '<div class="pillrow" style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">' +
      '<span class="pill ' + (UI.patMovFilter === "all" ? "on" : "") + '" data-act="patmovfilter" data-id="all">Tous</span>' +
      accounts.filter(a => (DB.patMovements || []).some(m => m.accountId === a.id)).map(a =>
        '<span class="pill ' + (UI.patMovFilter === a.id ? "on" : "") + '" data-act="patmovfilter" data-id="' + a.id + '">' +
        esc(a.name) + "</span>").join("") + "</div>";
  }
  if (!movs.length) {
    html += '<div class="empty" style="padding:22px 14px">Aucun mouvement' + (filter && filter !== "all" ? " sur ce compte" : "") + ".</div>";
  } else {
    html += '<div style="overflow-x:auto"><table class="ops"><thead><tr><th>Date</th>' +
      (onlyAccountId ? "" : "<th>Compte</th>") + '<th style="text-align:right">Montant</th><th></th></tr></thead><tbody>' +
      movs.map(m => {
        const a = accounts.find(x => x.id === m.accountId);
        return "<tr><td>" + esc(m.date.split("-").reverse().join("/")) +
          (m.tx ? ' <span class="tag lnk" title="Créé en classant un virement interne dans le budget">budget</span>' : "") + "</td>" +
          (onlyAccountId ? "" : '<td><span style="display:flex;align-items:center;gap:8px">' +
            (a ? patSwatch(a) : "") + esc(a ? a.name : "—") + "</span></td>") +
          '<td class="num ' + (m.amount >= 0 ? "" : "neg") + '" style="text-align:right;font-weight:600">' +
            esc(fmtEur(m.amount, { plus: true })) + "</td>" +
          '<td style="text-align:right"><button class="iconbtn danger" title="Supprimer" data-act="delpatmovement" data-id="' +
            m.id + '">' + icon("trash", 14) + "</button></td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  return html + "</div>";
}

/* ---- Détail d'un compte -------------------------------------------------- */
function viewPatAccount() {
  const a = (DB.patAccounts || []).find(x => x.id === UI.patAccount);
  if (!a) { UI.view = "pat"; return viewPatrimoine(); }
  const month = UI.patMonth, year = yearOf(month + "-01");
  const v = patAccountValue(a.id, month), u = patUnrealized(a.id, month);
  const pm = patMonthlyPerf(a.id, month), py = patAnnualPerf(a.id, year);

  let html = '<div class="topbar"><button class="btn sm ghost" data-act="patback">' + icon("left", 14) + "Comptes</button>" +
    '<h1 style="display:flex;align-items:center;gap:10px">' + patSwatch(a, 12) + esc(a.name) + "</h1>" +
    '<span class="tag">' + esc(patTypeName(patType(a.type).id)) + "</span>" +
    '<div class="periodnav"><button data-act="prev" aria-label="Mois précédent">' + icon("left") + "</button>" +
    '<span class="label">' + esc(monthLabel(month)) + "</span>" +
    '<button data-act="next" aria-label="Mois suivant">' + icon("right") + "</button></div>" +
    '<div class="spacer" style="flex:1"></div></div>';

  html += '<div class="kpis"><div class="kpi"><div class="eyebrow">Valorisation</div>' +
    '<div class="v num">' + (v == null ? "—" : esc(fmtEur(v))) + '</div><div class="s">' + esc(monthLabel(month)) + "</div></div>" +
    '<div class="kpi"><div class="eyebrow">Versé cumulé</div><div class="v num">' +
      (u ? esc(fmtEur(u.invested)) : "—") + '</div><div class="s">dépôts nets des retraits</div></div>' +
    '<div class="kpi"><div class="eyebrow">Plus-value</div><div class="v num ' +
      (!u ? "" : u.gain >= 0 ? "pos" : "neg") + '">' + (u ? esc(fmtEur(u.gain, { plus: true })) : "—") + "</div>" +
      '<div class="s">' + (u ? esc(fmtPerf(u.rate)) + " depuis l’origine" : "versements inconnus") + "</div></div>" +
    '<div class="kpi"><div class="eyebrow">Performance</div><div class="v num ' +
      (pm == null ? "" : pm >= 0 ? "pos" : "neg") + '">' + esc(fmtPerf(pm)) + "</div>" +
      '<div class="s">' + esc(fmtPerf(py)) + " sur " + year + "</div></div></div>";

  if (u && !patInvestedIsComplete(a.id)) {
    html += '<div class="note warn">' + icon("warn") +
      " Le premier mouvement enregistré est postérieur à la première valorisation : l’apport initial manque, donc la plus-value affichée est surévaluée.</div>";
  }

  /* --- Valeur contre versements cumulés : l'écart entre les deux, c'est le gain --- */
  const months = allPatMonths(month).filter(mk => patAccountValue(a.id, mk) != null || patInvested(a.id, mk) !== 0);
  if (months.length > 1) {
    const pts = months.map(mk => ({ mk, v: patAccountValue(a.id, mk) || 0, inv: patInvested(a.id, mk) }));
    const max = Math.max(1, ...pts.map(p => Math.max(p.v, p.inv)));
    const W = 640, H = 150, PAD = 6;
    const X = i => (pts.length === 1 ? 0 : i / (pts.length - 1) * W);
    const Y = val => H - PAD - (val / max) * (H - PAD * 2);
    const path = key => pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p[key]).toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    html += '<div class="card"><div class="chead"><h2>Valeur et versements</h2>' +
      '<div class="spacer" style="flex:1"></div><span class="tiny muted">depuis ' + esc(monthLabel(months[0])) + "</span></div>" +
      '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" role="img" aria-label="' +
        esc("Valorisation de " + a.name + " et versements cumulés, de " + monthLabel(months[0]) + " à " + monthLabel(month)) +
        '" style="display:block;overflow:visible">' +
      '<path d="' + path("v") + " L" + W + "," + H + " L0," + H + ' Z" fill="' + patAccountColor(a) + '" fill-opacity=".16"/>' +
      '<path d="' + path("v") + '" fill="none" stroke="' + patAccountColor(a) + '" stroke-width="2"/>' +
      '<path d="' + path("inv") + '" fill="none" stroke="var(--ink-mute)" stroke-width="1.4" stroke-dasharray="4 3"/>' +
      "</svg>" +
      '<div class="legend" style="margin-top:10px">' +
        '<span><i class="sw" style="background:' + patAccountColor(a) + '"></i>Valeur <b>' + esc(fmtEur(last.v)) + "</b></span>" +
        '<span><i class="sw" style="background:var(--ink-mute)"></i>Versé cumulé <b>' + esc(fmtEur(last.inv)) + "</b></span>" +
      "</div></div>";
  }

  /* --- Performance mois par mois --- */
  const last12 = last12Months(month).map(mk => ({ mk, r: patMonthlyPerf(a.id, mk) }));
  const maxAbs = Math.max(1, ...last12.map(x => Math.abs(x.r || 0)));
  html += '<div class="card"><div class="chead"><h2>Performance mensuelle</h2>' +
    '<div class="spacer" style="flex:1"></div><span class="tiny muted">douze mois</span></div>' +
    last12.map(x => {
      const w = x.r == null ? 0 : Math.abs(x.r) / maxAbs * 50;
      const pos = x.r != null && x.r >= 0;
      return '<div class="dvrow"><span class="muted">' + MONTHS_SHORT[+x.mk.slice(5, 7) - 1] + "</span>" +
        '<div class="dvtrack">' + (x.r == null ? "" :
          '<i style="' + (pos ? "left:50%" : "right:50%") + ";width:" + w.toFixed(2) + "%;background:" +
          (pos ? "var(--pos)" : "var(--neg)") + '"></i>') + "</div>" +
        '<span class="num ' + (x.r == null ? "muted" : pos ? "pos" : "neg") + '" style="text-align:right">' +
        esc(fmtPerf(x.r)) + "</span></div>";
    }).join("") + "</div>";

  html += patMovementsCard(DB.patAccounts || [], a.id);
  return html;
}

/* ---- Crédits ------------------------------------------------------------- */
function viewPatCredits() {
  const month = UI.patMonth;
  const liabs = DB.patLiabilities || [];
  let html = patTopbar("Crédits",
    '<button class="btn sm" data-act="newpatliability">' + icon("plus") + "Crédit</button>");

  const gross = patTotalAt(month), debt = patDebtTotalAt(month);
  html += '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">' +
    '<div class="kpi"><div class="eyebrow">Actifs</div><div class="v num">' + esc(fmtEur(gross)) + "</div>" +
      '<div class="s">' + esc(monthLabel(month)) + "</div></div>" +
    '<div class="kpi"><div class="eyebrow">Capital restant dû</div><div class="v num ' + (debt ? "neg" : "") + '">' +
      esc(fmtEur(debt)) + '</div><div class="s">' + liabs.length + " crédit(s)</div></div>" +
    '<div class="kpi"><div class="eyebrow">Patrimoine net</div><div class="v num">' + esc(fmtEur(gross - debt)) + "</div>" +
      '<div class="s">actifs moins dettes</div></div></div>';

  if (!liabs.length) {
    html += '<div class="card"><div class="empty"><b>Aucun crédit enregistré</b>' +
      "Tant qu’aucun passif n’est saisi, le patrimoine affiché est brut. Un bien financé à crédit vaut, pour vous, sa valeur moins le capital qui reste à rembourser.</div></div>";
    return html;
  }

  html += liabs.map(l => {
    const bal = patDebtAt(l.id, month);
    const share = l.share == null ? 100 : Number(l.share);
    const initial = l.mode === "auto" ? (Number(l.principal) || 0) * share / 100 : null;
    const done = initial ? Math.min(100, Math.max(0, (1 - bal / initial) * 100)) : null;
    const elapsed = l.start ? patMonthsBetween(l.start, month) : null;
    const left = l.mode === "auto" && l.months ? Math.max(0, Number(l.months) - (elapsed || 0)) : null;
    return '<div class="card"><div class="chead"><h2>' + esc(l.name || "Crédit") + "</h2>" +
      '<div class="spacer" style="flex:1"></div>' +
      '<span class="num" style="font-weight:650">' + esc(fmtEur(bal)) + "</span>" +
      '<button class="iconbtn danger" title="Supprimer ce crédit" data-act="delpatliability" data-id="' + l.id + '">' +
        icon("trash", 14) + "</button></div>" +
      (done != null ? '<div class="msbar"><i style="width:' + done.toFixed(1) + '%"></i></div>' +
        '<div class="tiny muted" style="display:flex;justify-content:space-between">' +
        "<span>" + esc(fmtRate(done)) + " remboursé</span>" +
        (left != null ? "<span>" + left + " mensualité(s) restante(s)</span>" : "<span></span>") + "</div>" : "") +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">' +
        '<div class="field" style="flex:2;min-width:150px"><label>Nom</label>' +
          '<input type="text" data-chg="patliab" data-id="' + l.id + '" data-f="name" value="' + esc(l.name || "") + '"></div>' +
        '<div class="field" style="flex:1;min-width:132px"><label>Suivi</label>' +
          '<select data-chg="patliab" data-id="' + l.id + '" data-f="mode">' +
          '<option value="auto"' + (l.mode !== "manual" ? " selected" : "") + ">Amortissement calculé</option>" +
          '<option value="manual"' + (l.mode === "manual" ? " selected" : "") + ">Saisie manuelle</option></select></div>" +
        '<div class="field" style="flex:1;min-width:110px"><label>Quote-part (%)</label>' +
          '<input type="number" step="1" min="0" max="100" data-chg="patliab" data-id="' + l.id + '" data-f="share" value="' +
          share + '"></div></div>' +
      (l.mode === "manual"
        ? '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">' +
            '<div class="field" style="flex:1;min-width:180px"><label>Capital restant dû en ' + esc(monthLabel(month)) + " (avant quote-part)</label>" +
            '<input type="number" step="100" data-chg="patdebtvalue" data-id="' + l.id + '" value="' +
            (((DB.patDebtValues || {})[l.id] || {})[month] != null ? DB.patDebtValues[l.id][month] : "") + '"></div></div>' +
          '<p class="tiny muted" style="margin:8px 0 0">Recopiez le montant de l’échéancier de votre banque, mois par mois. Le dernier montant saisi vaut pour les mois suivants.</p>'
        : '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">' +
            '<div class="field" style="flex:1;min-width:126px"><label>Capital emprunté</label>' +
              '<input type="number" step="1000" data-chg="patliab" data-id="' + l.id + '" data-f="principal" value="' +
              (l.principal || "") + '"></div>' +
            '<div class="field" style="flex:1;min-width:100px"><label>Taux annuel (%)</label>' +
              '<input type="number" step="0.05" data-chg="patliab" data-id="' + l.id + '" data-f="rate" value="' +
              (l.rate == null ? "" : l.rate) + '"></div>' +
            '<div class="field" style="flex:1;min-width:100px"><label>Durée (mois)</label>' +
              '<input type="number" step="12" data-chg="patliab" data-id="' + l.id + '" data-f="months" value="' +
              (l.months || "") + '"></div>' +
            '<div class="field" style="flex:1;min-width:120px"><label>Première échéance</label>' +
              '<input type="month" data-chg="patliab" data-id="' + l.id + '" data-f="start" value="' + esc(l.start || "") + '"></div></div>' +
          '<p class="tiny muted" style="margin:8px 0 0">Le capital restant dû est déroulé pour un prêt à mensualité constante. Il peut s’écarter de quelques euros de l’échéancier réel, qui dépend des arrondis de la banque.</p>') +
      "</div>";
  }).join("");
  return html;
}

/* =========================================================================
   Settings
   ========================================================================= */
function registerCat(c) { if (!CAT_BY_ID[c.id]) { CATS.push(c); CAT_BY_ID[c.id] = c; } }
/* Backups exported before the customCats fix don't carry custom category
   definitions, so a restored tx can point at an id nothing declares. Rebuild
   a placeholder from the bank's own label rather than let lookups crash. */
function recoverMissingCats(db) {
  const known = new Set((db.customCats || []).map(c => c.id));
  db.tx.forEach(t => {
    if (!t.cat || CAT_BY_ID[t.cat] || known.has(t.cat)) return;
    const c = { id: t.cat, group: "g_legacy", name: t.bankCat || t.cat, custom: true, recovered: true };
    registerCat(c);
    db.customCats = db.customCats || []; db.customCats.push(c);
    known.add(t.cat);
  });
}
function newCatId(name) {
  let base = "x_" + normalize(name).replace(/ /g, "_").slice(0, 22) || "x_cat";
  let id = base, n = 2; while (CAT_BY_ID[id]) id = base + "_" + n++;
  return id;
}
function createCategory(name, groupId) {
  const c = { id: newCatId(name), group: groupId, name: name.trim(), custom: true };
  registerCat(c);
  DB.customCats = DB.customCats || []; DB.customCats.push(c);
  saveDB(); return c;
}
