<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget</title>
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#FAFBFC; --raised:#FFFFFF;
  --ink:#131722; --ink-2:#4A5263;
  --ink-soft:#5A6272; --ink-mute:#8A92A3;
  --line:#E3E6EC; --line-2:#EEF0F4;
  --accent:#3B5BDB; --accent-soft:#EDF0FD; --accent-ink:#2A45B0;
  --pos:#0F7A55; --pos-soft:#E6F4EE;
  --neg:#C1272D; --neg-soft:#FBECEC;
  --warn:#9A6700; --warn-soft:#FFF6E0;
  --focus:#3B5BDB;
  --radius:10px; --radius-sm:7px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A22; --surface-2:#1B2029; --raised:#1E242E;
  --ink:#E7EAF0; --ink-2:#B7BECD; --ink-soft:#98A1B2; --ink-mute:#78808F;
  --line:#272D38; --line-2:#20262F;
  --accent:#7C93F5; --accent-soft:#1C2440; --accent-ink:#A8B8FF;
  --pos:#3FBF8F; --pos-soft:#12301F;
  --neg:#F4726F; --neg-soft:#331A1C;
  --warn:#E0B04A; --warn-soft:#2E2611;
  --focus:#7C93F5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
::selection{background:var(--accent-soft)}

/* ---------- typography utilities ---------- */
.eyebrow{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:14.5px}
h3{font-size:13px}
.muted{color:var(--ink-soft)}
.tiny{font-size:12px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto;
  display:flex; flex-direction:column; gap:18px;
}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 6px 2px}
.brand b{font-size:17px;font-weight:660;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-mute)}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navlabel{padding:14px 8px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mute)}
.navlabel:first-child{padding-top:2px}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:7px 8px;border-radius:var(--radius-sm);
  color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:500;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:20px}
.navbtn svg{flex:none;opacity:.85}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

.main{padding:22px 26px 60px;max-width:1220px;width:100%}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.periodnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.periodnav button{background:none;border:0;padding:5px 9px;border-radius:5px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center}
.periodnav button:hover{background:var(--surface-2);color:var(--ink)}
.periodnav .label{padding:4px 10px;font-weight:620;min-width:132px;text-align:center;font-size:13.5px}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  font-size:13px;font-weight:550;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;gap:5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--neg);border-color:var(--line)}
.btn.danger:hover{background:var(--neg-soft);border-color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}

/* ---------- cards / layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card>.chead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card>.chead .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1080px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-size:22px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.kpis.k5 .kpi .v{font-size:20px}
.kpi .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- comparison strip (signature) ---------- */
.cmp{display:flex;flex-direction:column}
.cmprow{display:grid;grid-template-columns:172px 96px 84px 1fr 130px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}
.cmprow:first-child{border-top:0}
.cmpname{display:flex;align-items:center;gap:8px;min-width:0}
.cmpname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:520}
.cmpdelta{display:flex;align-items:center;gap:5px;font-weight:620;font-size:13px}
.track{position:relative;height:22px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:var(--line);opacity:.75}
.track .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-mute);opacity:.5}
.track .fill{position:absolute;top:4px;bottom:4px;border-radius:2px}
.track .fill.over{background:var(--neg)}
.track .fill.under{background:var(--pos)}
.track .fill.flat{background:var(--ink-mute)}
.cmpprev{text-align:right;font-size:12px;color:var(--ink-soft)}
.legendline{display:flex;gap:16px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip .sw{width:11px;height:11px;border-radius:3px;flex:none}

/* ---------- category rows ---------- */
.catrow{display:grid;grid-template-columns:26px 1fr 108px 74px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);cursor:pointer}
.catrow:first-of-type{border-top:0}
.catrow:hover{background:var(--surface-2)}
.catrow .bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:4px}
.catrow .bar>i{display:block;height:100%;border-radius:3px}
.icon-badge{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none}
.icon-badge svg{width:14px;height:14px}
.subrow{display:grid;grid-template-columns:1fr 100px 70px;gap:10px;padding:4px 0 4px 36px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-2)}

/* ---------- operations table ---------- */
.ops{width:100%;border-collapse:collapse}
.ops th{
  text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-mute);padding:0 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.ops td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ops tr:hover td{background:var(--surface-2)}
.ops tr.is-dup td{opacity:.62}
.ops tr.is-ign td{opacity:.62}
.ops .c-date{width:66px;color:var(--ink-soft);font-size:12.5px}
.ops .c-amt{width:108px;text-align:right;font-weight:600;white-space:nowrap}
.ops .c-cat{width:200px}
.ops .c-imp{width:104px}
.ops .c-act{width:96px;text-align:right;white-space:nowrap}
.merchant{font-weight:550}
.rawlabel{font-size:11.5px;color:var(--ink-mute);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;display:block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.dup{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ign{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.todo{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.selcat{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:100%}
.catbtn{border:1px solid transparent;background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.catbtn:hover{border-color:var(--line);color:var(--ink)}
.catbtn.none{color:var(--neg);background:var(--neg-soft)}
.kpi .v.warn{color:var(--warn)}
.iconbtn{border:1px solid transparent;background:none;border-radius:6px;padding:3px;cursor:pointer;color:var(--ink-mute);display:inline-flex}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.iconbtn.danger:hover{color:var(--neg);border-color:var(--neg)}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  padding:6px 9px;color:var(--ink);
}
input[type=number]{font-family:var(--mono);text-align:right}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}

/* ---------- misc ---------- */
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:14px}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer;min-width:0}
.barcol .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:120px}
.barcol i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.barcol .lb{font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em}
.barcol.on .lb{color:var(--accent-ink);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:550;z-index:90;box-shadow:0 6px 24px -8px rgba(0,0,0,.4)}
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.42);display:grid;place-items:start center;padding:36px 16px;overflow:auto;z-index:80}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
.modal.wide{max-width:1000px}
.modal .mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal .mhead .spacer{flex:1}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{flex:1;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:12px;color:var(--ink-mute);background:var(--surface-2)}
.step.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:620}
.step.done{color:var(--pos);border-color:var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-soft);background:var(--surface-2)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.maptable{width:100%;border-collapse:collapse;font-size:13px}
.maptable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);padding:0 8px 6px;border-bottom:1px solid var(--line)}
.maptable td{padding:5px 8px;border-bottom:1px solid var(--line-2)}
.scroll{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.hbar{height:9px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.incgrid{width:100%;border-collapse:collapse;font-size:13px}
.incgrid th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute);padding:0 6px 6px;text-align:right}
.incgrid th:first-child{text-align:left}
.incgrid td{padding:3px 6px;border-top:1px solid var(--line-2)}
.incgrid input{width:104px;padding:4px 7px}

/* ---------- category tag ---------- */
.tag-cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:560;padding:2px 8px 2px 5px;border-radius:20px;
  border:1px solid transparent;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.tag-cat svg{flex:none;opacity:.9}
.tag-cat:hover{filter:brightness(.96);border-color:currentColor}
.tag-cat.none{background:var(--neg-soft);color:var(--neg);font-style:italic}

/* ---------- goals ---------- */
.goalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.goal{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface-2)}
.goal .gh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.goal .gh .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gv{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.goal .gv b{font-size:19px;font-weight:640;letter-spacing:-.02em}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.gbar>i{display:block;height:100%;border-radius:5px}
.gpace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.gfoot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px}
.state-ok{color:var(--pos)} .state-watch{color:var(--warn)} .state-over{color:var(--neg)}
.bg-ok{background:var(--pos)} .bg-watch{background:var(--warn)} .bg-over{background:var(--neg)}

/* ---------- comparison ---------- */
.cmprow{display:grid;grid-template-columns:210px 104px 92px 1fr 132px;gap:12px;align-items:center;padding:8px 10px;border-top:1px solid var(--line-2);border-radius:7px}
.cmprow.over{background:linear-gradient(90deg,var(--neg-soft),transparent 62%)}
.cmprow.under{background:linear-gradient(90deg,var(--pos-soft),transparent 62%)}
.cmprow.over .nm{color:var(--neg);font-weight:640}
.cmprow.under .nm{color:var(--pos);font-weight:640}

/* ---------- drill-down ---------- */
.merchrow{display:grid;grid-template-columns:1fr 62px 104px;gap:10px;padding:4px 0 4px 52px;font-size:12.5px;border-top:1px dashed var(--line-2);color:var(--ink-2)}
.warn-txt{color:var(--warn)}
.basegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.basegrid>div{background:var(--surface-2);padding:12px 14px}
.basegrid .v{font-size:20px;font-weight:600;margin:4px 0 2px;letter-spacing:-.02em}
.fixlist{display:flex;flex-direction:column}
.fixrow{display:grid;grid-template-columns:26px 1fr 190px 150px 96px 78px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px}
.fixrow:first-child{border-top:0}
.fixrow:hover{background:var(--surface-2)}
.fixrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.fixrow.off{opacity:.62}
.fixrow.off .nm{text-decoration:line-through;text-decoration-thickness:1px}
.subrow.open{background:var(--surface-2)}
.subrow{cursor:pointer}
.subrow:hover{background:var(--surface-2)}

/* ---------- review (tri des opérations) ---------- */
.rev{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-2);transition:transform .28s ease,opacity .28s ease}
.rev.out-right{transform:translateX(90px) rotate(2.5deg);opacity:0}
.rev.out-left{transform:translateX(-90px) rotate(-2.5deg);opacity:0}
.rev .rdate{font-size:12px;color:var(--ink-mute);letter-spacing:.02em}
.rev .rmerch{font-size:21px;font-weight:640;letter-spacing:-.02em;margin:3px 0 2px;text-transform:capitalize}
.rev .rlabel{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);word-break:break-all}
.rev .ramt{font-size:30px;font-weight:640;letter-spacing:-.03em;margin:10px 0 4px}
.progress{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-bottom:6px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.catgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.catchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.catchip:hover{border-color:var(--ink-mute)}
.catchip.on{color:#fff;border-color:transparent;font-weight:600}
.catchip.sugg{border-style:dashed;border-color:var(--accent)}
.grouplab{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:9px 0 2px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-mute)}

/* ---------- review, second pass ---------- */
.revhead{display:flex;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-weight:700;font-size:19px;letter-spacing:-.03em;flex:none}
.avatar svg{width:24px;height:24px}
.revwho{min-width:0;flex:1}
.revamt{font-size:34px;font-weight:660;letter-spacing:-.035em;text-align:right;white-space:nowrap}
.revwhy{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-mute);margin-top:3px}
.revwhy svg{width:12px;height:12px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 11px;font-size:13px;cursor:pointer;
  color:var(--ink);display:inline-flex;align-items:center;gap:7px;font-weight:520;transition:border-color .12s,transform .08s}

/* ---------------- small helpers ---------------- */
const pad2 = n => String(n).padStart(2, "0");
const monthKey = iso => iso.slice(0, 7);
const yearOf = iso => +iso.slice(0, 4);
const dayOf = iso => +iso.slice(8, 10);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
function monthLabel(key) { const [y, m] = key.split("-"); return MONTHS[+m - 1] + " " + y; }
function addMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}
function daysBetween(isoA, isoB) {
  return Math.abs((Date.parse(isoA) - Date.parse(isoB)) / 86400000);
}
function normalize(s) {
  return (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
}
function fmtEur(n, opts) {
  const sign = n < 0 ? "-" : (opts && opts.plus && n > 0 ? "+" : "");
  return sign + Math.abs(n).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}
function fmtEurShort(n) {
  return (n < 0 ? "-" : "") + Math.round(Math.abs(n)).toLocaleString("fr-FR") + " €";
}
function fmtPct(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1).replace(".", ",") + " %"; }
/* Plain rate, no leading sign except for a genuine negative. One decimal,
   dropped when it says nothing: 20 % rather than 20,0 %. */
function trim1(n) { return Math.abs(n).toFixed(1).replace(/\.0$/, "").replace(".", ","); }
function fmtRate(n) { return (n < 0 ? "−" : "") + trim1(n) + " %"; }
function fmtPts(n) { return trim1(n) + " pt" + (Math.abs(n) >= 2 ? "s" : ""); }

/* ---------------- amount parsing ----------------
   Handles 1 234,56 / 1,234.56 / -2,000.00 / (12.30) / 12.30 EUR         */
function parseAmount(raw) {
  let s = (raw == null ? "" : String(raw)).replace(/[\s\u00a0\u202f]/g, "").replace(/€|EUR/gi, "");
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.indexOf("-") >= 0) { neg = true; s = s.replace(/-/g, ""); }
  s = s.replace(/\+/g, "");
  const hasComma = s.indexOf(",") >= 0, hasDot = s.indexOf(".") >= 0;
  if (hasComma && hasDot) {
    // the right-most separator is the decimal one
    s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (hasComma) {
    s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
  }
  const v = parseFloat(s);
  if (isNaN(v)) return null;
  return neg ? -Math.abs(v) : v;
}

/* ---------------- date parsing ---------------- */
function parseDate(raw) {
  const s = (raw == null ? "" : String(raw)).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (!m) return null;
  let d = +m[1], mo = +m[2], y = +m[3];
  if (d > 12 && mo <= 12) { /* day first, fine */ }
  else if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; }   // month-first export
  if (y < 100) y += 2000;
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  return y + "-" + pad2(mo) + "-" + pad2(d);
}

/* ---------------- CSV ---------------- */
function detectSeparator(text) {
  const line = text.split(/\r?\n/).find(l => l.trim()) || "";
  const counts = [[",", 0], [";", 0], ["\t", 0]];
  let inQuotes = false;
  for (const ch of line) {
    if (ch === '"') inQuotes = !inQuotes;
    else if (!inQuotes) for (const c of counts) if (ch === c[0]) c[1]++;
  }
  counts.sort((a, b) => b[1] - a[1]);
  return counts[0][1] > 0 ? counts[0][0] : ";";
}
function parseCSV(text, sep) {
  sep = sep || detectSeparator(text);
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === sep) { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

    return !(key === cur && today <= r.day + 3);
  });
}

function goalOf(id) { return DB.goals[id] || { m: 0, y: 0 }; }

/* -------------------------------------------------------------------------
   Savings rate — (income − spending) / income. Money moved to a savings
   account is an internal transfer, so it is never spending: it stays inside
   the saved share, which is exactly what the ratio is meant to measure.
   ------------------------------------------------------------------------- */
function savingsRate(income, expense) {
  if (!income || income <= 0) return null;
  return (income - expense) / income * 100;
}
/* ok = target reached, watch = within 5 points, under = further below. */
function savingsState(rate, goal) {
  if (rate == null || !goal) return "none";
  if (rate >= goal) return "ok";
  if (rate >= goal - 5) return "watch";
  return "under";
}
const SAVINGS_CLASS = { ok: "pos", watch: "warn", under: "neg", none: "" };
/* Symbol + words, so the verdict never rests on colour alone. */
function savingsVerdict(rate, goal) {
  const st = savingsState(rate, goal);
  if (st === "none") return "";
  const gap = goal - rate;
  if (st === "ok") return "✓ objectif de " + fmtRate(goal) + " tenu";
  return (st === "watch" ? "● " : "▼ ") + fmtPts(gap) + " sous l\u2019objectif de " + fmtRate(goal);
}
/* Weighted rate over the last n complete months carrying an income:
   totals are summed before the ratio, so a small month cannot skew it. */
function savingsRateWindow(n) {
  const cur = monthKey(todayISO());
  const keys = new Set(DB.tx.map(t => monthKey(t.date)));
  Object.keys(DB.income).forEach(k => keys.add(k));
  const list = Array.from(keys).filter(k => k < cur).sort().reverse();
  let income = 0, expense = 0, months = 0;
  for (const k of list) {
    const s = monthStats(k);
    if (s.income <= 0) continue;
    income += s.income; expense += s.expense; months++;
    if (months === n) break;
  }
  return { rate: savingsRate(income, expense), months, income, expense };
}
/* Rule of thumb: 10 % floor, 20 % target, 25 % and above builds fast.
   Anchored on what is already achieved, so a target is never a downgrade. */
const SAVINGS_STEPS = [
  { v: 10, name: "Plancher", help: "de quoi encaisser les imprévus sans emprunter" },
  { v: 20, name: "Cible", help: "cohérent avec la règle 50/30/20 des objectifs" },
  { v: 25, name: "Ambitieux", help: "constitution de patrimoine rapide" },
];
function suggestedSavingsGoal() {
  const w = savingsRateWindow(12);
  if (w.rate == null) return { value: 20, why: "Pas encore de mois complet avec des revenus saisis : 20 % est la cible de référence." };
  if (w.rate < 10) return { value: 10, why: "Vous êtes à " + fmtRate(w.rate) + " sur 12 mois : 10 % est la marche suivante, franchissable." };
  const held = Math.floor(w.rate / 5) * 5;
  if (held >= 25) return { value: held, why: "Vous tenez déjà " + fmtRate(w.rate) + " sur 12 mois : l\u2019objectif sert alors à ne pas redescendre." };
  return { value: 20, why: "Vous êtes à " + fmtRate(w.rate) + " sur 12 mois : 20 % est la marche suivante." };
}

/* -------------------------------------------------------------------------
   Suggested budgets. Frame: 50/30/20 (Elizabeth Warren) applied to net income,
   share per group loosely calibrated on the INSEE consumption structure
   (housing ~28 % of spending, food ~12 % excluding restaurants).
   Everything is a starting point the user overwrites.
   ------------------------------------------------------------------------- */
const GROUP_SHARE = {            // % of net monthly income
  g_home: 25, g_food: 15, g_car: 10, g_subs: 3, g_health: 3,
  g_shop: 10, g_leisure: 12, g_fees: 2,          // 80 % spent, 20 % saved
};
const SUB_SHARE = {              // % inside the group
  g_home: { c_rent: 70, c_power: 12, c_water: 4, c_homeins: 5, c_homegear: 6, c_works: 3 },
  g_car: { c_carins: 20, c_fuel: 40, c_carfix: 20, c_parking: 8, c_transit: 12 },
  g_food: { c_grocery: 60, c_resto: 25, c_delivery: 15 },
  g_subs: { c_internet: 35, c_mobile: 25, c_subs: 40 },
  g_health: { c_doctor: 35, c_pharmacy: 20, c_hair: 20, c_sport: 25 },
  g_shop: { c_clothes: 35, c_games: 25, c_tech: 25, c_gifts: 15 },
  g_leisure: { c_outings: 40, c_holidays: 60 },
  g_fees: { c_bankfees: 20, c_tax: 60, c_fines: 5, c_otherins: 15 },
};
/* Average net income over the last 12 months that carry a figure. */
function avgIncome12() {
  const keys = Object.keys(DB.income).sort().reverse();
  const seen = [];
  for (const k of keys) { const v = manualIncome(k); if (v > 0) seen.push(v); if (seen.length === 12) break; }
  if (!seen.length) {                              // nothing typed in: fall back on the statement
    const byMonth = {};
    DB.tx.forEach(t => { if (isIncomeOp(t)) byMonth[monthKey(t.date)] = (byMonth[monthKey(t.date)] || 0) + t.amount; });
    const vals = Object.keys(byMonth).sort().reverse().slice(0, 12).map(k => byMonth[k]);
    if (!vals.length) return 0;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }
  return seen.reduce((a, b) => a + b, 0) / seen.length;
}
function suggestedGoals() {
  const income = avgIncome12();
  if (!income) return { income: 0, byId: {} };
  const byId = {};
  Object.entries(GROUP_SHARE).forEach(([gid, share]) => {
    const amount = income * share / 100;
    byId[gid] = Math.round(amount / 5) * 5;
    const subs = SUB_SHARE[gid] || {};
    Object.entries(subs).forEach(([cid, s]) => { byId[cid] = Math.round(amount * s / 100 / 5) * 5; });
  });
  return { income, byId };
}

/* Spending grouped by merchant inside one category — "which restaurants exactly". */
function merchantsOfCat(ops, catId) {
  const agg = {};
  ops.forEach(t => {
    if (!isExpense(t) || t.cat !== catId) return;
    const k = canonOf(t) || normalize(t.merchantRaw || merchantFromLabel(t.label)) || "divers";
    (agg[k] = agg[k] || { name: t.merchantRaw || merchantFromLabel(t.label) || "—", n: 0, v: 0 });
    agg[k].n++; agg[k].v -= t.amount;
  });
  return Object.values(agg).sort((a, b) => b.v - a.v);
}
function spentOn(id, ops) {
  const g = GROUP_BY_ID[id];
  return ops.reduce((s, t) => {
    if (!isExpense(t)) return s;
    return (g ? catGroup(t.cat).id === id : t.cat === id) ? s - t.amount : s;
  }, 0);
}

/* The rate is honest only if the month is closed and everything is classified. */
function rateTooltip(s, rate, running) {
  if (rate == null) return "Le taux se calcule sur les revenus : saisissez-les dans Réglages.";
  let t = "(revenus − dépenses) ÷ revenus = (" + fmtEur(s.income) + " − " + fmtEur(s.expense) + ") ÷ " + fmtEur(s.income) +
    ". Les virements vers l\u2019épargne ne sont pas des dépenses : ils restent dans la part épargnée.";
  if (running) t += " Mois en cours : le salaire est saisi en entier alors que les dépenses ne le sont pas encore, le taux paraît donc plus élevé qu\u2019il ne finira.";
  if (s.todoCount) t += " " + s.todoCount + " opération(s) sans catégorie ne sont pas comptées dans les dépenses : le taux est optimiste tant qu\u2019elles ne sont pas classées.";
  return t;
}

function goalState(spent, target, pace) {
  if (spent > target) return "over";
  if (target > 0 && pace > 0.08 && spent > target * pace * 1.15) return "watch";
  if (spent > target * 0.9) return "watch";
  return "ok";
}
function goalCard(ops, mode, pace) {
  const ids = Object.keys(DB.goals).filter(id => (DB.goals[id][mode] || 0) > 0);
  const label = mode === "m" ? "Objectifs du mois" : "Objectifs de l\u2019année";
  let html = '<div class="card"><div class="chead"><h2>' + label + "</h2><div class=\"spacer\"></div>" +
    '<button class="btn sm ghost" data-act="view" data-view="settings">Régler</button></div>';
  if (!ids.length) {
    const sg = suggestedGoals();
    return html + '<div class="empty"><b>Aucun objectif défini</b>' +
      (sg.income ? "Sur la base de " + esc(fmtEur(sg.income)) + " de revenu mensuel moyen, l\u2019application peut proposer une répartition de départ."
                 : "Saisissez d\u2019abord vos revenus : les montants proposés en dépendent.") +
      '<div style="margin-top:12px"><button class="btn ' + (sg.income ? "primary" : "") + '" data-act="' + (sg.income ? "suggest" : "view") + '" data-view="settings">' +
      (sg.income ? "Proposer des objectifs" : "Saisir mes revenus") + "</button></div></div></div>";
  }
  const cards = ids.map(id => {
    const target = DB.goals[id][mode], spent = spentOn(id, ops);
    const st = goalState(spent, target, pace || 1);
    const pct = Math.min(spent / target * 100, 100);
    const g = GROUP_BY_ID[id], c = CAT_BY_ID[id];
    const name = g ? g.name : (c ? c.name : id);
    const grp = g || (c ? GROUP_BY_ID[c.group] : null);
    const paceLeft = Math.min((pace || 1) * 100, 100);
    return '<div class="goal">' +
      '<div class="gh">' + (grp ? groupBadge(grp) : "") + '<span class="nm">' + esc(name) + "</span></div>" +
      '<div class="gv"><b class="num state-' + st + '">' + esc(fmtEur(spent)) + '</b><span class="tiny muted num">/ ' + esc(fmtEur(target)) + "</span></div>" +
      '<div class="gbar"><i class="bg-' + st + '" style="width:' + pct.toFixed(1) + '%"></i>' +
        (mode === "m" && pace < 1 ? '<span class="gpace" style="left:' + paceLeft.toFixed(1) + '%" title="rythme attendu à ce jour du mois"></span>' : "") +
      "</div>" +
      '<div class="gfoot state-' + st + '">' + (st === "over" ? "▲ dépassé de " + fmtEur(spent - target)
        : st === "watch" ? "● reste " + fmtEur(target - spent) : "✓ reste " + fmtEur(target - spent)) + "</div></div>";
  }).join("");
  return html + '<div class="goalgrid">' + cards + "</div>" +
    (mode === "m" && (pace || 1) < 1 ? '<div class="tiny muted" style="margin-top:10px">Le repère vertical marque le rythme attendu au ' + dayOf(todayISO()) + " du mois.</div>" : "") + "</div>";
}

/* Group breakdown, drilling down to subcategories then to merchants. */
function fixedTag(catId) {
  const c = CAT_BY_ID[catId], g = catGroup(catId);
  if (!g) return "";
  return '<span class="tag-cat" style="background:' + g.color + '1A;color:' + g.color + ';cursor:default">' +
    icon(g.icon, 12) + esc(c ? c.name : g.name) + "</span>";
}
function fixedRow(r, key) {
  const seen = r.months[key] != null;
  const rhythm = PERIOD_NAME[r.period] + (r.period === 1 ? " · vers le " + r.day : " · " + fmtEurShort(r.amount));
  const status = r.on
    ? (seen ? '<span class="tiny muted">passée</span>' : r.period === 1 ? '<span class="tiny warn-txt">▲ absente</span>' : '<span class="tiny muted">—</span>')
    : '<span class="tiny muted" title="' + esc(r.manual ? "vous l\u2019avez écartée du socle" : r.why) + '">' +
      esc(r.manual ? "écartée" : r.flag) + "</span>";
  return '<div class="fixrow' + (r.on ? "" : " off") + '">' +
    '<label class="check" title="' + (r.on ? "Retirer du socle" : "Compter dans le socle") + '"><input type="checkbox" data-chg="fixed" data-key="' +
      esc(r.key) + '" ' + (r.on ? "checked" : "") + "></label>" +
    '<span class="nm" style="text-transform:capitalize" title="' +
      esc(r.count + " prélèvements depuis " + monthLabel(r.firstMonth) + " · régularité " + Math.round(r.regular * 100) + " % · variation " + Math.round(r.spread * 100) + " %") +
      '">' + esc(r.name) + "</span>" +
    "<span>" + fixedTag(r.cat) + "</span>" +
    '<span class="tiny muted">' + esc(rhythm) + "</span>" +
    '<span class="num" style="text-align:right;font-weight:600">' + esc(fmtEur(r.monthly)) + "</span>" +
    '<span style="text-align:right">' + status + "</span>" +
    "</div>";
}
function fixedCard(s) {
  const bc = baseCost();
  let html = '<div class="card"><div class="chead"><h2>Coût de base</h2><div class="spacer"></div>' +
    '<span class="tiny muted">charges repérées sur les ' + FIXED_WINDOW + " derniers mois</span></div>";
  if (!bc.list.length)
    return html + '<div class="empty"><b>Rien de récurrent détecté pour l\u2019instant</b>' +
      "Il faut au moins trois passages d\u2019un même commerçant, à un rythme et pour un montant stables. Importez plus d\u2019historique et la liste se remplira seule.</div></div>";

  const income = s.income || avgIncome12();
  const fromAvg = !s.income && income > 0;
  const share = income > 0 ? bc.monthly / income * 100 : null;
  const left = income > 0 ? income - bc.monthly : null;
  const goal = DB.settings.savingsGoal || 0;
  const toSave = goal && income > 0 ? income * goal / 100 : 0;

  html += '<div class="basegrid">' +
    '<div><div class="eyebrow">Socle mensuel</div><div class="v num">' + esc(fmtEur(bc.monthly)) + "</div>" +
      '<div class="tiny muted">' + bc.kept.length + " charge" + (bc.kept.length > 1 ? "s" : "") + " retenue" + (bc.kept.length > 1 ? "s" : "") +
      ", en équivalent mensuel</div></div>" +
    '<div><div class="eyebrow">Part engagée d\u2019avance</div><div class="v num' + (share == null ? "" : share > 60 ? " neg" : share > 45 ? " warn" : "") + '">' +
      (share == null ? "—" : esc(fmtRate(share))) + "</div>" +
      '<div class="tiny muted">' + (share == null ? "revenus non saisis" : "de vos revenus part sans décision") + "</div></div>" +
    '<div><div class="eyebrow">Reste à vivre</div><div class="v num' + (left == null ? "" : left < 0 ? " neg" : "") + '">' +
      (left == null ? "—" : esc(fmtEur(left))) + "</div>" +
      '<div class="tiny muted">' + (left == null ? "revenus non saisis"
        : fromAvg ? "sur un revenu moyen de " + fmtEur(income)
        : toSave ? "dont " + fmtEur(toSave) + " à épargner pour tenir " + fmtRate(goal)
        : "revenus du mois − socle") + "</div></div>" +
    "</div>";

  const miss = missingFixed(bc.kept, UI.month);
  if (miss.length) html += '<div class="note warn" style="margin:0 0 12px">' + icon("warn") + " " +
    (miss.length > 1 ? miss.length + " charges habituelles ne sont pas passées" : "Une charge habituelle n\u2019est pas passée") +
    " en " + esc(monthLabel(UI.month)) + " : " + esc(miss.map(r => r.name).join(", ")) +
    ". Soit elle est en retard, soit elle a cessé — dans ce cas, décochez-la.</div>";

  html += '<div class="fixlist">' + bc.kept.map(r => fixedRow(r, UI.month)).join("") + "</div>";
  if (bc.out.length)
    html += '<div class="legendline" style="justify-content:space-between">' +
      '<span class="muted">' + bc.out.length + " autre" + (bc.out.length > 1 ? "s" : "") + " détectée" + (bc.out.length > 1 ? "s" : "") +
      ", écartée" + (bc.out.length > 1 ? "s" : "") + " du socle</span>" +
      '<button class="btn sm ghost" data-act="showcand">' + (UI.showCand ? "Masquer" : "Voir et arbitrer") + "</button></div>" +
      (UI.showCand ? '<div class="fixlist">' + bc.out.map(r => fixedRow(r, UI.month)).join("") + "</div>" : "");
  return html + '<p class="tiny muted" style="margin:12px 0 0">Une charge est retenue quand elle revient au même rythme pour un montant stable. ' +
    "Le socle est le plancher de dépense d\u2019un mois où vous ne décidez de rien : il donne la marge de manœuvre réelle et sert de base au matelas de sécurité (3 à 6 mois).</p></div>";
}

/* Group breakdown, drilling down to subcategories then to merchants. */
function catCard(s) {
  const rows = GROUPS.filter(g => g.kind === KIND_EXPENSE).map(g => ({ g, v: s.groups[g.id] || 0 }))
    .filter(r => r.v !== 0).sort((a, b) => b.v - a.v);
  const total = rows.reduce((a, r) => a + Math.max(r.v, 0), 0) || 1;
  let html = '<div class="card"><div class="chead"><h2>Dépenses par groupe</h2><div class="spacer"></div>' +
    '<span class="tiny muted">' + esc(fmtEur(s.expense)) + " · cliquez pour déplier</span></div>";
  if (!rows.length) return html + '<div class="empty">Aucune dépense classée sur ce mois.</div></div>';
  html += rows.map(r => {
    const share = Math.max(r.v, 0) / total * 100;
    const open = UI.openGroup === r.g.id;
    let sub = "";
    if (open) {
      const cats = CATS.filter(c => c.group === r.g.id).map(c => ({ c, v: s.cats[c.id] || 0 })).filter(x => x.v !== 0).sort((a, b) => b.v - a.v);
      sub = cats.map(x => {
        const openCat = UI.openCat === x.c.id;
        let merch = "";
        if (openCat) {
          const list = merchantsOfCat(s.ops, x.c.id);
          merch = list.map(m => '<div class="merchrow"><span style="text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + "</span>" +
            '<span class="num muted" style="text-align:right">' + m.n + " ×</span>" +
            '<span class="num" style="text-align:right">' + esc(fmtEur(m.v)) + "</span></div>").join("");
        }
        return '<div class="subrow ' + (openCat ? "open" : "") + '" data-act="togglecat" data-cat="' + x.c.id + '">' +
          "<span>" + (openCat ? "▾ " : "▸ ") + esc(x.c.name) + '</span><span class="num" style="text-align:right">' + esc(fmtEur(x.v)) +
          '</span><span class="num muted" style="text-align:right">' + Math.round(x.v / r.v * 100) + " %</span></div>" + merch;
      }).join("");
    }
    return '<div class="catrow" data-act="togglegroup" data-group="' + r.g.id + '">' +
      groupBadge(r.g) +
      "<div><div>" + (open ? "▾ " : "▸ ") + esc(r.g.name) + '</div><div class="bar"><i style="width:' + share.toFixed(1) + "%;background:" + r.g.color + '"></i></div></div>' +
      '<div class="num" style="text-align:right;font-weight:600">' + esc(fmtEur(r.v)) + "</div>" +
      '<div class="num muted" style="text-align:right">' + Math.round(share) + " %</div></div>" + sub;
  }).join("");
  return html + "</div>";
}

/* =========================================================================
   Operations table
   ========================================================================= */
function importLabel(id) {
  const imp = DB.imports.find(i => i.id === id);
  return imp ? imp.name : "—";
}
function importDate(id) {
  const imp = DB.imports.find(i => i.id === id);
  return imp ? imp.date : "";
}
function opsCard(s) {
  const batches = Array.from(new Set(s.ops.map(t => t.imp)));
  let ops = s.ops.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  if (UI.batch !== "all") ops = ops.filter(t => String(t.imp) === UI.batch);
  const shown = ops.filter(t => {
    if (t.status === ST_DUP || t.status === ST_DUP_MAYBE) return UI.showDup;
    if (t.status === ST_IGNORED) return UI.showIgnored;
    return true;
  });

  let html = '<div class="card"><div class="chead"><h2>Opérations</h2><div class="spacer"></div>' +
    '<button class="btn sm" data-act="addop">' + icon("plus") + "Ajouter</button>" +
    (s.ops.length ? ' <button class="btn sm danger" data-act="delmonth" title="Vide le mois pour rejouer un import">' + icon("trash") + "Vider le mois</button>" : "") + "</div>";

  html += '<div class="controls">' +
    '<label class="check"><input type="checkbox" data-chg="showdup" ' + (UI.showDup ? "checked" : "") + "> Afficher les doublons" +
      (s.dupCount ? ' <span class="tag dup">' + s.dupCount + "</span>" : "") + "</label>" +
    '<label class="check"><input type="checkbox" data-chg="showign" ' + (UI.showIgnored ? "checked" : "") + "> Afficher les virements internes" +
      (s.ignoredCount ? ' <span class="tag ign">' + s.ignoredCount + "</span>" : "") + "</label>";
  if (batches.length > 1 || UI.batch !== "all") {
    html += '<span class="spacer" style="flex:1"></span><span class="tiny muted">Lot d\u2019import :</span><div class="pillrow">' +
      '<span class="pill ' + (UI.batch === "all" ? "on" : "") + '" data-act="batch" data-batch="all">Tous</span>' +
      batches.map(b => '<span class="pill ' + (String(b) === UI.batch ? "on" : "") + '" data-act="batch" data-batch="' + b + '">' + esc(importLabel(b)) + "</span>").join("") + "</div>";
  }
  html += "</div>";

  if (!shown.length) return html + '<div class="empty"><b>Rien à afficher</b>Importez un relevé pour remplir ce mois.</div></div>';

  html += '<table class="ops"><thead><tr><th class="c-date">Date</th><th>Opération</th><th class="c-cat">Catégorie</th>' +
    '<th class="c-imp">Importé le</th><th class="c-amt">Montant</th><th class="c-act"></th></tr></thead><tbody>';
  html += shown.map(t => opRow(t)).join("");
  html += "</tbody></table>";
  const hidden = ops.length - shown.length;
  if (hidden > 0) html += '<div class="tiny muted" style="margin-top:8px">' + hidden + " opération" + (hidden > 1 ? "s" : "") + " masquée" + (hidden > 1 ? "s" : "") + " (doublons ou virements internes).</div>";
  return html + "</div>";
}

function catTag(t) {
  if (!t.cat) return '<button class="tag-cat none" data-act="editcat" data-id="' + t.id + '">' + icon("plus", 13) + "choisir…</button>";
  const g = catGroup(t.cat);
  return '<button class="tag-cat" data-act="editcat" data-id="' + t.id + '" style="background:' + g.color + '1A;color:' + g.color + '" title="' +
    esc(g.name + " · " + catName(t.cat)) + '">' + icon(g.icon, 13) + esc(catName(t.cat)) + "</button>";
}
function opRow(t) {
  const dup = t.status === ST_DUP || t.status === ST_DUP_MAYBE;
  const ign = t.status === ST_IGNORED;
  const cls = dup ? "is-dup" : ign ? "is-ign" : "";
  let tags = "";
  if (t.status === ST_DUP) tags = '<span class="tag dup">doublon</span>';
  else if (t.status === ST_DUP_MAYBE) tags = '<span class="tag dup">doublon probable</span>';
  else if (ign) tags = '<span class="tag ign">interne</span>';
  else if (!t.cat) tags = '<span class="tag todo">à catégoriser</span>';

  let actions = "";
  if (dup) {
    actions = '<button class="iconbtn" title="Ce n\u2019est pas un doublon" data-act="undup" data-id="' + t.id + '">' + icon("undo", 14) + "</button>" +
      '<button class="iconbtn danger" title="Supprimer" data-act="del" data-id="' + t.id + '">' + icon("trash", 14) + "</button>";
  } else {
    actions = ign
      ? '<button class="iconbtn" title="Recompter cette opération" data-act="unignore" data-id="' + t.id + '">' + icon("undo", 14) + "</button>"
      : '<button class="iconbtn" title="Ignorer (virement interne)" data-act="ignore" data-id="' + t.id + '">' + icon("vault", 14) + "</button>";
    actions += '<button class="iconbtn" title="Marquer comme doublon" data-act="mkdup" data-id="' + t.id + '">' + icon("warn", 14) + "</button>" +
      '<button class="iconbtn danger" title="Supprimer" data-act="del" data-id="' + t.id + '">' + icon("trash", 14) + "</button>";
  }
  const merchant = t.merchantRaw || merchantFromLabel(t.label) || "—";
  return '<tr class="' + cls + '"><td class="c-date num">' + t.date.slice(8, 10) + "/" + t.date.slice(5, 7) + "</td>" +
    "<td><div class=\"merchant\">" + esc(merchant) + " " + tags + '</div><span class="rawlabel">' + esc(t.label) + "</span></td>" +
    '<td class="c-cat">' + catTag(t) + "</td>" +
    '<td class="c-imp tiny muted">' + esc(importDate(t.imp)) + "</td>" +
    '<td class="c-amt num ' + (t.amount > 0 ? "pos" : "") + '">' + esc(fmtEur(t.amount)) + "</td>" +
    '<td class="c-act">' + actions + "</td></tr>";
}

/* =========================================================================
   Year view
   ========================================================================= */
function viewYear() {
  const year = UI.year;
  const proj = yearProjection(year);
  const months = [];
  for (let m = 1; m <= 12; m++) {
    const key = year + "-" + pad2(m), st = monthStats(key);
    months.push({ key, m, expense: st.expense, income: st.income, balance: st.balance });
  }
  const maxV = Math.max(1, ...months.map(x => Math.max(x.expense, x.income)));

  let html = periodBar(String(year), "year");

  const yRate = savingsRate(proj.income, proj.expense);
  const ySgoal = DB.settings.savingsGoal || 0;
  html += '<div class="kpis k5">' +
    kpi("Revenus " + year, fmtEur(proj.income), proj.complete ? "année complète" : "depuis le 1er janvier") +
    kpi("Dépenses " + year, fmtEur(proj.expense), proj.complete ? "année complète" : "depuis le 1er janvier") +
    kpi("Balance " + year, fmtEur(proj.balance), proj.balance >= 0 ? "mise de côté" : "déficit", proj.balance >= 0 ? "pos" : "neg") +
    kpi("Taux d\u2019épargne " + year,
        yRate == null ? "—" : fmtRate(yRate),
        yRate == null ? "revenus de l\u2019année non saisis"
          : ySgoal ? savingsVerdict(yRate, ySgoal)
          : (proj.complete ? "sur l\u2019année complète" : "cumul depuis janvier"),
        yRate == null ? "warn" : ySgoal ? SAVINGS_CLASS[savingsState(yRate, ySgoal)] : (yRate >= 0 ? "" : "neg"),
        yRate == null ? "Le taux se calcule sur les revenus : saisissez-les dans Réglages."
          : "(" + fmtEur(proj.income) + " − " + fmtEur(proj.expense) + ") ÷ " + fmtEur(proj.income) +
            ". Le taux annuel ne bouge pas avec la projection : cumul et projection sont dans le même rapport.") +
    kpi(proj.complete ? "Balance finale" : "Projection fin " + year, fmtEur(proj.balanceYear),
        proj.complete ? "réalisé" : "au rythme actuel (moyenne YTD)", proj.balanceYear >= 0 ? "pos" : "neg") +
    "</div>";

  /* goals first: what the user steers with */
  const yearOps = DB.tx.filter(t => yearOf(t.date) === year);
  html += goalCard(yearOps, "y", year < yearOf(todayISO()) ? 1 : (year > yearOf(todayISO()) ? 0 : proj.elapsed));

  /* monthly bars */
  html += '<div class="card"><div class="chead"><h2>Mois par mois</h2><div class="spacer"></div>' +
    '<span class="legendline" style="border:0;margin:0;padding:0"><span class="chip"><span class="sw" style="background:var(--pos)"></span>revenus</span>' +
    '<span class="chip"><span class="sw" style="background:var(--neg)"></span>dépenses</span></span></div>';
  html += '<div class="bars">' + months.map(x => {
    const he = Math.round(x.expense / maxV * 118), hi = Math.round(x.income / maxV * 118);
    const on = x.key === UI.month;
    return '<div class="barcol ' + (on ? "on" : "") + '" data-act="openmonth" data-month="' + x.key + '" title="' + esc(monthLabel(x.key) + " · dépenses " + fmtEur(x.expense) + " · revenus " + fmtEur(x.income)) + '">' +
      '<div class="stack" style="flex-direction:row;align-items:flex-end;gap:2px;height:118px">' +
        '<i style="flex:1;height:' + Math.max(hi, x.income ? 2 : 0) + 'px;background:var(--pos)"></i>' +
        '<i style="flex:1;height:' + Math.max(he, x.expense ? 2 : 0) + 'px;background:var(--neg)"></i>' +
      "</div><span class=\"lb\">" + MONTHS_SHORT[x.m - 1] + "</span></div>";
  }).join("") + "</div></div>";

  /* projection vs previous years */
  const years = yearsWithData().filter(y => y <= yearOf(todayISO()));
  const bal = years.map(y => ({ y, p: yearProjection(y) }));
  const maxB = Math.max(1, ...bal.map(b => Math.abs(b.p.balanceYear)));
  html += '<div class="grid2"><div class="card"><div class="chead"><h2>Balance et taux d\u2019épargne par année</h2><div class="spacer"></div>' +
    '<span class="tiny muted">' + (proj.complete ? "" : "estimation " + year + " au rythme actuel") + "</span></div>" +
    bal.map(b => {
      const v = b.p.balanceYear, w = Math.abs(v) / maxB * 100, cur = b.y === year;
      const r = savingsRate(b.p.incomeYear, b.p.expenseYear);
      const rc = r == null ? "muted" : ySgoal ? SAVINGS_CLASS[savingsState(r, ySgoal)] : "muted";
      return '<div style="display:grid;grid-template-columns:52px 1fr 108px 72px;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line-2)">' +
        '<span class="num" style="font-weight:' + (cur ? 700 : 400) + '">' + b.y + (b.p.complete ? "" : " *") + "</span>" +
        '<div class="hbar"><i style="width:' + w.toFixed(1) + "%;background:" + (v >= 0 ? "var(--pos)" : "var(--neg)") + '"></i></div>' +
        '<span class="num ' + (v >= 0 ? "pos" : "neg") + '" style="text-align:right">' + esc(fmtEur(v)) + "</span>" +
        '<span class="num ' + rc + '" style="text-align:right" title="taux d\u2019épargne ' + b.y + '">' +
          (r == null ? "—" : esc(fmtRate(r))) + "</span></div>";
    }).join("") +
    '<div class="tiny muted" style="margin-top:8px">* année en cours, projetée depuis la moyenne mensuelle constatée (' +
      esc(fmtEur(proj.monthlyExpense || 0)) + " de dépenses par mois).</div></div>";

  /* YTD comparison with last year */
  const prevY = ytdTotals(year - 1, (year - 1) + todayISO().slice(4));
  const curY = ytdTotals(year);
  const infl = 1 + (DB.settings.inflation || 0) / 100;
  const band = (DB.settings.band || 5) / 100;
  html += '<div class="card"><div class="chead"><h2>Cumul depuis janvier vs ' + (year - 1) + "</h2></div>";
  const cmpRows = GROUPS.filter(g => g.kind === KIND_EXPENSE).map(g => {
    const now = curY.groups[g.id] || 0, ref = (prevY.groups[g.id] || 0) * infl;
    return { g, now, ref, delta: now - ref, pct: ref > 0 ? (now - ref) / ref * 100 : 0 };
  }).filter(r => r.now || r.ref).sort((a, b) => b.now - a.now);
  if (!cmpRows.length) html += '<div class="empty">Pas de données sur les deux années.</div>';
  else html += cmpRows.map(r => {
    const over = r.delta > r.ref * band, under = r.delta < -r.ref * band;

  return html;

/* =========================================================================
   Patrimoine — comptes, valorisations mensuelles, mouvements.
   Perf = (valeur_fin − valeur_début − mouvement) / (valeur_début + mouvement),
   neutralise l'effet des dépôts/retraits sur la performance affichée.
   ========================================================================= */
const PAT_TYPES = [
  { id: "courant", name: "Compte courant" }, { id: "livret", name: "Livret" },
  { id: "pea", name: "PEA" }, { id: "av", name: "Assurance-vie" },
  { id: "per", name: "PER" }, { id: "pee", name: "PEE" },
  { id: "immo", name: "Immobilier" }, { id: "autre", name: "Autre" },
];
function patTypeName(id) { const t = PAT_TYPES.find(x => x.id === id); return t ? t.name : id; }
function newPatAccountId(name) {
  let base = "pa_" + normalize(name).replace(/ /g, "_").slice(0, 22) || "pa_compte";
  let id = base, n = 2; while ((DB.patAccounts || []).some(a => a.id === id)) id = base + "_" + n++;
  return id;
}
function patAccountValue(accountId, mk) {
  const vals = (DB.patValues || {})[accountId]; if (!vals) return null;
  const keys = Object.keys(vals).filter(k => k <= mk).sort();
  return keys.length ? vals[keys[keys.length - 1]] : null;
}
function patTotalAt(mk) {
  return (DB.patAccounts || []).reduce((s, a) => s + (patAccountValue(a.id, mk) || 0), 0);
}
function patHasHistoryAt(mk) {
  return (DB.patAccounts || []).some(a => patAccountValue(a.id, mk) != null);
}
/* Comptes exclus (ex. immobilier) : gardés dans le patrimoine total mais sortis
   de la performance globale, qui n'a pas de sens sur des actifs sans valorisation régulière. */
function patPerfAccounts() {
  return (DB.patAccounts || []).filter(a => !a.perfExcluded);
}
function patPerfTotalAt(mk) {
  const accs = patPerfAccounts();
  return accs.some(a => patAccountValue(a.id, mk) != null) ? accs.reduce((s, a) => s + (patAccountValue(a.id, mk) || 0), 0) : null;
}
function patMovementsInMonth(accountId, mk) {
  return (DB.patMovements || []).filter(m => monthKey(m.date) === mk && (!accountId || m.accountId === accountId))
    .reduce((s, m) => s + m.amount, 0);
}
function patMovementsInYear(accountId, year) {
  return (DB.patMovements || []).filter(m => yearOf(m.date) === year && (!accountId || m.accountId === accountId))
    .reduce((s, m) => s + m.amount, 0);
}
function patPerfMovements(period, isYear) {
  const ids = new Set(patPerfAccounts().map(a => a.id));
  return (DB.patMovements || []).filter(m => (isYear ? yearOf(m.date) === period : monthKey(m.date) === period) && ids.has(m.accountId))
    .reduce((s, m) => s + m.amount, 0);
}
function patPerf(valFin, valDebut, mouvement) {
  if (valFin == null || valDebut == null) return null;
  const denom = valDebut + mouvement;
  return denom ? (valFin - valDebut - mouvement) / denom * 100 : null;
}
function patMonthlyPerf(accountId, mk) {
  const prevM = addMonth(mk, -1);
  const valFin = accountId ? patAccountValue(accountId, mk) : patPerfTotalAt(mk);
  const valDebut = accountId ? patAccountValue(accountId, prevM) : patPerfTotalAt(prevM);
  const mouvement = accountId ? patMovementsInMonth(accountId, mk) : patPerfMovements(mk, false);
  return patPerf(valFin, valDebut, mouvement);
}
function patAnnualPerf(accountId, year) {
  const endKey = year + "-12", prevEndKey = (year - 1) + "-12";
  const valFin = accountId ? patAccountValue(accountId, endKey) : patPerfTotalAt(endKey);
  const valDebut = accountId ? patAccountValue(accountId, prevEndKey) : patPerfTotalAt(prevEndKey);
  const mouvement = accountId ? patMovementsInYear(accountId, year) : patPerfMovements(year, true);
  return patPerf(valFin, valDebut, mouvement);
}

/* =========================================================================
   Import CSV — reprise de l'historique Excel (Data-Comptes / Data-Mouvements)
   ========================================================================= */
let PATIMP = null;
const FR_MONTHS_ABBR = ["janv", "fevr", "mars", "avr", "mai", "juin", "juil", "aout", "sept", "oct", "nov", "dec"];
/* Dates du tableur : "1 janv 2023" — un seul jour saisi par mois, donc on ne garde que le mois. */
function parseFrCompteDate(raw) {
  const parts = normalize(raw).split(" ").filter(Boolean);
  const year = parts.find(p => /^\d{4}$/.test(p));
  if (!year) return null;
  const idx = FR_MONTHS_ABBR.findIndex(a => parts.some(p => p.startsWith(a)));
  return idx < 0 ? null : year + "-" + pad2(idx + 1);
}
function guessPatType(name) {
  const n = normalize(name);
  if (n.includes("courant")) return "courant";
  if (n.includes("livret") || n.includes("lld") || n.includes("pel")) return "livret";
  if (n.includes(" av ") || n.startsWith("av") || n.includes("assurance")) return "av";
  if (n.includes("pea")) return "pea";
  if (n.includes("per")) return "per";
  if (n.includes("pee")) return "pee";
  if (n.includes("immo")) return "immo";
  return "autre";
}
/* Le tableur exporte en « ; » (Excel FR) ou en « , » (Excel US, Google Sheets, LibreOffice)
   selon la machine. Plutôt que de deviner sur la première ligne — qui n'est pas toujours
   l'en-tête dans ces exports — on essaie chaque délimiteur et on garde celui qui retrouve la
   ligne « Date » : un mauvais délimiteur laisse la ligne entière dans une seule cellule et se
   disqualifie tout seul. À égalité, le plus grand nombre de colonnes gagne. */
function parsePatCSV(text) {
  let best = { rows: [], hIdx: -1, cols: 0 };
  for (const sep of [";", ",", "\t"]) {
    const rows = parseCSV(text, sep);
    const hIdx = rows.findIndex(r => normalize(r[0]) === "date" && r.length > 1);
    if (hIdx >= 0 && rows[hIdx].length > best.cols) best = { rows, hIdx, cols: rows[hIdx].length };
  }
  return best;
}
const SEP_HINT = " (colonnes séparées par « ; » ou « , »)";
/* Tableau large : une ligne par mois, une colonne par compte. Les colonnes après le
   dernier compte réel ("Colonne5"…, "Total"…) sont des calculs du tableur, pas des comptes. */
function parsePatComptesCSV(text) {
  const { rows, hIdx } = parsePatCSV(text);
  if (hIdx < 0) return { error: "Colonne « Date » introuvable dans Data-Comptes" + SEP_HINT + "." };
  const header = rows[hIdx], accCols = [];
  for (let i = 1; i < header.length; i++) {
    const h = (header[i] || "").trim();
    if (!h) continue;
    const n = normalize(h);
    if (n.startsWith("colonne") || n.startsWith("total")) break;
    accCols.push({ idx: i, name: h });
  }
  if (!accCols.length) return { error: "Aucune colonne de compte trouvée dans Data-Comptes." };
  const values = {};
  accCols.forEach(a => (values[a.name] = {}));
  for (let r = hIdx + 1; r < rows.length; r++) {
    const mkRaw = parseFrCompteDate(rows[r][0]);
    if (!mkRaw) continue;
    /* La ligne "1 janv 2023" est l'état des comptes AU 1er janvier, donc la valorisation
       de clôture de décembre 2022 — même convention que les valeurs saisies dans l'app
       (patAccountValue traite une clé "YYYY-MM" comme la valeur de FIN de ce mois-là). */
    const mk = addMonth(mkRaw, -1);
    accCols.forEach(a => {
      const v = parseAmount(rows[r][a.idx]);
      if (v != null) values[a.name][mk] = v;
    });
  }
  return { accounts: accCols.map(a => a.name), values, error: null };
}
function parsePatMouvementsCSV(text) {
  const { rows, hIdx } = parsePatCSV(text);
  if (hIdx < 0) return { error: "Colonne « Date » introuvable dans Data-Mouvements" + SEP_HINT + "." };
  const norm = rows[hIdx].map(normalize);
  const ci = { date: norm.indexOf("date"), compte: norm.indexOf("compte"), montant: norm.findIndex(h => h.startsWith("montant")) };
  if (ci.date < 0 || ci.compte < 0 || ci.montant < 0)
    return { error: "Colonnes Date/Compte/Montant introuvables dans Data-Mouvements" + SEP_HINT + "." };
  const movements = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const date = parseDate(row[ci.date]), compte = (row[ci.compte] || "").trim(), amount = parseAmount(row[ci.montant]);
    if (!date || !compte || amount == null) continue;
    movements.push({ compte, date, amount });
  }
  return { movements, error: null };
}
function importPatrimoineCsv(comptesText, mouvementsText) {
  const c = parsePatComptesCSV(comptesText);
  if (c.error) return { error: c.error };
  const m = parsePatMouvementsCSV(mouvementsText);
  if (m.error) return { error: m.error };

  /* Le CSV est la source de vérité : on remplace tout l'onglet Patrimoine plutôt que de
     fusionner, pour qu'un ré-import après mise à jour du tableur reflète exactement le fichier
     (pas de doublons, pas de compte fantôme). On garde juste le réglage "perf. globale" par
     compte, qui n'existe pas dans le CSV. */
  const prevPerfExcluded = {};
  (DB.patAccounts || []).forEach(a => { prevPerfExcluded[normalize(a.name)] = a.perfExcluded; });

  DB.patAccounts = []; DB.patValues = {}; DB.patMovements = [];
  const nameToId = {};
  c.accounts.forEach(name => {
    const key = normalize(name);
    const id = newPatAccountId(name);
    DB.patAccounts.push({ id, name, type: guessPatType(name), perfExcluded: prevPerfExcluded[key] || false });
    nameToId[key] = id;
  });
  let valuesImported = 0;
  c.accounts.forEach(name => {
    const id = nameToId[normalize(name)];
    DB.patValues[id] = { ...c.values[name] };
    valuesImported += Object.keys(c.values[name]).length;
  });
  let nextId = 1, movementsImported = 0, movementsSkipped = 0;
  m.movements.forEach(mv => {
    const accountId = nameToId[normalize(mv.compte)];
    if (!accountId) { movementsSkipped++; return; }
    DB.patMovements.push({ id: nextId++, accountId, date: mv.date, amount: mv.amount });
    movementsImported++;
  });

  saveDB();
  return { accountsCreated: c.accounts.length, valuesImported, movementsImported, movementsSkipped, error: null };
}

function last12Months(endKey) {
  const out = []; for (let i = 11; i >= 0; i--) out.push(addMonth(endKey, -i));
  return out;
}
/* Tout l'historique saisi, du plus ancien mois valorisé (sur n'importe quel compte) jusqu'à endKey. */
function allPatMonths(endKey) {
  const vals = DB.patValues || {};
  let minKey = endKey;
  Object.values(vals).forEach(v => Object.keys(v).forEach(k => { if (k < minKey) minKey = k; }));
  const out = []; let k = minKey;
  while (k <= endKey) { out.push(k); k = addMonth(k, 1); }
  return out;
}

  const cmp = accPerf.filter(x => x.pm != null).sort((x, y) => y.pm - x.pm);

      }).join("") + "</div>";

  html += "</div>";

  const perfMonths = last12Months(month).map(mk => ({ mk, perf: patMonthlyPerf(null, mk) }));

  html += '<div class="card"><div class="chead"><h2>Performance mensuelle</h2><div class="spacer"></div>' +
    '<span class="tiny muted">hors mouvements</span></div>' +
    perfMonths.map(x => {

      return '<div style="display:grid;grid-template-columns:52px 1fr 72px;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line-2)">' +

        (x.perf == null ? "—" : esc(fmtRate(x.perf))) + "</span></div>";
    }).join("") + "</div>";

  return html;

function registerCat(c) { if (!CAT_BY_ID[c.id]) { CATS.push(c); CAT_BY_ID[c.id] = c; } }
/* Backups exported before the customCats fix don't carry custom category
   definitions, so a restored tx can point at an id nothing declares. Rebuild
   a placeholder from the bank's own label rather than let lookups crash. */
function recoverMissingCats(db) {
  const known = new Set((db.customCats || []).map(c => c.id));
  db.tx.forEach(t => {
    if (!t.cat || CAT_BY_ID[t.cat] || known.has(t.cat)) return;
    const c = { id: t.cat, group: "g_legacy", name: t.bankCat || t.cat, custom: true, recovered: true };
    registerCat(c);
    db.customCats = db.customCats || []; db.customCats.push(c);
    known.add(t.cat);
  });
}
function newCatId(name) {
  let base = "x_" + normalize(name).replace(/ /g, "_").slice(0, 22) || "x_cat";
  let id = base, n = 2; while (CAT_BY_ID[id]) id = base + "_" + n++;
  return id;
}
function createCategory(name, groupId) {
  const c = { id: newCatId(name), group: groupId, name: name.trim(), custom: true };
  registerCat(c);
  DB.customCats = DB.customCats || []; DB.customCats.push(c);
  saveDB(); return c;
}

/* Duplicates are computed as soon as the file is read, so the choice can be offered. */
function analyseDuplicates() {
  const rows = WIZ.rows;
  rows.forEach(r => r.merchantKey = merchantKey(r));
  const verdicts = detectDuplicates(rows, DB.tx, { windowDays: DB.settings.dupWindow, amountTol: (DB.settings.dupTol || 5) / 100 });

  WIZ.dups = verdicts.filter(v => v.status !== ST_OK);

    '<div style="display:flex;align-items:center;gap:8px;font-weight:600">' + icon("warn") + WIZ.dups.length +

    '<div class="tiny" style="margin:5px 0 8px">' + sure + " doublon" + (sure > 1 ? "s" : "") + " certain" + (sure > 1 ? "s" : "") +

function readFileText(file, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(fr.result); }
    catch (e) { text = new TextDecoder("windows-1252").decode(fr.result); }
    cb(text, file.name);
  };
  fr.readAsArrayBuffer(file);
}
function ingest(text, name) {
  const res = parseStatement(text);
  if (res.error) { WIZ.error = res.error; WIZ.rows = []; }
  else { WIZ.rows = res.rows; WIZ.error = null; WIZ.name = name || "collé"; WIZ.step = 2; WIZ.noMerchantCol = res.merchantColumnIsCategory; }
  if (WIZ.rows.length) analyseDuplicates();
  render();
}

function commitImport() {
  const rows = WIZ.rows;
  rows.forEach(r => r.merchantKey = merchantKey(r));
  const idx = buildMerchantIndex(DB.tx.map(t => t.merchantKey).concat(rows.map(r => r.merchantKey)));
  const legacy = WIZ.mode === "history" ? Object.assign({}, LEGACY_MAP, DB.legacyMap, WIZ.mapping) : Object.assign({}, LEGACY_MAP, DB.legacyMap);
  const dup = WIZ.verdicts || detectDuplicates(rows, DB.tx, { windowDays: DB.settings.dupWindow, amountTol: (DB.settings.dupTol || 5) / 100 });
  const impId = (DB.imports.reduce((m, i) => Math.max(m, i.id), 0) || 0) + 1;
  const label = WIZ.mode === "history" ? "Reprise historique" : todayISO().split("-").reverse().join("/");
  let added = 0, dupCount = 0, ignored = 0;
  const fresh = [];
  const history = WIZ.mode === "history";
  dup.forEach(({ row, status }) => {
    if (status !== ST_OK && !WIZ.importDups && !history) return;      // skipped entirely, as chosen
    const c = categorise(row, DB.rules, idx, legacy);
    const st = status !== ST_OK ? status : (history ? c.status : ST_OK);
    const t = { date: row.date, label: row.label, merchantRaw: row.merchantRaw, amount: row.amount,
                /* a new operation is never categorised behind the user's back: only the reprise
                   inherits the categories a human already assigned in the spreadsheet */
                cat: history ? c.cat : null, status: st, imp: impId, bankCat: row.bankCat, merchantKey: row.merchantKey };
    fresh.push(t);
    if (st === ST_DUP || st === ST_DUP_MAYBE) dupCount++; else if (st === ST_IGNORED) ignored++; else added++;
  });
  DB.tx = DB.tx.concat(fresh);
  if (WIZ.mode === "history") DB.legacyMap = Object.assign({}, DB.legacyMap, WIZ.mapping);
  reindex();
  let learned = 0;
  if (WIZ.mode === "history") {
    learned = learnRulesFromHistory(0.6);
    // second pass: vendor rules fill in what the old spreadsheet never categorised
    fresh.forEach(t => {
      if (t.cat || t.status === ST_DUP || t.status === ST_DUP_MAYBE) return;
      const c = categorise(t, DB.rules, MERCHANT_INDEX, legacy);
      if (c.cat) { t.cat = c.cat; if (c.status === ST_IGNORED) { t.status = ST_IGNORED; ignored++; added--; } }
    });
  }
  DB.imports.push({ id: impId, date: label, name: label, file: WIZ.name, n: fresh.length });
  const todo = fresh.filter(t => t.status === ST_OK && !t.cat).length;
  saveDB(); reindex();
  WIZ.result = { added, dup: dupCount, todo, ignored, rules: learned, name: label };
  UI.showDup = false;
  const dates = fresh.map(t => t.date).sort();
  if (dates.length) { UI.month = monthKey(dates[dates.length - 1]); UI.year = yearOf(dates[dates.length - 1]); }
  if (history) { WIZ.step = 4; render(); }
  else {                                   // straight into one-by-one sorting
    const ids = fresh.filter(t => t.status === ST_OK).map(t => t.id);
    UI.modal = null; WIZ = null;
    if (ids.length) startReview(ids, "Import du " + label);
    else { render(); toast("Rien de nouveau à trier."); }
  }
}

  const c = categorise(t, DB.rules, MERCHANT_INDEX, DB.legacyMap);
  return c;

        "Revenir sur la dernière</button></div>" : "") + "</div></div>";
  }

  const sel = REVIEW.sel === undefined ? sug.cat : REVIEW.sel;

  const kind = /CARTE/i.test(t.label) ? "Carte" : /VIR/i.test(t.label) ? "Virement" : /PRLV|PREL/i.test(t.label) ? "Prélèvement" : /RETRAIT|DAB/i.test(t.label) ? "Retrait" : "Opération";
  const selGroup = sel ? catGroup(sel) : null;
  const accent = selGroup ? selGroup.color : "var(--ink-mute)";

  const initials = merchant.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, " ").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";

    (selGroup ? icon(selGroup.icon, 24) : esc(initials)) + "</div>";

  /* why this suggestion, in four words rather than a sentence */
  const why = { rule: "déjà classé ainsi", legacy: "d\u2019après le relevé", keyword: "commerçant reconnu", neutral: "transfert interne probable" }[sug.source];
  const twins = sug.source === "rule" ? DB.tx.filter(x => x.cat === sug.cat && x !== t && canonOf(x) === canonOf(t)).length : 0;

  /* quick picks: the suggestion, then the categories actually used the most */
  const used = {};
  DB.tx.forEach(x => { if (x.cat && !CAT_BY_ID[x.cat].legacy) used[x.cat] = (used[x.cat] || 0) + 1; });
  const quick = [];
  if (sug.cat) quick.push(sug.cat);
  Object.keys(used).sort((a, b) => used[b] - used[a]).forEach(c => { if (quick.length < 6 && quick.indexOf(c) < 0) quick.push(c); });
  if (sel && quick.indexOf(sel) < 0) quick.unshift(sel);

  const pickBtn = cid => {

    return '<button class="pick ' + (on ? "on" : "") + '" data-act="revsel" data-cat="' + cid + '"' +
      (on ? ' style="border-color:' + g.color + ";background:" + g.color + '14;color:' + g.color + '"' : "") + ">" +
      '<span class="dot" style="background:' + g.color + '"></span>' + esc(c.name) + "</button>";
  };

  let picker = '<div class="pickrow">' + quick.map(pickBtn).join("") + "</div>";
  if (REVIEW.expand) {
    picker += GROUPS.map(g => {
      const list = CATS.filter(c => c.group === g.id && (!c.legacy || c.id === sel) && quick.indexOf(c.id) < 0);
      if (!list.length) return "";
      return '<div class="grouplab">' + esc(g.name) + '</div><div class="pickrow">' + list.map(c => pickBtn(c.id)).join("") + "</div>";
    }).join("");
  }

  const segments = [];
  for (let i = 0; i < Math.min(REVIEW.total, 24); i++) {

  return '<div class="modal-back"><div class="modal" style="max-width:600px">' +

    '<div class="segbar">' + segments.join("") + "</div>" +

        '<div class="revamt num ' + (expense ? "" : "pos") + '">' + esc(fmtEur(t.amount, { plus: true })) + "</div>" +
      "</div>" +
      '<div class="rlabel" style="margin-top:10px">' + esc(t.label) + "</div>" +
      (sug.cat && sug.source ? '<div class="revwhy">' + icon(sug.source === "rule" ? "check" : "eye", 12) + esc(why) +

      (!expense ? '<div class="revwhy">' + icon("income", 12) + "montant reçu : revenu, ou remboursement à déduire d\u2019un poste</div>" : "") +
      '<div class="moreline"><span class="hr"></span><button data-act="revexpand">' +

        (REVIEW.remember ? "checked" : "") + "> Mémoriser</label>" +
      '<button class="btn primary big" data-act="revvalidate" ' + (sel ? "" : "disabled") +
        (sel && selGroup ? ' style="background:' + selGroup.color + ";border-color:" + selGroup.color + '"' : "") + ">" +
        icon("check") + (sel ? esc(CAT_BY_ID[sel].name) : "Choisir une catégorie") + "</button>" +

      '<span class="kbd">→</span> plus tard · <span class="kbd">Retour arrière</span> revenir</div>' +
    "</div></div>";
}
function reviewAct(action) {
  const t = reviewCurrent();
  if (!t || REVIEW.busy) return;      // one card at a time, even on a double tap
  const card = document.getElementById("revcard");
  const sug = reviewSuggestion(t);
  const sel = REVIEW.sel === undefined ? sug.cat : REVIEW.sel;
  if (action === "validate" && !sel) { toast("Choisissez une catégorie."); return; }
  REVIEW.busy = true;
  /* everything this action touches is recorded, so it can be taken back */
  const undo = { at: REVIEW.i, id: t.id, action: action, sel: sel,
                 prevCat: t.cat, prevStatus: t.status, rules: [], siblings: [] };
  const apply = () => {
    REVIEW.busy = false;
    if (action === "validate") {
      t.cat = sel;
      t.status = catKind(sel) === KIND_NEUTRAL ? ST_IGNORED : ST_OK;
      const key = canonOf(t) || labelKey(t);
      const legacy = CAT_BY_ID[sel] && CAT_BY_ID[sel].legacy;
      if (REVIEW.remember && !legacy && key && key.length > 2 && /[a-z]{3}/.test(key) && !OPAQUE_MERCHANTS.has(key)) {
        const lk = labelKey(t);
        [key, lk].forEach(k => {
          if (!k || k.length < 3 || OPAQUE_MERCHANTS.has(k) || DB.rules[k] === sel) return;
          undo.rules.push([k, DB.rules[k]]);
          DB.rules[k] = sel;
        });
        /* the rest of the batch from the same merchant is settled at the same time */
        const removals = [];
        DB.tx.forEach(x => {
          if (x === t || !isTodo(x) || canonOf(x) !== canonOf(t)) return;
          const at = REVIEW.ids.indexOf(x.id);
          if (at <= REVIEW.i) return;
          undo.siblings.push({ id: x.id, at: at, prevCat: x.cat, prevStatus: x.status });
          x.cat = sel;
          if (catKind(sel) === KIND_NEUTRAL) x.status = ST_IGNORED;
          removals.push(at);
        });
        removals.sort((a, b) => b - a).forEach(at => REVIEW.ids.splice(at, 1));
      }
    } else if (action === "ignore") {
      t.status = ST_IGNORED; t.cat = t.cat || "c_transfer";
    }
    REVIEW.history.push(undo);
    REVIEW.i++; REVIEW.sel = undefined;
    saveDB(); render();
  };
  if (card && action !== "skip") {
    card.classList.add(action === "ignore" ? "out-left" : "out-right");
    setTimeout(apply, 240);
  } else apply();
}

/* Step back one card and undo what that card's action changed. */
function reviewBack() {
  if (!REVIEW || !REVIEW.history.length || REVIEW.busy) return;
  const u = REVIEW.history.pop();
  const t = DB.tx[u.id];
  if (t) { t.cat = u.prevCat; t.status = u.prevStatus; }
  u.rules.forEach(([k, prev]) => { if (prev === undefined) delete DB.rules[k]; else DB.rules[k] = prev; });
  u.siblings.slice().sort((a, b) => a.at - b.at).forEach(s => {
    const x = DB.tx[s.id];
    if (x) { x.cat = s.prevCat; x.status = s.prevStatus; }
    REVIEW.ids.splice(s.at, 0, s.id);
  });
  REVIEW.i = u.at;
  REVIEW.sel = u.action === "validate" ? u.sel : undefined;   // the previous pick comes back selected
  saveDB(); render();
}

/* =========================================================================
   Backup / export
   ========================================================================= */
function download(filename, content, type) {
  const blob = new Blob([content], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON() {
  download("budget-sauvegarde-" + todayISO() + ".json", serialize(DB), "application/json");
  toast("Sauvegarde exportée.");
}
function exportCSV() {
  const head = ["date", "libelle", "vendeur", "montant", "groupe", "categorie", "statut", "import"];
  const statusLabel = { 0: "compte", 1: "doublon", 2: "doublon probable", 3: "ignore" };
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [head.join(";")].concat(DB.tx.map(t => [
    t.date, t.label, t.merchantRaw || "", String(t.amount).replace(".", ","),
    t.cat && catGroup(t.cat) ? catGroup(t.cat).name : "", t.cat ? catName(t.cat) : "",
    statusLabel[t.status], importLabel(t.imp),
  ].map(q).join(";")));
  download("budget-operations-" + todayISO() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
  toast("Export CSV terminé.");
}
function restoreJSON(text) {
  try {
    const db = deserialize(text);
    if (!confirm("Restaurer cette sauvegarde ? Les " + DB.tx.length + " opérations actuelles seront remplacées par " + db.tx.length + " opérations.")) return;
    DB = db;
    (DB.customCats || []).forEach(registerCat);
    recoverMissingCats(DB);
    reindex(); saveDB(); render(); toast("Sauvegarde restaurée.");
  } catch (e) { toast("Fichier illisible : ce n\u2019est pas une sauvegarde Budget."); }
}
