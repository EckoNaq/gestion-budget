<script>
/* =========================================================================
   Budget — single-file expense tracker. All data stays in this browser.
   ========================================================================= */
/* ==== PURE START ==== */

const STORE_KEY = "budget.app.v1";          // distinct from any other local app
/* 2 : ajout des passifs (patLiabilities / patDebtValues) et des réglages de projection.
   Aucune migration n'est nécessaire — deserialize() donne une valeur par défaut à toute
   clé absente, donc une sauvegarde v1 se restaure telle quelle. */
const SCHEMA_VERSION = 2;

const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_SHORT = ["jan","fév","mar","avr","mai","jun","jui","aoû","sep","oct","nov","déc"];

/* Operation status */
const ST_OK = 0, ST_DUP = 1, ST_DUP_MAYBE = 2, ST_IGNORED = 3;

/* Category kinds: how a group takes part in the numbers */
const KIND_EXPENSE = "expense", KIND_INCOME = "income", KIND_NEUTRAL = "neutral";

/* -------------------------------------------------------------------------
   Taxonomy: groups carry the analysis, subcategories carry the detail.
   `legacy` subcategories are kept so imported history stays exactly as it was
   recorded, but they are never offered when categorising something new.
   ------------------------------------------------------------------------- */
const GROUPS = [
  { id:"g_home",    name:"Logement",              kind:KIND_EXPENSE, color:"#3B5BDB", icon:"home"     },
  { id:"g_car",     name:"Véhicule & transports", kind:KIND_EXPENSE, color:"#0E7C86", icon:"car"      },

  { id:"g_subs",    name:"Abonnements & télécom", kind:KIND_EXPENSE, color:"#7048B6", icon:"signal"   },
  { id:"g_health",  name:"Santé & soins",         kind:KIND_EXPENSE, color:"#1F8A4C", icon:"heart"    },
  { id:"g_shop",    name:"Achats & équipement",   kind:KIND_EXPENSE, color:"#C2255C", icon:"bag"      },
  { id:"g_leisure", name:"Sorties & vacances",    kind:KIND_EXPENSE, color:"#946200", icon:"ticket"   },
  { id:"g_fees",    name:"Frais & obligations",   kind:KIND_EXPENSE, color:"#5C6270", icon:"receipt"  },
  { id:"g_legacy",  name:"Divers (historique)",   kind:KIND_EXPENSE, color:"#8A6E5D", icon:"dots"     },
  { id:"g_income",  name:"Revenus",               kind:KIND_INCOME,  color:"#0F7A55", icon:"income"   },
  { id:"g_neutral", name:"Épargne & transferts",  kind:KIND_NEUTRAL, color:"#6B7280", icon:"vault"    },
];

const CATS = [
  ["c_rent",       "g_home",    "Loyer"],
  ["c_power",      "g_home",    "Électricité & gaz"],
  ["c_water",      "g_home",    "Eau"],
  ["c_homeins",    "g_home",    "Assurance habitation"],
  ["c_homegear",   "g_home",    "Équipement & déco"],
  ["c_works",      "g_home",    "Travaux & entretien"],
  ["c_homemisc",   "g_home",    "Divers logement", true],

  ["c_carins",     "g_car",     "Assurance auto"],
  ["c_fuel",       "g_car",     "Carburant"],
  ["c_carfix",     "g_car",     "Entretien & réparation"],
  ["c_parking",    "g_car",     "Parking & péages"],
  ["c_transit",    "g_car",     "Transports"],
  ["c_carmisc",    "g_car",     "Divers véhicule", true],

  ["c_grocery",    "g_food",    "Courses"],
  ["c_delivery",   "g_food",    "Livraison de repas"],
  ["c_resto",      "g_food",    "Restaurants & bars"],

  ["c_internet",   "g_subs",    "Internet"],
  ["c_mobile",     "g_subs",    "Mobile"],
  ["c_subs",       "g_subs",    "Abonnements"],

  ["c_doctor",     "g_health",  "Médecin & soins"],
  ["c_pharmacy",   "g_health",  "Pharmacie"],
  ["c_hair",       "g_health",  "Coiffeur & beauté"],
  ["c_sport",      "g_health",  "Sport"],

  ["c_clothes",    "g_shop",    "Vêtements"],
  ["c_games",      "g_shop",    "Jeux & objets"],
  ["c_tech",       "g_shop",    "High-tech"],
  ["c_gifts",      "g_shop",    "Cadeaux"],

  ["c_outings",    "g_leisure", "Sorties"],
  ["c_holidays",   "g_leisure", "Vacances & voyages"],
  ["c_leisuremisc","g_leisure", "Divers loisirs", true],

  ["c_bankfees",   "g_fees",    "Frais bancaires"],
  ["c_tax",        "g_fees",    "Impôts & taxes"],
  ["c_fines",      "g_fees",    "Amendes"],
  ["c_otherins",   "g_fees",    "Assurances diverses"],

  ["c_dailymisc",  "g_legacy",  "Divers vie quotidienne", true],
  ["c_unknown",    "g_legacy",  "Inconnu", true],

  ["c_salary",     "g_income",  "Salaire"],
  ["c_bonus",      "g_income",  "Bonus"],
  ["c_incmisc",    "g_income",  "Revenus divers"],
  ["c_refund",     "g_income",  "Remboursements"],

  ["c_savings",    "g_neutral", "Épargne & investissement"],
  ["c_transfer",   "g_neutral", "Virement interne"],
].map(([id, group, name, legacy]) => ({ id, group, name, legacy: !!legacy }));

const CAT_BY_ID = Object.fromEntries(CATS.map(c => [c.id, c]));
const GROUP_BY_ID = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const catGroup = catId => (CAT_BY_ID[catId] ? GROUP_BY_ID[CAT_BY_ID[catId].group] : null);
const catKind = catId => { const g = catGroup(catId); return g ? g.kind : null; };
const catName = catId => (CAT_BY_ID[catId] ? CAT_BY_ID[catId].name : "—");

/* -------------------------------------------------------------------------
   Legacy spreadsheet values (column D) -> categories of this app.
   `null` means "no safe guess, ask during the import".
   ------------------------------------------------------------------------- */
const LEGACY_MAP = {
  // categories the user maintained himself
  "loyer":"c_rent", "assurance maison":"c_homeins", "electricite gaz":"c_power", "eau":"c_water",
  "divers logement":"c_homemisc", "assurance auto":"c_carins", "essence":"c_fuel",
  "entretien":"c_carfix", "divers vehicule":"c_carmisc", "courses":"c_grocery",
  "deliveroo":"c_delivery", "restaurants bars":"c_resto", "internet":"c_internet",
  "mobile":"c_mobile", "abonnements":"c_subs", "vetements":"c_clothes", "coiffeur":"c_hair",
  "sport":"c_sport", "vacances":"c_holidays", "sorties":"c_outings", "jeux objets":"c_games",
  "divers loisirs":"c_leisuremisc", "divers vie quotidienne":"c_dailymisc", "inconnu":"c_unknown",
  // categories left as the bank had labelled them
  "restaurants bars discotheques":"c_resto", "restaurants":"c_resto", "alimentation":"c_grocery",
  "mobilier electromenager decoration":"c_homegear", "club association sport hobby art":"c_sport",
  "transports quotidiens metro bus":"c_transit", "transports longue distance avions trains":"c_transit",
  "frais bancaires et de gestion dont agios":"c_bankfees",
  "energie electricite gaz fuel chauffage":"c_power", "telephonie fixe et mobile":"c_mobile",
  "telephone":"c_mobile", "multimedia a domicile tv internet telephonie":"c_internet",
  "journaux magazines":"c_subs", "livres cd dvd bijoux jouets":"c_games",
  "divertissement culture cine theatre concerts":"c_outings",
  "equipements sportifs et artistiques":"c_sport", "vetements et accessoires":"c_clothes",
  "electronique et informatique":"c_tech", "carburant":"c_fuel", "parking":"c_parking",
  "peages":"c_parking", "bricolage et jardinage":"c_works",
  "travaux reparation entretien amenagement":"c_works", "assurances auto moto":"c_carins",
  "assurance habitation et rc":"c_homeins", "entretien reparation":"c_carfix",
  "impots taxes":"c_tax", "contraventions":"c_fines", "medecins et frais medicaux":"c_doctor",
  "pharmacie et laboratoire":"c_pharmacy", "hebergement hotels camping":"c_holidays",
  "depenses jeux et paris":"c_outings", "loyers charges":"c_rent",
  "cadeaux et solidarite":"c_gifts", "sante":"c_doctor",
  // income
  "salaire":"c_salary", "vir sepa ibm international treasury serv":"c_salary",
  // money that never left the estate -> ignored, exactly like in the spreadsheet
  "pea":"c_savings", "livret a":"c_savings", "livreta":"c_savings", "pel":"c_savings",
  "av":"c_savings", "assurance vie":"c_savings", "crypto":"c_savings",
  "epargne financiere retraite prevoyance pea assurance vie":"c_savings",
  "depenses d epargne autres":"c_savings", "virements emis":"c_transfer",
  "virements recus":"c_transfer", "virements emis de comptes a comptes":"c_transfer",
  "virements recus de comptes a comptes":"c_transfer",
  "vir virement depuis boursobank":"c_transfer", "vir virement depuis livret a":"c_transfer",
  "mouvements internes debiteurs":"c_transfer", "mouvements internes crediteurs":"c_transfer",
  "retraits cash":"c_transfer", "remboursement de frais offres boursorama":"c_transfer",
  "autorisation paiement retrait en cours":"c_transfer", "doublon":"c_transfer",
  // deliberately unresolved
  "vie quotidienne autres":null, "non categorise":null, "loisirs autres":null,
  "auto moto autres":null, "paypal":null, "fournitures autres":null, "imprimerie":null,
};

/* Merchant keywords, used when no rule exists yet. */
const KEYWORDS = [
  [/CARREFOUR|AUCHAN|LIDL|LECLERC|INTERMARCHE|INTERMACHE|CASINO|MONOPRIX|FRANPRIX|PICARD|GRAND FRAIS|BIOCOOP|SUPER U|\bMATCH\b|HELLOFRESH|MAXICOFFEE|BOULANGER|MARIE BLACHERE/, "c_grocery"],
  [/DELIVEROO|UBER ?EATS|JUST ?EAT|FRICHTI/, "c_delivery"],
  [/MCDONALD|MCDO|BURGER|\bKFC\b|RESTAURANT|BRASSERIE|PIZZ|SUSHI|\bBAR\b|CAFE|TACOS|SUBWAY|STARBUCKS|O TACOS|POKAWA/, "c_resto"],
  [/ENGIE|\bEDF\b|TOTALENERGIE|ELECTRICITE|\bGAZ\b|ENI GAS/, "c_power"],
  [/VEOLIA|SAUR|\bSUEZ\b|EAU DE LA METROPOLE|\bEMEL\b|NOREADE/, "c_water"],
  [/ESSO|SHELL|\bBP\b|STATION|CARBURANT|AVIA|\bAGIP\b|TOTAL ACCESS/, "c_fuel"],
  [/NORAUTO|FEU VERT|MIDAS|SPEEDY|CARROSSERIE|GARAGE|CONTROLE TECHNIQUE/, "c_carfix"],
  [/HORODATEUR|INDIGO|\bPARKING\b|EFFIA|SANEF|APRR|VINCI AUTOROUTE/, "c_parking"],
  [/\bSNCF\b|ILEVIA|VELOV|\bRATP\b|BLABLACAR|FLIXBUS|\bUBER\b(?! ?EATS)|\bTAXI\b|TRAINLINE/, "c_transit"],
  [/\bSFR\b|ORANGE|BOUYGUES|\bFREE\b|SOSH|RED BY|TELECOM/, "c_mobile"],
  [/NETFLIX|SPOTIFY|DEEZER|DISNEY|CANAL|PRIME VIDEO|ICLOUD|GOOGLE STORAGE|DROPBOX|MICROSOFT 365/, "c_subs"],
  [/PHARMACIE|DOCTEUR|\bDR\b|MEDECIN|LABORATOIRE|DENTAIRE|OPTIC|MUTUELLE|\bKINE\b|HOPITAL|CPAM/, "c_doctor"],
  [/BASIC ?FIT|FITNESS|KEEPCOOL|NEONESS|\bYOGA\b|SALLE DE SPORT|DECATHLON|CLUB ALPIN/, "c_sport"],
  [/COIFF|SEPHORA|NOCIBE|MARIONNAUD|YVES ROCHER|\bNAIL\b|INSTITUT|BARBIER/, "c_hair"],
  [/IKEA|LEROY MERLIN|CASTORAMA|CONFORAMA|MAISONS DU MONDE|\bGIFI\b|ZARA HOME|BUT\b/, "c_homegear"],
  [/ZARA|\bH&M\b|KIABI|UNIQLO|PRIMARK|JULES|CELIO|VETEMENT|CHAUSSURE|SHEIN|VINTED|CACHE CACHE/, "c_clothes"],
  [/BOARDGAMEARENA|PHILIBERT|LUDUM|FOLDED SPACE|NINTENDO|STEAM|PLAYSTATION|\bXBOX\b|CULTURA|\bFNAC\b|MICROMANIA/, "c_games"],
  [/AMAZON|\bAMZ\b|LDLC|MATERIEL NET|BOULANGER ELEC|APPLE STORE|BACKMARKET/, "c_tech"],
  [/CINEMA|\bUGC\b|PATHE|GAUMONT|KINEPOLIS|THEATRE|CONCERT|MUSEE|ZOO|PARC ASTERIX/, "c_outings"],

  [/IMPOT|\bDGFIP\b|TRESOR PUBLIC|TAXE FONCIERE|URSSAF/, "c_tax"],
  [/AMENDE|ANTAI|CONTRAVENTION/, "c_fines"],
];

/* Labels that hide a transfer between the user's own accounts or savings. */
const NEUTRAL_PATTERNS = [
  /\bPEA\b/, /LIVRET/, /\bLDDS?\b/, /\bLEP\b/, /\bPEL\b/, /ASSURANCE ?VIE/, /\bAV\b MENSUEL/,
  /VIREMENT INTERNE/, /VIR INTERNE/, /DEPUIS BOURSOBANK/, /VERS BOURSOBANK/,
  /VIREMENT ECONOMIE/, /ECONOMIE DU MOIS/, /EPARGNE/, /BINANCE|COINBASE|KRAKEN|BITSTAMP/,
];

/* Top-level labels the bank puts in place of a merchant since its 2026 export
   change: they describe a category, not a shop. */
const BANK_PARENTS = new Set([
  "loisirs et sorties","vie quotidienne","non categorise","voyages transports","voyages et transports",
  "virements recus","virements emis","auto moto","auto et moto","logement","abonnements telephonie",
  "abonnements et telephonie","services financiers professionnels","services financiers et professionnels",
  "sante","mouvements internes crediteurs","mouvements internes debiteurs","impots taxes","impots et taxes",
  "revenus","epargne","depenses d epargne","scolarite enfants","retraits cash","divers",
]);

/* Merchant names that describe the rail, not the shop: never build a rule on them. */
const OPAQUE_MERCHANTS = new Set([
  "paypal","boursorama banque","boursobank","virement","retrait automate","retrait",
  "sumup","zettle","stripe","lydia","lydia solutions","wero","sepa","carte",
  "virements recus","virements emis","virements","virement interne","prelevement","prelevements",
  "non categorise","inconnu","divers",
]);
/* Canonical merchant, or "" when the name only describes the payment rail. */
function canonMerchant(row, merchantIndex) {
  const k = merchantIndex && merchantIndex[row.merchantKey] ? merchantIndex[row.merchantKey] : (row.merchantKey || "");
  return OPAQUE_MERCHANTS.has(k) ? "" : k;
}

/* ---------------- small helpers ---------------- */
const pad2 = n => String(n).padStart(2, "0");
const monthKey = iso => iso.slice(0, 7);
const yearOf = iso => +iso.slice(0, 4);
const dayOf = iso => +iso.slice(8, 10);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
function monthLabel(key) { const [y, m] = key.split("-"); return MONTHS[+m - 1] + " " + y; }
function addMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}
function daysBetween(isoA, isoB) {

  if (s.indexOf("-") >= 0) { neg = true; s = s.replace(/-/g, ""); }

/* ---------------- date parsing ---------------- */

  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (!m) return null;
  let d = +m[1], mo = +m[2], y = +m[3];
  if (d > 12 && mo <= 12) { /* day first, fine */ }
  else if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; }   // month-first export

  const line = text.split(/\r?\n/).find(l => l.trim()) || "";
  const counts = [[",", 0], [";", 0], ["\t", 0]];
  let inQuotes = false;
  for (const ch of line) {
    if (ch === '"') inQuotes = !inQuotes;
    else if (!inQuotes) for (const c of counts) if (ch === c[0]) c[1]++;
  }
  counts.sort((a, b) => b[1] - a[1]);

    if (inQuotes) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === sep) { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));

/* Column names are matched by header, never by position: the bank has already

const COLUMN_ALIASES = {

  dateVal:  ["dateval", "date de valeur", "date valeur"],
  label:    ["label", "libelle", "libelle operation", "libelle simplifie", "nature de l operation", "description"],
  bankCat:  ["category", "categorie", "categorie operation"],
  merchant: ["supplierfound", "supplier", "fournisseur", "vendeur", "commercant", "beneficiaire"],
  bankParent: ["categoryparent", "categorie parente", "categorie parent"],
  amount:   ["amount", "montant", "montant eur", "montant operation"],
  debit:    ["debit", "montant debit"],
  credit:   ["credit", "montant credit"],

    if (idx < 0) for (const a of aliases) { idx = norm.findIndex(h => h && h.startsWith(a)); if (idx >= 0) break; }

function parseStatement(text) {

  const cols = mapHeader(rows[0]);
  if (cols.date == null || cols.label == null || (cols.amount == null && cols.debit == null))
    return { rows: [], error: "Colonnes introuvables. Il faut au minimum une date, un libellé et un montant." };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const date = parseDate(r[cols.date]);
    const label = (r[cols.label] || "").trim();
    let amount = cols.amount != null ? parseAmount(r[cols.amount]) : null;
    if (amount == null && cols.debit != null) {

  const merchantColumnIsCategory = named.length > 4 && categoryLike / named.length > 0.5;
  if (merchantColumnIsCategory) out.forEach(r => { r.bankParent = r.bankParent || r.merchantRaw; r.merchantRaw = ""; });

/* ---------------- merchant ----------------

const LABEL_NOISE = /\b(CARTE|CB|PAIEMENT|PRLV|PRELEVEMENT|PREL|VIR|VIREMENT|SEPA|INST|RECU|EMIS|ACHAT|FACTURE|RETRAIT|DAB|AVOIR|REMBT?)\b/g;

   appear between two imports. Each stored operation may absorb at most one

    if (!byCents.has(c.cents)) byCents.set(c.cents, []);
    byCents.get(c.cents).push(c);               // same objects in both indexes: "taken" is shared
    if (c.mk) { if (!byMerchant.has(c.mk)) byMerchant.set(c.mk, []); byMerchant.get(c.mk).push(c); }
  });
  const results = [];
  for (const row of incoming) {
    const anchor = dupAnchor(row);
    let hit = null;
    for (const c of byCents.get(Math.round(row.amount * 100)) || []) {
      if (c.taken || daysBetween(anchor, c.anchor) > windowDays) continue;
      if (row.merchantKey && c.mk && row.merchantKey !== c.mk) continue;
      hit = { cand: c, level: ST_DUP }; break;
    }
    if (!hit && row.merchantKey) {              // same shop, same week, amount adjusted after the fact
      for (const c of byMerchant.get(row.merchantKey) || []) {
        if (c.taken || daysBetween(anchor, c.anchor) > windowDays) continue;

/* =========================================================================

/* patReturn / patContribution : hypothèses de projection. null = déduites de l'historique

   patSafetyTarget : mois de dépenses visés en épargne de précaution, repère usuel 3 à 6. */
const DEFAULT_SETTINGS = { inflation: 1.9, band: 5, dupWindow: 5, dupTol: 5, theme: "auto", savingsGoal: 0,
  patReturn: null, patContribution: null, patTarget: 0, patSafetyTarget: 4 };

function emptyDB() {
  return { v: SCHEMA_VERSION, tx: [], rules: {}, income: {}, goals: {}, imports: [], legacyMap: {}, fixed: {}, settings: { ...DEFAULT_SETTINGS }, customCats: [], patAccounts: [], patValues: {}, patMovements: [], patLiabilities: [], patDebtValues: {}, patRules: {} };

/* Les deux moitiés de l'application, pour pouvoir en sauvegarder une sans l'autre.

   faute de quoi restaurer un export Patrimoine écraserait l'objectif d'épargne du Budget. */

    accounts: (DB.patAccounts || []).length, movements: (DB.patMovements || []).length,
    values: Object.values(DB.patValues || {}).reduce((s, v) => s + Object.keys(v || {}).length, 0),

/* -------------------------------------------------------------------------

   écrire ramenait donc tout son état, effaçant sans un mot ce que l'autre avait fait
   depuis — un import, une soirée de saisie, trois ans de valorisations. Il suffisait
   d'un clic sur « Thème » dans l'onglet resté ouvert la veille, puisque lui aussi
   enregistre. Ce n'était pas une fusion ratée mais un retour en arrière complet.

   D'où une révision, tenue dans une clé à part pour être relue sans déballer 300 Ko de
   JSON à chaque écriture. Avant d'écrire, une fenêtre vérifie qu'elle part bien de la
   révision qu'elle a lue ; sinon elle se déclare périmée et n'écrit plus rien. En prime
   l'événement `storage` la prévient dès que l'autre enregistre, avant même qu'on ait

function reindex() {

/* Majority vote per merchant over everything already categorised by hand. */
function learnRulesFromHistory(minShare) {
  const votes = {};
  const vote = (k, cat) => {
    if (!k || k.length < 3 || OPAQUE_MERCHANTS.has(k) || BANK_PARENTS.has(k)) return;
    if (!/[a-z]{3}/.test(k)) return;                     // reference numbers are not merchants
    (votes[k] = votes[k] || {})[cat] = (votes[k][cat] || 0) + 1;
  };
  DB.tx.forEach(t => {
    /* a rule never points at a legacy "Divers" bucket: those exist to keep the past
       intact, not to file anything new */
    if (!t.cat || t.status === ST_DUP || (CAT_BY_ID[t.cat] && CAT_BY_ID[t.cat].legacy)) return;
    vote(canonOf(t), t.cat);
    vote(labelKey(t), t.cat);      // the label works even when the bank drops the merchant column
  });
  let added = 0;
  for (const [k, v] of Object.entries(votes)) {
    const ranked = Object.entries(v).sort((a, b) => b[1] - a[1]);
    const total = ranked.reduce((s, x) => s + x[1], 0);
    if (ranked[0][1] / total >= (minShare || 0.6)) { if (!DB.rules[k]) added++; DB.rules[k] = ranked[0][0]; }
  }
  return added;
}

/* =========================================================================
   Numbers
   ========================================================================= */
const isCounted = t => t.status === ST_OK && !!t.cat;
const isExpense = t => isCounted(t) && catKind(t.cat) === KIND_EXPENSE;
const isIncomeOp = t => isCounted(t) && catKind(t.cat) === KIND_INCOME;
const isTodo = t => t.status === ST_OK && !t.cat;

function opsOfMonth(key) { return DB.tx.filter(t => monthKey(t.date) === key); }
function manualIncome(key) { const a = DB.income[key]; return a ? (a[0] || 0) + (a[1] || 0) + (a[2] || 0) : 0; }
function statementIncome(key) { return opsOfMonth(key).filter(isIncomeOp).reduce((s, t) => s + t.amount, 0); }

/* Spending per group. Refunds (positive amounts on an expense category) lower it. */
function groupTotals(ops) {
  const out = {};
  GROUPS.forEach(g => { if (g.kind === KIND_EXPENSE) out[g.id] = 0; });
  ops.forEach(t => { if (isExpense(t)) out[catGroup(t.cat).id] -= t.amount; });
  return out;
}
function catTotals(ops) {
  const out = {};
  ops.forEach(t => { if (isExpense(t)) out[t.cat] = (out[t.cat] || 0) - t.amount; });
  return out;
}
function monthStats(key) {
  const ops = opsOfMonth(key);
  const expense = ops.filter(isExpense).reduce((s, t) => s - t.amount, 0);
  const incomeOps = ops.filter(isIncomeOp).reduce((s, t) => s + t.amount, 0);
  const income = manualIncome(key) + incomeOps;
  const todo = ops.filter(isTodo);
  return {
    key, ops, expense, income, incomeOps, balance: income - expense,
    todoCount: todo.length, todoAmount: todo.reduce((s, t) => s - Math.min(t.amount, 0), 0),
    dupCount: ops.filter(t => t.status === ST_DUP || t.status === ST_DUP_MAYBE).length,
    ignoredCount: ops.filter(t => t.status === ST_IGNORED).length,
    groups: groupTotals(ops), cats: catTotals(ops),

}

/* Same month one year earlier, cut at the same day when the month is still running. */
function comparisonRows(key) {
  const prevKey = addMonth(key, -12);
  const running = key === monthKey(todayISO());
  const cutDay = running ? dayOf(todayISO()) : 31;
  const cur = opsOfMonth(key);
  const prev = opsOfMonth(prevKey).filter(t => dayOf(t.date) <= cutDay);
  const a = groupTotals(cur), b = groupTotals(prev);
  const infl = 1 + (DB.settings.inflation || 0) / 100;
  const band = (DB.settings.band || 5) / 100;
  return GROUPS.filter(g => g.kind === KIND_EXPENSE).map(g => {
    const now = a[g.id] || 0, before = b[g.id] || 0, ref = before * infl;
    const delta = now - ref;
    const pct = ref > 0 ? delta / ref * 100 : (now > 0 ? 100 : 0);
    let verdict = "flat";
    if (ref === 0 && now === 0) verdict = "none";
    else if (ref === 0) verdict = "over";
    else if (delta > ref * band) verdict = "over";
    else if (delta < -ref * band) verdict = "under";
    return { group: g, now, before, ref, delta, pct, verdict };
  }).filter(r => !(r.verdict === "none"));
}

function ytdTotals(year, cutISO) {
  const cut = cutISO || (year < yearOf(todayISO()) ? year + "-12-31" : todayISO());
  let expense = 0, income = 0;
  const groups = {}; GROUPS.forEach(g => { if (g.kind === KIND_EXPENSE) groups[g.id] = 0; });
  DB.tx.forEach(t => {
    if (yearOf(t.date) !== year || t.date > cut) return;
    if (isExpense(t)) { expense -= t.amount; groups[catGroup(t.cat).id] -= t.amount; }
    else if (isIncomeOp(t)) income += t.amount;
  });
  const cutMonth = monthKey(cut);
  for (let m = 1; m <= 12; m++) {
    const key = year + "-" + pad2(m);
    if (key <= cutMonth) income += manualIncome(key);
  }
  return { expense, income, balance: income - expense, groups };
}

/* Year-end estimate from the year-to-date average, as in the spreadsheet. */
function yearProjection(year) {
  const today = todayISO(), curYear = yearOf(today);
  const done = ytdTotals(year);
  if (year < curYear) return { ...done, projected: true, elapsed: 1, expenseYear: done.expense, incomeYear: done.income, balanceYear: done.balance, complete: true };
  if (year > curYear) return { ...done, expenseYear: 0, incomeYear: 0, balanceYear: 0, elapsed: 0, complete: false };
  const m = +today.slice(5, 7), d = dayOf(today);
  const daysInMonth = new Date(curYear, m, 0).getDate();
  const elapsed = Math.max(((m - 1) + d / daysInMonth) / 12, 0.02);
  return {
    ...done, complete: false, elapsed,
    expenseYear: done.expense / elapsed, incomeYear: done.income / elapsed,
    balanceYear: done.balance / elapsed,
    monthlyExpense: done.expense / (elapsed * 12), monthlyIncome: done.income / (elapsed * 12),
  };
}
function yearsWithData() {
  const s = new Set(DB.tx.map(t => yearOf(t.date)));
  Object.keys(DB.income).forEach(k => s.add(+k.slice(0, 4)));
  return Array.from(s).sort();
}
function patYearsWithData() {

  Object.values(DB.patValues || {}).forEach(v => Object.keys(v).forEach(k => s.add(+k.slice(0, 4))));
  return Array.from(s).sort();
}
/* -------------------------------------------------------------------------
   Base cost — what comes back on its own. A merchant qualifies when it bills
   at a steady rhythm for a steady amount over a long window; everything else
   is discretionary, however regular the habit feels. The detector proposes,
   the user decides, and the decision is stored per merchant.
   ------------------------------------------------------------------------- */
const FIXED_WINDOW = 36;                       // months of history examined
const FIXED_PERIODS = [1, 2, 3, 6, 12];
const PERIOD_NAME = { 1: "mensuelle", 2: "bimestrielle", 3: "trimestrielle", 6: "semestrielle", 12: "annuelle" };
/* Groups where regularity proves a habit, never a commitment. */
const DISCRETIONARY_GROUPS = new Set(["g_food", "g_shop", "g_leisure"]);

function median(vals) {
  if (!vals.length) return 0;
  const a = vals.slice().sort((x, y) => x - y), h = a.length >> 1;
  return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2;
}
/* Median absolute deviation over the median: 0 for a perfectly steady amount. */
function relSpread(vals) {
  const m = median(vals);
  if (!m) return 1;
  return median(vals.map(v => Math.abs(v - m))) / m;
}
function monthDiff(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }

function detectRecurring() {
  const cur = monthKey(todayISO());
  const from = addMonth(cur, -(FIXED_WINDOW - 1));
  const by = {};
  const catsOf = {};                            // catégories distinctes vues chez un marchand
  DB.tx.forEach(t => {
    const mk = monthKey(t.date);
    if (!isExpense(t) || mk < from || mk > cur) return;
    const k = canonOf(t);                       // "" for opaque merchants: skipped
    if (!k) return;
    /* Regroupement par (marchand, catégorie), et non par marchand seul. Un même
       assureur prélève l'habitation et l'auto : réunies sous « maif », les deux
       lignes faisaient deux prélèvements par mois et tombaient ensemble sous le
       garde-fou « plusieurs factures par mois = dépense variable ». Deux charges
       bien réelles disparaissaient ainsi sans le moindre signalement — et le
       matelas de sécurité, qui se calcule dessus, se trompait d'autant. Même
       histoire pour un opérateur qui facture le mobile et la box. */
    const ck = k + "|" + (t.cat || "");
    (catsOf[k] = catsOf[k] || new Set()).add(t.cat || "");
    const e = (by[ck] = by[ck] || { key: k, ckey: ck, name: t.merchantRaw || merchantFromLabel(t.label) || k, cat: t.cat, ops: 0, days: [], months: {} });
    e.months[mk] = (e.months[mk] || 0) - t.amount;
    e.ops++; e.days.push(dayOf(t.date)); e.cat = t.cat;
  });
  const out = [];
  Object.values(by).forEach(e => {
    /* La clé ne se complique que pour les marchands réellement scindés : ailleurs
       elle reste le marchand seul, et les arbitrages déjà enregistrés dans
       DB.fixed continuent de s'appliquer. Celles qui gagnent une clé composée
       sont précisément celles qui n'étaient jamais détectées — aucune décision
       ne peut donc leur être attachée. */
    if (catsOf[e.key] && catsOf[e.key].size > 1) e.key = e.ckey;
    const keys = Object.keys(e.months).sort(), n = keys.length;
    if (n < 3) return;                          // no rhythm can be read from two points
    if (e.ops / n > 1.35) return;               // several bills a month: variable spending
    const amounts = keys.map(k => e.months[k]);
    const gaps = [];
    for (let i = 1; i < n; i++) gaps.push(monthDiff(keys[i - 1], keys[i]));
    /* Median gap, not span ÷ count: one missed month must not shift the rhythm,
       and a yearly charge seen three times has to read as yearly, not half-yearly. */
    const raw = median(gaps);
    const period = FIXED_PERIODS.reduce((best, p) => Math.abs(p - raw) < Math.abs(best - raw) ? p : best, 1);
    const slack = period === 1 ? 0 : 1;         // monthly must land every month
    const regular = gaps.filter(g => Math.abs(g - period) <= slack).length / gaps.length;
    /* Amount read on the recent occurrences only: a tariff raised last year is
       a fact about today's base cost, not a sign of an unstable charge. */
    const recent = amounts.slice(-Math.min(n, period === 1 ? 6 : 3));
    const amount = median(recent);
    const spread = relSpread(recent);
    if (amount <= 0) return;                    // net refunds
    const since = monthDiff(keys[n - 1], cur);
    if (since > Math.max(period * 1.6, period + 1)) return;   // stopped: no longer a charge
    /* Comfort spending can be perfectly regular — a monthly restaurant is not a
       committed charge. Steady numbers are never enough to enrol it on their own. */
    const soft = DISCRETIONARY_GROUPS.has((catGroup(e.cat) || {}).id);
    const steady = spread <= 0.12 && relSpread(amounts) <= 0.35;
    const sure = regular >= 0.7 && steady && !soft;
    const maybe = regular >= 0.5 && spread <= 0.3;
    if (!sure && !maybe) return;
    const why = sure ? "" : soft ? "dépense de confort : régulière, mais vous pouvez l\u2019arrêter demain"
      : !steady ? "montant trop variable d\u2019une fois sur l\u2019autre pour une charge fixe"
      : "rythme irrégulier : les prélèvements ne tombent pas à intervalle fixe";
    const flag = sure ? "" : soft ? "confort" : !steady ? "variable" : "irrégulier";
    out.push({
      key: e.key, name: e.name, cat: e.cat, count: n, period, amount, spread, regular, why, flag,
      monthly: amount / period, day: Math.round(median(e.days)),
      lastMonth: keys[n - 1], firstMonth: keys[0], months: e.months,
      tier: sure ? "sure" : "maybe",
    });
  });
  return out;
}
/* Detection plus the user's own calls, which always win. */
function fixedCharges() {
  const dec = DB.fixed || {};
  return detectRecurring().map(r => {
    r.manual = dec[r.key] != null;
    r.on = r.manual ? !!dec[r.key] : r.tier === "sure";
    return r;
  }).sort((a, b) => b.monthly - a.monthly);
}
function baseCost() {
  const list = fixedCharges(), kept = list.filter(r => r.on);
  return { list, kept, monthly: kept.reduce((s, r) => s + r.monthly, 0), out: list.filter(r => !r.on) };
}
/* Monthly charges that have not shown up in the month being looked at.
   In the running month, a charge is only late once its usual date is behind us. */
function missingFixed(kept, key) {
  const cur = monthKey(todayISO()), today = dayOf(todayISO());
  return kept.filter(r => {
    if (r.period !== 1 || key < r.firstMonth || key > cur) return false;
    if (r.months[key] != null) return false;

/* -------------------------------------------------------------------------
   Savings rate — (income − spending) / income. Money moved to a savings
   account is an internal transfer, so it is never spending: it stays inside
   the saved share, which is exactly what the ratio is meant to measure.
   ------------------------------------------------------------------------- */
function savingsRate(income, expense) {
  if (!income || income <= 0) return null;
  return (income - expense) / income * 100;
}
/* ok = target reached, watch = within 5 points, under = further below. */
function savingsState(rate, goal) {
  if (rate == null || !goal) return "none";
  if (rate >= goal) return "ok";
  if (rate >= goal - 5) return "watch";
  return "under";
}
const SAVINGS_CLASS = { ok: "pos", watch: "warn", under: "neg", none: "" };
/* Symbol + words, so the verdict never rests on colour alone. */
function savingsVerdict(rate, goal) {
  const st = savingsState(rate, goal);
  if (st === "none") return "";
  const gap = goal - rate;
  if (st === "ok") return "✓ objectif de " + fmtRate(goal) + " tenu";
  return (st === "watch" ? "● " : "▼ ") + fmtPts(gap) + " sous l\u2019objectif de " + fmtRate(goal);
}
/* Weighted rate over the last n complete months carrying an income:
   totals are summed before the ratio, so a small month cannot skew it. */
function savingsRateWindow(n) {
  const cur = monthKey(todayISO());
  const keys = new Set(DB.tx.map(t => monthKey(t.date)));
  Object.keys(DB.income).forEach(k => keys.add(k));
  const list = Array.from(keys).filter(k => k < cur).sort().reverse();
  let income = 0, expense = 0, months = 0;
  for (const k of list) {
    const s = monthStats(k);
    if (s.income <= 0) continue;
    income += s.income; expense += s.expense; months++;
    if (months === n) break;

const SAVINGS_STEPS = [

  { v: 20, name: "Cible", help: "cohérent avec la règle 50/30/20 des objectifs" },

function suggestedSavingsGoal() {
  const w = savingsRateWindow(12);
  if (w.rate == null) return { value: 20, why: "Pas encore de mois complet avec des revenus saisis : 20 % est la cible de référence." };
  if (w.rate < 10) return { value: 10, why: "Vous êtes à " + fmtRate(w.rate) + " sur 12 mois : 10 % est la marche suivante, franchissable." };
  const held = Math.floor(w.rate / 5) * 5;

  g_car: { c_carins: 20, c_fuel: 40, c_carfix: 20, c_parking: 8, c_transit: 12 },
  g_food: { c_grocery: 60, c_resto: 25, c_delivery: 15 },

/* Average net income over the last 12 months that carry a figure. */
function avgIncome12() {
  const keys = Object.keys(DB.income).sort().reverse();
  const seen = [];
  for (const k of keys) { const v = manualIncome(k); if (v > 0) seen.push(v); if (seen.length === 12) break; }
  if (!seen.length) {                              // nothing typed in: fall back on the statement
    const byMonth = {};
    DB.tx.forEach(t => { if (isIncomeOp(t)) byMonth[monthKey(t.date)] = (byMonth[monthKey(t.date)] || 0) + t.amount; });
    const vals = Object.keys(byMonth).sort().reverse().slice(0, 12).map(k => byMonth[k]);
    if (!vals.length) return 0;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }
  return seen.reduce((a, b) => a + b, 0) / seen.length;
}
function suggestedGoals() {
  const income = avgIncome12();
  if (!income) return { income: 0, byId: {} };
  const byId = {};
  Object.entries(GROUP_SHARE).forEach(([gid, share]) => {
    const amount = income * share / 100;
    byId[gid] = Math.round(amount / 5) * 5;
    const subs = SUB_SHARE[gid] || {};
    Object.entries(subs).forEach(([cid, s]) => { byId[cid] = Math.round(amount * s / 100 / 5) * 5; });
  });
  return { income, byId };
}

function merchantsOfCat(ops, catId) {
  const agg = {};

    if (!isExpense(t) || t.cat !== catId) return;
    const k = canonOf(t) || normalize(t.merchantRaw || merchantFromLabel(t.label)) || "divers";
    (agg[k] = agg[k] || { name: t.merchantRaw || merchantFromLabel(t.label) || "—", n: 0, v: 0 });
    agg[k].n++; agg[k].v -= t.amount;
  });
  return Object.values(agg).sort((a, b) => b.v - a.v);
}

  const g = GROUP_BY_ID[id];

/* =========================================================================
   Shell
   ========================================================================= */
/* -------------------------------------------------------------------------
   render() remplace tout le DOM d'un bloc. Les champs de saisie n'y survivent donc pas,
   et c'est ainsi qu'une valorisation se perdait : on tape un montant, on clique dans le
   champ voisin, le `change` du premier part avant que le clic n'aboutisse, le rendu
   détruit le champ visé, et le focus retombe sur le vide. Les chiffres suivants ne vont
   nulle part. Ni curseur, ni message : on repart en croyant avoir saisi.

   Deux mesures. D'abord le rendu provoqué par un `change` attend la fin du geste
   (renderSoon), le temps que le clic ou la tabulation ait désigné sa cible. Ensuite le
   rendu rend au champ actif son focus, son curseur et ce qui y était tapé — la valeur
   comprise, car un champ en cours d'édition n'est pas encore dans DB.
   ------------------------------------------------------------------------- */
let renderPending = 0;
function renderSoon() {
  if (renderPending) return;
  renderPending = setTimeout(() => { renderPending = 0; render(); }, 0);
}
/* L'identité se lit sur les attributs : ce sont les seuls repères qu'un champ garde
   d'un rendu à l'autre, son nœud étant recréé à chaque fois. */
function focusKey(el) {
  if (!el || !el.tagName || !/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return null;
  if (el.id) return "#" + el.id;
  const d = el.dataset || {};
  if (!d.chg) return null;
  return ["chg", "id", "key", "slot"].filter(k => d[k] != null)
    .map(k => "[data-" + k + '="' + String(d[k]).replace(/"/g, "") + '"]').join("");
}
function captureFocus() {
  const el = document.activeElement, key = focusKey(el);
  if (!key) return null;
  const f = { key: key, value: el.value };
  /* selectionStart lève sur un input number ou date : là, le curseur ne se restitue pas,
     mais le focus et la valeur, si. */
  try { f.start = el.selectionStart; f.end = el.selectionEnd; } catch (e) {}
  return f;
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.querySelector(f.key);
  if (!el || el === document.activeElement) return;
  if (f.value != null && el.value !== f.value) el.value = f.value;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  try { if (f.start != null) el.setSelectionRange(f.start, f.end); } catch (e) {}
}
function render() {
  const keepFocus = captureFocus();
  const todo = DB.tx.filter(isTodo).length;
  /* Le détail d'un compte n'a pas d'entrée propre : il garde « Comptes » allumé, sinon la

  const budgetNav = [

    ["todo", "inbox", "À catégoriser", todo], ["settings", "gear", "Réglages"],
  ];
  const patNav = [["pathome", "home", "Aperçu"], ["patanalyse", "pie", "Analyse"],
    ["pat", "vault", "Comptes"], ["patcredits", "debt", "Crédits"]];
  const dataNav = [["data", "file", "Données"]];
  const nav = '<div class="navlabel">Budget</div>' + budgetNav.map(navItem).join("") +

  const body = UI.view === "month" ? viewMonth()

    : UI.view === "year" ? viewYear()

    : UI.view === "pathome" ? viewPatrimoineHome()
    : UI.view === "patanalyse" ? viewPatAnalyse()
    : UI.view === "pat" ? viewPatrimoine()
    : UI.view === "patcredits" ? viewPatCredits()
    : UI.view === "patacct" ? viewPatAccount()
    : UI.view === "patmilestones" ? viewPatMilestones()
    : UI.view === "data" ? viewGeneral() : viewSettings();

  $("#app").innerHTML =
    '<div class="shell"><aside class="rail">' +
      '<div class="brand"><b>Budget</b><span>' + (DB.tx.length ? DB.tx.length + " op." : "") + "</span></div>" +
      '<div class="navgroup">' + nav + "</div>" +

        '<button class="btn primary" data-act="import" style="justify-content:center">' + icon("down") + "Importer</button>" +
        '<button class="btn" data-act="theme" style="justify-content:center">' + icon("eye") + "Thème</button>" +
      "</div></aside>" +
    '<main class="main">' + staleBanner() + body + "</main></div>" +

  restoreFocus(keepFocus);

/* Un bandeau collant plutôt qu'un toast : il ne doit pas pouvoir s'effacer avant qu'on ait

  html += '<div class="kpis k5">' +
    kpi("Revenus", fmtEur(s.income), s.incomeOps ? fmtEur(s.incomeOps) + " depuis le relevé" : (manualIncome(UI.month) ? "saisis à la main" : "aucun revenu saisi"), s.income ? "" : "warn") +
    kpi("Dépenses", fmtEur(s.expense), (dm >= 0 ? "▲ " : "▼ ") + fmtEur(Math.abs(dm)) + " vs " + MONTHS[+addMonth(UI.month, -1).slice(5) - 1]) +
    kpi("Balance", fmtEur(s.balance), s.balance >= 0 ? "épargne du mois" : "déficit du mois", s.balance >= 0 ? "pos" : "neg") +
    kpi("Taux d\u2019épargne",
        rate == null ? "—" : fmtRate(rate),
        rate == null ? "revenus du mois non saisis"
          : sgoal ? savingsVerdict(rate, sgoal)
          : w12.months ? "moyenne 12 mois : " + fmtRate(w12.rate) : "aucun objectif défini",
        rate == null ? "warn" : sgoal ? SAVINGS_CLASS[savingsState(rate, sgoal)] : (rate >= 0 ? "" : "neg"),
        rateTooltip(s, rate, running)) +
    kpi("À catégoriser", String(s.todoCount), s.todoCount ? fmtEur(s.todoAmount) + " hors calcul" : "tout est classé", s.todoCount ? "warn" : "") +
    "</div>";

  if (s.incomeOps > 0 && manualIncome(UI.month) > 0)
    html += '<div class="note warn" style="margin-bottom:16px">' + icon("warn") +
      " Ce mois compte " + esc(fmtEur(manualIncome(UI.month))) + " de revenus saisis à la main <b>et</b> " +
      esc(fmtEur(s.incomeOps)) + " de revenus repérés dans le relevé. Si c\u2019est le même salaire, il est compté deux fois : " +
      '<button class="btn sm" data-act="view" data-view="settings" style="margin-left:6px">ajuster la saisie</button></div>';
  if (s.todoCount) html += '<div class="note warn" style="margin-bottom:16px">' + icon("warn") + " " + s.todoCount +

  html += goalCard(s.ops, "m", monthPace(UI.month));

  html += opsCard(s);
  return html;
}

function monthPace(key) {
  if (key !== monthKey(todayISO())) return 1;
  const [y, m] = key.split("-").map(Number);
  return dayOf(todayISO()) / new Date(y, m, 0).getDate();
}

function comparisonCard(key, cmp) {
  const pct = UI.cmpMode !== "eur";
  let html = '<div class="card"><div class="chead"><h2>Écart avec ' + monthLabel(addMonth(key, -12)) + "</h2>" +
    '<div class="spacer"></div><span class="tiny muted" style="margin-right:10px">' +
    (key === monthKey(todayISO()) ? "arrêté au " + dayOf(todayISO()) + " des deux mois" : "mois complets") + "</span>" +
    '<span class="seg"><button class="' + (pct ? "on" : "") + '" data-act="cmpmode" data-mode="pct">%</button>' +
    '<button class="' + (pct ? "" : "on") + '" data-act="cmpmode" data-mode="eur">€</button></span></div>';
  if (!cmp.length) return html + '<div class="empty">Pas encore de dépenses sur ce mois ni sur le même mois un an plus tôt.</div></div>';
  html += '<div class="cmp">' + cmp.map(r => {
    const scale = 60, pp = Math.max(-scale, Math.min(scale, r.pct));
    const half = 50, w = Math.abs(pp) / scale * half;
    const bandW = DB.settings.band / scale * half;
    const arrow = r.verdict === "over" ? "▲" : r.verdict === "under" ? "▼" : "＝";
    const cls = r.verdict === "over" ? "neg" : r.verdict === "under" ? "pos" : "muted";
    const fillCls = r.verdict === "over" ? "over" : r.verdict === "under" ? "under" : "flat";
    return '<div class="cmprow ' + r.verdict + '">' +
      '<div class="cmpname">' + groupBadge(r.group) + '<span class="nm">' + esc(r.group.name) + "</span></div>" +
      '<div class="num" style="text-align:right;font-weight:600">' + esc(fmtEur(r.now)) + "</div>" +
      '<div class="cmpdelta ' + cls + '" title="' + esc("référence " + fmtEur(r.ref) + " · " + monthLabel(addMonth(key, -12)) + " revalorisé") + '"><span>' + arrow +
        '</span><span class="num">' + esc(pct ? (r.ref >= 20 ? fmtPct(r.pct) : "n.s.") : fmtEur(r.delta, { plus: true })) + "</span></div>" +
      '<div class="track">' +
        '<div class="band" style="left:' + (half - bandW) + "%;width:" + (bandW * 2) + '%"></div>' +
        '<div class="zero" style="left:' + half + '%"></div>' +
        '<div class="fill ' + fillCls + '" style="' + (pp >= 0 ? "left:" + half + "%;" : "left:" + (half - w) + "%;") + "width:" + Math.max(w, 0.6) + '%"></div>' +
      "</div>" +
      '<div class="cmpprev">réf. ' + esc(fmtEur(r.ref)) + "</div>" +
      "</div>";
  }).join("") + "</div>";
  return html + '<div class="legendline"><span class="chip"><span class="sw" style="background:var(--pos)"></span>▼ moins dépensé</span>' +
    '<span class="chip"><span class="sw" style="background:var(--neg)"></span>▲ plus dépensé</span>' +
    '<span class="chip"><span class="sw" style="background:var(--line)"></span>＝ zone neutre ±' + DB.settings.band + " %</span>" +
    '<span class="muted">survolez une ligne pour voir la référence : ' + esc(monthLabel(addMonth(key, -12))) +
    " revalorisé de " + String(DB.settings.inflation).replace(".", ",") + " % d'inflation</span></div></div>";
}

function kpi(label, value, sub, cls, title) {
  return '<div class="kpi"' + (title ? ' title="' + esc(title) + '"' : "") + '><div class="eyebrow">' + esc(label) + "</div>" +
    '<div class="v num ' + (cls === "pos" || cls === "neg" || cls === "warn" ? cls : "") + '">' + esc(value) + "</div>" +
    '<div class="s ' + (cls === "warn" ? "" : "") + '">' + esc(sub) + "</div></div>";
}

/* The rate is honest only if the month is closed and everything is classified. */
function rateTooltip(s, rate, running) {
  if (rate == null) return "Le taux se calcule sur les revenus : saisissez-les dans Réglages.";
  let t = "(revenus − dépenses) ÷ revenus = (" + fmtEur(s.income) + " − " + fmtEur(s.expense) + ") ÷ " + fmtEur(s.income) +
    ". Les virements vers l\u2019épargne ne sont pas des dépenses : ils restent dans la part épargnée.";
  if (running) t += " Mois en cours : le salaire est saisi en entier alors que les dépenses ne le sont pas encore, le taux paraît donc plus élevé qu\u2019il ne finira.";
  if (s.todoCount) t += " " + s.todoCount + " opération(s) sans catégorie ne sont pas comptées dans les dépenses : le taux est optimiste tant qu\u2019elles ne sont pas classées.";
  return t;
}

function goalState(spent, target, pace) {
  if (spent > target) return "over";
  if (target > 0 && pace > 0.08 && spent > target * pace * 1.15) return "watch";
  if (spent > target * 0.9) return "watch";
  return "ok";
}
function goalCard(ops, mode, pace) {
  const ids = Object.keys(DB.goals).filter(id => (DB.goals[id][mode] || 0) > 0);
  const label = mode === "m" ? "Objectifs du mois" : "Objectifs de l\u2019année";
  let html = '<div class="card"><div class="chead"><h2>' + label + "</h2><div class=\"spacer\"></div>" +
    '<button class="btn sm ghost" data-act="view" data-view="settings">Régler</button></div>';
  if (!ids.length) {
    const sg = suggestedGoals();
    return html + '<div class="empty"><b>Aucun objectif défini</b>' +
      (sg.income ? "Sur la base de " + esc(fmtEur(sg.income)) + " de revenu mensuel moyen, l\u2019application peut proposer une répartition de départ."
                 : "Saisissez d\u2019abord vos revenus : les montants proposés en dépendent.") +
      '<div style="margin-top:12px"><button class="btn ' + (sg.income ? "primary" : "") + '" data-act="' + (sg.income ? "suggest" : "view") + '" data-view="settings">' +
      (sg.income ? "Proposer des objectifs" : "Saisir mes revenus") + "</button></div></div></div>";
  }
  const cards = ids.map(id => {
    const target = DB.goals[id][mode], spent = spentOn(id, ops);
    const st = goalState(spent, target, pace || 1);
    const pct = Math.min(spent / target * 100, 100);
    const g = GROUP_BY_ID[id], c = CAT_BY_ID[id];
    const name = g ? g.name : (c ? c.name : id);
    const grp = g || (c ? GROUP_BY_ID[c.group] : null);
    const paceLeft = Math.min((pace || 1) * 100, 100);
    return '<div class="goal">' +
      '<div class="gh">' + (grp ? groupBadge(grp) : "") + '<span class="nm">' + esc(name) + "</span></div>" +
      '<div class="gv"><b class="num state-' + st + '">' + esc(fmtEur(spent)) + '</b><span class="tiny muted num">/ ' + esc(fmtEur(target)) + "</span></div>" +
      '<div class="gbar"><i class="bg-' + st + '" style="width:' + pct.toFixed(1) + '%"></i>' +
        (mode === "m" && pace < 1 ? '<span class="gpace" style="left:' + paceLeft.toFixed(1) + '%" title="rythme attendu à ce jour du mois"></span>' : "") +
      "</div>" +
      '<div class="gfoot state-' + st + '">' + (st === "over" ? "▲ dépassé de " + fmtEur(spent - target)
        : st === "watch" ? "● reste " + fmtEur(target - spent) : "✓ reste " + fmtEur(target - spent)) + "</div></div>";
  }).join("");
  return html + '<div class="goalgrid">' + cards + "</div>" +
    (mode === "m" && (pace || 1) < 1 ? '<div class="tiny muted" style="margin-top:10px">Le repère vertical marque le rythme attendu au ' + dayOf(todayISO()) + " du mois.</div>" : "") + "</div>";
}

function fixedCard(s) {
  const bc = baseCost();
  let html = '<div class="card"><div class="chead"><h2>Charges fixes</h2><div class="spacer"></div>' +
    '<span class="tiny muted">charges repérées sur les ' + FIXED_WINDOW + " derniers mois</span></div>";
  if (!bc.list.length)
    return html + '<div class="empty"><b>Rien de récurrent détecté pour l\u2019instant</b>' +
      "Il faut au moins trois passages d\u2019un même commerçant, à un rythme et pour un montant stables. Importez plus d\u2019historique et la liste se remplira seule.</div></div>";

  const income = s.income || avgIncome12();
  const fromAvg = !s.income && income > 0;
  const share = income > 0 ? bc.monthly / income * 100 : null;
  const left = income > 0 ? income - bc.monthly : null;
  const goal = DB.settings.savingsGoal || 0;
  const toSave = goal && income > 0 ? income * goal / 100 : 0;

  html += '<div class="basegrid">' +
    '<div><div class="eyebrow">Total mensuel</div><div class="v num">' + esc(fmtEur(bc.monthly)) + "</div>" +
      '<div class="tiny muted">' + bc.kept.length + " charge" + (bc.kept.length > 1 ? "s" : "") + " retenue" + (bc.kept.length > 1 ? "s" : "") +
      ", en équivalent mensuel</div></div>" +
    '<div><div class="eyebrow">Part engagée d\u2019avance</div><div class="v num' + (share == null ? "" : share > 60 ? " neg" : share > 45 ? " warn" : "") + '">' +
      (share == null ? "—" : esc(fmtRate(share))) + "</div>" +
      '<div class="tiny muted">' + (share == null ? "revenus non saisis" : "de vos revenus part sans décision") + "</div></div>" +
    '<div><div class="eyebrow">Reste à vivre</div><div class="v num' + (left == null ? "" : left < 0 ? " neg" : "") + '">' +
      (left == null ? "—" : esc(fmtEur(left))) + "</div>" +
      '<div class="tiny muted">' + (left == null ? "revenus non saisis"
        : fromAvg ? "sur un revenu moyen de " + fmtEur(income)
        : toSave ? "dont " + fmtEur(toSave) + " à épargner pour tenir " + fmtRate(goal)
        : "revenus du mois − charges fixes") + "</div></div>" +
    "</div>";

  const miss = missingFixed(bc.kept, UI.month);
  if (miss.length) html += '<div class="note warn" style="margin:0 0 12px">' + icon("warn") + " " +
    (miss.length > 1 ? miss.length + " charges habituelles ne sont pas passées" : "Une charge habituelle n\u2019est pas passée") +
    " en " + esc(monthLabel(UI.month)) + " : " + esc(miss.map(r => r.name).join(", ")) +
    ". Soit elle est en retard, soit elle a cessé — dans ce cas, décochez-la.</div>";

  html += '<div class="fixlist">' + bc.kept.map(r => fixedRow(r, UI.month)).join("") + "</div>";
  if (bc.out.length)
    html += '<div class="legendline" style="justify-content:space-between">' +
      '<span class="muted">' + bc.out.length + " autre" + (bc.out.length > 1 ? "s" : "") + " détectée" + (bc.out.length > 1 ? "s" : "") +
      ", écartée" + (bc.out.length > 1 ? "s" : "") + " des charges fixes</span>" +
      '<button class="btn sm ghost" data-act="showcand">' + (UI.showCand ? "Masquer" : "Voir et arbitrer") + "</button></div>" +
      (UI.showCand ? '<div class="fixlist">' + bc.out.map(r => fixedRow(r, UI.month)).join("") + "</div>" : "");
  return html + '<p class="tiny muted" style="margin:12px 0 0">Une charge est retenue quand elle revient au même rythme pour un montant stable. ' +
    "Les charges fixes forment le plancher de dépense d\u2019un mois où vous ne décidez de rien : elles donnent la marge de manœuvre réelle et servent de base au matelas de sécurité (3 à 6 mois).</p></div>";
}

/* Group breakdown, drilling down to subcategories then to merchants. */
function catCard(s) {
  const rows = GROUPS.filter(g => g.kind === KIND_EXPENSE).map(g => ({ g, v: s.groups[g.id] || 0 }))
    .filter(r => r.v !== 0).sort((a, b) => b.v - a.v);
  const total = rows.reduce((a, r) => a + Math.max(r.v, 0), 0) || 1;
  let html = '<div class="card"><div class="chead"><h2>Dépenses par groupe</h2><div class="spacer"></div>' +
    '<span class="tiny muted">' + esc(fmtEur(s.expense)) + " · cliquez pour déplier</span></div>";
  if (!rows.length) return html + '<div class="empty">Aucune dépense classée sur ce mois.</div></div>';
  html += rows.map(r => {
    const share = Math.max(r.v, 0) / total * 100;
    const open = UI.openGroup === r.g.id;
    let sub = "";
    if (open) {
      const cats = CATS.filter(c => c.group === r.g.id).map(c => ({ c, v: s.cats[c.id] || 0 })).filter(x => x.v !== 0).sort((a, b) => b.v - a.v);
      sub = cats.map(x => {
        const openCat = UI.openCat === x.c.id;
        let merch = "";
        if (openCat) {
          const list = merchantsOfCat(s.ops, x.c.id);
          merch = list.map(m => '<div class="merchrow"><span style="text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.name) + "</span>" +
            '<span class="num muted" style="text-align:right">' + m.n + " ×</span>" +
            '<span class="num" style="text-align:right">' + esc(fmtEur(m.v)) + "</span></div>").join("");
        }
        return '<div class="subrow ' + (openCat ? "open" : "") + '" data-act="togglecat" data-cat="' + x.c.id + '">' +
          "<span>" + (openCat ? "▾ " : "▸ ") + esc(x.c.name) + '</span><span class="num" style="text-align:right">' + esc(fmtEur(x.v)) +
          '</span><span class="num muted" style="text-align:right">' + Math.round(x.v / r.v * 100) + " %</span></div>" + merch;
      }).join("");
    }
    return '<div class="catrow" data-act="togglegroup" data-group="' + r.g.id + '">' +
      groupBadge(r.g) +
      "<div><div>" + (open ? "▾ " : "▸ ") + esc(r.g.name) + '</div><div class="bar"><i style="width:' + share.toFixed(1) + "%;background:" + r.g.color + '"></i></div></div>' +
      '<div class="num" style="text-align:right;font-weight:600">' + esc(fmtEur(r.v)) + "</div>" +
      '<div class="num muted" style="text-align:right">' + Math.round(share) + " %</div></div>" + sub;
  }).join("");
  return html + "</div>";
}

/* =========================================================================
   Operations table
   ========================================================================= */
function importLabel(id) {
  const imp = DB.imports.find(i => i.id === id);
  return imp ? imp.name : "—";
}
function importDate(id) {
  const imp = DB.imports.find(i => i.id === id);
  return imp ? imp.date : "";
}
function opsCard(s) {
  const batches = Array.from(new Set(s.ops.map(t => t.imp)));
  let ops = s.ops.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  if (UI.batch !== "all") ops = ops.filter(t => String(t.imp) === UI.batch);
  const shown = ops.filter(t => {
    if (t.status === ST_DUP || t.status === ST_DUP_MAYBE) return UI.showDup;
    if (t.status === ST_IGNORED) return UI.showIgnored;
    return true;
  });

  let html = '<div class="card"><div class="chead"><h2>Opérations</h2><div class="spacer"></div>' +
    '<button class="btn sm" data-act="addop">' + icon("plus") + "Ajouter</button>" +
    (s.ops.length ? ' <button class="btn sm danger" data-act="delmonth" title="Vide le mois pour rejouer un import">' + icon("trash") + "Vider le mois</button>" : "") + "</div>";

  html += '<div class="controls">' +
    '<label class="check"><input type="checkbox" data-chg="showdup" ' + (UI.showDup ? "checked" : "") + "> Afficher les doublons" +
      (s.dupCount ? ' <span class="tag dup">' + s.dupCount + "</span>" : "") + "</label>" +
    '<label class="check"><input type="checkbox" data-chg="showign" ' + (UI.showIgnored ? "checked" : "") + "> Afficher les virements internes" +
      (s.ignoredCount ? ' <span class="tag ign">' + s.ignoredCount + "</span>" : "") + "</label>";
  if (batches.length > 1 || UI.batch !== "all") {
    html += '<span class="spacer" style="flex:1"></span><span class="tiny muted">Lot d\u2019import :</span><div class="pillrow">' +
      '<span class="pill ' + (UI.batch === "all" ? "on" : "") + '" data-act="batch" data-batch="all">Tous</span>' +
      batches.map(b => '<span class="pill ' + (String(b) === UI.batch ? "on" : "") + '" data-act="batch" data-batch="' + b + '">' + esc(importLabel(b)) + "</span>").join("") + "</div>";
  }
  html += "</div>";

  if (!shown.length) return html + '<div class="empty"><b>Rien à afficher</b>Importez un relevé pour remplir ce mois.</div></div>';

  html += '<table class="ops"><thead><tr><th class="c-date">Date</th><th>Opération</th><th class="c-cat">Catégorie</th>' +
    '<th class="c-imp">Importé le</th><th class="c-amt">Montant</th><th class="c-act"></th></tr></thead><tbody>';
  html += shown.map(t => opRow(t)).join("");
  html += "</tbody></table>";
  const hidden = ops.length - shown.length;
  if (hidden > 0) html += '<div class="tiny muted" style="margin-top:8px">' + hidden + " opération" + (hidden > 1 ? "s" : "") + " masquée" + (hidden > 1 ? "s" : "") + " (doublons ou virements internes).</div>";
  return html + "</div>";
}

function catTag(t) {
  if (!t.cat) return '<button class="tag-cat none" data-act="editcat" data-id="' + t.id + '">' + icon("plus", 13) + "choisir…</button>";
  const g = catGroup(t.cat);
  return '<button class="tag-cat" data-act="editcat" data-id="' + t.id + '" style="background:' + g.color + '1A;color:' + g.color + '" title="' +
    esc(g.name + " · " + catName(t.cat)) + '">' + icon(g.icon, 13) + esc(catName(t.cat)) + "</button>";
}
function opRow(t) {
  const dup = t.status === ST_DUP || t.status === ST_DUP_MAYBE;
  const ign = t.status === ST_IGNORED;
  const cls = dup ? "is-dup" : ign ? "is-ign" : "";
  let tags = "";
  if (t.status === ST_DUP) tags = '<span class="tag dup">doublon</span>';
  else if (t.status === ST_DUP_MAYBE) tags = '<span class="tag dup">doublon probable</span>';
  else if (ign) tags = '<span class="tag ign">interne</span>';
  else if (!t.cat) tags = '<span class="tag todo">à catégoriser</span>';
  /* Le virement a nourri un compte : le dire ici, c'est la seule façon de voir d'un coup
     d'œil ce qui est déjà arrivé dans le patrimoine et ce qui n'y est jamais entré. */
  const linked = patLinkedMove(t);
  if (linked) {
    const la = (DB.patAccounts || []).find(a => a.id === linked.accountId);
    tags += ' <span class="tag lnk" title="' +
      esc(fmtEur(linked.amount, { plus: true }) + " enregistré sur ce compte au " + linked.date.split("-").reverse().join("/")) +
      '">' + (la ? patSwatch(la, 7) : "") + esc(la ? la.name : "patrimoine") + "</span>";
  }

  let actions = "";
  if (dup) {
    actions = '<button class="iconbtn" title="Ce n\u2019est pas un doublon" data-act="undup" data-id="' + t.id + '">' + icon("undo", 14) + "</button>" +
      '<button class="iconbtn danger" title="Supprimer" data-act="del" data-id="' + t.id + '">' + icon("trash", 14) + "</button>";
  } else {
    actions = ign
      ? '<button class="iconbtn" title="Recompter cette opération" data-act="unignore" data-id="' + t.id + '">' + icon("undo", 14) + "</button>"
      : '<button class="iconbtn" title="Ignorer (virement interne)" data-act="ignore" data-id="' + t.id + '">' + icon("vault", 14) + "</button>";
    actions += '<button class="iconbtn" title="Marquer comme doublon" data-act="mkdup" data-id="' + t.id + '">' + icon("warn", 14) + "</button>" +
      '<button class="iconbtn danger" title="Supprimer" data-act="del" data-id="' + t.id + '">' + icon("trash", 14) + "</button>";
  }
  const merchant = t.merchantRaw || merchantFromLabel(t.label) || "—";
  return '<tr class="' + cls + '"><td class="c-date num">' + t.date.slice(8, 10) + "/" + t.date.slice(5, 7) + "</td>" +
    "<td><div class=\"merchant\">" + esc(merchant) + " " + tags + '</div><span class="rawlabel">' + esc(t.label) + "</span></td>" +
    '<td class="c-cat">' + catTag(t) + "</td>" +
    '<td class="c-imp tiny muted">' + esc(importDate(t.imp)) + "</td>" +
    '<td class="c-amt num ' + (t.amount > 0 ? "pos" : "") + '">' + esc(fmtEur(t.amount)) + "</td>" +
    '<td class="c-act">' + actions + "</td></tr>";
}


/* =========================================================================
   Mois v2 — refonte visuelle
   -------------------------------------------------------------------------
   Un second écran mensuel, posé à côté de l'ancien le temps de trancher. Il lit
   exactement les mêmes données : rien n'est recalculé autrement, seule la mise
   en forme change. Tout son balisage vit sous .v2, dont les styles sont
   cloisonnés — « Mois » reste intact tant que les deux coexistent.
   ========================================================================= */

/* Gamme d'identification des postes : huit teintes régulières prises dans l'arc
   froid 205°–345°, toutes à plus de 36° des teintes qui portent un verdict. Les
   couleurs de groupe d'origine contenaient un vert et un rose-rouge, qui se
   seraient lus comme une réussite et un dépassement. */
const V2_HUE = {
  g_home:    ["#007B84", "#40C7D1"],
  g_car:     ["#007A94", "#43C5E4"],
  g_food:    ["#0076A0", "#5DC1F1"],
  g_subs:    ["#3171A5", "#7FBBF7"],
  g_health:  ["#586BA4", "#A2B3F5"],
  g_shop:    ["#76649C", "#C1ABEC"],
  g_leisure: ["#8C5D8E", "#DBA4DC"],
  g_fees:    ["#9B577C", "#EC9FC8"],
  g_legacy:  ["#6B7280", "#9AA3B2"],
};
const v2Dark = () => document.documentElement.getAttribute("data-theme") === "dark";
function v2Colour(groupId) {
  const p = V2_HUE[groupId] || V2_HUE.g_legacy;
  return v2Dark() ? p[1] : p[0];
}
/* Pastille d'icône : teinte tenue à 12 % en fond, tracé à pleine teinte. */
function v2Poste(groupId, size) {
  const g = GROUP_BY_ID[groupId];
  if (!g) return "";
  const c = v2Colour(groupId);
  return '<span class="pico" style="color:' + c + ";background:" + c + '1F">' + icon(g.icon, size || 15) + "</span>";
}

/* Variantes de détresse : un poste dépassé change d'icône. Ce qui compte, la
   planche d'essai l'a montré, est que la silhouette change — un petit motif
   ajouté au coin devient une tache illisible à 14 px. D'où la maison qui brûle,
   le panier renversé, le cœur fendu, le signal barré, le ticket coupé. */
const V2_HURT = {
  home:'<path d="M2.4 8.4 8 4.2l5.6 4.2V14.2H2.4z"/><path d="M6.4 14.2v-3.6h3.2v3.6"/>' +
       '<path d="M8 3.4c-1-.7-1-1.9.1-2.8-.1.9.5 1.1.9.7.2-.8-.3-1.6-.7-2 1.9.5 3 2.1 2.3 3.5"/>' +
       '<path d="M4.6 4.2c-.6-.5-.6-1.3 0-1.9-.1.6.3.8.6.5.1-.5-.2-1.1-.5-1.3 1.3.3 2 1.4 1.5 2.3"/>',
  cart:'<g transform="translate(8,8) rotate(28) scale(.86) translate(-8,-8)">' +
       '<path d="M1.6 2.5h1.9l1.6 7.2h6.6l1.5-5.2H4.3"/><circle cx="6.2" cy="12.6" r="1"/>' +
       '<circle cx="11" cy="12.6" r="1"/></g>' +
       '<circle cx="3" cy="13.6" r=".85" fill="currentColor" stroke="none"/>' +
       '<circle cx="6.4" cy="14.6" r=".7" fill="currentColor" stroke="none"/>',
  car:'<path d="M1.8 11.4h12M3.3 11.4 4.5 7.6a1.4 1.4 0 0 1 1.3-1h3.4a1.4 1.4 0 0 1 1.3 1l1.2 3.8M2.8 11.4v1.9M12.8 11.4v1.9"/>' +
      '<circle cx="4.8" cy="11.6" r=".85"/><circle cx="10.6" cy="11.6" r=".85"/>' +
      '<path d="M9.9 6.2c1.9-1.2 2.2-3.2 1.3-4.6 2.7 1 4.2 3.4 3 5.4"/>' +
      '<path d="M12.9 6.6c.8-.6.9-1.5.5-2.2 1.2.5 1.8 1.5 1.3 2.4"/>',
  heart:'<path d="M8 13.2S2.4 9.9 2.4 6.3A2.9 2.9 0 0 1 8 5a2.9 2.9 0 0 1 5.6 1.3c0 3.6-5.6 6.9-5.6 6.9z"/>' +
        '<path d="M8.6 5.4 7.1 8.2h2L7.6 11"/>',
  bag:'<path d="M3 5.2h10l-.8 8.3H3.8z"/><path d="M5.6 5.2V4a2.4 2.4 0 0 1 4.8 0v1.2"/>' +
      '<path d="M5.4 9.2 6.6 10.4 5.4 11.6 6.6 12.8"/>',
  signal:'<path d="M8 13.2v.1M4.6 10a4.8 4.8 0 0 1 6.8 0M2.2 7.4a8.2 8.2 0 0 1 11.6 0"/><path d="M3 3 13 13"/>',
  ticket:'<path d="M2 6.2V4h5.2v8H2V9.4a1.6 1.6 0 0 0 0-3.2z"/><path d="M14 6.2V4H8.8v8H14V9.4a1.6 1.6 0 0 1 0-3.2z"/>' +
         '<path d="M8 3.4 7.4 5l1.2 1.4-1.2 1.4 1.2 1.4-1.2 1.4.6 1.6"/>',
  receipt:'<path d="M4 1.8h8.4v5.1l-1.4.8-1.4-.8-1.4.8-1.4-.8-1.4.8-1.4-.8z"/><path d="M6.2 4.2h4"/>' +
          '<path d="M2.8 10.1 4.2 9.3l1.4.8 1.4-.8 1.4.8 1.4-.8v5.1H2.8z"/><path d="M5 12.5h3.4"/>',
  dots:'<circle cx="4" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12" cy="8" r="1.1"/>'
};
/* Le glyphe central : l'icône du poste, dans la teinte de son état, et sa
   variante meurtrie quand le plafond est franchi. */
function v2Glyph(groupId, state) {
  const g = GROUP_BY_ID[groupId];
  if (!g) return "";
  const d = state === "bad" ? (V2_HURT[g.icon] || ICONS[g.icon]) : ICONS[g.icon];
  return '<svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
}
/* Ce que le survol ajoute : le rythme attendu à ce jour, l'écart, et surtout la
   projection de fin de mois — la seule chose qui dise si le plafond tiendra. */
function v2Tip(r, c) {
  const p = c.running ? c.day / c.days : 1;
  const head = '<div class="tip"><span class="th">' + esc(r.name) + "</span>";
  if (!c.running) {
    const over = r.spent > r.target;
    /* Pas de phrase d'introduction : que le mois soit clos, l'utilisateur le
       sait déjà — le dire lui prendrait une ligne pour rien. */
    return head + "<table><tbody>" +
      "<tr><th>Dépensé</th><td class=\"num\">" + esc(fmtEur(r.spent)) + "</td></tr>" +
      "<tr><th>Plafond</th><td class=\"num q\">" + esc(fmtEur(r.target)) + "</td></tr>" +
      '<tr class="sum"><th>' + (over ? "Dépassement" : "Marge gardée") + "</th>" +
      '<td class="num ' + (over ? "up" : "down") + '">' +
      esc(over ? fmtEur(r.spent - r.target) : fmtEur(r.target - r.spent)) +
      "</td></tr></tbody></table></div>";
  }
  if (r.heavy) {
    const over = r.spent > r.target;
    return head + "<table><tbody>" +
      "<tr><th>Dépensé au " + c.day + "</th><td class=\"num\">" + esc(fmtEur(r.spent)) + "</td></tr>" +
      "<tr><th>Plafond</th><td class=\"num q\">" + esc(fmtEur(r.target)) + "</td></tr>" +
      '<tr class="sum"><th>' + (over ? "Dépassement" : "Reste") + "</th>" +
      '<td class="num ' + (over ? "up" : "down") + '">' +
      esc(over ? fmtEur(r.spent - r.target) : fmtEur(r.target - r.spent)) +
      "</td></tr></tbody></table>" +
      '<span class="note">Ses prélèvements tombent en début de mois : comparer au calendrier ferait ' +
      "crier au dépassement dès le 4.</span></div>";
  }
  const attendu = r.target * p, ecart = r.spent - attendu, proj = r.spent / p;
  /* Pas de phrase d'introduction non plus ici : le jour se dit dans le libellé
     de la ligne qu'il qualifie, ce qui économise une ligne entière. */
  return head +
    "<table><tbody>" +
      "<tr><th>Rythme attendu au " + c.day + "</th><td class=\"num q\">" + esc(fmtEur(attendu)) + "</td></tr>" +
      "<tr><th>Dépensé</th><td class=\"num\">" + esc(fmtEur(r.spent)) + "</td></tr>" +
      '<tr class="gap"><th>Écart au rythme</th><td class="num ' + (ecart > 0 ? "up" : "down") + '">' +
        esc(fmtEur(ecart, { plus: true })) + " · " + esc(attendu ? fmtPct(ecart / attendu * 100) : "—") + "</td></tr>" +
      '<tr class="sum"><th>Fin de mois estimée</th><td class="num ' + (proj > r.target ? "up" : "down") + '">' +
        esc(fmtEur(proj)) + "</td></tr>" +
      "<tr><th>Plafond</th><td class=\"num q\">" + esc(fmtEur(r.target)) + "</td></tr>" +
    "</tbody></table>" +
    '<span class="note">' + (proj > r.target
      ? "À ce rythme, le plafond serait dépassé de " + fmtEur(proj - r.target) + " à la fin du mois."
      : "À ce rythme, le mois finirait " + fmtEur(r.target - proj) + " sous le plafond.") +
    " Il reste " + (c.days - c.day) + " jours." +
    (r.st === "bad" ? " Cliquez pour voir d’où ça vient." : "") + "</span></div>";
}

/* Trois silhouettes, trois états : cercle tenu, carré en avance, triangle
   dépassé. La forme porte le sens, la couleur ne fait que l'appuyer — un
   lecteur qui ne distingue pas le vert du rouge lit la silhouette. */
function v2Shape(shape, glyph) {
  return '<svg viewBox="0 0 20 20" aria-hidden="true">' + shape +
    '<g fill="none" stroke="var(--on)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + glyph + "</g></svg>";
}
const V2_WIN = v2Shape('<circle cx="10" cy="10" r="10" fill="currentColor"/>', '<path d="M5.6 10.4l2.9 2.9 5.9-6.3"/>');
const V2_HOT = v2Shape('<rect x="0" y="0" width="20" height="20" rx="5" fill="currentColor"/>', '<path d="M10 14.6V6.2M6.5 9.7L10 6.2l3.5 3.5"/>');
const V2_BAD = v2Shape('<path d="M10 1l9.2 17H.8z" fill="currentColor"/>', '<path d="M10 8.2v3.6M10 14.9v.01"/>');
const V2_BADGE = { win: V2_WIN, hot: V2_HOT, bad: V2_BAD };
const V2_FLAME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.6-3 1.4-4.2C9 9.6 10 11 11 11c0-3 1-6 1-9z"/></svg>';
const V2_CHEV = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

function v2Pts(n) { const v = Math.abs(n); return trim1(v) + " point" + (v >= 2 ? "s" : ""); }
function v2AnimClass(want) { return UI.v2anim === want ? " anim-" + want : ""; }

/* Mois consécutifs, en remontant depuis celui qu'on regarde, où le taux
   d'épargne a tenu l'objectif. Le mois en cours ne compte pas : il n'est pas
   fini, et une série ne se gagne pas d'avance. */
function v2Streak(goal) {
  if (!goal) return 0;
  const running = monthKey(todayISO());
  let k = UI.month === running ? addMonth(UI.month, -1) : UI.month, n = 0;
  for (let i = 0; i < 240; i++) {
    const m = monthStats(k), r = savingsRate(m.income, m.expense);
    if (r == null || r < goal) break;
    n++; k = addMonth(k, -1);
  }
  return n;
}
/* Épargne cumulée depuis janvier de l'année consultée, mois courant inclus. */
function v2Ytd(key) {
  const y = key.slice(0, 4);
  let sum = 0;
  for (let i = 1; i <= +key.slice(5, 7); i++) sum += monthStats(y + "-" + pad2(i)).balance;
  return sum;
}
/* Part de charges fixes par groupe, en équivalent mensuel. */
function v2FixedByGroup() {
  const out = {};
  baseCost().kept.forEach(r => {
    const g = catGroup(r.cat);
    if (g) out[g.id] = (out[g.id] || 0) + r.monthly;
  });
  return out;
}
function v2History(groupId, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(monthStats(addMonth(UI.month, -i)).groups[groupId] || 0);
  return out;
}

/* -------------------------------------------------------------------------
   Écran
   ------------------------------------------------------------------------- */
function viewMonthV2() {
  const key = UI.month;
  const running = key === monthKey(todayISO());
  const [yy, mm] = key.split("-").map(Number);
  const days = new Date(yy, mm, 0).getDate();
  const day = running ? dayOf(todayISO()) : days;
  const ctx = { key, running, days, day, s: monthStats(key), goal: DB.settings.savingsGoal || 0 };

  const tab = (id, label) =>
    '<button data-act="v2tab" data-tab="' + id + '" aria-selected="' + (UI.v2tab === id) + '">' + esc(label) + "</button>";

  let html = '<div class="v2"><div class="top"><div class="per">' +
    '<button data-act="prev" aria-label="Mois précédent">‹</button>' +
    '<h1 data-act="v2pick" aria-expanded="' + !!UI.v2pick + '" title="Choisir une période">' +
      esc(monthLabel(key)) + "</h1>" +
    '<button data-act="next" aria-label="Mois suivant">›</button>' +
    (UI.v2pick ? v2Picker(key) : "") +
    '<button class="v2today" data-act="today" title="Revenir au mois en cours" hidden></button><span class="st">' + (running ? "en cours · " + day + "/" + days : "clos") + "</span></div>" +
    '<div class="tabs" role="tablist">' + tab("mois", "Le mois") + tab("ou", "Où ça part") + tab("ops", "Opérations") + "</div></div>";

  html += UI.v2tab === "ou" ? v2Ou(ctx) : UI.v2tab === "ops" ? v2Ops(ctx) : v2Month(ctx);
  UI.v2anim = null;
  return html + "</div>";
}

/* Se promener de mois en mois à coups de flèches devient vite pénible sur deux
   ans d'historique : le panneau ouvre l'année, puis le mois. */
function v2Picker(key) {
  const cur = monthKey(todayISO());
  const y = UI.v2pickYear || +key.slice(0, 4);
  const years = yearsWithData();
  const lo = Math.min(years.length ? years[0] : y, y, +cur.slice(0, 4));
  const hi = Math.max(years.length ? years[years.length - 1] : y, y, +cur.slice(0, 4));
  const months = MONTHS.map((name, i) => {
    const k = y + "-" + pad2(i + 1);
    return '<button data-act="v2pickmonth" data-month="' + k + '" class="' +
      (k === key ? "on " : "") + (k === cur ? "now " : "") + (opsOfMonth(k).length ? "has" : "") + '">' +
      esc(name) + "</button>";
  }).join("");
  return '<div class="mpick"><div class="yr">' +
    '<button data-act="v2pickyear" data-y="' + (y - 1) + '" aria-label="Année précédente"' +
      (y <= lo ? " disabled" : "") + ">‹</button>" +
    "<b>" + y + "</b>" +
    '<button data-act="v2pickyear" data-y="' + (y + 1) + '" aria-label="Année suivante"' +
      (y >= hi ? " disabled" : "") + ">›</button></div>" +
    '<div class="ms">' + months + "</div>" +
    '<div class="ft"><button data-act="v2pickmonth" data-month="' + cur + '">Mois en cours</button></div></div>';
}

/* ---------------- onglet « Le mois » ---------------- */
function v2Month(c) {
  const s = c.s, rate = savingsRate(s.income, s.expense), goal = c.goal;
  const done = goal > 0 && rate != null && rate >= goal;
  const prog = goal > 0 && rate != null ? Math.min(Math.max(rate, 0) / goal, 1) : 0;
  const C = 2 * Math.PI * 63;

  let html = '<div class="board"><div class="fiche">' +
    '<div class="cap">' + (c.running ? "Fiche au " + c.day + " " + MONTHS[+c.key.slice(5) - 1].toLowerCase() : "Fiche du mois") + "</div>" +
    '<table class="ftab"><tbody>' +
      "<tr><th>Revenus</th><td class=\"num\">" + esc(fmtEur(s.income)) + "</td></tr>" +
      "<tr><th>Dépenses</th><td class=\"num\"><span class=\"op\">−</span>" + esc(fmtEur(s.expense)) + "</td></tr>" +
      '<tr class="sum' + (s.balance < 0 ? " down" : "") + '"><th>Épargne</th><td class="num">' + esc(fmtEur(s.balance)) + "</td></tr>" +
      '<tr class="run"><th>Cumul depuis janvier</th><td class="num">' + esc(fmtEur(v2Ytd(c.key))) + "</td></tr>" +
    "</tbody></table></div>";

  html += '<div class="gauge' + (done ? " done" : "") + '"><div class="ringwrap">' +
    '<svg class="ring" viewBox="0 0 154 154" aria-hidden="true">' +
      '<circle class="rt" cx="77" cy="77" r="63"></circle>' +
      '<circle class="rp" cx="77" cy="77" r="63" stroke-dasharray="' + C.toFixed(1) +
        '" stroke-dashoffset="' + (C * (1 - prog)).toFixed(1) + '"></circle></svg>' +
    '<div class="rlabel"><div class="rv num">' + (rate == null ? "—" : esc(fmtRate(rate))) +
      '</div><div class="rk">d’épargne</div></div>' +
    (done ? '<div class="ringmark' + (UI.v2anim === "all" ? " cheer" : "") + '">' + V2_WIN + "</div>" : "") +
    "</div>";
  html += '<div class="gverdict">' +
    (!goal ? "Aucun objectif d’épargne défini"
      : rate == null ? "Revenus du mois non saisis"
      : done ? "Objectif de " + fmtRate(goal) + " atteint" : "Objectif de " + fmtRate(goal) + " non atteint") + "</div>" +
    '<div class="gsub">' +
    (!goal ? "À régler dans Réglages"
      : rate == null ? "Le taux se calcule sur les revenus"
      : done ? v2Pts(rate - goal) + " au-dessus" + (c.running ? " — au " + c.day + " du mois" : "")
      : "il manque " + v2Pts(goal - rate) + (c.running ? ", et il reste " + (c.days - c.day) + " jours" : "")) +
    "</div></div></div>";

  /* --- objectifs --- */
  const ids = Object.keys(DB.goals).filter(id => (DB.goals[id].m || 0) > 0);
  const fixedBy = v2FixedByGroup();
  const pace = c.running ? c.day / c.days : 1;
  const rows = ids.map(id => {
    const g = GROUP_BY_ID[id], cat = CAT_BY_ID[id];
    const grp = g || (cat ? GROUP_BY_ID[cat.group] : null);
    const target = DB.goals[id].m, spent = spentOn(id, s.ops);
    const fx = g ? Math.min(fixedBy[id] || 0, spent) : 0;
    /* Sur un poste majoritairement engagé, comparer au rythme du mois n'a pas de
       sens : le loyer part le 3 et la barre crierait au dépassement dès le 4. */
    const heavy = target > 0 && fx / target >= 0.6;
    const st = spent > target ? "bad"
      : c.running && !heavy && spent / target > pace ? "hot" : "win";
    return { id, name: grp && g ? g.name : (cat ? cat.name : id), grp: grp ? grp.id : "g_legacy",
             target, spent, fx, st, heavy };
  }).sort((a, b) => (a.st === b.st ? b.spent - a.spent : a.st === "bad" ? -1 : b.st === "bad" ? 1 : a.st === "hot" ? -1 : 1));

  const held = rows.filter(r => r.spent <= r.target).length;
  html += '<div class="chips' + v2AnimClass("all") + '">' + v2Chips(c, rows, held) + "</div>";

  /* Un trophée décroché dans le mois consulté s'annonce ici, entre les
     pastilles et les objectifs : c'est le moment de la lecture où l'on vient
     de comprendre comment le mois s'est passé. */
  html += v2TroBanner(c.key);

  html += '<div class="sect"><div class="shead"><span class="t">Objectifs</span>';
  if (rows.length) {
    html += '<span class="c">' + held + " tenus sur " + rows.length + "</span><span class=\"sp\"></span>" +
      '<span class="leg">' +
        '<span class="lgi win"><span class="lgb">' + V2_WIN + "</span>tenu</span>" +
        (c.running ? '<span class="lgi hot"><span class="lgb">' + V2_HOT + "</span>en avance sur le rythme</span>" : "") +
        '<span class="lgi bad"><span class="lgb">' + V2_BAD + "</span>dépassé</span></span>";
  }
  html += "</div>";

  if (!rows.length) {
    html += '<div class="todo"><div class="tx">Aucun objectif mensuel défini. Les objectifs se règlent dans <b>Réglages</b>.</div>' +
      '<button class="act" data-act="view" data-view="settings">Régler</button></div>';
  } else {
    const R = 27, CIRC = 2 * Math.PI * R;
    /* De quel côté s'ouvre la carte de survol dépend du nombre de colonnes, qu'il
       faut donc retrouver exactement — une piste d'écart et c'est la vignette de
       bord qui ouvre sa carte hors de l'écran. Trois pièges : la grille ne prend
       que la moitié de la colonne dès que « Où en est le mois » se range à côté
       (seuil interrogé plutôt que recopié), la marge du conteneur se lit au lieu
       de se deviner, et auto-fill loge n pistes dès que n*116 + (n-1)*8 tient —
       il y a une gouttière de moins que de colonnes, d'où le +8. */
    const GAP = 8, gw = 116 + GAP;
    const main = document.querySelector(".main");
    let inner = window.innerWidth - 280;
    if (main) {
      const cs = getComputedStyle(main);
      inner = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    }
    const cote = !window.matchMedia("(max-width:940px)").matches;   // cf. .v2 .gsplit
    const availW = Math.max(cote ? (Math.max(inner, 240) - 10) / 2 : inner, 240);
    const cols = Math.max(Math.floor((availW + GAP) / gw), 1);
    const cells = rows.map((r, i) => {
      const canOpen = r.st === "bad", isOpen = UI.v2goal === r.id;
      const frac = Math.min(r.spent / r.target, 1);
      /* L'encoche de rythme : un tiret très court, décalé à l'angle voulu. */
      const notch = c.running && !r.heavy
        ? '<circle class="pace2" cx="32" cy="32" r="' + R + '" fill="none" stroke-dasharray="2.4 ' +
          (CIRC - 2.4).toFixed(2) + '" stroke-dashoffset="' + (-pace * CIRC).toFixed(2) + '"></circle>'
        : "";
