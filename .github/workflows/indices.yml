# Met à jour indices.js, les cours de fin de mois des grands indices lus par l'onglet
# Progrès (« Face aux marchés »). Tourne le 1er et le 3 de chaque mois : la seconde passe
# rattrape un éventuel échec de la première. Aucun secret, aucune clé : seulement des cours
# publics. Le fichier n'est commité que s'il a changé.
name: Indices de marché

on:
  schedule:
    - cron: "17 6 1 * *"
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les cours de fin de mois
        run: node scripts/fetch-indices.mjs
      - name: Publier s'il y a du nouveau
        run: |
          if git diff --quiet -- indices.js; then
            echo "Aucun nouveau mois : rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indices.js
          git commit -m "Met à jour les indices de marché ($(date -u +%Y-%m))"
          git push
